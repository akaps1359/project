<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="랜덤 스파이어">
<meta name="theme-color" content="#15111d">
<!-- TITLE START -->
<title>랜덤 스파이어</title>
<!-- TITLE END -->
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- BODY START -->
<div id="app">
  <section id="scr-title" class="screen" hidden></section>
  <section id="scr-map" class="screen" hidden></section>
  <section id="scr-battle" class="screen" hidden>
    <div class="hud">
      <button class="stat" id="h-life" aria-label="생명"><img class="ic" data-icon="heart" alt=""><b id="h-life-v">20</b><small class="of" id="h-life-m">/20</small></button>
      <button class="stat" id="h-gold" aria-label="골드"><img class="ic" data-icon="coin" alt=""><b id="h-gold-v">0</b></button>
      <button class="stat" id="h-foe" aria-label="적"><img class="ic" data-icon="skull" alt=""><b id="h-foe-v">0</b><small class="of" id="h-foe-m">/60</small></button>
      <button class="stat" id="h-wave" aria-label="웨이브"><b id="h-wave-v">1/3</b><small id="h-wave-t"></small></button>
      <button id="b-speed" class="btn sm" aria-label="속도">x1</button>
      <button id="b-pause" class="btn sm" aria-label="일시정지">II</button>
    </div>
    <div id="bossbar" hidden><span id="boss-name"></span><div class="bar"><i id="boss-hp"></i><i id="boss-sh"></i><span id="boss-ticks"></span></div><span id="boss-t"></span><div id="boss-cast" class="idle"><b></b><span></span><i></i></div></div>
    <div id="field">
      <canvas id="cv" width="160" height="186" aria-label="전장"></canvas>
    </div>
    <div id="dock">
      <div id="panel"></div>
      <div id="strikebar" hidden><div class="sb-top"><b class="sb-name"></b><span class="sb-dmg"></span></div><div class="sb-bar"><i></i></div><p class="sb-hint">강타 준비! 노란 막대를 채우면 끊겨요 · 금색 칸 유닛이 때리는 중 · 강한 유닛을 가까이 옮기세요</p></div>
      <div id="toasts"></div>
    </div>
    <div id="itembar"></div>
    <div id="controls">
      <button id="b-upg" class="btn">강화</button>
      <button id="b-summon" class="btn gold"><span>소환</span><b id="summon-cost">10G</b></button>
    </div>
  </section>
  <section id="scr-page" class="screen" hidden></section>
  <div id="ptoasts" class="ptoasts" aria-live="polite"></div>
  <div id="modal" hidden><div class="modal-box"></div></div>
  <div id="tip" hidden></div>
  <div id="rotate">화면을 세로로 돌려 주세요</div>
</div>
<!-- BODY END -->
<!-- 개발용: 음원은 배포 폴더(docs/assets/audio)에 한 벌만 둔다. 빌드된 docs/index.html 은 assets/audio/ 를 읽는다 -->
<script>window.RS = { AUDIO_BASE: "../docs/assets/audio/" };</script>
<!-- SCRIPTS START -->
<script src="src/core/rng.js"></script>
<script src="src/data/units.js"></script>
<script src="src/data/content.js"></script>
<script src="src/data/relics.js"></script>
<script src="src/data/ancients.js"></script>
<script src="src/data/meta.js"></script>
<script src="src/data/events.js"></script>
<script src="src/core/stats.js"></script>
<script src="src/core/board.js"></script>
<script src="src/core/stage.js"></script>
<script src="src/core/battle.js"></script>
<script src="src/core/run.js"></script>
<script src="src/render/sprites.js"></script>
<script src="src/render/world.js"></script>
<script src="src/render/renderer.js"></script>
<script src="src/data/audiomap.js"></script>
<script src="src/audio.js"></script>
<script src="src/ui/common.js"></script>
<script src="src/ui/battle.js"></script>
<script src="src/ui/adventure.js"></script>
<script src="src/ui/menus.js"></script>
<script src="src/main.js"></script>
<!-- SCRIPTS END -->
</body>
</html>
