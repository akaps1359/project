<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="랜덤 스파이어">
<meta name="theme-color" content="#15111d">
<!-- TITLE START -->
<title>랜덤 스파이어</title>
<!-- TITLE END -->
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- BODY START -->
<div id="app">
  <section id="scr-title" class="screen" hidden></section>
  <section id="scr-map" class="screen" hidden></section>
  <section id="scr-battle" class="screen" hidden>
    <div class="hud">
      <div class="stat" id="h-life"><img class="ic" data-icon="heart" alt="생명"><b id="h-life-v">20/20</b></div>
      <div class="stat" id="h-gold"><img class="ic" data-icon="coin" alt="골드"><b id="h-gold-v">0</b><small id="h-int"></small></div>
      <div class="stat" id="h-foe"><img class="ic" data-icon="skull" alt="적"><b id="h-foe-v">0/60</b></div>
      <div class="stat" id="h-wave"><b id="h-wave-v">1/3</b><small id="h-wave-t"></small></div>
      <button id="b-speed" class="btn sm" aria-label="속도">x1</button>
      <button id="b-pause" class="btn sm" aria-label="일시정지">II</button>
    </div>
    <div id="field">
      <div id="bossbar" hidden><span id="boss-name"></span><div class="bar"><i id="boss-hp"></i></div><span id="boss-t"></span></div>
      <canvas id="cv" width="160" height="186" aria-label="전장"></canvas>
      <div id="toasts"></div>
    </div>
    <div id="panel"></div>
    <div id="itembar"></div>
    <div id="controls">
      <button id="b-upg" class="btn">강화</button>
      <button id="b-summon" class="btn gold"><span>소환</span><b id="summon-cost">10G</b></button>
      <button id="b-arrange" class="btn">정리</button>
    </div>
  </section>
  <section id="scr-page" class="screen" hidden></section>
  <div id="modal" hidden><div class="modal-box"></div></div>
  <div id="tip" hidden></div>
  <div id="rotate">화면을 세로로 돌려 주세요</div>
</div>
<!-- BODY END -->
<!-- SCRIPTS START -->
<script src="src/core/rng.js"></script>
<script src="src/data/units.js"></script>
<script src="src/data/content.js"></script>
<script src="src/data/events.js"></script>
<script src="src/core/stats.js"></script>
<script src="src/core/board.js"></script>
<script src="src/core/stage.js"></script>
<script src="src/core/battle.js"></script>
<script src="src/core/run.js"></script>
<script src="src/render/sprites.js"></script>
<script src="src/render/renderer.js"></script>
<script src="src/audio.js"></script>
<script src="src/ui/ui.js"></script>
<script src="src/main.js"></script>
<!-- SCRIPTS END -->
</body>
</html>
