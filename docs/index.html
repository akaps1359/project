        else if (k === 'style') el.style.cssText = v;
        else el.setAttribute(k, v === true ? '' : v);
      }
    }
    for (let i = 2; i < arguments.length; i++) append(el, arguments[i]);
    return el;
  }
  function append(el, c) {
    if (c == null || c === false) return;
    if (Array.isArray(c)) c.forEach((x) => append(el, x));
    else el.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
  }
  UI.h = h;
  UI.append = append;

  const iconName = (icon) => (icon.startsWith('c_') ? icon.slice(2) + '3' : icon);
  UI.icon = (name, cls, scale) => h('img', { class: 'ic ' + (cls || ''), src: RS.iconURL(iconName(name), scale || 4), alt: '' });
  UI.unitImg = (cls, tier, extra) => h('img', { class: 'uimg ' + (extra || ''), src: RS.unitURL(cls, tier, 3), alt: '' });

  UI.fmt = (v) => Math.floor(v).toLocaleString('ko-KR');
  UI.fmtK = (v) => RS.fmtNum(v);
  UI.pct = (v) => Math.round(v * 100) + '%';

  // ── 두 번 탭 방지 ──
  // 화면이 바뀐 직후의 탭은 버린다. 빠른 두 번 탭이 새 화면의 같은 자리를 누르지 않게 한다.
  UI.lockUntil = 0;
  UI.lockInput = function (ms) {
    const now = typeof performance !== 'undefined' ? performance.now() : Date.now();
    UI.lockUntil = Math.max(UI.lockUntil, now + (ms == null ? 300 : ms));
  };
  UI.inputLocked = function () {
    const now = typeof performance !== 'undefined' ? performance.now() : Date.now();
    return now < UI.lockUntil;
  };

  UI.btn = function (label, onclick, cls, disabled) {
    return h('button', {
      class: 'btn ' + (cls || ''),
      disabled: !!disabled,
      onclick(e) {
        RS.sfx('click');
        onclick(e);
      },
    }, label);
  };

  // 되돌릴 수 없는 동작: 첫 탭은 글자만 바뀌고, 2초 안에 한 번 더 누르면 실행
  UI.btn2 = function (label, armedLabel, onConfirm, cls, disabled) {
    let timer = 0;
    const el = h('button', {
      class: 'btn ' + (cls || ''),
      disabled: !!disabled,
      onclick(e) {
        const now = typeof performance !== 'undefined' ? performance.now() : Date.now();
        if (el.classList.contains('arm')) {
          // 빠른 두 번 탭(실수)은 확인으로 치지 않는다
          if (now - (el._armedAt || 0) < 400) return;
          clearTimeout(timer);
          el.classList.remove('arm');
          RS.sfx('click');
          onConfirm(e);
          return;
        }
        RS.sfx('click');
        el._armedAt = now;
        el.classList.add('arm');
        el.dataset.label = el.textContent;
        el.textContent = armedLabel;
        timer = setTimeout(() => {
          if (!el.classList.contains('arm')) return;
          el.classList.remove('arm');
          el.textContent = el.dataset.label || label;
        }, 2000);
      },
    }, label);
    return el;
  };

  // 한 번만 눌려야 하는 버튼 묶음: 하나를 누르면 모두 잠근다
  UI.lockAll = function (root) {
    if (!root) return;
    for (const b of root.querySelectorAll('button')) b.disabled = true;
  };

  UI.hideTip = function () {
    const tip = $('#tip');
    if (tip) tip.hidden = true;
  };

  UI.show = function (id) {
    UI.hideTip();
    if (UI.current !== id) UI.lockInput();
    for (const s of document.querySelectorAll('.screen')) s.hidden = s.id !== id;
    UI.current = id;
    const pt = $('#ptoasts');
    if (pt) {
      pt.classList.toggle('battle', id === 'scr-battle');
      // 전투 화면에서는 전장 위에 페이지 토스트를 남기지 않는다
      if (id === 'scr-battle') pt.innerHTML = '';
    }
  };

  // ── 토스트·툴팁 ──
  UI.toast = function (text, kind) {
    const inBattle = UI.current === 'scr-battle';
    const box = inBattle ? $('#toasts') : $('#ptoasts');
    if (!box || !text) return;
    const max = inBattle ? 2 : 3;
    while (box.children.length >= max) box.firstChild.remove();
    const t = h('div', { class: 'toast ' + (kind || '') }, text);
    let dur = 1700;
    if (inBattle && UI.G && UI.G.speed >= 2) {
      dur = 1100;
      t.style.animationDuration = '1.1s';
    } else if (!inBattle) {
      dur = 2400;
      t.style.animationDuration = '2.4s';
    }
    box.appendChild(t);
    setTimeout(() => t.remove(), dur);
  };

  // 숫자가 잠깐 떠오르는 표시 (HUD 옆)
  UI.hudFloat = function (anchor, text, kind) {
    if (!anchor) return;
    const f = h('span', { class: 'hudfloat ' + (kind || '') }, text);
    anchor.appendChild(f);
    setTimeout(() => f.remove(), 700);
  };

  UI.tip = function (anchor, title, desc, extra, action) {
    const tip = $('#tip');
    tip.innerHTML = '';
    append(tip, [
      h('b', null, title),
      desc ? h('p', null, desc) : null,
      extra ? h('p', { class: 'cost' }, extra) : null,
      action ? h('div', { class: 'tip-act' }, UI.btn(action.label, (e) => {
        e.stopPropagation();
        tip.hidden = true;
        action.onClick();
      }, 'gold sm')) : null,
    ]);
    tip.hidden = false;
    const r = anchor.getBoundingClientRect();
    const tw = Math.min(260, window.innerWidth - 24);
    tip.style.width = tw + 'px';
    const left = Math.max(12, Math.min(window.innerWidth - tw - 12, r.left + r.width / 2 - tw / 2));
    tip.style.left = left + 'px';
    const below = r.bottom + 8;
    const th = tip.offsetHeight;
    tip.style.top = (below + th > window.innerHeight - 12 ? Math.max(12, r.top - th - 8) : below) + 'px';
  };
  // 화면 좌표에 툴팁 (전장의 적처럼 DOM 요소가 없는 대상)
  UI.tipAt = function (x, y, title, desc, extra, action) {
    const rect = { left: x - 10, right: x + 10, top: y - 14, bottom: y + 14, width: 20, height: 28 };
    UI.tip({ getBoundingClientRect: () => rect }, title, desc, extra, action);
  };

  // ── 저주 설명: 글 속 '저주 [이름]' 과 '무작위 저주' 를 찾아 무엇인지 풀어 준다 ──
  UI.curseRefs = function (text) {
    const list = [];
    let random = false;
    if (!text) return null;
    const re = /저주 \[([^\]]+)\]/g;
    let m;
    while ((m = re.exec(text))) {
      const c = RS.CURSES.find((x) => x.name === m[1]);
      if (c && list.indexOf(c) < 0) list.push(c);
    }
    if (/무작위 저주|저주 하나와|저주도 숨어|· 저주 ·|저주를 받는다/.test(text)) random = true;
    return list.length || random ? { list, random } : null;
  };
  const RANDOM_POOL = () => RS.CURSES.filter((c) => !c.permanent);
  // 카드·선택지 안에 넣는 짧은 설명
  UI.curseNote = function (text) {
    const r = UI.curseRefs(text);
    if (!r) return null;
    return h('div', { class: 'cursenote' },
      r.list.map((c) => h('p', null, h('b', null, `저주 [${c.name}]`), ' ' + c.desc)),
      r.random ? h('p', null, h('b', null, '무작위 저주'), ` 1개: ${RANDOM_POOL().map((c) => c.name).join('·')} 중 하나`) : null,
    );
  };
  // 툴팁용 글: '저주 [불면]' → '저주 [불면: 전투를 시작할 때 생명 -1]'
  UI.curseText = function (text) {
    if (!text) return text;
    return text.replace(/저주 \[([^\]]+)\]/g, (all, name) => {
      const c = RS.CURSES.find((x) => x.name === name);
      return c ? `저주 [${name}: ${c.desc}]` : all;
    });
  };
  // 저주가 걸린 선택: 고르기 전에 저주를 자세히 보여 주고 한 번 더 묻는다
  UI.curseConfirm = function (label, text, onOk) {
    const r = UI.curseRefs(text);
    if (!r) return onOk();
    const cards = r.list.map((c) => h('div', { class: 'card curse' }, UI.icon('curse', 'cic', 4),
      h('div', { class: 'cbody' }, h('div', { class: 'ctop' }, h('span', { class: 'rar' }, c.permanent ? '저주 · 없앨 수 없음' : c.fades ? '저주 · 저절로 사라짐' : '저주'), h('b', null, c.name)), h('p', null, c.desc))));
    const pool = r.random ? h('div', { class: 'cursepool' }, h('p', { class: 'dim' }, '무작위 저주는 아래 중 하나가 나옵니다'),
      RANDOM_POOL().map((c) => h('p', null, h('b', null, c.name), ' · ' + c.desc))) : null;
    UI.modal('저주 확인', h('div', { class: 'confirm' },
      h('p', null, `[${label}] 을(를) 고르면 아래 저주를 받습니다.`),
      h('div', { class: 'cards' }, cards), pool,
      h('p', { class: 'dim small' }, '저주는 상점의 [제거]나 일부 이벤트로 없앨 수 있어요' + (r.list.some((c) => c.permanent) ? ' (없앨 수 없는 것 제외)' : '') + '. 액막이 매듭이 있으면 막아 줘요.'),
      h('div', { class: 'row2' },
        UI.btn('취소', () => UI.closeModal()),
        UI.btn('그래도 고른다', () => {
          UI.onModalClose = null;
          UI.closeModal();
          onOk();
        }, 'gold'),
      ),
    ));
  };

  // ── 카드·칩 ──
  UI.relicTitle = (r) => `${r.name} · ${RS.RARITY_NAME.relic[r.rarity]} 유물`;

  UI.relicChip = function (id, run) {
    const r = RS.REL[id];
    let extra = r.cost ? '대가 · ' + UI.curseText(r.cost) : null;
    const st = run && run.relicState[id];
    if (st && st.uses != null) extra = `남은 횟수 ${st.uses}`;
    else if (st && st.charges != null) extra = `남은 충전 ${st.charges}`;
    else if (st && st.count != null) extra = `남은 횟수 ${st.count}`;
    else if (st && st.active === false) extra = '깨짐';
    return h('button', {
      class: 'chip relic r' + r.rarity,
      'aria-label': r.name,
      onclick(e) {
        UI.tip(e.currentTarget, UI.relicTitle(r), r.desc, extra);
      },
    }, UI.icon(r.icon, '', 3));
  };

  UI.augCard = function (id, selected, onclick, extra) {
    const a = RS.augDef(id);
    const up = RS.isUpgraded(id);
    return h('button', { class: `card r${a.rarity}${selected ? ' sel' : ''}`, onclick },
      UI.icon(a.icon, 'cic', 4),
      h('div', { class: 'cbody' },
        h('div', { class: 'ctop' }, h('span', { class: 'rar' }, RS.RARITY_NAME.aug[a.rarity]), h('b', null, a.name + (up ? '+' : '')), a.unique ? null : h('small', { class: 'stack' }, '중첩 가능')),
        h('p', null, a.desc + (up ? ' (연마: 효과 ×1.5)' : '')),

        extra || null,
      ),
    );
  };

  UI.relicCard = function (id, selected, onclick, price) {
    const r = RS.REL[id];
    return h('button', { class: `card relic rr${r.rarity}${selected ? ' sel' : ''}`, onclick },
      UI.icon(r.icon, 'cic', 4),
      h('div', { class: 'cbody' },
        h('div', { class: 'ctop' }, h('span', { class: 'rar' }, RS.RARITY_NAME.relic[r.rarity] + ' 유물'), h('b', null, r.name)),
        h('p', null, r.desc),
        r.cost ? h('p', { class: 'cost' }, '대가 · ' + r.cost) : null,
        r.cost ? UI.curseNote(r.cost) : null,

      price != null ? h('span', { class: 'price' }, UI.icon('coin', '', 2), price) : null,

  // ── 상단 바 ──
  UI.keysEl = function (run) {
    if (run.act > 3 && !run.keys.ruby) return null;
    const k = run.keys;
    if (!k.ruby && !k.emerald && !k.sapphire && run.act === 1 && run.floor < 2) return null;
    const one = (name, has, label) => h('span', { class: 'keyic' + (has ? ' on' : ''), title: label }, UI.icon(name, '', 2));
    return h('button', {
      class: 'keys',
      'aria-label': '봉인석',
      onclick(e) {
        UI.tip(e.currentTarget, '균열의 봉인석', '붉은(휴식처에서 회수)·초록(성난 엘리트 처치)·푸른(보물 상자에서 유물 대신) 봉인석 세 개를 모으면 3막 보스 뒤에 4막이 열린다.');
      },
    }, one('key_ruby', k.ruby, '붉은 봉인석'), one('key_emerald', k.emerald, '초록 봉인석'), one('key_sapphire', k.sapphire, '푸른 봉인석'));
  };

  UI.topbar = function (run, title) {

      h('div', { class: 'tb-title' }, title),
      h('div', { class: 'tb-stats' },
        UI.keysEl(run),
        h('span', { class: 'stat' }, UI.icon('heart', '', 3), h('b', null, `${Math.ceil(run.life)}/${run.maxLife}`)),
        h('span', { class: 'stat' }, UI.icon('coin', '', 3), h('b', null, UI.fmt(run.gold))),
        UI.btn('빌드', () => UI.openBuild(), 'sm tb-build'),

  UI.relicStrip = function (run) {

      }),

  // 보상·상점·이벤트 같은 페이지 화면.
  // 카드를 고르는 것처럼 같은 화면을 다시 그릴 때는 UI.keepScroll = true 로 스크롤을 지킨다.
  UI.page = function (title, sub, body, footer) {
    const scr = $('#scr-page');
    const run = UI.G.run;
    const prev = scr.querySelector('.page');
    const keep = UI.keepScroll && prev && UI.current === 'scr-page' ? prev.scrollTop : 0;
    const selOnly = !!UI.keepScroll && UI.current === 'scr-page';
    UI.keepScroll = false;
    scr.innerHTML = '';
    delete scr.dataset.view;
    append(scr, [
      run ? UI.topbar(run, title) : h('div', { class: 'topbar' }, h('div', { class: 'tb-title' }, title)),
      run ? UI.relicStrip(run) : null,
      h('div', { class: 'page scroll' }, sub ? h('p', { class: 'page-sub' }, sub) : null, body),
      footer ? h('div', { class: 'page-foot' }, footer) : null,
    ]);
    UI.show('scr-page');
    // 같은 화면을 다시 그려도(이벤트 다음 단계 등) 두 번 탭이 새 버튼을 누르지 않게
    UI.lockInput(selOnly ? 120 : 300);
    const pg = scr.querySelector('.page');
    pg.scrollTop = keep;
    if (keep) {
      const s = pg.querySelector('.card.sel, .bcell.sel, .btn.option.sel');
      if (s && s.scrollIntoView) s.scrollIntoView({ block: 'nearest' });
    }
  };

  // ── 모달 ──
  UI.modal = function (title, body, onClose) {
    UI.hideTip();
    const m = $('#modal');
    const box = m.querySelector('.modal-box');
    box.innerHTML = '';
    append(box, [
      h('div', { class: 'modal-head' }, h('b', null, title), h('button', { class: 'btn sm x', onclick: () => UI.closeModal(), 'aria-label': '닫기' }, '닫기')),
      h('div', { class: 'modal-body scroll' }, body),
    ]);
    m.hidden = false;
    UI.lockInput(250);
    UI.onModalClose = onClose || null;
    UI.G.setModal(true);
  };
  UI.closeModal = function () {
    UI.hideTip();
    const m = $('#modal');
    // 모달을 닫는 탭이 아래 화면을 누르지 않게
    if (!m.hidden) UI.lockInput(250);
    m.hidden = true;
    UI.G.setModal(false);
    const cb = UI.onModalClose;
    UI.onModalClose = null;
    if (cb) cb();
  };
  // 모달 안의 다른 모달로 바꿀 때: 닫기 콜백을 부르지 않고 내용만 바꾼다
  UI.swapModal = function (fn) {
    UI.onModalClose = null;
    fn();
  };

  // 확인 창: 취소하면 아무 일도 없다
  UI.confirm = function (title, text, okLabel, onOk, onCancel) {
    UI.modal(title, h('div', { class: 'confirm' },
      h('p', null, text),
      h('div', { class: 'row2' },
        UI.btn('취소', () => UI.closeModal()),
        UI.btn(okLabel, () => {
          UI.onModalClose = null;
          UI.closeModal();
          onOk();
        }, 'gold'),
      ),
    ), onCancel || null);
  };

  // 탭 묶음
  UI.tabs = function (tabs) {
    const head = h('div', { class: 'tabs' });
    const body = h('div', { class: 'tabbody' });
    const sel = (k) => {
      for (const b of head.children) b.classList.toggle('on', b.dataset.k === String(k));

      append(body, tabs[k].render());
    };
    tabs.forEach((t, k) => head.appendChild(h('button', { class: 'tab', 'data-k': String(k), onclick: () => sel(k) }, t.name)));

  };

  // 목록 행
  UI.augRow = function (id, count) {

    return h('div', { class: `lrow r${a.rarity}` }, UI.icon(a.icon, '', 3),
      h('div', null, h('b', null, a.name + (up ? '+' : '') + (count > 1 ? ` ×${count}` : '')), h('p', null, a.desc + (up ? ' (연마: ×1.5)' : '')), a.cost ? h('p', { class: 'cost' }, '대가 · ' + UI.curseText(a.cost)) : null));

  // 보드 미리보기 (칸 고르기용)
  UI.boardPicker = function (run, opts) {
    const grid = h('div', { class: 'bpick' });
    for (let i = 0; i < RS.FIELD.SIZE; i++) {
      const s = run.board[i];

      grid.appendChild(h('button', {
        class: 'bcell' + (ok ? '' : ' off') + (opts.selected === i ? ' sel' : '') + (RS.isInner(i) ? ' inner' : ''),

  // ── 획득 요약: 효과를 적용하기 전후를 비교해 무엇을 얻고 잃었는지 보여 준다 ──
  const countOf = (list) => {
    const m = {};
    for (const x of list) m[x] = (m[x] || 0) + 1;
    return m;
  };
  UI.snapGains = function (run) {
    const units = {};
    for (const s of run.board) if (s) units[s.cls + ':' + s.tier] = (units[s.cls + ':' + s.tier] || 0) + s.n;

  // ── 첫 전투 코치 (메타 기록에 진행 상황 저장) ──
  function tut() {
    const meta = UI.G.meta;
    if (!meta.tut || typeof meta.tut !== 'object') meta.tut = {};
    return meta.tut;
  }
  UI.tutDone = function (k) {
    const t = tut();
    if (t.off || t[k]) return;
    t[k] = true;
    if (t.summon && t.merge && t.upgrade && t.leak && t.cap) t.off = true;
    UI.G.saveMeta();
  };
  UI.coach = function (b, mergeable) {
    const G = UI.G;
    const t = tut();
    let text = null;
    let pulse = null;
    if (!t.off && (G.meta.runs || 0) > 2) {
      t.off = true;
      G.saveMeta();
    }
    if (!t.off) {
      const run = G.run;
      if (!t.summon) {
        text = '① 금색 [소환]을 눌러 유닛을 부르세요 (부를수록 1G씩 비싸져요)';
        pulse = 'summon';
      } else if (!t.merge && mergeable > 0) {
        text = '② 반짝이는 칸을 누르고 [합성] → 다음 등급 무작위 유닛';
      } else if (!t.upgrade && b.waveIdx >= 2) {
        let min = Infinity;
        for (const c of RS.CLASSES) min = Math.min(min, b.upgradeCost(c));
        if (run.gold >= min) {
          text = '③ [강화]: 골드로 한 클래스의 피해를 레벨당 +15%';
          pulse = 'upg';
        }
      }
      if (!t.cap && b.enemies.length >= b.cap * 0.5) {
        UI.toast(`적이 ${b.cap}마리 쌓이면 패배! 화력을 늘리세요`, 'warn');
        UI.tutDone('cap');
      }
    }
    const c = UI.hudCache;
    if (c.pulse !== pulse) {
      c.pulse = pulse;
      $('#b-summon').classList.toggle('pulse', pulse === 'summon');
      $('#b-upg').classList.toggle('pulse', pulse === 'upg');
    }
    const refs = UI.panelRefs || {};
    if (UI.panelMode === 'idle' && refs.hint) {
      setText(refs.hint, 'coach', text || '칸을 눌러 정보 보기 · 끌어서 자리 바꾸기');
      if (c.coachOn !== !!text) {
        c.coachOn = !!text;
        refs.hint.classList.toggle('coach', !!text);
        if (refs.hint.parentElement) refs.hint.parentElement.classList.toggle('coaching', !!text);
      }
    }
  };

  UI.doSummon = function () {
    const G = UI.G;
    const b = G.battle;
    if (!b) return;
    RS.unlockAudio();
    const res = b.summon();
    if (res.err === 'gold') {
      RS.sfx('error');
      UI.toast('골드가 부족해요', 'warn');
    } else if (res.err === 'full') {
      RS.sfx('error');
      UI.toast('빈자리가 없어요. 합성하거나 판매하세요', 'warn');
    } else if (res.err === 'cap') {
      RS.sfx('error');
      UI.toast('비단 목띠: 이번 웨이브에는 더 소환할 수 없어요', 'warn');
    } else if (res.err === 'locked') {
      RS.sfx('error');
      UI.toast('홀림 귀고리: 준비 시간에는 소환할 수 없어요', 'warn');
    } else if (res.err) {
      RS.sfx('error');
    } else {
      RS.sfx(res.tier > 0 ? 'rare' : 'summon');
      UI.tutDone('summon');
      if (res.tier > 0) UI.toast(`${RS.TIER[res.tier].name} ${RS.CLASS[res.cls].name} 소환!`, 't' + res.tier);
      if (res.clover) UI.toast('네잎클로버! 비용 반환', 'good');
      if (res.twin != null) UI.toast('한 기가 더 따라왔다!', 'good');
      const s = G.run.board[res.slot];
      if (s && RS.canMerge(G.run.board, res.slot) && (tut().off || tut().merge || UI.panelMode !== 'idle') && (UI.mergeHints = (UI.mergeHints || 0) + 1) <= 2) {
        UI.toast('합성 가능! 반짝이는 칸을 누르세요', 'good');
      }
    }
    UI.updateHud(true);
  };

  UI.doMerge = function (i, pick) {
    const G = UI.G;
    const b = G.battle;
    if (!b) return;
    if (b.M.mergeChoose && !pick) {
      const opts = UI.mergeOptsFor(b, i);
      if (opts && opts.length) {
        UI.sel = i;
        if (G.renderer) G.renderer.sel = i;
        UI.setPanel('mergeChoose', { slot: i, opts });
        return;
      }
    }
    const tierFrom = G.run.board[i] ? G.run.board[i].tier : 0;
    const res = b.merge(i, pick);
    if (!res) {
      // 고른 후보가 코어의 후보와 다르면(스택이 바뀐 사이 등) 후보를 다시 받아 패널을 연다
      forgetMergeOpts(b, i);
      if (pick && b.M.mergeChoose && RS.canMerge(G.run.board, i)) {
        const opts = UI.mergeOptsFor(b, i);
        if (opts && opts.length) {
          UI.setPanel('mergeChoose', { slot: i, opts });
          return;
        }
      }
      UI.select(G.run.board[i] ? i : -1);
      UI.updateHud(true);
      return;
    }
    forgetMergeOpts(b, i);
    UI.tutDone('merge');
    if (res.fail) {
      RS.sfx('error');
      UI.toast('합성 실패…', 'warn');
    } else {
      const r = res.results[0];
      RS.sfx(r && r.tier >= 3 ? 'legend' : 'merge');
      if (r) UI.toast(`${res.double ? '대성공! ' : ''}${RS.TIER[r.tier].name} ${RS.CLASS[r.cls].name}${res.results.length > 1 ? ' ×2' : ''}`, 't' + r.tier);
      if (res.refund) UI.toast('재활용: 재료 1기 반환', 'good');
    }
    const next = res.results.length ? res.results[0].slot : -1;
    UI.select(G.run.board[i] && G.run.board[i].tier === tierFrom ? i : next);
    UI.updateHud(true);
  };

  UI.doMergeAll = function () {
    const G = UI.G;
    const b = G.battle;
    if (!b) return;
    if (RS.firstMergeable(G.run.board) < 0) {
      RS.sfx('error');
      UI.toast('합성할 칸이 없어요 (같은 칸에 같은 유닛 3기)', 'warn');
      return;
    }
    // 고대 두루마리: 칸마다 결과를 골라야 하므로 첫 칸의 선택 패널을 연다
    if (b.M.mergeChoose) {
      const i = RS.firstMergeable(G.run.board);
      UI.doMerge(i);
      return;
    }
    let count = 0;
    let i;
    let guard = 0;
    while ((i = RS.firstMergeable(G.run.board)) >= 0 && guard++ < 30) {
      const res = b.merge(i);
      if (res) count++;
      else break;
    }
    if (count) {
      RS.sfx('merge');
      UI.tutDone('merge');
      UI.toast(`${count}번 합성했어요`);
    }
    UI.select(-1);
    UI.updateHud(true);
  };

  function doSell(i) {
    const G = UI.G;
    const b = G.battle;
    if (!b) return;
    const v = b.sell(i);
    if (v) {
      RS.sfx('coin');
      UI.toast(`+${v}G`);
    }
    UI.select(G.run.board[i] ? i : -1);
    UI.updateHud(true);
  }

  UI.panelMode = 'idle';
  UI.setPanel = function (mode, data) {
    const G = UI.G;
    // 사용·닫기 버튼 자리에 합성·판매 버튼이 바로 그려지므로 연타가 새 버튼을 누르지 않게 잠깐 막는다
    if (UI.panelMode !== mode && (UI.panelMode === 'item' || UI.panelMode === 'mergeChoose' || UI.panelMode === 'upgrade') && UI.lockInput) UI.lockInput(250);
    UI.panelMode = mode;
    UI.panelData = data || null;
    UI.panelSig = null;
    const p = $('#panel');
    p.innerHTML = '';
    p.className = 'panel-' + mode;
    UI.panelRefs = {};
    if (UI.hudCache) {
      UI.hudCache.coach = null;
      UI.hudCache.coachOn = null;
    }
    const b = G.battle;
    const run = G.run;
    if (!b) return;
    if (mode === 'idle') {
      const refs = UI.panelRefs;
      append(p, h('div', { class: 'pidle' },
        h('div', { class: 'pstat' }, h('span', null, '전체 DPS'), (refs.dps = h('b', null, '0'))),
        h('div', { class: 'pstat' }, h('span', null, '유닛'), (refs.units = h('b', null, '0'))),
        h('div', { class: 'pstat' }, h('span', null, b.M.summonCap ? '남은 소환' : '다음 이자'), (refs.int = h('b', null, '0'))),
        (refs.hint = h('p', { class: 'phint' }, '칸을 눌러 정보 보기 · 끌어서 자리 바꾸기')),
      ));
    } else if (mode === 'unit') {
      const i = UI.sel;
      const s = run.board[i];
      if (!s) return UI.setPanel('idle');
      const C = RS.CLASS[s.cls];
      const T = RS.TIER[s.tier];
      const refs = UI.panelRefs;
      const canMerge = RS.canMerge(run.board, i);
      UI.panelSig = unitSig(run, i);
      const sv = UI.sellValueAt(b, i);
      const sellBtn = s.tier >= 2
        ? UI.btn2(`판매 +${sv}`, `한 번 더: 판매 +${sv}`, () => doSell(i))
        : btn(`판매 +${sv}`, () => doSell(i));
      append(p, h('div', { class: 'punit' },
        unitImg(s.cls, s.tier, 'big'),
        h('div', { class: 'pinfo' },
          h('div', { class: 'pname' }, h('b', { class: 'tier' + s.tier }, `${T.name} ${C.name}`), ` ×${s.n}`,
            run.runes[i] && RS.RUNE[run.runes[i]] ? h('span', { class: 'runebadge' + (RS.RUNE[run.runes[i]].bad ? ' bad' : ''), style: `--rune:${RS.RUNE[run.runes[i]].color}` }, RS.RUNE[run.runes[i]].name) : null,
            (refs.dps = h('span', { class: 'pdps' }))),
          (refs.stats = h('div', { class: 'pstats' })),
          (refs.desc = h('p', { class: 'pdesc' })),
        ),
        h('div', { class: 'pbtns' },
          btn(s.tier >= RS.TOP_TIER ? '최고 등급' : canMerge ? '합성' : `합성 ${s.n}/${RS.mergeNeed(s.tier)}`, () => UI.doMerge(i), canMerge ? 'gold' : '', !canMerge),
          (refs.sell = sellBtn),
        ),
      ));
      refs.baseDesc = run.runes[i] && RS.RUNE[run.runes[i]] ? `${RS.RUNE[run.runes[i]].name}: ${RS.RUNE[run.runes[i]].desc}` : `${C.role} · ${C.desc}`;
      UI.refreshUnitStats();
    } else if (mode === 'upgrade') {
      const refs = (UI.panelRefs = { rows: {} });
      const grid = h('div', { class: 'upg-grid' });
      for (const c of RS.CLASSES) {
        const el = h('button', {
          class: 'upg',
          'aria-label': `${RS.CLASS[c].name} 강화`,
          title: `${RS.CLASS[c].name} 강화`,
          onclick() {
            const r = b.upgrade(c);
            if (r.err) {
              RS.sfx('error');
              UI.toast(r.err === 'locked' ? '홀림 귀고리: 준비 시간에는 강화할 수 없어요' : r.err === 'gold' ? '골드가 부족해요' : '지금은 강화할 수 없어요', 'warn');
            } else {
              RS.sfx('upgrade');
            }
            UI.updateHud(true);
          },
        }, unitImg(c, 0), h('b', { class: 'lv' }), h('span', { class: 'cost' }));
        refs.rows[c] = el;
        grid.appendChild(el);
      }
      append(p, h('div', { class: 'pupg' }, grid));
    } else if (mode === 'item') {
      const idx = data.idx;
      const it = RS.ITEM[run.items[idx]];
      if (!it) return UI.setPanel('idle');
      append(p, h('div', { class: 'pitem' },
        icon(it.icon, 'big', 4),
        h('div', { class: 'pinfo' }, h('b', null, it.name), h('p', { class: 'pdesc' }, it.desc + (b.M.itemPotency ? ' (효과 2배)' : ''))),
        h('div', { class: 'pbtns' },
          btn('사용', () => {
            const r = b.useItem(idx);
            if (r.err) {
              RS.sfx('error');
              UI.toast(r.err === 'full' ? '빈자리가 없어요' : '쓸 수 없어요', 'warn');
              return;
            }
            RS.sfx(it.id === 'bomb' ? 'bomb' : it.id === 'freeze' ? 'freeze' : 'upgrade');
            UI.toast(`${it.name} 사용!`, 'good');
            UI.renderItems();
            UI.closePanel();
            UI.updateHud(true);
          }, 'gold'),
          btn('닫기', () => UI.closePanel()),
        ),
      ));
    } else if (mode === 'mergeChoose') {
      const tier = Math.min(3, (run.board[data.slot] ? run.board[data.slot].tier : 0) + 1);
      append(p, h('div', { class: 'pchoose' },
        h('p', { class: 'phint' }, '고대 두루마리: 합성 결과를 고르세요'),
        h('div', { class: 'row2' },
          data.opts.map((c) => h('button', {
            class: 'btn choose',
            onclick() {
              RS.sfx('click');
              UI.doMerge(data.slot, c);
            },
          }, unitImg(c, tier), RS.CLASS[c].name)),
          btn('닫기', () => UI.closePanel(), 'sm'),
        ),
      ));
    }
  };

  function unitSig(run, i) {
    const s = run.board[i];
    return s ? `${i}/${s.cls}/${s.tier}/${s.n}/${RS.canMerge(run.board, i)}/${run.runes[i] || ''}` : '';
  }

  UI.refreshUnitStats = function () {
    const G = UI.G;
    const refs = UI.panelRefs;
    const b = G.battle;
    if (!refs || !refs.stats || !b) return;
    const i = UI.sel;
    const s = G.run.board[i];
    if (!s) return;
    if (b.statsDirty) b.computeSlotStats();
    const st = b.slotStats[i];
    if (!st) return;
    const reach = UI.reaches(st, i);
    const parts = [`피해 ${fmtK(st.dmg)}`, `${(1 / st.interval).toFixed(1)}회/초`, `사거리 ${Math.round(st.range)}`];
    if (st.crit > 0) parts.push(`치명 ${pct(Math.min(1, st.crit))}`);
    if (st.splash) parts.push(`범위 ${st.splash}`);
    if (st.slow) parts.push(`둔화 ${pct(st.slow)}`);
    if (st.shots > 1) parts.push(`${st.shots}발`);
    const text = parts.join(' · ');
    if (refs.stats.textContent !== text) refs.stats.textContent = text;
    const dps = reach ? `DPS ${fmtK(st.dps * s.n)}` : 'DPS 0';
    if (refs.dps && refs.dps.textContent !== dps) refs.dps.textContent = dps;
    if (refs.dps && refs.reach !== reach) {
      refs.reach = reach;
      refs.dps.classList.toggle('bad', !reach);
      refs.desc.classList.toggle('bad', !reach);
      refs.desc.textContent = reach ? refs.baseDesc : '사거리가 길에 닿지 않아요 · 바깥 칸으로 옮기거나 [정리]';
    }
    if (refs.sell && !refs.sell.classList.contains('arm')) {
      const t = `판매 +${UI.sellValueAt(b, i)}`;
      if (refs.sell.textContent !== t) refs.sell.textContent = t;
    }
  };

  UI.renderItems = function () {
    const G = UI.G;
    const bar = $('#itembar');
    bar.innerHTML = '';
    const run = G.run;
    const b = G.battle;
    const slots = RS.itemSlots(run);
    // 칸이 많으면(보급 허리띠·연금 솥·별) 칸과 버튼을 조금 줄인다
    UI.itemTight = slots + (b && b.M.stars ? 2 : 0) >= 6;
    bar.classList.toggle('tight', UI.itemTight);
    for (let k = 0; k < slots; k++) {
      const id = run.items[k];
      if (id) {
        const it = RS.ITEM[id];
        bar.appendChild(h('button', {
          class: 'islot',
          'aria-label': it.name,
          onclick() {
            RS.sfx('click');
            UI.setPanel('item', { idx: k });
          },
        }, icon(it.icon, '', 3)));
      } else {
        bar.appendChild(h('button', {
          class: 'islot empty',
          'aria-label': '빈 소모품 칸',
          onclick(e) {
            UI.tip(e.currentTarget, '소모품 칸', '상점·보상에서 얻은 소모품(폭탄·얼음 등)을 전투 중에 눌러 씁니다.');
          },
        }));
      }
    }
    bar.appendChild(h('div', { class: 'spacer' }));
    UI.starBtn = null;
    if (b && b.M.stars) {
      // 별의 섭정: 별을 모아 별똥별
      UI.starBtn = btn('★ 0/3', () => {
        const bb = G.battle;
        if (!bb || !bb.starfall()) {
          RS.sfx('error');
          UI.toast(bb && bb.stars >= (bb.starCost || 3) ? '적이 있을 때 쓸 수 있어요' : `별이 ${(bb && bb.starCost) || 3}개 모여야 해요 (웨이브마다 1개, 최대 ${bb ? UI.starMax(bb) : 5}개)`, 'warn');
          return;
        }
        RS.sfx('bomb');
        UI.toast('별똥별!', 'good');
        UI.updateHud(true);
      }, 'sm star');
      UI.starBtn.setAttribute('aria-label', '별똥별');
      bar.appendChild(UI.starBtn);
    }
    UI.mergeAllBtn = btn(UI.itemTight ? '합성' : '모두 합성', () => UI.doMergeAll(), 'sm mall off');
    UI.mergeAllBtn.setAttribute('aria-label', '모두 합성');
    bar.appendChild(UI.mergeAllBtn);
    // 칸이 많으면 '빌드'는 뺀다 (일시정지 메뉴에 있다)
    if (slots <= 3 && !(b && b.M.stars)) bar.appendChild(btn('빌드', () => UI.openBuild(), 'sm'));
  };

  const setText = (el, key, v) => {
    if (UI.hudCache[key] !== v) {
      UI.hudCache[key] = v;
      el.textContent = v;
    }
  };
  const setCls = (el, key, cls, on) => {
    if (UI.hudCache[key] !== on) {
      UI.hudCache[key] = on;
      el.classList.toggle(cls, on);
    }
  };

  UI.updateHud = function (force) {
    const G = UI.G;
    const b = G.battle;
    const run = G.run;
    if (!b || !run) return;
    if (force || !UI.hudCache) UI.hudCache = {};
    const c = UI.hudCache;
    const blind = !!b.M.blindfold;
    setText($('#h-life-v'), 'life', `${Math.ceil(run.life)}/${run.maxLife}`);
    // 좁은 화면(360px 이하)에서는 네 자리부터 줄여 쓴다
    setText($('#h-gold-v'), 'gold', run.gold >= (window.innerWidth <= 360 ? 1000 : 10000) ? fmtK(run.gold) : fmt(run.gold));
    const cap = RS.interestCap(b.M);
    const inter = Math.min(cap, Math.floor(run.gold / RS.BAL.interestPer));
    setText($('#h-foe-v'), 'foe', `${b.enemies.length}/${b.cap}`);
    setCls($('#h-foe'), 'danger', 'danger', b.enemies.length >= b.cap * 0.7);
    setCls($('#h-life'), 'low', 'danger', run.life <= run.maxLife * 0.3);
    const nW = b.stage.waves.length;
    const tl = b.prep > 0 ? null : trialLeft(b);
    if (b.prep > 0) {
      setText($('#h-wave-v'), 'wv', '준비');
      setText($('#h-wave-t'), 'wt', blind ? '?' : `${Math.ceil(b.prep)}초`);
    } else if (tl != null) {
      setText($('#h-wave-v'), 'wv', '시험');
      setText($('#h-wave-t'), 'wt', `${Math.max(0, Math.ceil(tl))}초`);
    } else {
      setText($('#h-wave-v'), 'wv', `${b.waveIdx}/${nW}`);
      setText($('#h-wave-t'), 'wt', b.waveIdx < nW ? (blind ? '?' : `${Math.max(0, Math.ceil(b.waveT))}초`) : '마지막');
    }
    setCls($('#h-wave'), 'urgent', 'urgent', tl != null && tl <= 10);
    const cost = b.summonCost();
    setText($('#summon-cost'), 'cost', b.summonLimit() <= 0 ? '제한' : `${cost}G`);
    setCls($('#b-summon'), 'canS', 'off', !(run.gold >= cost && b.summonLimit() > 0));
    setText($('#b-speed'), 'spd', `x${G.speed}`);
    if (UI.starBtn) {
      setText(UI.starBtn, 'star', `★ ${b.stars}/${b.starCost || 3}`);
      setCls(UI.starBtn, 'starOn', 'off', !b.canStarfall());
    }
    // 합성 가능한 칸 수 + 길에 닿지 않는 칸 (0.1초마다 20칸)
    let mergeable = 0;
    if (b.statsDirty) b.computeSlotStats();
    const R = G.renderer;
    const noReach = R && (R.noReach || (R.noReach = new Uint8Array(F.SIZE)));
    for (let i = 0; i < F.SIZE; i++) {
      const s = run.board[i];
      if (s && RS.canMerge(run.board, i)) mergeable++;
      if (noReach) noReach[i] = s && b.slotStats[i] && !UI.reaches(b.slotStats[i], i) ? 1 : 0;
    }
    if (UI.mergeAllBtn) {

      if (!UI.panelData || !RS.canMerge(run.board, UI.panelData.slot)) UI.closePanel();

  };

  function updateBossBar(b, c, blind) {
    const bb = $('#bossbar');
    if (b.boss) {
      if (bb.hidden || c.bwait !== false) {
        c.bwait = false;

          bb.hidden = false;

      if (c.bhp !== w) {

      // 보스를 쓰러뜨렸다: 바는 그대로 두어 캔버스 크기가 바뀌지 않게 한다

  // 전투 이벤트 → 소리·토스트
  UI.onFx = function (ev) {
    switch (ev.k) {
      case 'wave': {
        RS.sfx('wave');
        const g = (ev.gold || 0) + (ev.interest || 0);
        if (g > 0) UI.hudFloat($('#h-gold'), `+${g}G`, 'good');
        break;
      }
      case 'boss':
        RS.sfx('boss');
        RS.bgm('boss');
        UI.toast(`${ev.name} 등장!`, 'warn');
        break;
      case 'bossDown':
        RS.sfx('big');
        UI.toast('보스 처치!', 'good');
        break;
      case 'msg':
        UI.toast(ev.text, ev.warn ? 'warn' : '');
        break;
      case 'shot':
        if (RS.sfxAttack) RS.sfxAttack(ev.cls, ev.crit);
        break;
      case 'kill':
        RS.sfx(ev.big ? 'big' : 'kill');
        break;
      case 'leak':
        RS.sfx('leak');
        if (ev.v > 0) {
          const el = $('#h-life');
          el.classList.remove('hit');
          void el.offsetWidth;
          el.classList.add('hit');
          clearTimeout(UI.hitTimer);
          UI.hitTimer = setTimeout(() => el.classList.remove('hit'), 300);
          UI.hudFloat(el, '-' + Math.round(ev.v * 10) / 10, 'bad');
          const t = tut();
          if (!t.off && !t.leak) {
            UI.toast('적이 한 바퀴 돌아 균열로 들어가면 생명이 줄어요', 'warn');
            UI.tutDone('leak');
          }
        }
        break;
      case 'summon':
        if (ev.free) RS.sfx('summon');
        break;
      case 'won':
        RS.bgm(null);
        if (UI.G.battle && UI.G.battle.trialFailed) {
          RS.sfx('lose');
          break;
        }
        RS.sfx('win');
        UI.toast('승리!', 'good');
        break;
      case 'lost':
        RS.bgm(null);
        RS.sfx('lose');
        UI.toast(ev.reason === 'cap' ? '적이 너무 많습니다!' : '생명이 다했습니다', 'warn');

// 모험 화면: 맵, 축복, 차원 방랑자, 선택 대기열, 보상, 상점, 이벤트, 휴식처, 보물, 결과
(function (RS) {

  // 긴 이름은 버튼에 들어가도록 줄인다
  const short = (s, n) => (s.length > n ? s.slice(0, n - 1) + '…' : s);

  function bossTimeOf(run, bossId) {
    const M = RS.collectMods(run);
    const def = RS.ENEMY[bossId];
    return RS.BAL.bossTime + (M.bossTimeAdd || 0) + ((def && def.bossTimeAdd) || 0);

  // ── 맵 ──
  UI.showMap = function () {
    const G = UI.G;
    const run = G.run;
    UI.rewardSel = null;
    UI.shopSel = null;
    UI.restTrain = false;
    UI.mapArmed = null;
    const scr = $('#scr-map');
    scr.innerHTML = '';
    const act = RS.actDef(run);
    const box = h('div', { class: 'mapbox scroll' });
    const wings = RS.wingChoices(run);
    const floors = run.map.floors;
    const nF = floors.length;
    const left = nF - run.floor;
    append(scr, [
      UI.topbar(run, `${run.act}막 · ${act.name}`),
      UI.relicStrip(run),
      box,
      h('p', { class: 'hint' },
        left > 0 ? h('span', { class: 'mapchip' }, left === 1 ? '다음은 보스' : `보스까지 ${left}층`) : null,
        '반짝이는 칸을 누르면 설명, 한 번 더 누르면 이동합니다.' + (wings.length ? ` · 점선 칸은 축지 장화로 (${run.relicState.wingBoots.uses}회)` : '')),
    ]);
    UI.show('scr-map');
    const W = RS.MAP_W;
    const avail = RS.nextChoices(run);
    const isAvail = (f, l) => avail.some((c) => c.f === f && c.lane === l);
    const isWing = (f, l) => wings.some((c) => c.f === f && c.lane === l);
    const pad = 46;
    // 층 사이를 넉넉히 벌려 칸 사이 연결선(대각선 포함)이 충분히 보이게
    const H = Math.max(box.clientHeight, nF * 96 + pad * 2);
    const rowH = (H - pad * 2) / nF;
    const inner = h('div', { class: 'mapinner', style: `height:${H}px` });
    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('class', 'maplines');
    svg.setAttribute('width', '100%');
    svg.setAttribute('height', String(H));
    const laneX = (l) => 10 + l * (80 / (W - 1));
    const rowY = (f) => Math.round(pad + (nF - f) * rowH + rowH / 2 - 8);
    // 지금 갈 수 있는 칸에서 이어지는 모든 칸 (앞으로 탈 수 있는 길)
    const reach = new Set();
    const stack = avail.map((c) => [c.f, c.lane]);
    while (stack.length) {
      const [f, l] = stack.pop();
      const k = f + ':' + l;
      if (reach.has(k)) continue;
      reach.add(k);
      const n = f <= nF && floors[f - 1][l];
      if (n) for (const nl of n.next) if (f < nF) stack.push([f + 1, nl]);
    }
    const addLine = (x1, y1, x2, y2, cls) => {
      const line = document.createElementNS(svgNS, 'line');
      line.setAttribute('x1', x1 + '%');
      line.setAttribute('y1', String(y1));
      line.setAttribute('x2', x2 + '%');
      line.setAttribute('y2', String(y2));
      line.setAttribute('class', cls);
      svg.appendChild(line);
    };
    const edges = [];
    for (let f = 1; f < nF; f++) {
      for (let l = 0; l < W; l++) {
        const n = floors[f - 1][l];
        if (!n) continue;
        for (const nl of n.next) {
          const target = floors[f][nl];
          let cls = 'ln far';
          if (n.visited && target && target.visited) cls = 'ln done';
          else if (f === run.floor && l === run.lane) cls = 'ln open';
          else if (reach.has(f + ':' + l) && reach.has(f + 1 + ':' + nl)) cls = 'ln reach';
          edges.push([laneX(l), rowY(f), laneX(nl), rowY(f + 1), cls]);
        }
      }
    }
    // 흐린 길 → 갈 수 있는 길 → 지나온 길·다음 길 순서로 그려 밝은 선이 위에 오게
    const order = { 'ln far': 0, 'ln reach': 1, 'ln done': 2, 'ln open': 3 };
    edges.sort((a, b) => order[a[4]] - order[b[4]]);
    for (const e of edges) addLine(e[0], e[1], e[2], e[3], 'lnb ' + e[4].slice(3));
    for (const e of edges) addLine(...e);
    inner.appendChild(svg);
    const bossDef = RS.ENEMY[act.boss];
    for (let f = 1; f <= nF; f++) {
      for (let l = 0; l < W; l++) {
        const n = floors[f - 1][l];
        if (!n) continue;
        const shown = n.resolved || n.type;
        const info = RS.NODE_INFO[shown] || RS.NODE_INFO.combat;
        const here = f === run.floor && l === run.lane;
        const can = isAvail(f, l);
        const wing = !can && isWing(f, l);
        const far = !n.visited && !here && !wing && !reach.has(f + ':' + l);
        const isBoss = n.type === 'boss';
        let label = n.type === 'unknown' ? (n.resolved ? `?·${RS.NODE_INFO[n.resolved].name}` : null) : info.name;
        if (isBoss && bossDef) label = bossDef.name;
        const title = n.type === 'unknown' ? '? (미지)' : isBoss && bossDef ? `보스 · ${bossDef.name}` : info.name;
        const key = f + ':' + l;
        const enter = () => {
          UI.mapArmed = null;
          UI.hideTip();
          RS.sfx('click');
          G.enterNode(f, l, wing);
        };
        const nodeIcon = isBoss && bossDef
          ? h('img', { class: 'ic', src: RS.iconURL(act.boss, 3), alt: '' })
          : icon(n.type === 'unknown' && !n.resolved ? 'n_event' : info.icon, '', 3);
        inner.appendChild(h('button', {
          class: `node t-${n.type}${n.visited ? ' visited' : ''}${here ? ' here' : ''}${can ? ' avail' : ''}${wing ? ' wing' : ''}${far ? ' far' : ''}`,
          style: `left:${laneX(l)}%;top:${rowY(f)}px`,
          'aria-label': label || '?',
          onclick(e) {
            if (can || wing) {

              if (UI.mapArmed === key && !$('#tip').hidden) return enter();
              UI.mapArmed = key;
              for (const el of inner.querySelectorAll('.node.armed')) el.classList.remove('armed');
              e.currentTarget.classList.add('armed');
              RS.sfx('click');
              UI.tip(e.currentTarget, title, nodeDesc(n, run), wing ? '축지 장화를 한 번 씁니다' : null, { label: '여기로 이동', onClick: enter });
            } else {

            }
          },

        n.burning ? h('span', { class: 'burn' }, icon('flameE', '', 3)) : null,
        label ? h('span', { class: 'nlabel' }, label) : null));

    }
    box.appendChild(inner);
    const targetY = rowY(Math.min(nF, run.floor + 1));
    box.scrollTop = Math.max(0, targetY - box.clientHeight * 0.55);
  };

  function nodeDesc(n, run) {
    if (n.burning) return '성난 엘리트. 무작위 강화를 받은 엘리트가 나온다. 이기면 유물과 함께 초록 봉인석.';

  function refundOf(item) {

// 게임 진행 제어: 루프, 저장, 화면 전환, 메타 기록
(function (RS) {
  'use strict';

  const STEP = 1 / 60;
  const MAX_STEPS = 12;
  const SAVE_KEY = 'rs_save_v2';
  const META_KEY = 'rs_meta_v1';
  const SPEED_KEY = 'rs_speed';

  function store(k, v) {
    try {
      if (v == null) localStorage.removeItem(k);
      else localStorage.setItem(k, v);
    } catch (e) {
      /* 개인 정보 보호 모드 등: 저장 없이 진행 */
    }
  }
  function load(k) {
    try {
      return localStorage.getItem(k);
    } catch (e) {
      return null;
    }
  }

  const G = (RS.G = {
    run: null, battle: null, renderer: null,
    speed: 1, paused: false, modalOpen: false, hidden: false,
    meta: { runs: 0, wins: 0, bestAct: 0, bestFloor: 0, maxAsc: 0, wongo: 0, tut: {} },
    rotated: false,
    last: 0, acc: 0, hudT: 0, wake: null,
  });
  const UI = RS.UI;
  UI.G = G;

  function loadMeta() {
    try {
      const m = JSON.parse(load(META_KEY) || 'null');
      if (m) Object.assign(G.meta, m);
    } catch (e) {
      /* 손상된 기록은 무시 */
    }
    if (!G.meta.tut || typeof G.meta.tut !== 'object') G.meta.tut = {};
  }
  G.saveMeta = function () {
    store(META_KEY, JSON.stringify(G.meta));
  };

  function unlockState(m) {
    return { cmds: RS.COMMANDERS.filter((c) => RS.commanderUnlocked(c, m)).map((c) => c.id), asc: m.maxAsc || 0 };
  }
  function unlockMessages(before, m) {
    const out = [];
    for (const c of RS.COMMANDERS) {
      if (RS.commanderUnlocked(c, m) && before.cmds.indexOf(c.id) < 0) out.push(`지휘관 ${c.title} ${c.name}`);
    }
    if ((m.maxAsc || 0) > before.asc) out.push(`심연 ${m.maxAsc}`);
    return out;
  }
  // 클리어 기록: 3막 보스를 쓰러뜨리면(4막에 들어서면) 그 자리에서 센다
  function recordClear(run, m) {
    if (run.clearRecorded) return;
    run.clearRecorded = true;
    m.wins = (m.wins || 0) + 1;
    if (run.asc >= (m.maxAsc || 0)) m.maxAsc = Math.min(RS.MAX_ASC, run.asc + 1);
  }
  // 진행 기록: 새 막에 들어서는 순간 최고 기록과 해금을 남긴다 (모험이 끝나기 전에도)
  function recordProgress(run) {
    const m = G.meta;
    const before = unlockState(m);
    // 4막까지 갔다면 3막을 끝까지 오른 것으로 기록
    const act = Math.min(3, run.act);
    const floor = run.act > 3 ? RS.FLOORS_PER_ACT : run.floor;
    let changed = false;
    if (act > (m.bestAct || 0) || (act === m.bestAct && floor > (m.bestFloor || 0))) {
      m.bestAct = act;
      m.bestFloor = floor;
      changed = true;
    }
    if (run.act >= 4 && !run.clearRecorded) {
      recordClear(run, m);
      changed = true;
    }
    if (changed) G.saveMeta();
    const out = unlockMessages(before, m);
    if (out.length) {
      run.newUnlocks = (run.newUnlocks || []).concat(out);
      for (const u of out) UI.toast('해금 · ' + u, 'good');
    }
    return out;
  }

  // 모험이 끝날 때(또는 버릴 때) 기록하고, 이번 모험에서 새로 열린 것을 돌려준다
  function recordEnd(run, won) {
    const m = G.meta;
    recordProgress(run);
    const before = unlockState(m);
    if (won) recordClear(run, m);
    // 진 엔딩은 심장을 실제로 부쉈을 때만
    if (won && run.act === 4) m.heart = true;
    m.wongo = (m.wongo || 0) + Math.floor((run.stats.wongo || 0) / 10);
    G.saveMeta();
    const out = unlockMessages(before, m);
    if (out.length) run.newUnlocks = (run.newUnlocks || []).concat(out);
    return (run.newUnlocks || []).slice();
  }

  G.savedRun = function () {
    const s = load(SAVE_KEY);
    if (!s) return null;
    try {
      return RS.loadString(s);
    } catch (e) {
      return null;
    }
  };

  G.save = function () {
    const run = G.run;
    if (!run) return;
    if (run.phase === 'over' || run.phase === 'victory') store(SAVE_KEY, null);
    else {
      recordProgress(run);
      store(SAVE_KEY, RS.saveString(run));
    }
  };

  // 저장된 모험을 버리고 새로 시작할 때: 지금까지의 진행은 기록에 남긴다
  G.abandonSaved = function () {
    const run = G.savedRun();
    if (run && !run.recorded) {
      run.recorded = true;
      recordEnd(run, false);
    }
    store(SAVE_KEY, null);
  };

  function resetSelections() {
    UI.optSel = null;
    UI.choiceSel = null;
    UI.rewardSel = null;
    UI.shopSel = null;
    UI.restTrain = false;
    UI.mapArmed = null;
  }

  G.newRun = function (seed, opts) {
    resetSelections();
    G.run = RS.newRun(seed, opts);
    G.meta.runs++;
    G.saveMeta();
    G.save();
    G.route();
  };

  G.continueRun = function () {
    const run = G.savedRun();
    if (!run) return UI.showCommanders();
    resetSelections();
    G.run = run;
    G.route();
  };

  G.route = function () {
    const run = G.run;
    releaseWake();
    // 상황별 배경 음악 (고르기 화면은 이전 곡을 이어 간다)
    const BGM = { neow: 'event', map: 'map', reward: 'map', treasure: 'map', shop: 'shop', event: 'event', rest: 'rest', actStart: 'event', over: 'lose', victory: 'win' };
    if (BGM[run.phase]) RS.bgm(BGM[run.phase]);
    switch (run.phase) {
      case 'neow': UI.showNeow(); break;
      case 'map': UI.showMap(); break;
      case 'battle': G.startBattle(); break;
      case 'reward': UI.showReward(); break;
      case 'shop': UI.showShop(); break;
      case 'event': UI.showEvent(); break;
      case 'rest': UI.showRest(); break;
      case 'treasure': UI.showTreasure(); break;
      case 'actStart': UI.showActStart(); break;
      case 'choice': UI.showChoice(); break;
      case 'over':
      case 'victory': {
        if (!run.recorded) {
          run.recorded = true;
          recordEnd(run, run.phase === 'victory');
        }
        UI.showEnd(run.phase === 'victory', (run.newUnlocks || []).slice());
        break;
      }
    }
  };

  // 진행 한 걸음: 상태를 바꾸고, 쌓인 선택(증강 고르기 등)을 먼저 처리한 뒤 저장
  const step = (fn) => (...args) => {
    fn(...args);
    RS.flushQueue(G.run);
    G.save();
    G.route();
  };

  G.afterNeow = step(() => {
    G.run.phase = 'map';
    G.run.pending = null;
  });
  G.enterNode = step((f, lane, wing) => RS.enterNode(G.run, f, lane, wing));
  G.leaveNode = step(() => RS.advance(G.run));
  G.afterReward = step(() => {
    if (RS.rewardComplete(G.run)) RS.advance(G.run);
  });
  G.startAct = step(() => {
    G.run.phase = 'map';
    G.run.pending = null;
  });
  G.startEventFight = step(() => RS.startEventFight(G.run));
  G.finishChoice = function () {
    RS.popQueue(G.run);
    G.save();
    G.route();
  };

  G.startBattle = function () {
    const run = G.run;
    G.battle = new RS.Battle(run, run.pending.stage);
    RS.bgm(run.pending.stage.type === 'boss' ? 'boss' : 'battle');
    G.renderer.reset();
    G.renderer.setTheme(RS.actDef(run).theme);
    G.acc = 0;
    G.paused = false;
    UI.showBattle();
    requestWake();
  };

  G.endBattle = function () {
    const b = G.battle;
    G.battle = null;
    RS.finishBattle(G.run, b);
    G.save();
    G.route();
  };

  // 전투 중 나가면 전투 전 저장본으로 되돌린다
  G.quitToTitle = function () {
    G.battle = null;
    G.run = null;
    releaseWake();
    UI.showTitle();
  };

  G.setSpeed = function (s) {
    G.speed = s;
    store(SPEED_KEY, String(s));
    UI.updateHud(true);
  };
  G.setModal = function (open) {
    G.modalOpen = open;
  };

  // 화면 꺼짐 방지: 백그라운드에 다녀오면 브라우저가 풀어 버리므로 다시 잡는다
  function requestWake() {
    try {
      if (navigator.wakeLock && !G.wake) {
        navigator.wakeLock.request('screen').then((w) => {
          if (!G.battle) {
            w.release().catch(() => {});
            return;
          }
          G.wake = w;
          w.addEventListener('release', () => {
            if (G.wake === w) G.wake = null;
          });
        }).catch(() => {});
      }
    } catch (e) {
      /* 지원하지 않으면 무시 */
    }
  }
  function releaseWake() {
    if (G.wake) {
      G.wake.release().catch(() => {});
      G.wake = null;
    }
  }

  function frame(ts) {
    requestAnimationFrame(frame);
    const dt = G.last ? Math.min(0.1, (ts - G.last) / 1000) : 0;
    G.last = ts;
    const b = G.battle;
    if (!b) return;
    // 가로 회전 안내가 떠 있는 동안에도 멈춘다
    const running = !G.paused && !G.modalOpen && !G.hidden && !G.rotated;
    if (running) {
      G.acc += dt * G.speed;
      let steps = 0;
      while (G.acc >= STEP && steps < MAX_STEPS) {
        b.update(STEP);
        G.acc -= STEP;
        steps++;
      }
      if (steps >= MAX_STEPS) G.acc = 0;
      for (let k = 0; k < b.fx.length; k++) UI.onFx(b.fx[k]);
      G.renderer.consume(b);
      G.hudT -= dt;
      if (G.hudT <= 0) {
        G.hudT = 0.1;
        UI.updateHud();
      }
      if (b.status === 'won' || b.status === 'lost') {
        G.endBattle();
        return;
      }
    }
    G.renderer.draw(b, running ? dt * Math.min(G.speed, 2) : 0);
  }

  function boot(hotData) {
    RS.bakeSprites();
    RS.bakeDigits();
    G.renderer = new RS.Renderer(document.getElementById('cv'));
    G.renderer.setTheme('forest');
    loadMeta();
    G.speed = Math.min(3, Math.max(1, parseInt(load(SPEED_KEY) || '1', 10) || 1));
    if (hotData && hotData.save && !load(SAVE_KEY)) store(SAVE_KEY, hotData.save);
    UI.initBattle();
    // 두 번 탭 방지: 화면이 막 바뀐 직후의 클릭은 버린다 (전투 조작 버튼·전장은 제외)
    document.addEventListener('click', (e) => {
      if (!UI.inputLocked()) return;
      const t = e.target;
      if (t && t.closest && t.closest('#controls,#itembar,#cv')) return;
      e.preventDefault();
      e.stopImmediatePropagation();
    }, true);
    // 툴팁 바깥을 누르면 닫기 (툴팁을 여는 요소는 자기 onclick 이 다시 그린다)
    const tipEl = document.getElementById('tip');
    document.addEventListener('pointerdown', (e) => {
      if (!tipEl || tipEl.hidden || tipEl.contains(e.target)) return;
      if (e.target.closest && e.target.closest('.chip,.node,.keys,.hud .stat,#bossbar,.islot.empty')) return;
      tipEl.hidden = true;
    }, true);
    // 툴팁 자체를 눌러도 닫힌다 (안의 버튼은 제 할 일을 한 뒤 닫는다)
    tipEl.addEventListener('click', (e) => {
      if (!e.target.closest('button')) tipEl.hidden = true;
    });
    // 스크롤하면 툴팁을 숨긴다 (가리키던 것이 움직이므로)
    document.addEventListener('scroll', () => UI.hideTip(), true);
    // 모달 바깥(어두운 배경)을 누르면 닫기
    const modalEl = document.getElementById('modal');
    modalEl.addEventListener('click', (e) => {
      if (e.target === modalEl) UI.closeModal();
    });
    // iOS 사파리는 touchend·click 안에서만 소리를 깨울 수 있다
    for (const ev of ['pointerdown', 'touchend', 'click']) document.addEventListener(ev, () => RS.unlockAudio(), { passive: true });
    document.addEventListener('visibilitychange', () => {
      G.hidden = document.hidden;
      // 앱을 내리면 음악도 멈춘다 (돌아오면 다음 터치에서 다시)
      if (RS.audioHidden) RS.audioHidden(document.hidden);
      if (document.hidden && G.battle && !G.modalOpen) UI.openPause();
      if (!document.hidden && G.battle) requestWake();
    });
    // 가로로 돌리면 전투를 멈추고 메뉴를 띄운다
    if (window.matchMedia) {
      const rot = window.matchMedia('(orientation: landscape) and (max-height: 500px)');
      const onRot = () => {
        G.rotated = rot.matches;
        if (rot.matches && G.battle && !G.modalOpen) UI.openPause();
      };
      if (rot.addEventListener) rot.addEventListener('change', onRot);
      else if (rot.addListener) rot.addListener(onRot);
      G.rotated = rot.matches;
    }
    UI.showTitle();
    const hot = window.claude && window.claude.hot;
    if (hot && hot.snapshot) {
      try {
        // 전투 중 상태가 아니라 마지막 저장본(전투 전)을 넘긴다
        hot.snapshot(() => ({ save: load(SAVE_KEY) }));
      } catch (e) {
        /* 미리보기 환경 */
      }
    }
    requestAnimationFrame(frame);
  }

  function start() {
    const hot = window.claude && window.claude.hot;
    if (hot && hot.ready) hot.ready(boot);
    else boot((hot && hot.data) || {});
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})((globalThis.RS = globalThis.RS || {}));

</script>
</body>
</html>
