:root {
  color-scheme: dark;
  --bg: #15111d;
  --bg2: #1c1627;
  --panel: #251d33;
  --panel2: #30264a;
  --line: #0a070f;
  --hi: #4a3d66;
  --text: #f3e9d2;
  --dim: #a797bd;
  --gold: #f5c44a;
  --gold-d: #9c6f22;
  --red: #ef6166;
  --green: #74d86d;
  --blue: #7cc4ff;
  --pink: #f07fb0;
  --t0: #c2c9d3;
  --t1: #5d9bf0;
  --t2: #b273f0;
  --t3: #f5ae3d;
  --font: 'Galmuri11', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif;
  --px: 0 -2px 0 var(--line), 0 2px 0 var(--line), -2px 0 0 var(--line), 2px 0 0 var(--line);
}

[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--text);
  overscroll-behavior: none;
}
body {
  font: 12px/1.5 var(--font);
  -webkit-text-size-adjust: 100%;
}
#app {
  position: fixed;
  inset: 0;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  display: flex;
  justify-content: center;
  background:
    radial-gradient(120% 60% at 50% 0%, #2a1f3f 0%, rgba(21, 17, 29, 0) 70%),
    var(--bg);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}
img { max-width: 100%; }
.ic, .uimg, .foe, .boss-preview img {
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}
.ic { width: 24px; height: 24px; display: block; }
.uimg { width: 36px; height: 36px; display: block; }
.uimg.big { width: 48px; height: 48px; }
.scroll { overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.scroll-x { overflow-x: auto; touch-action: pan-x; -webkit-overflow-scrolling: touch; }

.screen {
  width: 100%;
  max-width: 480px;
  height: 100%;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* ── 버튼 ── */
.btn {
  font: inherit;
  color: var(--text);
  background: var(--panel2);
  border: 0;
  border-radius: 0;
  margin: 2px;
  padding: 8px 12px;
  min-height: 40px;
  cursor: pointer;
  box-shadow: var(--px), inset 0 -3px 0 rgba(0, 0, 0, 0.35), inset 0 2px 0 rgba(255, 255, 255, 0.12);
  touch-action: manipulation;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.btn:active:not(:disabled) {
  transform: translateY(2px);
  box-shadow: var(--px), inset 0 -1px 0 rgba(0, 0, 0, 0.35), inset 0 2px 0 rgba(255, 255, 255, 0.08);
}
.btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.sm { min-height: 34px; padding: 4px 10px; }
.btn.big { min-height: 52px; font-size: 15px; padding: 10px 20px; }
.btn.gold { background: var(--gold); color: #2b1c07; box-shadow: var(--px), inset 0 -3px 0 var(--gold-d), inset 0 2px 0 rgba(255, 255, 255, 0.45); }
.btn.grow { flex: 1; }
.row2 { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.row2 > .btn { flex: 1; }

/* ── 타이틀 ── */
#scr-title { padding: 24px 20px 18px; }
.title-wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; text-align: center; padding-bottom: 4vh; }
.eyebrow { color: var(--pink); letter-spacing: 0.12em; margin: 0 0 8px; font-size: 11px; }
.logo { margin: 0; font-size: 44px; line-height: 1.1; font-weight: normal; }
.logo span { display: block; color: var(--text); text-shadow: 3px 3px 0 var(--line); }
.logo .l2 { color: var(--gold); text-shadow: 3px 3px 0 #6b3f12, 6px 6px 0 var(--line); }
.parade { display: flex; justify-content: center; gap: 4px; margin-top: 26px; }
.parade .uimg { width: 54px; height: 54px; }
.bob { animation: bob 1.2s steps(2) infinite; }
.parade .uimg:nth-child(2n) { animation-delay: 0.3s; }
@keyframes bob { 50% { transform: translateY(-3px); } }
.title-foes { display: flex; justify-content: center; gap: 10px; margin-top: 10px; opacity: 0.85; }
.title-foes .foe { width: 36px; height: auto; }
.title-menu { display: flex; flex-direction: column; gap: 10px; }
.title-menu > .btn { width: 100%; }
.record { text-align: center; color: var(--dim); margin: 6px 0 0; }

/* ── 상단 바 ── */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 14px 8px;
  background: var(--bg2);
  box-shadow: 0 2px 0 var(--line);
  z-index: 2;
}
.tb-title { font-size: 13px; color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-stats { display: flex; align-items: center; gap: 10px; }
.stat { display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.stat .ic { width: 18px; height: 18px; }
.strip { display: flex; gap: 6px; padding: 8px 14px; min-height: 44px; background: var(--bg2); box-shadow: 0 2px 0 var(--line); }
.strip.wrap { flex-wrap: wrap; background: none; box-shadow: none; padding: 0; }
.chip { flex: 0 0 auto; width: 34px; height: 34px; padding: 3px; border: 0; background: var(--panel); box-shadow: var(--px); display: grid; place-items: center; }
.chip .ic { width: 24px; height: 24px; }
.chip.curse { background: #3a1f3f; }
.chip.item { background: #1f2b3a; }
.chip.aug.r2 { background: #3b3018; }
.chip.aug.r3 { background: #2c2445; }

/* ── 맵 ── */
.mapbox { flex: 1; min-height: 0; position: relative; }
.mapinner { position: relative; width: 100%; }
.maplines { position: absolute; inset: 0; pointer-events: none; }
.maplines .ln { stroke: #4a3d66; stroke-width: 2; stroke-dasharray: 3 5; }
.maplines .ln.done { stroke: var(--gold); stroke-dasharray: none; opacity: 0.8; }
.maplines .ln.open { stroke: var(--text); stroke-dasharray: 4 4; }
.node {
  position: absolute;
  transform: translate(-50%, -50%);
  width: 48px;
  height: 48px;
  border: 0;
  padding: 0;
  background: var(--panel);
  box-shadow: var(--px);
  display: grid;
  place-items: center;
  font: inherit;
  color: var(--text);
  touch-action: manipulation;
}
.node .ic { width: 27px; height: 27px; }
.node .nlabel { position: absolute; top: 50px; left: 50%; transform: translateX(-50%); font-size: 10px; line-height: 1.2; color: var(--dim); white-space: nowrap; }
.node.t-boss { width: 64px; height: 64px; background: #3a1d2c; }
.node.t-boss .ic { width: 40px; height: 40px; }
.node.t-boss .nlabel { top: 66px; }
.node.t-elite { background: #3a2022; }
.node.visited { opacity: 0.45; }
.node.here { opacity: 1; box-shadow: var(--px), 0 0 0 4px var(--gold); }
.node.avail { animation: pulse 1s steps(2) infinite; background: var(--panel2); }
.node.avail .nlabel { color: var(--text); }
@keyframes pulse { 50% { box-shadow: var(--px), 0 0 0 4px var(--text); } }
.hint { text-align: center; color: var(--dim); margin: 0; padding: 8px 12px 10px; font-size: 11px; }

/* ── 전투 ── */
#scr-battle { gap: 0; }
.hud {
  display: flex;
  align-items: center;

// 시드 기반 난수 (mulberry32). 같은 시드면 같은 전투·맵이 나온다.
(function (RS) {
  'use strict';

  function Rng(seed) {
    this.s = seed | 0;
  }
  Rng.prototype.next = function () {
    const a = (this.s = (this.s + 0x6d2b79f5) | 0);
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  Rng.prototype.int = function (n) {
    return Math.floor(this.next() * n);
  };
  Rng.prototype.chance = function (p) {
    return this.next() < p;
  };
  Rng.prototype.pick = function (arr) {
    return arr[Math.floor(this.next() * arr.length)];
  };
  Rng.prototype.weighted = function (items, weightOf) {
    let total = 0;
    for (let i = 0; i < items.length; i++) total += weightOf(items[i]);
    let r = this.next() * total;
    for (let i = 0; i < items.length; i++) {
      r -= weightOf(items[i]);
      if (r < 0) return items[i];
    }
    return items[items.length - 1];
  };
  Rng.prototype.shuffle = function (arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(this.next() * (i + 1));
      const t = arr[i];
      arr[i] = arr[j];
      arr[j] = t;
    }
    return arr;
  };
  Rng.prototype.seed32 = function () {
    return (this.next() * 4294967296) >>> 0;
  };

  RS.Rng = Rng;
  RS.randomSeed = function () {
    return (Math.random() * 4294967296) >>> 0;
  };
})((globalThis.RS = globalThis.RS || {}));

// 증강·유물·저주의 효과를 하나의 수치 묶음(mods)으로 합친다.
(function (RS) {
  'use strict';

  RS.baseMods = function () {
    const cls = {};
    for (const c of RS.CLASSES) cls[c] = { dmg: 0, aspd: 0, range: 0, crit: 0, splash: 0, slow: 0 };
    return {
      dmgPct: 0, aspdPct: 0, rangeAdd: 0, critChance: 0, critMult: 0, cls,
      tierDmg: [0, 0, 0, 0], cornerDmg: 0, innerDmg: 0, innerRange: 0,
      killGoldPct: 0, waveGoldPct: 0, interestCap: 0, interestBonus: 0, combatGoldPct: 0,
      summonCostPct: 0, rareChance: 0, noRare: 0, twinChance: 0, cloverChance: 0,
      mergeRefund: 0, mergeDouble: 0, mergeFail: 0, mergeChoose: 0, mergeMirror: 0,
      sellPct: 0, upgradeCostPct: 0,
      leakMult: 1, leakAdd: 0, thorns: 0, powderKeg: 0,
      enemySpeedPct: 0, enemyHpPct: 0, bossHpPct: 0, extraEnemies: 0, waveIntervalPct: 0,
      freezeChance: 0, firstStrike: 0, shrapnel: 0, eliteDmgPct: 0, burn: 0,
      itemSlots: 0, bossTimeAdd: 0, battleStartGold: 0, battleStartLifeLoss: 0,
      winHeal: 0, eliteKillHeal: 0, eliteKillMaxLife: 0,
      augChoices: 0, augRerolls: 0, restTrainBonus: 0, pocketWatch: 0,
      diversity: 0, purity: 0, eliteSquad: 0, rich: 0, berserk: 0, legendAura: 0,
    };
  };

  const MULTIPLY = { leakMult: true };

  function addInto(M, mods) {
    for (const k in mods) {
      const v = mods[k];
      if (k === 'cls') {
        for (const c in v) for (const s in v[c]) M.cls[c][s] += v[c][s];
      } else if (k === 'tierDmg') {
        for (let i = 0; i < 4; i++) M.tierDmg[i] += v[i] || 0;
      } else if (MULTIPLY[k]) {
        M[k] *= v;
      } else {
        M[k] += v;
      }
    }
  }

  RS.collectMods = function (run) {
    const M = RS.baseMods();
    for (const id of run.augments) addInto(M, RS.AUG[id].mods);
    for (const id of run.relics) addInto(M, RS.REL[id].mods);
    for (const id of run.curses) addInto(M, RS.CURSE[id].mods);
    return M;
  };

  RS.itemSlots = function (run) {
    return 3 + RS.collectMods(run).itemSlots;
  };

  RS.interestCap = function (M) {
    return RS.BAL.interestCap + M.interestCap;
  };
})((globalThis.RS = globalThis.RS || {}));

// 전장 좌표와 유닛 보드(4×5 칸, 한 칸에 같은 유닛 3기까지)
(function (RS) {
  'use strict';

  // 논리 해상도 160×186. 적은 격자 바깥의 사각 루프를 시계 방향으로 돈다.
  const F = (RS.FIELD = {
    W: 160, H: 186, COLS: 4, ROWS: 5, SLOT: 26, GX: 28, GY: 28,
    L: 15, T: 15, R: 145, B: 171,
  });
  F.SIZE = F.COLS * F.ROWS;
  F.TOPLEN = F.R - F.L;
  F.SIDELEN = F.B - F.T;
  F.PERIM = 2 * (F.TOPLEN + F.SIDELEN);

  RS.pathPos = function (d, out) {
    d %= F.PERIM;
    if (d < 0) d += F.PERIM;
    if (d < F.TOPLEN) {
      out.x = F.L + d; out.y = F.T; out.dir = 0;
    } else if ((d -= F.TOPLEN) < F.SIDELEN) {
      out.x = F.R; out.y = F.T + d; out.dir = 1;
    } else if ((d -= F.SIDELEN) < F.TOPLEN) {
      out.x = F.R - d; out.y = F.B; out.dir = 2;
    } else {
      d -= F.TOPLEN;
      out.x = F.L; out.y = F.B - d; out.dir = 3;
    }
    return out;
  };

  const CENTERS = [];
  for (let i = 0; i < F.SIZE; i++) {
    CENTERS.push({
      x: F.GX + (i % F.COLS) * F.SLOT + F.SLOT / 2,
      y: F.GY + Math.floor(i / F.COLS) * F.SLOT + F.SLOT / 2,
    });
  }
  RS.slotCenter = (i) => CENTERS[i];

  RS.slotAt = function (x, y) {
    const c = Math.floor((x - F.GX) / F.SLOT);
    const r = Math.floor((y - F.GY) / F.SLOT);
    if (c < 0 || r < 0 || c >= F.COLS || r >= F.ROWS) return -1;
    return r * F.COLS + c;
  };

  const CORNERS = [0, 3, 16, 19];
  const INNER = [5, 6, 9, 10, 13, 14];
  RS.isCorner = (i) => CORNERS.indexOf(i) >= 0;
  RS.isInner = (i) => INNER.indexOf(i) >= 0;

  // 근접 유닛은 바깥 칸(모서리 우선), 원거리 유닛은 안쪽 칸부터 채운다.
  const MELEE_ORDER = [0, 3, 16, 19, 1, 2, 17, 18, 4, 7, 8, 11, 12, 15, 5, 6, 9, 10, 13, 14];
  const RANGED_ORDER = [5, 6, 9, 10, 13, 14, 1, 2, 17, 18, 4, 7, 8, 11, 12, 15, 0, 3, 16, 19];
  RS.slotOrder = (cls) => (RS.CLASS[cls].melee ? MELEE_ORDER : RANGED_ORDER);

  RS.newBoard = function () {
    const b = [];
    for (let i = 0; i < F.SIZE; i++) b.push(null);
    return b;
  };

  RS.boardUnitCount = function (board) {
    let n = 0;
    for (const s of board) if (s) n += s.n;
    return n;
  };

  RS.bestUnit = function (board) {
    let best = null;
    for (const s of board) if (s && (!best || s.tier > best.tier)) best = s;
    return best;
  };

  RS.mostCommonClass = function (run) {
    const w = {};
    for (const c of RS.CLASSES) w[c] = 0;
    for (const s of run.board) if (s) w[s.cls] += s.n * Math.pow(3, s.tier);
    let best = RS.CLASSES[0];
    for (const c of RS.CLASSES) if (w[c] > w[best]) best = c;
    return best;
  };

  // 같은 유닛 칸 → 빈칸 순으로 찾는다. 자리가 없으면 -1
  RS.findSlotFor = function (board, cls, tier, prefer) {
    const order = RS.slotOrder(cls);
    for (const i of order) {
      const s = board[i];
      if (s && s.cls === cls && s.tier === tier && s.n < 3) return i;
    }
    if (prefer != null && prefer >= 0 && !board[prefer]) return prefer;
    for (const i of order) if (!board[i]) return i;
    return -1;
  };

  RS.addUnit = function (board, cls, tier, prefer) {
    const i = RS.findSlotFor(board, cls, tier, prefer);
    if (i < 0) return -1;
    if (board[i]) board[i].n++;
    else board[i] = { cls, tier, n: 1 };
    return i;
  };

  RS.hasRoomFor = function (board, cls, tier) {
    return RS.findSlotFor(board, cls, tier) >= 0;
  };

  RS.hasEmptySlot = function (board) {
    for (const s of board) if (!s) return true;
    return false;
  };

  RS.swapSlots = function (board, a, b) {
    const t = board[a];
    board[a] = board[b];
    board[b] = t;
  };

  // 같은 유닛을 한 칸에 모으고, 근접은 바깥·원거리는 안쪽으로 다시 배치한다.
  RS.autoArrange = function (board) {
    const groups = {};
    for (const s of board) {
      if (!s) continue;
      const key = s.cls + ':' + s.tier;
      groups[key] = (groups[key] || 0) + s.n;
    }
    const stacks = [];
    for (const key in groups) {
      const parts = key.split(':');
      let n = groups[key];
      while (n > 0) {
        const take = Math.min(3, n);
        stacks.push({ cls: parts[0], tier: +parts[1], n: take });
        n -= take;
      }
    }
    stacks.sort((a, b) => b.tier - a.tier || b.n - a.n);
    for (let i = 0; i < board.length; i++) board[i] = null;
    const leftovers = [];
    for (const st of stacks) {
      const order = RS.slotOrder(st.cls);
      // 근접은 바깥 14칸, 원거리는 안쪽 6칸 + 바깥 비모서리까지만 1차 배치
      const limit = RS.CLASS[st.cls].melee ? 14 : 16;
      let placed = false;
      for (let k = 0; k < limit; k++) {
        const i = order[k];
        if (!board[i]) {
          board[i] = st;
          placed = true;
          break;
        }
      }
      if (!placed) leftovers.push(st);
    }
    for (const st of leftovers) {
      for (let i = 0; i < board.length; i++) {
        if (!board[i]) {
          board[i] = st;
          break;
        }
      }
    }
  };

  RS.canMerge = function (board, i) {
    const s = board[i];
    return !!s && s.n >= 3 && s.tier < 3;
  };

  RS.firstMergeable = function (board) {
    for (let i = 0; i < board.length; i++) if (RS.canMerge(board, i)) return i;
    return -1;
  };

  // 두 개의 서로 다른 클래스 후보 (고대 두루마리)
  RS.mergeOptions = function (rng) {
    const a = rng.pick(RS.CLASSES);
    let b = rng.pick(RS.CLASSES);
    while (b === a) b = rng.pick(RS.CLASSES);
    return [a, b];
  };

  // 합성: 같은 유닛 3기 → 다음 등급 무작위 클래스 1기
  RS.mergeSlot = function (run, i, rng, M, pickCls) {
    const board = run.board;
    const s = board[i];
    if (!RS.canMerge(board, i)) return null;
    const res = { from: s.tier, results: [], fail: false, refund: false, double: false, gold: 0 };
    s.n -= 3;
    if (M.mergeRefund && rng.chance(M.mergeRefund)) {
      s.n += 1;
      res.refund = true;
    }
    if (s.n <= 0) board[i] = null;
    if (M.mergeFail && rng.chance(M.mergeFail)) {
      res.fail = true;
      return res;
    }
    let tier = s.tier + 1;
    if (M.mergeDouble && tier < 3 && rng.chance(M.mergeDouble)) {
      tier++;
      res.double = true;
    }
    const count = M.mergeMirror && rng.chance(M.mergeMirror) ? 2 : 1;
    for (let k = 0; k < count; k++) {

    const nW = RS.BAL.wavesPerStage;
    for (let k = 0; k < nW; k++) {
      const L = RS.waveLevel(act, floor, k);

      const bossWave = type === 'boss' && k === nW - 1;

      heal: M.winHeal,
      aug: RS.rollAugments(run, 3 + M.augChoices, w),
      augW: w,
      augDone: false,
      rerolls: M.augRerolls,
      relics: null,
      relicDone: false,
    };
    if (type === 'elite') reward.relics = RS.rollRelics(run, 2, [1, 2], [70, 30]);
    if (type === 'boss') reward.relics = RS.rollRelics(run, 3, [2, 3], [50, 50]);
    run.phase = 'reward';
    run.pending = { reward };
  };

  RS.rewardPickAug = function (run, id) {
    const r = run.pending.reward;
    if (r.augDone) return;
    RS.pickAugment(run, id);
    r.augDone = true;
  };
  RS.rewardSkipAug = function (run) {
    const r = run.pending.reward;
    if (r.augDone) return 0;
    const g = BAL.skipGold[run.act];
    RS.addGold(run, g);
    r.augDone = true;
    return g;
  };
  RS.rewardReroll = function (run) {
    const r = run.pending.reward;
    if (r.rerolls <= 0 || r.augDone) return false;
    r.rerolls--;
    r.aug = RS.rollAugments(run, r.aug.length, r.augW, r.aug);
    return true;
  };
  RS.rewardPickRelic = function (run, id) {
    const r = run.pending.reward;
    if (r.relicDone) return;
    if (id) RS.addRelic(run, id);
    r.relicDone = true;
  };
  RS.rewardComplete = function (run) {
    const r = run.pending && run.pending.reward;
    return !!r && r.augDone && (!r.relics || !r.relics.length || r.relicDone);
  };

  // 노드를 마치고 다음으로
  RS.advance = function (run) {
    if (run.nodeType === 'boss') {
      if (run.act >= 3) {
        run.phase = 'victory';
        run.pending = null;
        return;
      }
      run.act++;
      run.floor = 0;
      run.lane = -1;
      run.map = RS.genMap(run);
      RS.heal(run, Math.ceil(run.maxLife * BAL.actHealPct));
      run.phase = 'actStart';
      run.pending = null;
      return;
    }
    run.phase = 'map';
    run.pending = null;
  };

  // ── 이벤트 ──
  RS.pickEvent = function (run) {
    let pool = RS.EVENTS.filter((e) => run.seenEvents.indexOf(e.id) < 0);
    if (!pool.length) pool = RS.EVENTS;
    const e = run.rng.pick(pool);
    run.seenEvents.push(e.id);
    return e.id;
  };

  RS.optionDesc = function (run, opt) {
    return typeof opt.desc === 'function' ? opt.desc(run) : opt.desc;
  };
  RS.optionEnabled = function (run, opt) {
    return !opt.cond || opt.cond(run);
  };

  RS.eventChoose = function (run, idx) {
    const ev = RS.EVENT[run.pending.event];
    const opt = ev.options[idx];
    if (!opt || !RS.optionEnabled(run, opt) || run.pending.result) return null;
    let res = opt.apply(run, run.rng);
    if (typeof res === 'string') res = { text: res };
    run.pending.result = res;
    if (res.augRarity) {
      const w = [0, 0, 0, 0];
      w[res.augRarity] = 1;
      run.pending.aug = RS.rollAugments(run, 3, w);
    }
    return res;
  };

  // ── 상점 ──
  const PRICE_MUL = [0, 1, 1.35, 1.7];

  RS.genShop = function (run) {
    const rng = run.rng;
    const mul = PRICE_MUL[run.act];
    const list = [];
    for (const id of RS.rollRelics(run, 2, [1, 2], [65, 35])) {
      list.push({ kind: 'relic', id, price: Math.round((RS.REL[id].rarity === 2 ? 190 : 130) * mul), sold: false });
    }
    for (let k = 0; k < 3; k++) {
      list.push({ kind: 'item', id: RS.randomItemId(rng), price: Math.round((45 + rng.int(26)) * mul), sold: false });
    }
    const aug = RS.rollAugments(run, 1, [0, 0, 1, 0]);
    if (aug.length) list.push({ kind: 'aug', id: aug[0], price: Math.round(110 * mul), sold: false });
    if (run.curses.length) list.push({ kind: 'curse', id: run.curses[0], price: Math.round(80 * mul), sold: false });
    return { list };
  };

  RS.shopBuy = function (run, idx) {
    const it = run.pending.shop.list[idx];
    if (!it || it.sold) return { err: 'sold' };
    if (run.gold < it.price) return { err: 'gold' };
    if (it.kind === 'item' && run.items.length >= RS.itemSlots(run)) return { err: 'full' };
    if (it.kind === 'curse' && run.curses.indexOf(it.id) < 0) return { err: 'sold' };
    RS.addGold(run, -it.price);
    it.sold = true;
    if (it.kind === 'relic') RS.addRelic(run, it.id);
    else if (it.kind === 'item') RS.addItem(run, it.id);
    else if (it.kind === 'aug') RS.pickAugment(run, it.id);
    else if (it.kind === 'curse') run.curses.splice(run.curses.indexOf(it.id), 1);
    return { ok: true };
  };

  // ── 휴식처 ──
  RS.restHealAmount = (run) => Math.ceil(run.maxLife * BAL.restHealPct);
  RS.restTrainAmount = (run) => BAL.trainLevels + RS.collectMods(run).restTrainBonus;
  RS.restHeal = function (run) {
    RS.heal(run, RS.restHealAmount(run));
  };
  RS.restTrain = function (run, cls) {
    run.classLv[cls] += RS.restTrainAmount(run);
  };
})((globalThis.RS = globalThis.RS || {}));

  function buildBackground(th, name) {
    const c = document.createElement('canvas');
    c.width = F.W;
    c.height = F.H;
    const x = c.getContext('2d');
    const rng = new RS.Rng(name.length * 977 + 13);
    x.fillStyle = th.ground[0];
    x.fillRect(0, 0, F.W, F.H);
    for (let k = 0; k < 900; k++) {
      x.fillStyle = rng.pick(th.ground);
      x.fillRect(rng.int(F.W), rng.int(F.H), 1 + rng.int(2), 1);
    }
    for (let k = 0; k < 140; k++) {
      x.fillStyle = rng.pick(th.speck);
      x.fillRect(rng.int(F.W), rng.int(F.H), 1, 1);
    }
    // 길 (폭 18 사각 루프)
    const o = 9;
    x.fillStyle = th.pathEdge;
    x.fillRect(F.L - o - 1, F.T - o - 1, F.R - F.L + 2 * o + 2, F.B - F.T + 2 * o + 2);
    x.fillStyle = th.path[0];
    x.fillRect(F.L - o, F.T - o, F.R - F.L + 2 * o, F.B - F.T + 2 * o);
    // 안쪽 땅
    x.fillStyle = th.pathEdge;
    x.fillRect(F.L + o - 1, F.T + o - 1, F.R - F.L - 2 * o + 2, F.B - F.T - 2 * o + 2);
    x.fillStyle = th.ground[1];

      const py = rng.int(F.H);
      const onPath = px >= F.L - o && px < F.R + o && py >= F.T - o && py < F.B + o &&
        !(px >= F.L + o && px < F.R - o && py >= F.T + o && py < F.B - o);
      if (!onPath) continue;
      x.fillStyle = rng.chance(0.2) ? th.pebble : rng.pick(th.path);
      x.fillRect(px, py, rng.chance(0.3) ? 2 : 1, 1);
    }
    // 칸
    for (let i = 0; i < F.SIZE; i++) {
      const cx = F.GX + (i % F.COLS) * F.SLOT;
      const cy = F.GY + Math.floor(i / F.COLS) * F.SLOT;

  } catch (e) {
    /* 저장소를 못 쓰면 기본값 */

    if (ctx) {

    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);

    g.connect(master);
    o.start(t0);
    o.stop(t0 + dur + 0.02);

    click: () => tone(660, 0.05, 'square', 0.08),
    summon: () => { tone(520, 0.07, 'square', 0.1, 780); tone(780, 0.08, 'square', 0.08, 1040, 0.06); },
    rare: () => { tone(660, 0.08, 'square', 0.1); tone(880, 0.08, 'square', 0.1, null, 0.07); tone(1320, 0.12, 'square', 0.1, null, 0.14); },
    merge: () => { tone(440, 0.07, 'triangle', 0.18); tone(660, 0.07, 'triangle', 0.18, null, 0.06); tone(990, 0.14, 'triangle', 0.18, null, 0.12); },
    legend: () => { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.16, 'square', 0.1, null, i * 0.07)); },
    upgrade: () => { tone(330, 0.06, 'square', 0.1, 660); tone(660, 0.1, 'square', 0.08, 990, 0.06); },
    kill: () => tone(220, 0.05, 'square', 0.04, 110),
    big: () => { tone(160, 0.25, 'sawtooth', 0.15, 50); tone(90, 0.3, 'square', 0.1, 40, 0.05); },
    leak: () => { tone(180, 0.15, 'sawtooth', 0.14, 90); },
    coin: () => { tone(988, 0.05, 'square', 0.07); tone(1319, 0.08, 'square', 0.07, null, 0.05); },

  UI.showMap = function () {
    const run = G.run;
    UI.rewardSel = null;
    UI.shopSel = null;
    UI.restTrain = false;
    const scr = $('#scr-map');
    scr.innerHTML = '';
    const act = RS.ACTS[run.act - 1];
    const box = h('div', { class: 'mapbox scroll' });
    append(scr, [
      topbar(run, `${run.act}막 · ${act.name}`),
      relicStrip(run),
      box,
      h('p', { class: 'hint' }, '반짝이는 칸으로 이동하세요. 칸을 누르면 설명이 나옵니다.'),
    ]);
    show('scr-map');
    const floors = run.map.floors;
    const avail = RS.nextChoices(run);
    const isAvail = (f, l) => avail.some((c) => c.f === f && c.lane === l);
    const pad = 44;
    const H = Math.max(box.clientHeight, 7 * 78 + pad * 2);
    const rowH = (H - pad * 2) / 7;
    const inner = h('div', { class: 'mapinner', style: `height:${H}px` });
    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('class', 'maplines');
    svg.setAttribute('width', '100%');
    svg.setAttribute('height', String(H));
    const laneX = (l) => [18, 50, 82][l];
    const rowY = (f) => Math.round(pad + (7 - f) * rowH + rowH / 2 - 8);
    for (let f = 1; f <= 6; f++) {
      for (let l = 0; l < 3; l++) {
        const n = floors[f - 1][l];
        if (!n) continue;
        for (const nl of n.next) {
          const line = document.createElementNS(svgNS, 'line');
          line.setAttribute('x1', laneX(l) + '%');
          line.setAttribute('y1', String(rowY(f)));
          line.setAttribute('x2', laneX(nl) + '%');
          line.setAttribute('y2', String(rowY(f + 1)));
          const target = floors[f][nl];
          let cls = 'ln';
          if (n.visited && target.visited) cls += ' done';
          else if (f === run.floor && l === run.lane) cls += ' open';
          line.setAttribute('class', cls);
          svg.appendChild(line);
        }
      }
    }
    inner.appendChild(svg);
    for (let f = 1; f <= 7; f++) {
      for (let l = 0; l < 3; l++) {
        const n = floors[f - 1][l];
        if (!n) continue;
        const info = RS.NODE_INFO[n.type];
        const here = f === run.floor && l === run.lane;
        const can = isAvail(f, l);
        inner.appendChild(h('button', {
          class: `node t-${n.type}${n.visited ? ' visited' : ''}${here ? ' here' : ''}${can ? ' avail' : ''}`,
          style: `left:${laneX(l)}%;top:${rowY(f)}px`,
          'aria-label': info.name,
          onclick(e) {
            if (can) {
              RS.sfx('click');
              G.enterNode(f, l);
            } else {
              UI.tip(e.currentTarget, info.name, nodeDesc(n.type));
            }
          },
        }, icon(info.icon, '', 3), h('span', { class: 'nlabel' }, info.name)));
      }
    }
    box.appendChild(inner);
    const targetY = rowY(Math.min(7, run.floor + 1));
    box.scrollTop = Math.max(0, targetY - box.clientHeight * 0.55);
  };

  function bindField() {
    const cv = $('#cv');
    const toLogical = (e) => {
      const r = cv.getBoundingClientRect();
      return { x: ((e.clientX - r.left) / r.width) * F.W, y: ((e.clientY - r.top) / r.height) * F.H };
    };
    let drag = null;
    cv.addEventListener('pointerdown', (e) => {
      if (!G.battle) return;
      e.preventDefault();
      const p = toLogical(e);
      const i = RS.slotAt(p.x, p.y);
      const board = G.run.board;
      if (i < 0) {
        UI.select(-1);
        return;
      }
      if (!board[i]) {
        // 선택된 유닛이 있으면 빈칸으로 이동
        if (UI.sel >= 0 && board[UI.sel]) {
          G.battle.swap(UI.sel, i);
          RS.sfx('click');
          UI.select(i);
        } else UI.select(-1);
        return;
      }
      drag = { from: i, over: i, moved: false, x0: p.x, y0: p.y, id: e.pointerId };
      G.renderer.drag = drag;
      try {
        cv.setPointerCapture(e.pointerId);
      } catch (err) {
        /* 일부 브라우저 */
      }
    });
    cv.addEventListener('pointermove', (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      const p = toLogical(e);
      if (!drag.moved && Math.hypot(p.x - drag.x0, p.y - drag.y0) > 5) drag.moved = true;
      drag.over = RS.slotAt(p.x, p.y);
    });
    const end = (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      const d = drag;
      drag = null;
      G.renderer.drag = null;
      if (!G.battle) return;
      if (d.moved) {
        if (d.over >= 0 && d.over !== d.from) {
          G.battle.swap(d.from, d.over);
          RS.sfx('click');
          UI.select(d.over);
        }
      } else {
        UI.select(UI.sel === d.from ? -1 : d.from);
        RS.sfx('click');
      }
    };
    cv.addEventListener('pointerup', end);
    cv.addEventListener('pointercancel', (e) => {
      if (drag && e.pointerId === drag.id) {
        drag = null;
        G.renderer.drag = null;
      }
    });
  }

  UI.refreshUnitStats = function () {
    const refs = UI.panelRefs;
    const b = G.battle;
    if (!refs || !refs.stats || !b) return;
    const i = UI.sel;
    const s = G.run.board[i];
    if (!s) return;
    if (b.statsDirty) b.computeSlotStats();
    const st = b.slotStats[i];
    if (!st) return;
    const parts = [`피해 ${fmtK(st.dmg)}`, `${(1 / st.interval).toFixed(1)}회/초`, `사거리 ${Math.round(st.range)}`];
    if (st.crit > 0) parts.push(`치명 ${pct(Math.min(1, st.crit))}`);
    if (st.splash) parts.push(`범위 ${st.splash}`);
    if (st.slow) parts.push(`둔화 ${pct(st.slow)}`);
    if (st.shots > 1) parts.push(`${st.shots}발`);
    const text = parts.join(' · ');
    if (refs.stats.textContent !== text) refs.stats.textContent = text;
    const dps = `DPS ${fmtK(st.dps * s.n)}`;
    if (refs.dps && refs.dps.textContent !== dps) refs.dps.textContent = dps;
    if (refs.sell) {
      const t = `판매 +${RS.sellValue(G.run, s.tier, b.M)}`;

  UI.updateHud = function (force) {
    const b = G.battle;
    const run = G.run;
    if (!b || !run) return;
    if (force) UI.hudCache = {};
    const c = UI.hudCache;
    setText($('#h-life-v'), 'life', `${Math.ceil(run.life)}/${run.maxLife}`);
    setText($('#h-gold-v'), 'gold', fmt(run.gold));
    const cap = RS.interestCap(b.M);
    const inter = Math.min(cap, Math.floor(run.gold / RS.BAL.interestPer));
    setText($('#h-int'), 'int', inter > 0 ? `+${inter + (b.M.interestBonus || 0)}` : '');
    setText($('#h-foe-v'), 'foe', `${b.enemies.length}/${b.cap}`);
    const danger = b.enemies.length >= b.cap * 0.7;
    if (c.danger !== danger) {
      c.danger = danger;
      $('#h-foe').classList.toggle('danger', danger);
    }
    const lowLife = run.life <= run.maxLife * 0.3;
    if (c.low !== lowLife) {
      c.low = lowLife;
      $('#h-life').classList.toggle('danger', lowLife);
    }
    const nW = b.stage.waves.length;
    if (b.prep > 0) {
      setText($('#h-wave-v'), 'wv', '준비');
      setText($('#h-wave-t'), 'wt', `${Math.ceil(b.prep)}초`);
    } else {
      setText($('#h-wave-v'), 'wv', `${b.waveIdx}/${nW}`);
      setText($('#h-wave-t'), 'wt', b.waveIdx < nW ? `${Math.max(0, Math.ceil(b.waveT))}초` : '마지막');
    }
    const cost = RS.summonCost(run, b.M);
    setText($('#summon-cost'), 'cost', `${cost}G`);
    const canSummon = run.gold >= cost;
    if (c.canS !== canSummon) {
      c.canS = canSummon;
      $('#b-summon').classList.toggle('off', !canSummon);
    }
    setText($('#b-speed'), 'spd', `x${G.speed}`);
    // 보스
    const bb = $('#bossbar');
    if (b.boss) {
      if (bb.hidden) {
        bb.hidden = false;
        $('#boss-name').textContent = b.boss.def.name;
      }
      const w = Math.max(0, (b.boss.hp / b.boss.maxHp) * 100).toFixed(1) + '%';
      if (c.bhp !== w) {
        c.bhp = w;
        $('#boss-hp').style.width = w;
      }
      setText($('#boss-t'), 'bt', b.enraged ? '폭주!' : `${Math.ceil(b.bossTimer)}초`);
      if (c.enr !== b.enraged) {
        c.enr = b.enraged;
        bb.classList.toggle('enraged', b.enraged);
      }
    } else if (!bb.hidden) bb.hidden = true;
    // 패널
    const refs = UI.panelRefs || {};
    if (UI.panelMode === 'idle' && refs.dps) {
      setText(refs.dps, 'pdps', fmtK(b.totalDps()));
      setText(refs.units, 'punits', `${RS.boardUnitCount(run.board)}/60`);
      setText(refs.int, 'pint', inter > 0 ? `+${inter + (b.M.interestBonus || 0)}G` : '10G당 1');
    } else if (UI.panelMode === 'unit') {
      if (!run.board[UI.sel]) UI.select(-1);
      else UI.refreshUnitStats();
    } else if (UI.panelMode === 'upgrade' && refs.rows) {
      for (const cl of RS.CLASSES) {
        const el = refs.rows[cl];
        const lv = run.classLv[cl];
        const cst = RS.upgradeCost(run, cl, b.M);
        setText(el.querySelector('.lv'), 'lv' + cl, `Lv ${lv}`);
        setText(el.querySelector('.cost'), 'uc' + cl, `${cst}G`);
        const ok = run.gold >= cst;
        if (c['uo' + cl] !== ok) {
          c['uo' + cl] = ok;
          el.classList.toggle('off', !ok);
        }
      }
    }
  };

  // 전투 이벤트 → 소리·토스트
  UI.onFx = function (ev) {
    switch (ev.k) {
      case 'wave':
        RS.sfx('wave');
        UI.toast(`웨이브 ${ev.n}/${ev.total} · +${ev.gold}G${ev.interest ? ` · 이자 +${ev.interest}` : ''}`);
        break;
      case 'boss':
        RS.sfx('boss');
        UI.toast(`${ev.name} 등장!`, 'warn');
        break;
      case 'bossDown':
        RS.sfx('big');
        UI.toast('보스 처치!', 'good');
        break;
      case 'msg':
        UI.toast(ev.text, ev.warn ? 'warn' : '');
        break;
      case 'kill':
        RS.sfx(ev.big ? 'big' : 'kill');
        break;
      case 'leak':
        RS.sfx('leak');
        break;
      case 'upgrade':
        break;
      case 'won':
        RS.sfx('win');
        UI.toast('승리!', 'good');
        break;
      case 'lost':
        RS.sfx('lose');
        UI.toast(ev.reason === 'cap' ? '적이 너무 많습니다!' : '생명이 다했습니다', 'warn');
        break;
    }
  };

  // ── 보상·상점·이벤트 등 페이지 ──
  function page(title, sub, body, footer) {
    const scr = $('#scr-page');
    scr.innerHTML = '';
    append(scr, [
      topbar(G.run, title),
      relicStrip(G.run),
      h('div', { class: 'page scroll' }, sub ? h('p', { class: 'page-sub' }, sub) : null, body),
      footer ? h('div', { class: 'page-foot' }, footer) : null,
    ]);
    show('scr-page');
    scr.querySelector('.page').scrollTop = 0;
  }

      h('div', { class: 'cbody' },

  UI.showShop = function () {
    const run = G.run;
    const shop = run.pending.shop;
    const sel = UI.shopSel != null && shop.list[UI.shopSel] ? UI.shopSel : null;
    const list = h('div', { class: 'cards shop' });
    shop.list.forEach((it, idx) => {
      const selected = sel === idx;
      const onclick = () => {
        if (it.sold) return;
        RS.sfx('click');
        UI.shopSel = idx;
        UI.showShop();
      };
      let card;
      if (it.kind === 'relic') card = relicCard(it.id, selected, onclick, it.price);
      else if (it.kind === 'aug') {
        card = augCard(it.id, selected, onclick);
        card.appendChild(h('span', { class: 'price' }, icon('coin', '', 2), it.price));
      } else if (it.kind === 'item') {
        const d = RS.ITEM[it.id];
        card = h('button', { class: `card item${selected ? ' sel' : ''}`, onclick },
          icon(d.icon, 'cic', 4),
          h('div', { class: 'cbody' }, h('div', { class: 'ctop' }, h('span', { class: 'rar' }, '소모품'), h('b', null, d.name)), h('p', null, d.desc)),
          h('span', { class: 'price' }, icon('coin', '', 2), it.price));
      } else {
        const c = RS.CURSE[it.id];
        card = h('button', { class: `card curse${selected ? ' sel' : ''}`, onclick },
          icon('curse', 'cic', 4),
          h('div', { class: 'cbody' }, h('div', { class: 'ctop' }, h('span', { class: 'rar' }, '정화'), h('b', null, `저주 [${c.name}] 제거`)), h('p', null, c.desc)),
          h('span', { class: 'price' }, icon('coin', '', 2), it.price));
      }
      if (it.sold) card.classList.add('sold');
      else if (run.gold < it.price) card.classList.add('poor');
      list.appendChild(card);
    });
    const it = sel != null ? shop.list[sel] : null;
    const footer = [
      btn('떠나기', () => {
        UI.shopSel = null;
        G.leaveNode();
      }, 'sm'),
      btn(it && !it.sold ? `구매 · ${it.price}G` : '물건을 누르세요', () => {
        const r = RS.shopBuy(run, sel);
        if (r.err === 'gold') {
          RS.sfx('error');
          UI.toast2('골드가 부족해요');

  function buildTabs(tabs) {
    const head = h('div', { class: 'tabs' });
    const body = h('div', { class: 'tabbody' });
    const sel = (k) => {
      for (const b of head.children) b.classList.toggle('on', b.dataset.k === String(k));
      body.innerHTML = '';
      append(body, tabs[k].render());
    };
    tabs.forEach((t, k) => head.appendChild(h('button', { class: 'tab', 'data-k': String(k), onclick: () => sel(k) }, t.name)));
    sel(0);
    return h('div', null, head, body);
  }

  function augRow(id, count) {
    const a = RS.AUG[id];
    return h('div', { class: `lrow r${a.rarity}` }, icon(a.icon, '', 3),
      h('div', null, h('b', null, a.name + (count > 1 ? ` ×${count}` : '')), h('p', null, a.desc), a.cost ? h('p', { class: 'cost' }, '대가 · ' + a.cost) : null));
  }
  function relicRow(id) {

    return h('div', { class: `lrow rr${r.rarity}` }, icon(r.icon, '', 3),
      h('div', null, h('b', null, r.name), h('p', null, r.desc), r.cost ? h('p', { class: 'cost' }, '대가 · ' + r.cost) : null));
  }

  UI.openBuild = function () {
    const run = G.run;
    if (!run) return;
    const counts = {};
    for (const id of run.augments) counts[id] = (counts[id] || 0) + 1;
    UI.modal('빌드', buildTabs([
      {
        name: `증강 ${run.augments.length}`,
        render: () => (Object.keys(counts).length ? Object.keys(counts).map((id) => augRow(id, counts[id])) : h('p', { class: 'dim' }, '아직 증강이 없습니다. 전투에서 이기면 고를 수 있어요.')),
      },
      {
        name: `유물 ${run.relics.length}`,
        render: () => (run.relics.length ? run.relics.map(relicRow) : h('p', { class: 'dim' }, '유물은 엘리트·보스·보물·상점에서 얻습니다.')),
      },
      {
        name: '강화·저주',
        render: () => [
          h('div', { class: 'lvgrid' }, RS.CLASSES.map((c) => h('div', { class: 'lvcell' }, unitImg(c, 0), h('b', null, RS.CLASS[c].name), h('span', null, `Lv ${run.classLv[c]} · +${Math.round(run.classLv[c] * RS.BAL.upgradePct * 100)}%`)))),
          run.curses.length ? run.curses.map((id) => h('div', { class: 'lrow curse' }, icon('curse', '', 3), h('div', null, h('b', null, '저주 · ' + RS.CURSE[id].name), h('p', null, RS.CURSE[id].desc)))) : h('p', { class: 'dim' }, '저주 없음'),
        ],
      },
    ]));
  };

  UI.openCodex = function () {
    const enemyRow = (id) => {
      const e = RS.ENEMY[id];
      return h('div', { class: 'lrow' }, h('img', { class: 'ic', src: RS.iconURL(id, 2), alt: '' }),
        h('div', null, h('b', null, e.name + (e.boss ? ' · 보스' : e.elite ? ' · 엘리트' : '')), h('p', null, `체력 ×${e.hp} · 속도 ${e.speed} · 누수 ${e.leak}`), e.trait ? h('p', { class: 'cost' }, e.trait) : null));
    };
    UI.modal('도감', buildTabs([
      { name: '유닛', render: () => RS.CLASSES.map((c) => h('div', { class: 'lrow' }, unitImg(c, 3), h('div', null, h('b', null, `${RS.CLASS[c].name} · ${RS.CLASS[c].role}`), h('p', null, RS.CLASS[c].desc)))) },
      { name: '증강', render: () => [1, 2, 3].map((r) => RS.AUGMENTS.filter((a) => a.rarity === r).map((a) => augRow(a.id, 1))) },
      { name: '유물', render: () => RS.RELICS.map((r) => relicRow(r.id)) },
      { name: '적', render: () => Object.keys(RS.ENEMY).map(enemyRow) },
    ]));
  };

  UI.openHelp = function () {
    const li = (t, d) => h('li', null, h('b', null, t), ' ', d);
    UI.modal('게임 방법', h('div', { class: 'help' },
      h('ol', null,
        li('소환', '골드로 무작위 유닛을 부릅니다. 같은 유닛은 한 칸에 3기까지 쌓입니다. 소환할수록 비용이 1씩 오릅니다.'),
        li('합성', '같은 칸의 같은 유닛 3기 → 다음 등급 무작위 유닛 1기. 일반 → 희귀 → 영웅 → 전설.'),
        li('배치', '유닛을 끌어서 옮깁니다. 전사·도적은 사거리가 짧아 길과 붙은 바깥 칸에, 궁수·마법사·서리술사는 안쪽 칸에 두세요. [정리] 버튼이 자동으로 해 줍니다.'),
        li('적', '적은 길을 따라 계속 돕니다. 한 바퀴를 돌 때마다 생명이 깎이고, 필드에 적이 60마리가 되면 즉시 패배합니다.'),
        li('골드', '처치할 때, 웨이브가 시작될 때 들어옵니다. 보유 골드 10당 이자 1(최대 5). 모아 두는 것도 전략입니다.'),
        li('강화', '클래스마다 레벨당 피해 +15%. 모든 등급에 적용됩니다.'),
        li('상성', '돌골렘·흑기사는 궁수·도적 피해를 절반만 받습니다. 유령·리치는 물리 피해에 강하니 마법사·서리술사로.'),
        li('모험', '맵에서 길을 골라 3막 보스까지. 전투에서 이기면 증강, 엘리트·보스는 유물을 줍니다. 보스는 제한 시간이 지나면 폭주합니다.'),
        li('저장', '칸을 이동할 때마다 자동 저장됩니다. 전투 도중 나가면 그 전투를 처음부터 다시 합니다.'),
      ),
    ));
  };
})((globalThis.RS = globalThis.RS || {}));

// ── src/main.js ──
// 게임 진행 제어: 루프, 저장, 화면 전환
(function (RS) {
  'use strict';

  const STEP = 1 / 60;
  const MAX_STEPS = 12;
  const SAVE_KEY = 'rs_save_v1';
  const META_KEY = 'rs_meta_v1';
  const SPEED_KEY = 'rs_speed';

  function store(k, v) {
    try {
      if (v == null) localStorage.removeItem(k);
      else localStorage.setItem(k, v);
    } catch (e) {
      /* 개인 정보 보호 모드 등: 저장 없이 진행 */
    }
  }
  function load(k) {
    try {
      return localStorage.getItem(k);
    } catch (e) {
      return null;
    }
  }

  const G = (RS.G = {
    run: null, battle: null, renderer: null,
    speed: 1, paused: false, modalOpen: false, hidden: false,
    meta: { runs: 0, wins: 0, bestAct: 0, bestFloor: 0 },
    last: 0, acc: 0, hudT: 0, wake: null,
  });
  const UI = RS.UI;

  function loadMeta() {
    try {
      const m = JSON.parse(load(META_KEY) || 'null');
      if (m) Object.assign(G.meta, m);
    } catch (e) {
      /* 손상된 기록은 무시 */
    }
  }
  function saveMeta() {
    store(META_KEY, JSON.stringify(G.meta));
  }
  function recordProgress(run, won) {
    const m = G.meta;
    if (run.act > m.bestAct || (run.act === m.bestAct && run.floor > m.bestFloor)) {
      m.bestAct = run.act;
      m.bestFloor = run.floor;
    }
    if (won) m.wins++;
    saveMeta();
  }

  G.savedRun = function () {
    const s = load(SAVE_KEY);
    if (!s) return null;
    try {
      return RS.loadString(s);
    } catch (e) {
      return null;
    }
  };

  G.save = function () {
    const run = G.run;
    if (!run) return;
    if (run.phase === 'over' || run.phase === 'victory') store(SAVE_KEY, null);
    else store(SAVE_KEY, RS.saveString(run));
  };

  G.newRun = function (seed) {
    G.run = RS.newRun(seed);
    G.meta.runs++;
    saveMeta();
    G.save();
    G.route();
  };

  G.continueRun = function () {
    const run = G.savedRun();
    if (!run) return G.newRun();
    G.run = run;
    G.route();
  };

  G.route = function () {
    const run = G.run;
    releaseWake();
    switch (run.phase) {
      case 'map': UI.showMap(); break;
      case 'battle': G.startBattle(); break;
      case 'reward': UI.showReward(); break;
      case 'shop': UI.showShop(); break;
      case 'event': UI.showEvent(); break;
      case 'rest': UI.showRest(); break;
      case 'treasure': UI.showTreasure(); break;
      case 'actStart': UI.showActStart(); break;
      case 'over':
      case 'victory':
        if (!run.recorded) {
          run.recorded = true;
          recordProgress(run, run.phase === 'victory');
        }
        UI.showEnd(run.phase === 'victory');
        break;
    }
  };

  G.enterNode = function (f, lane) {
    RS.enterNode(G.run, f, lane);
    G.save();
    G.route();
  };
  G.leaveNode = function () {
    RS.advance(G.run);
    G.save();
    G.route();
  };
  G.afterReward = function () {
    if (RS.rewardComplete(G.run)) RS.advance(G.run);
    G.save();
    G.route();
  };
  G.startAct = function () {
    G.run.phase = 'map';
    G.save();
    G.route();
  };

  G.startBattle = function () {
    const run = G.run;
    G.battle = new RS.Battle(run, run.pending.stage);
    G.renderer.reset();
    G.renderer.setTheme(RS.ACTS[run.act - 1].theme);
    G.acc = 0;
    G.paused = false;
    UI.showBattle();
    requestWake();
  };

  G.endBattle = function () {
    const b = G.battle;
    G.battle = null;
    RS.finishBattle(G.run, b);
    G.save();
    G.route();
  };

  // 전투 중 나가면 전투 전 저장본으로 되돌린다
  G.quitToTitle = function () {
    G.battle = null;
    G.run = null;
    releaseWake();
    UI.showTitle();
  };

  G.setSpeed = function (s) {
    G.speed = s;
    store(SPEED_KEY, String(s));
    UI.updateHud(true);
  };
  G.setModal = function (open) {
    G.modalOpen = open;
  };

  function requestWake() {
    try {
      if (navigator.wakeLock && !G.wake) {
        navigator.wakeLock.request('screen').then((w) => (G.wake = w)).catch(() => {});
      }
    } catch (e) {
      /* 지원하지 않으면 무시 */
    }
  }
  function releaseWake() {
    if (G.wake) {
      G.wake.release().catch(() => {});
      G.wake = null;
    }
  }

  function frame(ts) {
    requestAnimationFrame(frame);
    const dt = G.last ? Math.min(0.1, (ts - G.last) / 1000) : 0;
    G.last = ts;
    const b = G.battle;
    if (!b) return;
    const running = !G.paused && !G.modalOpen && !G.hidden;
    if (running) {
      G.acc += dt * G.speed;
      let steps = 0;
      while (G.acc >= STEP && steps < MAX_STEPS) {
        b.update(STEP);
        G.acc -= STEP;
        steps++;
      }
      if (steps >= MAX_STEPS) G.acc = 0;
      for (let k = 0; k < b.fx.length; k++) UI.onFx(b.fx[k]);
      G.renderer.consume(b);
      G.hudT -= dt;
      if (G.hudT <= 0) {
        G.hudT = 0.1;
        UI.updateHud();
      }
      if (b.status === 'won' || b.status === 'lost') {
        G.endBattle();
        return;
      }
    }
    G.renderer.draw(b, running ? dt * Math.min(G.speed, 2) : 0);
  }

  function boot(hotData) {
    RS.bakeSprites();
    RS.bakeDigits();
    G.renderer = new RS.Renderer(document.getElementById('cv'));
    G.renderer.setTheme('forest');
    loadMeta();
    G.speed = Math.min(3, Math.max(1, parseInt(load(SPEED_KEY) || '1', 10) || 1));
    if (hotData && hotData.save && !load(SAVE_KEY)) store(SAVE_KEY, hotData.save);
    UI.init(G);
    UI.showTitle();
    // iOS 사파리는 touchend·click 안에서만 소리를 깨울 수 있다
    for (const ev of ['pointerdown', 'touchend', 'click']) document.addEventListener(ev, () => RS.unlockAudio(), { passive: true });
    document.addEventListener('visibilitychange', () => {
      G.hidden = document.hidden;
      if (document.hidden && G.battle && !G.modalOpen) UI.openPause();
    });
    const hot = window.claude && window.claude.hot;
    if (hot && hot.snapshot) {
      try {
        // 전투 중 상태가 아니라 마지막 저장본(전투 전)을 넘긴다
        hot.snapshot(() => ({ save: load(SAVE_KEY) }));
      } catch (e) {
        /* 미리보기 환경 */
      }
    }
    requestAnimationFrame(frame);
  }

  function start() {
    const hot = window.claude && window.claude.hot;
    if (hot && hot.ready) hot.ready(boot);
    else boot((hot && hot.data) || {});
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})((globalThis.RS = globalThis.RS || {}));

</script>
