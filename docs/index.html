:root {
  color-scheme: dark;
  --bg: #15111d;
  --bg2: #1c1627;
  --panel: #251d33;
  --panel2: #30264a;
  --line: #0a070f;
  --hi: #4a3d66;
  --text: #f3e9d2;
  --dim: #a797bd;
  --gold: #f5c44a;
  --gold-d: #9c6f22;
  --red: #ef6166;
  --green: #74d86d;
  --blue: #7cc4ff;
  --pink: #f07fb0;
  --t0: #c2c9d3;
  --t1: #5d9bf0;
  --t2: #b273f0;
  --t3: #f5ae3d;
  --font: 'Galmuri11', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif;
  --px: 0 -2px 0 var(--line), 0 2px 0 var(--line), -2px 0 0 var(--line), 2px 0 0 var(--line);
}

[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--text);
  overscroll-behavior: none;
}
body {
  font: 12px/1.5 var(--font);
  -webkit-text-size-adjust: 100%;
}
#app {
  position: fixed;
  inset: 0;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  display: flex;
  justify-content: center;
  background:
    radial-gradient(120% 60% at 50% 0%, #2a1f3f 0%, rgba(21, 17, 29, 0) 70%),
    var(--bg);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}
img { max-width: 100%; }
.ic, .uimg, .foe, .boss-preview img {
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}
.ic { width: 24px; height: 24px; display: block; }
.uimg { width: 36px; height: 36px; display: block; }
.uimg.big { width: 48px; height: 48px; }
.scroll { overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.scroll-x { overflow-x: auto; touch-action: pan-x; -webkit-overflow-scrolling: touch; }

.screen {
  width: 100%;
  max-width: 480px;
  height: 100%;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* ── 버튼 ── */
.btn {
  font: inherit;
  color: var(--text);
  background: var(--panel2);
  border: 0;
  border-radius: 0;
  margin: 2px;
  padding: 8px 12px;
  min-height: 40px;
  cursor: pointer;
  box-shadow: var(--px), inset 0 -3px 0 rgba(0, 0, 0, 0.35), inset 0 2px 0 rgba(255, 255, 255, 0.12);
  touch-action: manipulation;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.btn:active:not(:disabled) {
  transform: translateY(2px);
  box-shadow: var(--px), inset 0 -1px 0 rgba(0, 0, 0, 0.35), inset 0 2px 0 rgba(255, 255, 255, 0.08);
}
.btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.sm { min-height: 34px; padding: 4px 10px; }
.btn.big { min-height: 52px; font-size: 15px; padding: 10px 20px; }
.btn.gold { background: var(--gold); color: #2b1c07; box-shadow: var(--px), inset 0 -3px 0 var(--gold-d), inset 0 2px 0 rgba(255, 255, 255, 0.45); }
.btn.grow { flex: 1; }
.row2 { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.row2 > .btn { flex: 1; }

/* ── 타이틀 ── */
#scr-title { padding: 24px 20px 18px; }
.title-wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; text-align: center; padding-bottom: 4vh; }
.eyebrow { color: var(--pink); letter-spacing: 0.12em; margin: 0 0 8px; font-size: 11px; }
.logo { margin: 0; font-size: 44px; line-height: 1.1; font-weight: normal; }
.logo span { display: block; color: var(--text); text-shadow: 3px 3px 0 var(--line); }
.logo .l2 { color: var(--gold); text-shadow: 3px 3px 0 #6b3f12, 6px 6px 0 var(--line); }
.parade { display: flex; justify-content: center; gap: 4px; margin-top: 26px; }
.parade .uimg { width: 54px; height: 54px; }
.bob { animation: bob 1.2s steps(2) infinite; }
.parade .uimg:nth-child(2n) { animation-delay: 0.3s; }
@keyframes bob { 50% { transform: translateY(-3px); } }
.title-foes { display: flex; justify-content: center; gap: 10px; margin-top: 10px; opacity: 0.85; }
.title-foes .foe { width: 36px; height: auto; }
.title-menu { display: flex; flex-direction: column; gap: 10px; }
.title-menu > .btn { width: 100%; }
.record { text-align: center; color: var(--dim); margin: 6px 0 0; }

/* ── 상단 바 ── */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 14px 8px;
  background: var(--bg2);
  box-shadow: 0 2px 0 var(--line);
  z-index: 2;
}
.tb-title { font-size: 13px; color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-stats { display: flex; align-items: center; gap: 10px; }
.stat { display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.stat .ic { width: 18px; height: 18px; }
.strip { display: flex; gap: 6px; padding: 8px 14px; min-height: 44px; background: var(--bg2); box-shadow: 0 2px 0 var(--line); }
.strip.wrap { flex-wrap: wrap; background: none; box-shadow: none; padding: 0; }
.chip { flex: 0 0 auto; width: 34px; height: 34px; padding: 3px; border: 0; background: var(--panel); box-shadow: var(--px); display: grid; place-items: center; }
.chip .ic { width: 24px; height: 24px; }
.chip.curse { background: #3a1f3f; }
.chip.item { background: #1f2b3a; }
.chip.aug.r2 { background: #3b3018; }
.chip.aug.r3 { background: #2c2445; }

/* ── 맵 ── */
.mapbox { flex: 1; min-height: 0; position: relative; }
.mapinner { position: relative; width: 100%; }
.maplines { position: absolute; inset: 0; pointer-events: none; }
.maplines .ln { stroke: #4a3d66; stroke-width: 2; stroke-dasharray: 3 5; }
.maplines .ln.done { stroke: var(--gold); stroke-dasharray: none; opacity: 0.8; }
.maplines .ln.open { stroke: var(--text); stroke-dasharray: 4 4; }
.node {
  position: absolute;
  transform: translate(-50%, -50%);
  width: 48px;
  height: 48px;
  border: 0;
  padding: 0;
  background: var(--panel);
  box-shadow: var(--px);
  display: grid;
  place-items: center;
  font: inherit;
  color: var(--text);
  touch-action: manipulation;
}
.node .ic { width: 27px; height: 27px; }
.node .nlabel { position: absolute; top: 50px; left: 50%; transform: translateX(-50%); font-size: 10px; line-height: 1.2; color: var(--dim); white-space: nowrap; }
.node.t-boss { width: 64px; height: 64px; background: #3a1d2c; }
.node.t-boss .ic { width: 40px; height: 40px; }
.node.t-boss .nlabel { top: 66px; }
.node.t-elite { background: #3a2022; }
.node.visited { opacity: 0.45; }
.node.here { opacity: 1; box-shadow: var(--px), 0 0 0 4px var(--gold); }
.node.avail { animation: pulse 1s steps(2) infinite; background: var(--panel2); }
.node.avail .nlabel { color: var(--text); }
@keyframes pulse { 50% { box-shadow: var(--px), 0 0 0 4px var(--text); } }
.hint { text-align: center; color: var(--dim); margin: 0; padding: 8px 12px 10px; font-size: 11px; }

/* ── 전투 ── */
#scr-battle { gap: 0; }
.hud {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 8px;
  background: var(--bg2);
  box-shadow: 0 2px 0 var(--line);
  z-index: 2;
}
.hud .stat { flex: 1; min-width: 0; justify-content: center; background: var(--panel); box-shadow: var(--px); height: 30px; margin: 2px; padding: 0 4px; white-space: nowrap; }
.hud .stat b { font-weight: normal; font-size: 12px; }
.hud .stat small { color: var(--green); font-size: 10px; }
.hud .stat.danger b { color: var(--red); }
.hud .stat.danger { animation: warn 0.6s steps(2) infinite; }
@keyframes warn { 50% { background: #4a1d27; } }
.hud #h-wave { flex: 1.2; flex-direction: column; gap: 0; line-height: 1.1; }
.hud #h-wave small { color: var(--dim); }
.hud .btn.sm { min-height: 30px; min-width: 34px; padding: 0 6px; margin: 2px; }
#field { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; }
#cv {
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  touch-action: none;
  box-shadow: var(--px);
}
#bossbar {
  position: absolute;
  left: 12px;
  right: 12px;
  top: 8px;
  z-index: 3;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 3px 8px;
  background: rgba(21, 17, 29, 0.88);
  box-shadow: var(--px);
  font-size: 11px;
  pointer-events: none;
}
#bossbar .bar { flex: 1; height: 8px; background: #3a1d2c; box-shadow: 0 0 0 1px var(--line); }
#bossbar .bar i { display: block; height: 100%; background: var(--red); width: 100%; }
#bossbar.enraged { animation: warn 0.4s steps(2) infinite; }
#boss-name { color: var(--pink); white-space: nowrap; }
#boss-t { font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; }
#toasts { position: absolute; left: 0; right: 0; bottom: 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: none; z-index: 4; }
.toast {
  background: rgba(21, 17, 29, 0.92);
  box-shadow: var(--px);
  padding: 5px 10px;

<script>
// ── src/core/rng.js ──
// 시드 기반 난수 (mulberry32). 같은 시드면 같은 전투·맵이 나온다.
(function (RS) {
  'use strict';

  function Rng(seed) {
    this.s = seed | 0;
  }
  Rng.prototype.next = function () {
    const a = (this.s = (this.s + 0x6d2b79f5) | 0);
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  Rng.prototype.int = function (n) {
    return Math.floor(this.next() * n);
  };
  Rng.prototype.chance = function (p) {
    return this.next() < p;
  };
  Rng.prototype.pick = function (arr) {
    return arr[Math.floor(this.next() * arr.length)];
  };
  Rng.prototype.weighted = function (items, weightOf) {
    let total = 0;
    for (let i = 0; i < items.length; i++) total += weightOf(items[i]);
    let r = this.next() * total;
    for (let i = 0; i < items.length; i++) {
      r -= weightOf(items[i]);
      if (r < 0) return items[i];
    }
    return items[items.length - 1];
  };
  Rng.prototype.shuffle = function (arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(this.next() * (i + 1));
      const t = arr[i];
      arr[i] = arr[j];
      arr[j] = t;
    }
    return arr;
  };
  Rng.prototype.seed32 = function () {
    return (this.next() * 4294967296) >>> 0;
  };

  RS.Rng = Rng;
  RS.randomSeed = function () {
    return (Math.random() * 4294967296) >>> 0;
  };
})((globalThis.RS = globalThis.RS || {}));

// ── src/data/units.js ──
// 밸런스 상수, 유닛·등급·적·막(Act) 데이터
(function (RS) {
  'use strict';

    const rng = run.rng;
    const cost = rng.pick(COSTS);
    const big = rng.pick(BIG.filter((b) => b.clash !== cost.id));
    return [
      { kind: 'small', id: rng.pick(SMALL).id },
      { kind: 'mid', id: rng.pick(MID).id },
      { kind: 'big', id: big.id, cost: cost.id },
      { kind: 'swap' },
    ];
  };

  const find = (list, id) => list.find((x) => x.id === id);
  RS.blessingText = function (b) {
    if (b.kind === 'small') return { text: find(SMALL, b.id).text };
    if (b.kind === 'mid') return { text: find(MID, b.id).text };
    if (b.kind === 'big') return { text: find(BIG, b.id).text, cost: find(COSTS, b.cost).text };
    return { text: '시작 유물을 무작위 보스 유물로 바꾼다' };
  };
  RS.applyBlessing = function (run, b) {
    if (b.kind === 'small') find(SMALL, b.id).apply(run);
    else if (b.kind === 'mid') find(MID, b.id).apply(run);
    else if (b.kind === 'big') {
      find(COSTS, b.cost).apply(run);
      find(BIG, b.id).apply(run);
    } else {
      const start = run.relics.find((id) => RS.REL[id].rarity === 5);
      if (start) run.relics.splice(run.relics.indexOf(start), 1);
      RS.grantRandomRelic(run, [3]);
    }
  };

// 증강·유물·저주의 효과를 하나의 수치 묶음(mods)으로 합친다.
(function (RS) {
  'use strict';

  RS.baseMods = function () {
    const cls = {};
    for (const c of RS.CLASSES) cls[c] = { dmg: 0, aspd: 0, range: 0, crit: 0, splash: 0, slow: 0 };
    return {
      dmgPct: 0, aspdPct: 0, rangeAdd: 0, critChance: 0, critMult: 0, cls,
      tierDmg: [0, 0, 0, 0], cornerDmg: 0, innerDmg: 0, innerRange: 0,
      killGoldPct: 0, waveGoldPct: 0, interestCap: 0, interestBonus: 0, combatGoldPct: 0,
      summonCostPct: 0, rareChance: 0, epicChance: 0, noRare: 0, twinChance: 0, cloverChance: 0,
      mergeRefund: 0, mergeDouble: 0, mergeFail: 0, mergeChoose: 0, mergeMirror: 0,
      sellPct: 0, upgradeCostPct: 0, shopDiscount: 0,
      leakMult: 1, leakAdd: 0, thorns: 0, powderKeg: 0,
      enemySpeedPct: 0, enemyHpPct: 0, bossHpPct: 0, extraEnemies: 0, waveIntervalPct: 0,
      freezeChance: 0, firstStrike: 0, shrapnel: 0, eliteDmgPct: 0, burn: 0,
      itemSlots: 0, bossTimeAdd: 0, battleStartGold: 0, battleStartLifeLoss: 0,
      winHeal: 0, eliteKillHeal: 0, eliteKillMaxLife: 0,
      augChoices: 0, augRerolls: 0, restTrainBonus: 0, pocketWatch: 0,
      diversity: 0, purity: 0, eliteSquad: 0, rich: 0, berserk: 0, legendAura: 0,
    };
  };

  const MULTIPLY = { leakMult: true };

  function addInto(M, mods) {
    for (const k in mods) {
      const v = mods[k];
      if (k === 'cls') {
        for (const c in v) for (const s in v[c]) M.cls[c][s] += v[c][s];
      } else if (k === 'tierDmg') {
        for (let i = 0; i < 4; i++) M.tierDmg[i] += v[i] || 0;
      } else if (MULTIPLY[k]) {
        M[k] *= v;
      } else {
        M[k] = (M[k] || 0) + v;
      }
    }
  }

  // 증강 강화(연마): 이로운 수치만 1.5배. 이로운 수치가 없으면 null (강화 불가)
  const GOOD_UP = [
    'dmgPct', 'aspdPct', 'rangeAdd', 'critChance', 'critMult', 'killGoldPct', 'waveGoldPct', 'interestCap', 'interestBonus',
    'rareChance', 'twinChance', 'mergeRefund', 'mergeDouble', 'mergeMirror', 'sellPct', 'enemySpeedPct', 'eliteDmgPct',
    'firstStrike', 'shrapnel', 'freezeChance', 'diversity', 'purity', 'eliteSquad', 'rich', 'legendAura', 'demonForm',
    'noxious', 'poison', 'eliteKillHeal',
  ];
  const GOOD_DOWN = ['summonCostPct', 'upgradeCostPct'];
  RS.upgradeScale = function (mods, f) {
    const out = {};
    let any = false;
    for (const k in mods) {
      const v = mods[k];
      if (k === 'cls') {
        out.cls = {};
        for (const c in v) {
          out.cls[c] = {};
          for (const s in v[c]) {
            out.cls[c][s] = v[c][s] > 0 ? v[c][s] * f : v[c][s];
            if (v[c][s] > 0) any = true;
          }
        }
      } else if (GOOD_UP.indexOf(k) >= 0 && v > 0) {
        out[k] = k === 'interestCap' || k === 'interestBonus' || k === 'rangeAdd' ? Math.round(v * f) : v * f;
        any = true;
      } else if (GOOD_DOWN.indexOf(k) >= 0 && v < 0) {
        out[k] = Math.max(-0.9, v * f);
        any = true;
      } else out[k] = v;
    }
    return any ? out : null;
  };

  RS.collectMods = function (run) {
    const M = RS.baseMods();
    for (const id of run.augments) {
      const def = RS.augDef(id);
      addInto(M, RS.isUpgraded(id) ? RS.upgradeScale(def.mods, 1.5) || def.mods : def.mods);
    }
    for (const id of run.relics) addInto(M, RS.REL[id].mods);
    for (const id of run.curses) addInto(M, RS.CURSE[id].mods);
    return M;
  };

  RS.itemSlots = function (run) {
    return 3 + RS.collectMods(run).itemSlots + ((run.relicState && run.relicState.ghostSlots) || 0);
  };

  RS.interestCap = function (M) {
    return RS.BAL.interestCap + M.interestCap;
  };

  // ── 룬: 보드 칸에 새기는 인챈트 (슬레이 더 스파이어 2의 인챈트에서 착안) ──
  RS.RUNES = [
    { id: 'might', name: '힘의 룬', color: '#ef6166', desc: '이 칸 유닛 피해 +40%', mods: { dmg: 0.4 } },
    { id: 'swift', name: '신속의 룬', color: '#74d86d', desc: '이 칸 유닛 공격 속도 +30%', mods: { aspd: 0.3 } },
    { id: 'hawk', name: '매의 룬', color: '#7cc4ff', desc: '이 칸 유닛 사거리 +12', mods: { range: 12 } },
    { id: 'greed', name: '황금 룬', color: '#f5c44a', desc: '이 칸 유닛이 적을 처치하면 골드 +2', mods: { killGold: 2 } },
    { id: 'frostR', name: '서리 룬', color: '#a8ecff', desc: '이 칸 유닛 공격이 적을 15% 둔화', mods: { slow: 0.15 } },
    { id: 'fury', name: '분노의 룬', color: '#f07fb0', desc: '이 칸 유닛 치명타 확률 +15%', mods: { crit: 0.15 } },
    { id: 'echoR', name: '메아리의 룬', color: '#d3a0f7', desc: '이 칸 유닛 공격이 20% 확률로 한 번 더', mods: { echo: 0.2 } },
    { id: 'cloneR', name: '복제의 룬', color: '#ffd98a', desc: '휴식처에서 [복제]: 이 칸 유닛 1기를 복제', mods: {}, clone: true },
    { id: 'crack', name: '금 간 칸', color: '#6b6280', desc: '이 칸 유닛 피해 -30% (고통)', mods: { dmg: -0.3 }, bad: true },
  ];
  RS.RUNE = {};
  for (const r of RS.RUNES) RS.RUNE[r.id] = r;
})((globalThis.RS = globalThis.RS || {}));

(function (RS) {
  'use strict';

  // 논리 해상도 160×186. 적은 격자 바깥의 사각 루프를 시계 방향으로 돈다.
  const F = (RS.FIELD = {
    W: 160, H: 186, COLS: 4, ROWS: 5, SLOT: 26, GX: 28, GY: 28,
    L: 15, T: 15, R: 145, B: 171,
  });
  F.SIZE = F.COLS * F.ROWS;
  F.TOPLEN = F.R - F.L;
  F.SIDELEN = F.B - F.T;
  F.PERIM = 2 * (F.TOPLEN + F.SIDELEN);

    this.stats.goldEarned += wg + interest;

    this.waveT = RS.BAL.waveTime * (1 - M.waveIntervalPct);
    this.nextWaveDelay = -1;
    this.waveSummons = 0;
    this.echoUsed = false;
    if (k === 1 && M.doubt) {
      for (let i = 0; i < F.SIZE; i++) if (this.slotStun[i] > 100) this.slotStun[i] = 0;
    }
    if (M.pocketWatch) this.buffs.watch = 4;
    if (M.demonForm) {
      this.demon += M.demonForm;
      this.dynT = 0;
    }
    let free = M.waveFreeSummon || 0;
    if (M.happyFlower) {
      const st = (run.relicState.happyFlower = run.relicState.happyFlower || { n: 0 });
      st.n++;
      if (st.n >= 3) {
        st.n = 0;
        free++;
      }
    }
    for (let i = 0; i < free; i++) this.freeSummon(0);
    if (M.sealSummon && run.gold >= M.sealSummon) {
      RS.addGold(run, -M.sealSummon);
      this.freeSummon(0);
    }
    if (M.debt) RS.addGold(run, -M.debt);
    if (M.stars) this.stars = Math.min(5, this.stars + 1);
    this.emit({ k: 'wave', n: k + 1, total: this.stage.waves.length, gold: Math.round(wg), interest });
  };

  P.updateSpawns = function (dt) {
    if (!this.spawnQ.length) {
      this.spawnT = 0;
      return;
    }
    this.spawnT -= dt;
    while (this.spawnQ.length && this.spawnT <= 0) {
      const sp = this.spawnQ.shift();
      const e = this.spawnEnemy(sp.type, sp.L, 0, F.PERIM, sp.hpMul);
      if (sp.one) e.hp = e.maxHp = 1;
      if (sp.burning) e.burning = sp.burning;
      this.spawnT += sp.gap;
    }
  };

  P.spawnEnemy = function (type, L, d, nextLap, hpMul) {
    const def = RS.ENEMY[type];
    const M = this.M;
    const asc = this.run.asc || 0;
    let hp = RS.levelHp(L) * def.hp * (1 + M.enemyHpPct) * (hpMul || 1);
    if (def.boss) hp *= Math.max(0.2, 1 - M.bossHpPct) * (asc >= 8 ? 1.15 : 1);
    else if (def.elite) hp *= Math.max(0.2, 1 + (M.eliteHpPct || 0)) * (asc >= 7 ? 1.15 : 1);
    else if (asc >= 6) hp *= 1.1;
    const e = {
      id: this.nextId++, type, def, L,
      hp, maxHp: hp,
      d, nextLap, laps: 0, x: 0, y: 0, dir: 0,
      speed: def.speed,
      slow: 0, slowT: 0, stunT: 0, hasteP: 0, hasteT: 0,
      burn: 0, burnT: 0, poison: 0, poisonN: 0, poisonT: 0,
      struck: false, flash: 0,
      timer: 0, splitDone: 0, capLeft: def.dpsCap ? hp * def.dpsCap : 0, capT: 0,
      boss: !!def.boss, elite: !!def.elite, dead: false, burning: false,
      phase: this.rng.next() * 6.28,
    };
    RS.pathPos(e.d, e);
    this.enemies.push(e);
    if (e.boss) {
      this.bosses.push(e);
      if (!this.boss) {
        this.boss = e;
        this.bossTimer = RS.BAL.bossTime + M.bossTimeAdd + (def.bossTimeAdd || 0);
      }
      this.emit({ k: 'boss', name: def.name });
    }
    return e;
  };

  // 적이 적을 소환·분열할 때는 반복문이 끝난 뒤에 넣는다
  P.queueSpawn = function (type, L, d, nextLap, hpMul) {
    this.pending.push({ type, L, d, nextLap, hpMul });
  };
  P.flushPending = function () {
    if (!this.pending.length) return;
    for (const p of this.pending) this.spawnEnemy(p.type, p.L, p.d, p.nextLap, p.hpMul);
    this.pending.length = 0;
  };

  P.updateRift = function (dt) {
    for (let i = 0; i < F.SIZE; i++) if (this.slotStun[i] > 0 && this.slotStun[i] < 100) this.slotStun[i] -= dt;
    if (!this.riftWarn.length) return;
    for (const w of this.riftWarn) {
      w.t -= dt;
      if (w.t <= 0) {
        for (const c of w.cells) this.slotStun[c] = Math.max(this.slotStun[c], w.stun);
        this.emit({ k: 'rift', cells: w.cells });
      }
    }
    this.riftWarn = this.riftWarn.filter((w) => w.t > 0);
  };

  P.updateEnemies = function (dt) {
    const M = this.M;
    const globalSpeed = Math.max(0.3, 1 - M.enemySpeedPct);
    const list = this.enemies;
    for (let i = 0, n = list.length; i < n; i++) {
      const e = list[i];
      if (e.dead) continue;
      if (e.flash > 0) e.flash -= dt;
      if (e.stunT > 0) e.stunT -= dt;
      if (e.slowT > 0) {
        e.slowT -= dt;
        if (e.slowT <= 0) e.slow = 0;
      }
      if (e.hasteT > 0) {
        e.hasteT -= dt;
        if (e.hasteT <= 0) e.hasteP = 0;
      }
      if (e.capT !== undefined && e.def.dpsCap) {
        e.capT += dt;
        if (e.capT >= 0.5) {
          e.capT -= 0.5;
          e.capLeft = e.maxHp * e.def.dpsCap * 0.5;
        }
      }
      if (e.burnT > 0) {
        e.burnT -= dt;
        this.damage(e, e.burn * dt, null, false, true);
        if (e.dead) continue;
      }
      if (e.poisonT > 0) {
        e.poisonT -= dt;
        this.damage(e, e.poison * e.poisonN * dt, null, false, true);
        if (e.poisonT <= 0) e.poisonN = 0;
        if (e.dead) continue;
      }
      if (e.burning === 'regen' && e.hp < e.maxHp) e.hp = Math.min(e.maxHp, e.hp + e.maxHp * 0.015 * dt);
      if (M.noxious) {
        this.damage(e, e.maxHp * M.noxious * (e.boss ? 0.34 : 1) * dt, null, false, true);
        if (e.dead) continue;
      }
      const def = e.def;
      if (def.heal || def.haste || def.summon || def.rift || def.hop || def.submerge || def.anchor) this.enemySkill(e, def, dt);
      if (e.subT > 0) e.subT -= dt;
      if (e.stunT > 0) continue;
      let sp = e.speed * globalSpeed * (1 - e.slow) * (1 + e.hasteP);
      if (e.burning === 'fast') sp *= 1.3;
      if (e.boss && this.enraged) sp *= 1.8;
      if (def.rage && e.hp < e.maxHp * def.rage) sp *= 1.5;
      e.d += sp * dt;
      if (e.d >= e.nextLap) {
        e.nextLap += F.PERIM;
        e.laps++;
        this.leak(e);
        if (this.status !== 'running') return;
      }
      RS.pathPos(e.d, e);
    }
  };

  P.enemySkill = function (e, def, dt) {
    e.timer += dt;
    // 개구리: 가끔 앞으로 크게 뛴다
    if (def.hop) {
      if (e.hopT === undefined) e.hopT = this.rng.next() * def.hop.every;
      e.hopT += dt;
      if (e.hopT >= def.hop.every && e.stunT <= 0) {
        e.hopT = 0;
        e.d += def.hop.dist;
      }
    }
    // 늪의 여왕: 물속에 잠기면 공격받지 않는다
    if (def.submerge) {
      e.subTimer = (e.subTimer || 0) + dt;
      if (e.subTimer >= def.submerge.every) {
        e.subTimer = 0;
        e.subT = def.submerge.dur;
        this.emit({ k: 'msg', text: `${def.name}이(가) 물속으로 숨었다!` });
      }
    }
    // 해골 선장: 닻을 던져 한 열을 기절
    if (def.anchor) {
      e.anchorT = (e.anchorT || 0) + dt;
      if (e.anchorT >= def.anchor.every) {
        e.anchorT = 0;
        const c = this.rng.int(F.COLS);
        const cells = [];
        for (let r = 0; r < F.ROWS; r++) cells.push(r * F.COLS + c);
        this.riftWarn.push({ cells, t: def.anchor.warn, total: def.anchor.warn, stun: def.anchor.stun });
      }
    }
    if (def.heal && e.timer >= def.heal.every) {
      e.timer = 0;
      const r2 = def.heal.r * def.heal.r;
      for (const o of this.enemies) {
        if (o.dead) continue;
        const dx = o.x - e.x;
        const dy = o.y - e.y;
        if (dx * dx + dy * dy <= r2) o.hp = Math.min(o.maxHp, o.hp + o.maxHp * def.heal.pct);
      }
      this.emit({ k: 'heal', x: e.x, y: e.y, r: def.heal.r });
    } else if (def.haste && e.timer >= def.haste.every) {
      e.timer = 0;
      const r2 = def.haste.r * def.haste.r;
      for (const o of this.enemies) {
        if (o.dead) continue;
        const dx = o.x - e.x;
        const dy = o.y - e.y;
        if (dx * dx + dy * dy <= r2) {
          o.hasteP = def.haste.pct;
          o.hasteT = def.haste.dur;
        }
      }
      this.emit({ k: 'haste', x: e.x, y: e.y, r: def.haste.r });
    } else if (def.summon && e.timer >= def.summon.every) {
      e.timer = 0;
      for (let k = 0; k < def.summon.n; k++) {
        this.queueSpawn(def.summon.type, e.L, e.d - 7 * (k + 1), e.nextLap, def.summon.hp);
      }
      this.emit({ k: 'summonFx', x: e.x, y: e.y });
    } else if (def.rift && e.timer >= def.rift.every) {
      e.timer = 0;
      const c0 = this.rng.int(F.COLS - 1);
      const r0 = this.rng.int(F.ROWS - 1);
      const cells = [r0 * F.COLS + c0, r0 * F.COLS + c0 + 1, (r0 + 1) * F.COLS + c0, (r0 + 1) * F.COLS + c0 + 1];
      this.riftWarn.push({ cells, t: def.rift.warn, total: def.rift.warn, stun: def.rift.stun });
    }
  };

  P.leak = function (e) {
    const M = this.M;
    const run = this.run;
    const nW = this.stage.waves.length;
    let dmg = (e.def.leak + M.leakAdd) * M.leakMult;
    if ((e.elite || e.boss) && run.asc >= 5) dmg += 1;
    if (e.boss && this.enraged) dmg *= 2;
    if (M.lastWaveLeakMult && this.waveIdx >= nW) dmg *= 2;
    if (M.leakReduce) dmg = Math.max(1, dmg - M.leakReduce);
    let blocked = false;
    if (this.ghostT > 0) blocked = true;
    else if (M.firstWaveNoLeak && this.waveIdx <= 1) blocked = true;
    else if (M.helix && !this.helixUsed) {
      this.helixUsed = true;
      blocked = true;
    } else if (this.leakShield > 0) {
      this.leakShield--;
      blocked = true;
    }
    if (!blocked) {
      run.life -= dmg;
      this.stats.leaks += dmg;
    }
    this.emit({ k: 'leak', x: e.x, y: e.y, v: blocked ? 0 : dmg });
    if (M.thorns) this.damage(e, e.maxHp * M.thorns, null, false, true);
    if (M.powderKeg) {
      const kd = RS.levelHp(this.curL) * 0.3;
      for (const o of this.enemies) if (!o.dead) this.damage(o, kd, null, false, true);
      this.emit({ k: 'keg', x: F.L, y: F.T });
    }
    if (run.life <= 0) {
      run.life = 0;
      this.finish('lost', 'life');
    }
  };

  // ── 유닛 ──
  P.updateDyn = function () {
    const M = this.M;
    const run = this.run;
    let dmg = this.demon + (run.permDmg || 0);
    let aspd = 0;
    if (M.diversity || M.purity || M.eliteSquad || M.legendAura) {
      const kinds = {};
      let cnt = 0;
      let legends = 0;
      for (const s of run.board) {
        if (!s) continue;
        kinds[s.cls] = 1;
        cnt += s.n;
        if (s.tier === 3) legends += s.n;
      }
      const k = Object.keys(kinds).length;
      if (M.diversity && k === 5) dmg += M.diversity;
      if (M.purity && k > 0 && k <= 3) dmg += M.purity;
      if (M.eliteSquad && cnt > 0 && cnt <= 12) dmg += M.eliteSquad;
      if (M.legendAura) dmg += M.legendAura * legends;
    }
    if (M.rich && run.gold >= 100) dmg += M.rich;
    if (M.berserk && run.life <= run.maxLife / 2) {
      dmg += 0.6;
      aspd += 0.25;
    }
    const rst = run.relicState;
    if (rst.pumpkinCandle && rst.pumpkinCandle.charges > 0) dmg += 0.4;
    if (rst.waxToys) aspd += Math.max(0, 0.3 - 0.1 * Math.floor(rst.waxToys.fights / 3));
    if (this.kind === 'elite') dmg += (M.eliteBattleDmg || 0) + (M.bigBattleDmg || 0);
    if (this.kind === 'boss') dmg += M.bigBattleDmg || 0;
    if (this.buffs.rage > 0) aspd += 0.6;
    if (this.buffs.watch > 0) aspd += 0.6;
    if (dmg !== this.dyn.dmgPct || aspd !== this.dyn.aspdPct) {
      this.dyn.dmgPct = dmg;
      this.dyn.aspdPct = aspd;
      this.statsDirty = true;
    }
  };

  P.computeSlotStats = function () {
    this.statsDirty = false;
    const run = this.run;
    const M = this.M;
    for (let i = 0; i < F.SIZE; i++) {
      const s = run.board[i];
      if (!s) {
        this.slotStats[i] = null;
        continue;
      }
      this.slotStats[i] = RS.unitStats(run, M, this.dyn, s.cls, s.tier, i, this.slotStats[i] || {});
    }
  };

  RS.unitStats = function (run, M, dyn, cls, tier, i, st) {
    st = st || {};
    const C = RS.CLASS[cls];
    const T = RS.TIER[tier];
    const cm = M.cls[cls];
    const corner = i >= 0 && RS.isCorner(i);
    const inner = i >= 0 && RS.isInner(i);
    const rune = i >= 0 && run.runes && run.runes[i] ? RS.RUNE[run.runes[i]].mods : null;
    const pct = M.dmgPct + cm.dmg + (dyn ? dyn.dmgPct : 0) + M.tierDmg[tier] + (corner ? M.cornerDmg : 0) + (inner ? M.innerDmg : 0) + (rune && rune.dmg ? rune.dmg : 0);
    const lv = 1 + run.classLv[cls] * RS.BAL.upgradePct;
    const aspd = Math.max(0.2, 1 + M.aspdPct + cm.aspd + (dyn ? dyn.aspdPct : 0) + (rune && rune.aspd ? rune.aspd : 0));
    st.dmg = C.dmg * T.dmg * lv * Math.max(0.1, 1 + pct);
    st.interval = (C.interval * T.spd) / aspd;
    st.range = C.range + 3 * tier + M.rangeAdd + cm.range + (inner ? M.innerRange : 0) + (rune && rune.range ? rune.range : 0);
    st.crit = (C.crit ? C.crit[tier] : 0) + M.critChance + cm.crit + (rune && rune.crit ? rune.crit : 0);
    st.critMult = (C.critMult ? C.critMult[tier] : 2) + M.critMult;
    st.splash = C.splash ? C.splash[tier] + cm.splash : 0;
    st.slow = C.slow ? Math.min(0.8, C.slow[tier] + cm.slow) : 0;
    st.runeSlow = rune && rune.slow ? rune.slow : 0;
    st.runeGold = rune && rune.killGold ? rune.killGold : 0;
    st.runeEcho = rune && rune.echo ? rune.echo : 0;
    st.frostSplash = C.frostSplash && C.frostSplash[tier] ? C.frostSplash[tier] + cm.splash : 0;
    st.freeze = C.freeze ? C.freeze[tier] : 0;
    st.stun = C.stun ? C.stun[tier] : 0;
    st.shots = C.shots ? C.shots[tier] : 1;
    st.dps = (st.dmg / st.interval) * (1 + Math.min(1, st.crit) * (st.critMult - 1)) * st.shots;
    return st;
  };

  P.updateUnits = function (dt) {
    if (this.statsDirty) this.computeSlotStats();
    const board = this.run.board;
    for (let i = 0; i < F.SIZE; i++) {
      const s = board[i];
      if (!s) continue;
      if (this.slotStun[i] > 0) continue;
      const st = this.slotStats[i];
      const cds = this.cd[i];
      for (let u = 0; u < s.n; u++) {
        cds[u] -= dt;
        if (cds[u] > 0) continue;
        if (this.attack(i, s, st, u)) cds[u] = st.interval + Math.max(cds[u], -dt);
        else cds[u] = 0.1;
      }
    }
  };

  P.findTargets = function (x, y, range, n) {
    const out = this.targets;
    out.length = 0;
    const r2 = range * range;
    const list = this.enemies;
    for (let k = 0, len = list.length; k < len; k++) {
      const e = list[k];
      if (e.dead || e.subT > 0) continue;
      const dx = e.x - x;
      const dy = e.y - y;
      if (dx * dx + dy * dy > r2) continue;
      // 가장 멀리 간 적(누수 직전)부터
      let j = out.length;
      if (j < n) out.push(e);
      else if (e.d <= out[n - 1].d) continue;
      else j = n - 1;
      while (j > 0 && out[j - 1].d < e.d) {
        out[j] = out[j - 1];
        j--;
      }
      out[j] = e;
    }
    return out;
  };

  P.attack = function (i, s, st, u) {
    const c = RS.slotCenter(i);
    const targets = this.findTargets(c.x, c.y, st.range, st.shots);
    if (!targets.length) return false;
    let mul = 1;
    if (this.M.penNib && ++this.attackCount % 10 === 0) mul = 2;
    for (let k = 0; k < targets.length; k++) this.hitWith(i, s, st, targets[k], c, u, mul);
    // 메아리 룬: 확률로 한 번 더
    if (st.runeEcho && targets[0] && !targets[0].dead && this.rng.next() < st.runeEcho) this.hitWith(i, s, st, targets[0], c, u, 1);
    return true;
  };

  P.hitWith = function (i, s, st, e, c, u, mul) {
    const M = this.M;
    const rng = this.rng;
    const cls = s.cls;
    const C = RS.CLASS[cls];
    let dmg = st.dmg * (mul || 1);
    let crit = mul > 1;
    if (st.crit > 0 && rng.next() < st.crit) {
      dmg *= st.critMult;
      crit = true;
    }
    const ex = e.x;
    const ey = e.y;
    this.lastSlot = i;
    switch (cls) {
      case 'knight':
        this.damage(e, dmg, cls, crit);
        this.splash(ex, ey, C.cleaveR + M.cls.knight.splash, dmg * C.cleave, cls, e, false);
        if (st.stun && !e.boss && rng.next() < st.stun) e.stunT = Math.max(e.stunT, C.stunDur);
        break;
      case 'mage':
        this.splash(ex, ey, st.splash, dmg, cls, null, crit);
        this.emit({ k: 'boom', x: ex, y: ey, r: st.splash, tier: s.tier });
        break;
      case 'frost':
        this.damage(e, dmg, cls, crit);
        this.applySlow(e, st.slow, C.slowDur);
        if (st.frostSplash) {
          const r2 = st.frostSplash * st.frostSplash;
          for (const o of this.enemies) {
            if (o.dead || o === e) continue;
            const dx = o.x - ex;
            const dy = o.y - ey;
            if (dx * dx + dy * dy <= r2) {
              this.damage(o, dmg * 0.5, cls, false);
              this.applySlow(o, st.slow, C.slowDur);
            }
          }
        }
        if (st.freeze && !e.boss && rng.next() < st.freeze) e.stunT = Math.max(e.stunT, 0.6);
        break;
      case 'rogue':
        this.damage(e, dmg, cls, crit);
        if (M.poison && !e.dead) {
          e.poison = Math.max(e.poison, (dmg * M.poison) / 3);
          e.poisonN = Math.min(5, e.poisonN + 1);
          e.poisonT = 3;
        }
        break;
      default:
        this.damage(e, dmg, cls, crit);
    }
    if (st.runeSlow && !e.dead) this.applySlow(e, st.runeSlow, 1);
    if (M.shrapnel && cls !== 'mage' && cls !== 'frost') this.splash(ex, ey, 8, dmg * M.shrapnel, cls, e, false);
    if (M.freezeChance && !e.boss && rng.next() < M.freezeChance) e.stunT = Math.max(e.stunT, 0.8);
    this.lastSlot = -1;
    if (this.fxOn) this.fx.push({ k: 'shot', cls, tier: s.tier, slot: i, u, x1: c.x, y1: c.y, x2: ex, y2: ey, crit });
  };

  P.applySlow = function (e, pct, dur) {
    if (e.boss) pct *= 0.5;
    if (pct >= e.slow) {
      e.slow = pct;
      e.slowT = dur;
    } else if (pct > 0 && e.slowT < dur * 0.5) {
      e.slowT = dur * 0.5;
    }
  };

  P.splash = function (x, y, r, dmg, cls, exclude, crit) {
    const r2 = r * r;
    const list = this.enemies;
    const burn = cls === 'mage' ? this.M.burn : 0;
    for (let k = 0, len = list.length; k < len; k++) {
      const e = list[k];
      if (e.dead || e === exclude || e.subT > 0) continue;
      const dx = e.x - x;
      const dy = e.y - y;
      if (dx * dx + dy * dy > r2) continue;
      this.damage(e, dmg, cls, crit);
      if (burn && !e.dead) {
        const b = dmg * burn;
        if (b > e.burn || e.burnT <= 0) e.burn = b;
        e.burnT = 3;
      }
    }
  };

  P.damage = function (e, amount, cls, crit, isDot) {
    if (e.dead) return 0;
    let dm = amount;
    const def = e.def;
    const M = this.M;
    if (cls) {
      const t = RS.CLASS[cls].dmgType;

        if (f === 1) n.type = 'combat';
        else if (f === 5) n.type = 'treasure';
        else if (f === H) n.type = 'rest';
        else {
          const ps = parents(f, c);
          const banned = {};
          for (const p of ps) {
            if (p.type === 'elite' || p.type === 'rest' || p.type === 'shop') banned[p.type] = true;
            // 같은 부모를 둔 형제 칸과 같은 특수 방은 피한다
            for (const sc of p.next) {
              const sib = floors[f - 1][sc];
              if (sib && sib !== n && sib.type && sib.type !== 'combat') banned[sib.type] = true;
            }
          }
          const w = roomWeights(run, f).filter((x) => !banned[x[0]]);
          n.type = rng.weighted(w.length ? w : [['combat', 1]], (x) => x[1])[0];
        }
      }
    }
    const all = [];
    floors.forEach((row, fi) => row.forEach((n) => n && all.push({ n, f: fi + 1 })));
    // 막마다 엘리트 하나는 보장하고, 그중 하나가 '불타는 엘리트'(에메랄드 열쇠)
    let elites = all.filter((x) => x.n.type === 'elite');
    if (!elites.length) {
      const cands = all.filter((x) => x.f >= 4 && x.f < H && x.n.type === 'combat');
      if (cands.length) {
        rng.pick(cands).n.type = 'elite';
        elites = all.filter((x) => x.n.type === 'elite');
      }
    }
    if (elites.length) rng.pick(elites).n.burning = true;
    // 상점이 하나도 없으면 하나 만든다
    if (!all.some((x) => x.n.type === 'shop')) {
      const cands = all.filter((x) => x.f >= 3 && x.f < H && (x.n.type === 'combat' || x.n.type === 'unknown'));
      if (cands.length) rng.pick(cands).n.type = 'shop';
    }
    for (const n of floors[H - 1]) if (n) n.next = [2];
    const bossRow = new Array(W).fill(null);
    bossRow[2] = { type: 'boss', next: [], visited: false };
    floors.push(bossRow);
    return { floors };
  };

  // 4막: 휴식처 → 상점 → 엘리트 → 균열의 심장 (일직선)
  function genAct4Map() {
    const row = (type) => {
      const r = new Array(RS.MAP_W).fill(null);
      r[2] = { type, next: [2], visited: false };
      return r;
    };
    const floors = [row('rest'), row('shop'), row('elite'), row('boss')];
    floors[3][2].next = [];
    return { floors };
  }

  RS.bossFloor = (run) => run.map.floors.length;

  RS.nextChoices = function (run) {
    const floors = run.map.floors;
    const out = [];
    if (run.floor >= floors.length) return out;
    if (run.floor === 0) {
      floors[0].forEach((n, l) => n && out.push({ f: 1, lane: l }));
      return out;
    }
    const node = floors[run.floor - 1][run.lane];
    for (const l of node.next) out.push({ f: run.floor + 1, lane: l });
    return out;
  };

  // 날개 장화: 다음 층 아무 칸
  RS.wingChoices = function (run) {
    const st = run.relicState.wingBoots;
    if (!st || st.uses <= 0 || run.floor === 0 || run.floor >= run.map.floors.length) return [];
    const normal = RS.nextChoices(run);
    const out = [];
    run.map.floors[run.floor].forEach((n, l) => {
      if (n && !normal.some((c) => c.lane === l)) out.push({ f: run.floor + 1, lane: l, wing: true });
    });
    return out;
  };

  // ? 칸: 전투·상점·보물 확률이 이벤트가 나올 때마다 오른다
  function resolveUnknown(run) {
    const u = run.unknown;
    const M = RS.collectMods(run);
    u.count++;
    if (M.tinyChest && u.count % 4 === 0) return 'treasure';
    const r = run.rng.next();
    const combat = M.juzu ? 0 : u.combat;
    if (r < combat) {
      u.combat = 0.1;
      return 'combat';
    }
    if (r < combat + u.shop) {
      u.shop = 0.03;
      return 'shop';
    }
    if (r < combat + u.shop + u.treasure) {
      u.treasure = 0.02;
      return 'treasure';
    }
    u.combat += 0.1;
    u.shop += 0.03;
    u.treasure += 0.02;
    return 'event';
  }

  RS.enterNode = function (run, f, lane, useWing) {
    const node = run.map.floors[f - 1][lane];
    if (useWing) run.relicState.wingBoots.uses--;
    node.visited = true;
    run.floor = f;
    run.lane = lane;
    const bank = run.relicState.mawBank;
    if (bank && bank.active) RS.addGold(run, 12);
    let type = node.type;
    if (type === 'unknown') {
      type = resolveUnknown(run);
      node.resolved = type;
    }
    run.nodeType = type;
    run.burning = !!node.burning;
    const rng = run.rng;
    switch (type) {
      case 'combat':
      case 'elite':
      case 'boss':
        run.phase = 'battle';
        run.pending = { stage: RS.makeStage(run, type, rng, { burning: run.burning }) };
        break;
      case 'event':
        run.phase = 'event';
        run.pending = { event: RS.pickEvent(run), result: null, step: 0 };
        break;
      case 'shop':
        run.phase = 'shop';
        run.pending = { shop: RS.genShop(run) };
        break;
      case 'rest':
        run.phase = 'rest';
        run.pending = { done: false };
        break;
      case 'treasure':
        run.phase = 'treasure';
        run.pending = { relics: RS.rollRelics(run, 1, [1, 2], [65, 35]), opened: false };
        break;
    }
  };

  // ── 보상 ──
  const AUG_W = [null, [0, 70, 27, 3], [0, 58, 35, 7], [0, 48, 40, 12], [0, 30, 45, 25]];

  // 슬더스의 희귀 카드 보정처럼, 프리즘이 안 나올수록 확률이 오른다
  RS.rollAugments = function (run, n, rarityW, exclude, usePity) {
    const rng = run.rng;
    const owned = {};
    for (const id of run.augments) owned[RS.augDef(id).id] = true;
    const taken = {};
    if (exclude) for (const id of exclude) taken[id] = true;
    const avail = RS.AUGMENTS.filter((a) => !(a.unique && owned[a.id]));
    const out = [];
    for (let k = 0; k < n; k++) {
      const w = rarityW.slice();
      if (usePity) w[3] += run.prismPity * 100;
      const rar = rng.weighted([1, 2, 3], (r) => w[r]);
      if (usePity) {
        if (rar === 3) run.prismPity = 0;
        else if (rar === 1) run.prismPity = Math.min(0.4, run.prismPity + 0.01);
      }
      let pool = avail.filter((a) => a.rarity === rar && !taken[a.id]);
      if (!pool.length) pool = avail.filter((a) => !taken[a.id]);
      if (!pool.length) break;
      const a = rng.pick(pool);
      taken[a.id] = true;
      out.push(a.id);
    }
    return out;
  };

  RS.rollRelics = function (run, n, rarities, weights) {
    const rng = run.rng;
    const owned = {};
    for (const id of run.relics) owned[id] = true;
    const out = [];
    for (let k = 0; k < n; k++) {
      const pools = rarities.map((r) => RS.RELICS.filter((x) => x.rarity === r && !owned[x.id] && out.indexOf(x.id) < 0));
      const idx = rng.weighted(rarities.map((r, i) => i), (i) => (pools[i].length ? weights[i] : 0));
      const pool = pools[idx].length ? pools[idx] : [].concat(...pools);
      if (!pool.length) break;
      out.push(rng.pick(pool).id);
    }
    return out;
  };

  RS.grantRandomRelic = function (run, rarities) {
    const ids = RS.rollRelics(run, 1, rarities, rarities.map(() => 1));
    if (!ids.length) return null;
    RS.addRelic(run, ids[0]);
    return ids[0];
  };

  RS.augChoiceCount = function (run) {
    return Math.max(1, 3 + RS.collectMods(run).augChoices);
  };

  RS.finishBattle = function (run, battle) {
    const st = battle.stats;
    run.stats.battles++;
    run.stats.kills += st.kills;
    run.stats.dmg += st.dmg;
    for (const c of RS.CLASSES) run.stats.clsDmg[c] += st.clsDmg[c];
    if (run.lament > 0) run.lament--;
    if (run.tax > 0) run.tax--;
    RS.battleUpkeep(run);
    const stage0 = battle.stage;
    if (stage0.spec && stage0.spec.trial) {
      // 허수아비 시험: 실패해도 모험은 계속된다
      RS.trialReward(run, battle);
      return;
    }
    if (battle.result !== 'won') {
      run.phase = 'over';
      run.pending = { reason: battle.reason };
      return;
    }
    const M = RS.collectMods(run);
    const stage = battle.stage;
    const type = stage.type === 'eventFight' ? stage.spec.as || 'elite' : run.nodeType;
    const act = Math.min(3, run.act);
    const rng = run.rng;
    let gold = BAL.clearGold[type === 'boss' ? 'boss' : type === 'elite' ? 'elite' : 'combat'][act];
    gold = Math.round(gold * (0.85 + rng.next() * 0.3) * (1 + M.combatGoldPct)) + (M.winGold || 0) * act;
    if (run.burning && type === 'elite') gold += 30 * act;
    RS.addGold(run, gold);
    if (M.winHeal) RS.heal(run, M.winHeal);
    if (M.winMaxLife) {
      RS.changeMaxLife(run, M.winMaxLife);
      RS.heal(run, M.winMaxLife);
    }
    if (M.meatBone && run.life <= run.maxLife / 2) RS.heal(run, M.meatBone);
    if (M.eliteUpgrade && type === 'elite') {
      const idxs = run.augments.map((id, i) => i).filter((i) => RS.canUpgradeAug(run.augments[i]));
      rng.shuffle(idxs);
      for (const i of idxs.slice(0, M.eliteUpgrade)) RS.upgradeAug(run, i);
    }
    if (type === 'elite') run.stats.elites++;
    if (type === 'boss') run.stats.bosses++;
    const reward = { gold, heal: M.winHeal, augDone: false, rerolls: M.augRerolls, relics: null, relicDone: false, item: null, key: null };
    // 소모품: 기본 40%, 나오면 -10%p, 안 나오면 +10%p
    if (!M.noItems && type !== 'boss') {
      if (rng.chance(run.itemChance + (M.itemDropBonus || 0))) {
        const id = RS.randomItemId(rng);
        if (RS.addItem(run, id)) reward.item = id;
        run.itemChance = Math.max(0, run.itemChance - 0.1);
      } else run.itemChance = Math.min(1, run.itemChance + 0.1);
    }
    const w = type === 'boss' ? [0, 0, 0, 1] : type === 'elite' ? [0, 15, 60, 25] : AUG_W[Math.min(4, run.act)];
    reward.augW = w;
    reward.aug = RS.rollAugments(run, RS.augChoiceCount(run), w, null, type === 'combat');
    if (type === 'elite') {
      reward.relics = RS.rollRelics(run, 2, [1, 2], [70, 30]);
      if (M.blackStar) reward.takeAll = true;
      if (run.burning && !run.keys.emerald) {
        run.keys.emerald = true;
        reward.key = 'emerald';
      }
    }
    if (type === 'boss') reward.relics = RS.rollRelics(run, 3, [3], [1]);
    if (stage.type === 'eventFight' && stage.spec.relic) reward.relics = RS.rollRelics(run, stage.spec.relicChoices || 1, stage.spec.relic, stage.spec.relic.map(() => 1));
    if (type === 'combat' && M.prayerWheel) RS.enqueue(run, { k: 'aug', w, title: '기도 바퀴' });
    run.phase = 'reward';
    run.pending = { reward };
  };

  RS.rewardPickAug = function (run, id) {
    const r = run.pending.reward;
    if (r.augDone) return;
    RS.pickAugment(run, id);
    r.augDone = true;
  };
  RS.rewardSkipAug = function (run) {
    const r = run.pending.reward;
    if (r.augDone) return 0;
    const M = RS.collectMods(run);
    const g = BAL.skipGold[Math.min(3, run.act)] * (1 + (M.skipGoldMul || 0));
    RS.addGold(run, g);
    if (M.singingBowl) {
      RS.changeMaxLife(run, 2);
      RS.heal(run, 2);
    }
    r.augDone = true;
    return g;
  };
  RS.rewardReroll = function (run) {
    const r = run.pending.reward;
    if (r.rerolls <= 0 || r.augDone) return false;
    r.rerolls--;
    r.aug = RS.rollAugments(run, r.aug.length, r.augW, r.aug);
    return true;
  };
  RS.rewardPickRelic = function (run, id) {
    const r = run.pending.reward;
    if (r.relicDone) return;
    if (r.takeAll) for (const x of r.relics) RS.addRelic(run, x);
    else if (id) RS.addRelic(run, id);
    r.relicDone = true;
  };
  RS.rewardComplete = function (run) {
    const r = run.pending && run.pending.reward;
    return !!r && r.augDone && (!r.relics || !r.relics.length || r.relicDone);
  };

  // 노드를 마치고 다음으로. 쌓인 선택(증강 고르기 등)이 있으면 먼저 처리한다
  RS.advance = function (run) {
    if (run.nodeType === 'boss') {
      if (run.act === 4 || (run.act === 3 && !(run.keys.ruby && run.keys.emerald && run.keys.sapphire))) {
        run.phase = 'victory';
        run.pending = null;
        return;
      }
      run.act++;
      run.variants[run.act] = run.rng.int(RS.ACT_VARIANTS[run.act - 1].length);
      run.floor = 0;
      run.lane = -1;
      run.nodeType = null;
      run.map = RS.genMap(run);
      RS.heal(run, Math.ceil(run.maxLife * BAL.actHealPct * (run.asc >= 4 ? 0.5 : 1)));
      run.phase = 'actStart';
      run.pending = run.act <= 3 ? { ancient: RS.rollAncient(run) } : null;
    } else {
      run.phase = 'map';
      run.pending = null;
    }
    RS.flushQueue(run);
  };

  RS.flushQueue = function (run) {
    if (run.queue.length && run.phase !== 'choice' && run.phase !== 'victory' && run.phase !== 'over') {
      run.afterQueue = run.phase;
      run.afterPending = run.pending;
      run.phase = 'choice';
      run.pending = null;
    }
  };
  RS.popQueue = function (run) {
    run.queue.shift();
    if (!run.queue.length) {
      run.phase = run.afterQueue || 'map';
      run.pending = run.afterPending || null;
      run.afterQueue = null;
      run.afterPending = null;
    }
  };

  // ── 이벤트 ──
  RS.pickEvent = function (run) {
    const actOk = (e) => !e.acts || e.acts.indexOf(Math.min(3, run.act)) >= 0;
    let pool = RS.EVENTS.filter((e) => actOk(e) && run.seenEvents.indexOf(e.id) < 0 && (!e.cond || e.cond(run)));
    if (!pool.length) pool = RS.EVENTS.filter((e) => actOk(e) && (!e.cond || e.cond(run)));
    const e = run.rng.pick(pool);
    run.seenEvents.push(e.id);
    return e.id;
  };

  RS.optionDesc = function (run, opt) {
    return typeof opt.desc === 'function' ? opt.desc(run) : opt.desc;
  };
  RS.optionLabel = function (run, opt) {
    return typeof opt.label === 'function' ? opt.label(run) : opt.label;
  };
  RS.optionEnabled = function (run, opt) {
    return !opt.cond || opt.cond(run);
  };
  RS.eventOptions = function (run) {
    const ev = RS.EVENT[run.pending.event];
    const step = run.pending.step || 0;
    return ev.steps ? ev.steps[step].options : ev.options;
  };
  RS.eventText = function (run) {
    const ev = RS.EVENT[run.pending.event];
    const step = run.pending.step || 0;
    const t = ev.steps ? ev.steps[step].text : ev.text;
    return typeof t === 'function' ? t(run) : t;
  };

  // 결과: 문장 또는 { text, augRarity, fight, next(단계 이동), again(같은 단계 반복) }
  RS.eventChoose = function (run, idx) {
    const opt = RS.eventOptions(run)[idx];
    if (!opt || !RS.optionEnabled(run, opt) || run.pending.result) return null;
    let res = opt.apply(run, run.rng);
    if (typeof res === 'string') res = { text: res };
    res = res || { text: '' };
    if (res.next != null) {
      run.pending.step = res.next;
      run.pending.log = res.text;
      return res;
    }
    if (res.again) {
      run.pending.log = res.text;
      return res;
    }
    run.pending.result = res;
    if (res.augRarity) {
      const w = [0, 0, 0, 0];
      w[res.augRarity] = 1;
      RS.enqueue(run, { k: 'aug', w, title: RS.EVENT[run.pending.event].title });
    }
    if (res.fight) {
      run.pending.fight = res.fight;
    }
    return res;
  };

  // 이벤트 전투: 끝나면 보상 화면으로
  RS.startEventFight = function (run) {
    const spec = run.pending.fight;
    run.nodeType = 'eventFight';
    run.burning = false;
    run.phase = 'battle';
    run.pending = { stage: RS.makeStage(run, 'eventFight', run.rng, spec) };
  };

  // ── 상점 ──
  RS.priceMul = function (run) {
    const M = RS.collectMods(run);
    return [0, 1, 1.35, 1.7, 1.7][run.act] * (run.asc >= 2 ? 1.15 : 1) * Math.max(0.3, 1 - M.shopDiscount);
  };
  RS.removeCost = function (run) {
    const M = RS.collectMods(run);
    if (M.fixedRemoveCost) return M.fixedRemoveCost;
    return Math.round((75 + 25 * run.removeCount) * (run.asc >= 2 ? 1.15 : 1));
  };

  function shopRelic(run, exclude) {
    const ids = RS.rollRelics(run, 1, [1, 2], [65, 35]).filter((id) => exclude.indexOf(id) < 0);
    if (!ids.length) return null;
    return { kind: 'relic', id: ids[0], base: RS.REL[ids[0]].rarity === 2 ? 190 : 130 };
  }

  RS.genShop = function (run) {
    const rng = run.rng;
    const list = [];
    const taken = [];
    for (let k = 0; k < 3; k++) {
      const it = shopRelic(run, taken);
      if (it) {
        taken.push(it.id);
        list.push(it);
      }
    }
    for (let k = 0; k < 3; k++) list.push({ kind: 'item', id: RS.randomItemId(rng), base: 45 + rng.int(26) });
    const augs = RS.rollAugments(run, 2, [0, 30, 55, 15]);
    augs.forEach((id, k) => list.push({ kind: 'aug', id, base: [0, 80, 110, 160][RS.AUG[id].rarity], sale: k === 0 }));
    list.push({ kind: 'unit', tier: 1, base: 120 });
    list.push({ kind: 'unit', tier: 2, base: 330 });
    list.push({ kind: 'rune', id: RS.randomRune(rng), base: 100 });
    list.push({ kind: 'remove' });
    for (const it of list) it.sold = false;
    RS.repriceShop(run, { list });
    return { list };
  };

  RS.repriceShop = function (run, shop) {
    const mul = RS.priceMul(run);
    const free = RS.collectMods(run).freeFirstBuy && !shop.boughtAny;
    for (const it of shop.list) {
      if (free) it.price = 0;
      else if (it.kind === 'remove') it.price = RS.removeCost(run);
      else it.price = Math.round(it.base * mul * (it.sale ? 0.5 : 1));
    }
  };

  // 제거/룬처럼 대상을 골라야 하는 것은 구매 후 선택 대기열로 보낸다
  RS.shopBuy = function (run, idx) {
    const shop = run.pending.shop;
    const it = shop.list[idx];
    if (!it || it.sold) return { err: 'sold' };
    if (run.gold < it.price) return { err: 'gold' };
    if (it.kind === 'item' && (run.items.length >= RS.itemSlots(run) || RS.collectMods(run).noItems)) return { err: 'full' };
    if (it.kind === 'unit' && !RS.hasEmptySlot(run.board)) return { err: 'board' };
    if (it.kind === 'remove' && !RS.removableCount(run)) return { err: 'none' };
    RS.addGold(run, -it.price);
    shop.boughtAny = true;
    const bank = run.relicState.mawBank;
    if (bank) bank.active = false;
    it.sold = true;
    if (it.kind === 'relic') RS.addRelic(run, it.id);
    else if (it.kind === 'item') RS.addItem(run, it.id);
    else if (it.kind === 'aug') RS.pickAugment(run, it.id);
    else if (it.kind === 'unit') RS.grantUnits(run, it.tier, 1);
    else if (it.kind === 'rune') RS.enqueue(run, { k: 'rune', rune: it.id, title: '룬 새기기' });
    else if (it.kind === 'remove') {
      run.removeCount++;
      RS.enqueue(run, { k: 'remove', title: '제거 서비스' });
    }
    if (RS.collectMods(run).courier && it.kind !== 'remove') {
      // 택배원: 빈자리에 같은 종류의 새 물건
      let fresh = null;
      if (it.kind === 'relic') fresh = shopRelic(run, shop.list.filter((x) => x.kind === 'relic').map((x) => x.id));
      else if (it.kind === 'item') fresh = { kind: 'item', id: RS.randomItemId(run.rng), base: 45 + run.rng.int(26) };
      else if (it.kind === 'aug') {
        const a = RS.rollAugments(run, 1, [0, 30, 55, 15], shop.list.filter((x) => x.kind === 'aug').map((x) => x.id));
        if (a.length) fresh = { kind: 'aug', id: a[0], base: [0, 80, 110, 160][RS.AUG[a[0]].rarity] };
      } else if (it.kind === 'unit') fresh = { kind: 'unit', tier: it.tier, base: it.base };
      else if (it.kind === 'rune') fresh = { kind: 'rune', id: RS.randomRune(run.rng), base: 100 };
      if (fresh) {
        fresh.sold = false;
        shop.list[idx] = fresh;
      }
    }
    RS.repriceShop(run, shop);
    return { ok: true, kind: it.kind };
  };

  RS.removableCount = function (run) {
    return run.augments.length + run.curses.filter((id) => !RS.CURSE[id].permanent).length;
  };

  // ── 휴식처 ──
  RS.restHealAmount = (run) => Math.ceil(run.maxLife * BAL.restHealPct) + (RS.collectMods(run).restHealAdd || 0);
  RS.restTrainAmount = (run) => BAL.trainLevels + RS.collectMods(run).restTrainBonus;

  RS.restOptions = function (run) {
    const M = RS.collectMods(run);
    const opts = [];
    opts.push({ id: 'heal', label: '휴식', desc: `생명 +${RS.restHealAmount(run)}${M.dreamCatcher ? ' · 증강 선택' : ''}`, off: M.noRestHeal ? '각성제 때문에 잠들 수 없다' : null });
    opts.push({ id: 'train', label: '수련', desc: `클래스 하나 강화 +${RS.restTrainAmount(run)}`, off: M.noSmith ? '융합 망치 때문에 할 수 없다' : null });
    const up = run.augments.some((id) => RS.canUpgradeAug(id));
    opts.push({ id: 'smith', label: '연마', desc: '증강 하나를 강화 (효과 ×1.5)', off: M.noSmith ? '융합 망치 때문에 할 수 없다' : !up ? '강화할 수 있는 증강이 없다' : null });
    if (M.peacePipe) opts.push({ id: 'toke', label: '명상', desc: '증강이나 저주 하나를 없앤다', off: RS.removableCount(run) ? null : '없앨 것이 없다' });
    if (M.shovel) opts.push({ id: 'dig', label: '발굴', desc: '유물 하나를 얻는다' });
    if (M.girya) {
      const lifts = run.relicState.girya.lifts;
      opts.push({ id: 'lift', label: '단련', desc: `모든 유닛 피해 +6% (${lifts}/3)`, off: lifts >= 3 ? '더 단련할 수 없다' : null });
    }
    const candle = run.relicState.pumpkinCandle;
    if (candle && candle.charges < 5) opts.push({ id: 'kindle', label: '불 붙이기', desc: `호박 양초를 다시 켠다 (남은 ${candle.charges}번 → 5번)` });
    if (run.quests && run.quests.egg) opts.push({ id: 'hatch', label: '부화', desc: '용의 알을 부화시킨다: 전설 유닛 1기 + 유물 [아기 용]' });
    const clone = run.runes.map((r, i) => (r === 'cloneR' && run.board[i] ? i : -1)).filter((i) => i >= 0);
    if (clone.length) opts.push({ id: 'clone', label: '복제', desc: '복제의 룬 위 유닛 1기를 복제', off: RS.hasEmptySlot(run.board) || clone.some((i) => run.board[i].n < 3) ? null : '보드에 자리가 없다' });
    if (run.act <= 3 && !run.keys.ruby) opts.push({ id: 'recall', label: '회수', desc: '루비 열쇠를 얻는다 (휴식·수련 대신)' });
    return opts;
  };

  RS.restDo = function (run, id, arg) {
    switch (id) {
      case 'heal':
        RS.heal(run, RS.restHealAmount(run));
        if (RS.collectMods(run).dreamCatcher) RS.enqueue(run, { k: 'aug', w: [0, 50, 42, 8], title: '드림캐처' });
        break;
      case 'train':
        run.classLv[arg] += RS.restTrainAmount(run);
        break;
      case 'smith':
        RS.enqueue(run, { k: 'upgrade', title: '연마' });
        break;
      case 'toke':
        RS.enqueue(run, { k: 'remove', title: '명상' });
        break;
      case 'dig':
        RS.grantRandomRelic(run, [1, 2]);
        break;
      case 'lift':
        run.relicState.girya.lifts++;
        run.permDmg += 0.06;
        break;
      case 'recall':
        run.keys.ruby = true;
        break;
      case 'kindle':
        run.relicState.pumpkinCandle.charges = 5;
        break;
      case 'hatch':
        run.quests.egg = false;
        RS.grantUnits(run, 3, 1);
        if (!RS.hasRelic(run, 'babyDragon')) RS.addRelic(run, 'babyDragon');
        break;
      case 'clone': {
        const i = run.runes.findIndex((r, k) => r === 'cloneR' && run.board[k]);
        if (i >= 0) RS.addUnit(run.board, run.board[i].cls, run.board[i].tier, i);
        break;
      }
    }
    run.pending.done = true;
  };

  // ── 보물 ──
  RS.openChest = function (run, takeKey) {
    const p = run.pending;
    p.opened = true;
    const M = RS.collectMods(run);
    if (takeKey) {
      run.keys.sapphire = true;
      p.gotKey = true;
    } else {
      p.got = [];
      for (const id of p.relics) {
        RS.addRelic(run, id);
        p.got.push(id);
      }
      const doll = run.relicState.matryoshka;
      if (doll && doll.count > 0) {
        doll.count--;
        const extra = RS.grantRandomRelic(run, [1, 2]);
        if (extra) p.got.push(extra);
      }
    }
    if (M.cursedKey) {
      const c = RS.randomCurseId(run.rng);
      if (RS.addCurse(run, c)) p.curse = c;
    }
    // 보물 지도: 지도를 산 다음 막의 첫 보물 상자
    if (run.quests && run.quests.spoilsAct === run.act) {
      RS.addGold(run, 400);
      p.spoils = 400;
      run.quests.spoilsAct = null;
    }
  };

  // 전투가 끝날 때마다: 녹는 유물, 사라지는 저주, 퀘스트 카운트
  RS.battleUpkeep = function (run) {
    const st = run.relicState;
    if (st.pumpkinCandle && st.pumpkinCandle.charges > 0) st.pumpkinCandle.charges--;
    if (st.waxToys) st.waxToys.fights++;
    run.curseAge = run.curseAge || {};
    for (let i = run.curses.length - 1; i >= 0; i--) {
      const def = RS.CURSE[run.curses[i]];
      if (!def.fades) continue;
      const key = run.curses[i] + '@' + i;
      run.curseAge[key] = (run.curseAge[key] || 0) + 1;
      if (run.curseAge[key] >= def.fades) {
        run.curses.splice(i, 1);
        delete run.curseAge[key];
      }
    }
    const w = run.quests && run.quests.wongo;
    if (w && w.left > 0) {
      w.left--;
      if (w.left === 0) {
        for (let k = 0; k < 3; k++) RS.grantRandomRelic(run, [1, 2]);
        run.quests.wongo = null;
        run.quests.wongoDone = true;
      }
    }
  };

  // 허수아비 시험 보상 (시간 안에 쓰러뜨렸는지에 따라)
  RS.trialReward = function (run, battle) {
    const tier = battle.stage.spec.trial;
    const ok = battle.result === 'won' && !battle.trialFailed;
    const reward = { gold: 0, augDone: true, relics: null, relicDone: true, trial: { tier, ok } };
    if (ok) {
      if (tier === 1) {
        const id = RS.randomItemId(run.rng);
        if (RS.addItem(run, id)) reward.item = id;
      } else if (tier === 2) {
        RS.enqueue(run, { k: 'upgrade', title: '허수아비 시험' });
        RS.enqueue(run, { k: 'upgrade', title: '허수아비 시험' });
      } else {
        reward.relics = RS.rollRelics(run, 1, [2], [1]);
        reward.relicDone = false;
      }
    }
    run.phase = 'reward';
    run.pending = { reward };
  };

  // 모닥불 정령에 바친 유닛 등급에 따라 보상
  RS.sacrificeUnit = function (run, i) {
    const s = run.board[i];
    if (!s) return '';
    const tier = s.tier;
    s.n--;
    if (s.n <= 0) run.board[i] = null;
    if (tier === 0) return '정령들이 시큰둥하다. 아무 일도 없었다.';
    if (tier === 1) {
      RS.heal(run, 5);
      return '정령들이 기뻐한다. 생명 +5';
    }
    if (tier === 2) {
      RS.changeMaxLife(run, 5);
      RS.heal(run, run.maxLife);
      return '정령들이 춤춘다! 최대 생명 +5, 생명 모두 회복';
    }
    RS.changeMaxLife(run, 10);
    RS.heal(run, 10);
    const id = RS.grantRandomRelic(run, [2]);
    return `정령들이 환호한다! 최대 생명 +10${id ? `, 유물 [${RS.REL[id].name}]` : ''}`;
  };

  // 땜장이 공방: 직접 조립한 증강 (런마다 등록)
  RS.registerCustomAugs = function (run) {
    for (const id in run.customAugs || {}) {
      const c = run.customAugs[id];
      RS.AUG[id] = { id, name: c.name, rarity: 2, icon: 'gear', desc: c.desc, mods: c.mods, unique: true, custom: true };
    }
  };

  RS.buildTinker = function (run, extra) {
    const base = run.pending.tinker ? run.pending.tinker.base : 'dmg';
    const mods = {};
    const parts = [];
    if (base === 'dmg') { mods.dmgPct = 0.15; parts.push('모든 유닛 피해 +15%'); }
    if (base === 'aspd') { mods.aspdPct = 0.12; parts.push('모든 유닛 공격 속도 +12%'); }
    if (base === 'range') { mods.rangeAdd = 7; parts.push('모든 유닛 사거리 +7'); }
    if (extra === 'crit') { mods.critChance = 0.06; parts.push('치명타 확률 +6%'); }
    if (extra === 'gold') { mods.killGoldPct = 0.12; parts.push('처치 골드 +12%'); }
    if (extra === 'slow') { mods.enemySpeedPct = 0.05; parts.push('모든 적 이동 속도 -5%'); }
    run.customAugs = run.customAugs || {};
    const n = Object.keys(run.customAugs).length + 1;
    const id = 'tinker' + n;
    run.customAugs[id] = { name: `땜장이의 작품 ${n}호`, desc: parts.join(', '), mods };
    RS.registerCustomAugs(run);
    RS.pickAugment(run, id);
    return `[땜장이의 작품 ${n}호] 완성! (${parts.join(', ')})`;
  };

  RS.wongoSpend = function (run, g) {
    run.stats.wongo = (run.stats.wongo || 0) + g;
  };

  // 수정 구체: 9칸 중 정해진 횟수만큼 들여다본다
  RS.initSphere = function (run, n) {
    run.pending.sphere = { left: n, pool: run.rng.shuffle(['gold', 'gold', 'gold', 'item', 'item', 'aug', 'relic', 'curse', 'empty']) };
  };
  RS.revealSphere = function (run) {
    const s = run.pending.sphere;
    const r = s.pool.shift();
    s.left--;
    const a = Math.min(3, run.act);
    let text;
    if (r === 'gold') {
      RS.addGold(run, 40 * a);
      text = `골드 +${40 * a}`;
    } else if (r === 'item') text = RS.addItem(run, RS.randomItemId(run.rng)) ? '소모품을 찾았다' : '소모품이 있었지만 가질 수 없었다';
    else if (r === 'aug') {
      RS.enqueue(run, { k: 'aug', w: [0, 50, 40, 10], title: '수정 구체' });
      text = '증강의 환영이 보인다 (나중에 고른다)';
    } else if (r === 'relic') {
      const id = RS.grantRandomRelic(run, [1, 2]);
      text = `유물 [${id ? RS.REL[id].name : '먼지'}]!`;
    } else if (r === 'curse') text = RS.addCurse(run, RS.randomCurseId(run.rng)) ? '저주가 튀어나왔다!' : '저주가 튀어나왔지만 부적이 막았다';
    else text = '아무것도 없다';
    if (s.left > 0 && s.pool.length) return { text, again: true };
    return text + ' · 구체의 빛이 꺼졌다.';
  };

  // ── 룬 (보드 칸에 새기는 인챈트) ──
  RS.randomRune = function (rng) {
    return rng.pick(RS.RUNES.filter((r) => !r.bad)).id;
  };
  RS.setRune = function (run, slot, id) {
    run.runes[slot] = id;
  };
})((globalThis.RS = globalThis.RS || {}));

  // ── 굽기 ──
  function parse(rows, pal) {
    const h = rows.length;
    let w = 0;
    for (const r of rows) w = Math.max(w, r.length);
    const px = new Array(w * h).fill(null);
    for (let y = 0; y < h; y++) {
      const r = rows[y];
      for (let x = 0; x < r.length; x++) {
        const ch = r[x];
        if (ch === '.') continue;
        px[y * w + x] = pal[ch] || PAL[ch] || '#ff00ff';
      }
    }
    return { w, h, px };
  }

  // 1px 여백을 두고 외곽선을 두른다
  function withOutline(img) {
    const W = img.w + 2;
    const H = img.h + 2;
    const out = new Array(W * H).fill(null);
    for (let y = 0; y < img.h; y++) for (let x = 0; x < img.w; x++) out[(y + 1) * W + x + 1] = img.px[y * img.w + x];
    const filled = out.map((c) => c !== null);
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        if (filled[y * W + x]) continue;
        if ((x > 0 && filled[y * W + x - 1]) || (x < W - 1 && filled[y * W + x + 1]) || (y > 0 && filled[(y - 1) * W + x]) || (y < H - 1 && filled[(y + 1) * W + x])) {
          out[y * W + x] = OUTLINE;
        }
      }
    }
    return { w: W, h: H, px: out };
  }

  function hexRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

    const c = document.createElement('canvas');
    c.width = img.w;
    c.height = img.h;
    const ctx = c.getContext('2d');
    const data = ctx.createImageData(img.w, img.h);
    const tc = tint ? hexRgb(tint) : null;
    for (let i = 0; i < img.px.length; i++) {
      const col = img.px[i];
      if (!col) continue;
      const rgb = tc || hexRgb(col);
      data.data[i * 4] = rgb[0];
      data.data[i * 4 + 1] = rgb[1];
      data.data[i * 4 + 2] = rgb[2];
      data.data[i * 4 + 3] = 255;
    }
    ctx.putImageData(data, 0, 0);
    return c;

    for (const ck in colors) {
      GLYPH[ck] = {};
      for (const ch in DIGITS) {
        const rows = DIGITS[ch].map((r) => r.replace(/1/g, ck).replace(/0/g, '.'));

  RS.drawNum = function (ctx, str, x, y, color) {

    const z = F.SLOT - 3;

  P.drawSlots = function (ctx, b, dt) {

    const runes = b.run.runes;
    const t = this.t;
    for (let i = 0; i < F.SIZE; i++) {
      const x = F.GX + (i % F.COLS) * F.SLOT;
      const y = F.GY + Math.floor(i / F.COLS) * F.SLOT;
      const s = board[i];

          ctx.fillRect(x - 1, y, 3, 1);
          ctx.fillRect(x, y - 1, 1, 3);

    }

  };

    this.drag = null;

  UI.refreshUnitStats = function () {
    const G = UI.G;
    const refs = UI.panelRefs;
    const b = G.battle;
    if (!refs || !refs.stats || !b) return;
    const i = UI.sel;
    const s = G.run.board[i];
    if (!s) return;
    if (b.statsDirty) b.computeSlotStats();
    const st = b.slotStats[i];
    if (!st) return;
    const parts = [`피해 ${fmtK(st.dmg)}`, `${(1 / st.interval).toFixed(1)}회/초`, `사거리 ${Math.round(st.range)}`];
    if (st.crit > 0) parts.push(`치명 ${pct(Math.min(1, st.crit))}`);
    if (st.splash) parts.push(`범위 ${st.splash}`);
    if (st.slow) parts.push(`둔화 ${pct(st.slow)}`);
    if (st.shots > 1) parts.push(`${st.shots}발`);
    const text = parts.join(' · ');
    if (refs.stats.textContent !== text) refs.stats.textContent = text;
    const dps = `DPS ${fmtK(st.dps * s.n)}`;
    if (refs.dps && refs.dps.textContent !== dps) refs.dps.textContent = dps;
    if (refs.sell) {
      const t = `판매 +${RS.sellValue(G.run, s.tier, b.M)}`;
      if (refs.sell.textContent !== t) refs.sell.textContent = t;
    }
  };

  UI.renderItems = function () {
    const G = UI.G;
    const bar = $('#itembar');
    bar.innerHTML = '';
    const run = G.run;
    const slots = RS.itemSlots(run);
    for (let k = 0; k < slots; k++) {
      const id = run.items[k];
      if (id) {
        const it = RS.ITEM[id];

          class: 'islot',

  const setText = (el, key, v) => {
    if (UI.hudCache[key] !== v) {
      UI.hudCache[key] = v;
      el.textContent = v;
    }
  };

  UI.updateHud = function (force) {
    const G = UI.G;
    const b = G.battle;
    const run = G.run;
    if (!b || !run) return;
    if (force) UI.hudCache = {};
    const c = UI.hudCache;
    const blind = !!b.M.blindfold;
    setText($('#h-life-v'), 'life', `${Math.ceil(run.life)}/${run.maxLife}`);
    setText($('#h-gold-v'), 'gold', fmt(run.gold));
    const cap = RS.interestCap(b.M);
    const inter = Math.min(cap, Math.floor(run.gold / RS.BAL.interestPer));
    setText($('#h-int'), 'int', inter > 0 ? `+${inter + (b.M.interestBonus || 0)}` : '');
    setText($('#h-foe-v'), 'foe', `${b.enemies.length}/${b.cap}`);
    const danger = b.enemies.length >= b.cap * 0.7;
    if (c.danger !== danger) {
      c.danger = danger;
      $('#h-foe').classList.toggle('danger', danger);
    }
    const lowLife = run.life <= run.maxLife * 0.3;
    if (c.low !== lowLife) {
      c.low = lowLife;
      $('#h-life').classList.toggle('danger', lowLife);
    }
    const nW = b.stage.waves.length;
    if (b.prep > 0) {
      setText($('#h-wave-v'), 'wv', '준비');
      setText($('#h-wave-t'), 'wt', blind ? '?' : `${Math.ceil(b.prep)}초`);
    } else {
      setText($('#h-wave-v'), 'wv', `${b.waveIdx}/${nW}`);
      setText($('#h-wave-t'), 'wt', b.waveIdx < nW ? (blind ? '?' : `${Math.max(0, Math.ceil(b.waveT))}초`) : '마지막');
    }
    const cost = b.summonCost();
    setText($('#summon-cost'), 'cost', b.summonLimit() <= 0 ? '제한' : `${cost}G`);
    const canSummon = run.gold >= cost && b.summonLimit() > 0;
    if (c.canS !== canSummon) {
      c.canS = canSummon;
      $('#b-summon').classList.toggle('off', !canSummon);
    }
    setText($('#b-speed'), 'spd', `x${G.speed}`);
    if (UI.starBtn) {
      setText(UI.starBtn, 'star', `별똥별 ${b.stars}/3`);
      const on = b.canStarfall();
      if (c.star !== on) {
        c.star = on;
        UI.starBtn.classList.toggle('off', !on);
      }
    }
    // 보스
    const bb = $('#bossbar');
    if (b.boss) {
      if (bb.hidden) {
        bb.hidden = false;
        $('#boss-name').textContent = b.boss.def.name + (b.bosses.length > 1 ? ` 외 ${b.bosses.filter((x) => !x.dead).length - 1}` : '');
      }
      const w = blind ? '100%' : Math.max(0, (b.boss.hp / b.boss.maxHp) * 100).toFixed(1) + '%';
      if (c.bhp !== w) {
        c.bhp = w;
        $('#boss-hp').style.width = w;
      }
      setText($('#boss-t'), 'bt', b.enraged ? '폭주!' : blind ? '??' : `${Math.ceil(b.bossTimer)}초`);
      if (c.enr !== b.enraged) {
        c.enr = b.enraged;
        bb.classList.toggle('enraged', b.enraged);
      }
    } else if (!bb.hidden) bb.hidden = true;
    // 패널
    const refs = UI.panelRefs || {};
    if (UI.panelMode === 'idle' && refs.dps) {
      setText(refs.dps, 'pdps', fmtK(b.totalDps()));
      setText(refs.units, 'punits', `${RS.boardUnitCount(run.board)}/60`);
      if (b.M.summonCap) setText(refs.int, 'pint', `${b.summonLimit()}회`);
      else setText(refs.int, 'pint', inter > 0 ? `+${inter + (b.M.interestBonus || 0)}G` : '10G당 1');
    } else if (UI.panelMode === 'unit') {
      if (!run.board[UI.sel]) UI.select(-1);
      else UI.refreshUnitStats();
    } else if (UI.panelMode === 'upgrade' && refs.rows) {
      for (const cl of RS.CLASSES) {
        const el = refs.rows[cl];
        const lv = run.classLv[cl];
        const cst = b.upgradeCost(cl);
        setText(el.querySelector('.lv'), 'lv' + cl, `Lv ${lv}`);
        setText(el.querySelector('.cost'), 'uc' + cl, cst ? `${cst}G` : '무료');
        const ok = run.gold >= cst;
        if (c['uo' + cl] !== ok) {
          c['uo' + cl] = ok;
          el.classList.toggle('off', !ok);
        }
      }
    }
  };

  // 전투 이벤트 → 소리·토스트
  UI.onFx = function (ev) {
    switch (ev.k) {
      case 'wave':
        RS.sfx('wave');
        UI.toast(`웨이브 ${ev.n}/${ev.total} · +${ev.gold}G${ev.interest ? ` · 이자 +${ev.interest}` : ''}`);
        break;
      case 'boss':
        RS.sfx('boss');
        UI.toast(`${ev.name} 등장!`, 'warn');
        break;
      case 'bossDown':
        RS.sfx('big');
        UI.toast('보스 처치!', 'good');
        break;
      case 'msg':
        UI.toast(ev.text, ev.warn ? 'warn' : '');
        break;
      case 'kill':
        RS.sfx(ev.big ? 'big' : 'kill');
        break;
      case 'leak':
        RS.sfx('leak');
        break;
      case 'summon':
        if (ev.free) RS.sfx('summon');
        break;
      case 'won':
        RS.sfx('win');
        UI.toast('승리!', 'good');
        break;
      case 'lost':
        RS.sfx('lose');
        UI.toast(ev.reason === 'cap' ? '적이 너무 많습니다!' : '생명이 다했습니다', 'warn');
        break;
    }
  };
})((globalThis.RS = globalThis.RS || {}));

// ── src/ui/adventure.js ──
// 모험 화면: 맵, 축복, 고대 존재, 선택 대기열, 보상, 상점, 이벤트, 휴식처, 보물, 결과
(function (RS) {
  'use strict';

  const UI = RS.UI;
  const { h, append, $, btn, icon, unitImg, fmt, pct } = UI;

  // ── 맵 ──
  UI.showMap = function () {
    const G = UI.G;
    const run = G.run;
    UI.rewardSel = null;
    UI.shopSel = null;
    UI.restTrain = false;
    const scr = $('#scr-map');
    scr.innerHTML = '';
    const act = RS.actDef(run);
    const box = h('div', { class: 'mapbox scroll' });
    const wings = RS.wingChoices(run);
    append(scr, [
      UI.topbar(run, `${run.act}막 · ${act.name}`),
      UI.relicStrip(run),
      box,
      h('p', { class: 'hint' }, wings.length ? `반짝이는 칸으로 이동 · 점선 칸은 날개 장화로 (${run.relicState.wingBoots.uses}회)` : '반짝이는 칸으로 이동하세요. 칸을 누르면 설명이 나옵니다.'),
    ]);
    UI.show('scr-map');
    const floors = run.map.floors;
    const nF = floors.length;
    const W = RS.MAP_W;
    const avail = RS.nextChoices(run);
    const isAvail = (f, l) => avail.some((c) => c.f === f && c.lane === l);
    const isWing = (f, l) => wings.some((c) => c.f === f && c.lane === l);
    const pad = 46;
    const H = Math.max(box.clientHeight, nF * 70 + pad * 2);
    const rowH = (H - pad * 2) / nF;
    const inner = h('div', { class: 'mapinner', style: `height:${H}px` });
    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('class', 'maplines');
    svg.setAttribute('width', '100%');
    svg.setAttribute('height', String(H));
    const laneX = (l) => 10 + l * (80 / (W - 1));
    const rowY = (f) => Math.round(pad + (nF - f) * rowH + rowH / 2 - 8);
    for (let f = 1; f < nF; f++) {
      for (let l = 0; l < W; l++) {
        const n = floors[f - 1][l];
        if (!n) continue;
        for (const nl of n.next) {
          const line = document.createElementNS(svgNS, 'line');
          line.setAttribute('x1', laneX(l) + '%');
          line.setAttribute('y1', String(rowY(f)));
          line.setAttribute('x2', laneX(nl) + '%');
          line.setAttribute('y2', String(rowY(f + 1)));
          const target = floors[f][nl];
          let cls = 'ln';
          if (n.visited && target && target.visited) cls += ' done';
          else if (f === run.floor && l === run.lane) cls += ' open';
          line.setAttribute('class', cls);
          svg.appendChild(line);
        }
      }
    }
    inner.appendChild(svg);
    for (let f = 1; f <= nF; f++) {
      for (let l = 0; l < W; l++) {
        const n = floors[f - 1][l];
        if (!n) continue;
        const shown = n.resolved || n.type;
        const info = RS.NODE_INFO[shown] || RS.NODE_INFO.combat;
        const here = f === run.floor && l === run.lane;
        const can = isAvail(f, l);
        const wing = !can && isWing(f, l);
        const label = n.type === 'unknown' ? (n.resolved ? `?·${RS.NODE_INFO[n.resolved].name}` : '?') : info.name;
        inner.appendChild(h('button', {
          class: `node t-${n.type}${n.visited ? ' visited' : ''}${here ? ' here' : ''}${can ? ' avail' : ''}${wing ? ' wing' : ''}`,
          style: `left:${laneX(l)}%;top:${rowY(f)}px`,
          'aria-label': label,
          onclick(e) {
            if (can || wing) {
              RS.sfx('click');
              G.enterNode(f, l, wing);
            } else {
              UI.tip(e.currentTarget, n.type === 'unknown' ? '? (미지)' : info.name, nodeDesc(n));
            }
          },
        }, icon(n.type === 'unknown' && !n.resolved ? 'n_event' : info.icon, '', 3),
        n.burning ? h('span', { class: 'burn' }, icon('flameE', '', 3)) : null,
        h('span', { class: 'nlabel' }, label)));
      }
    }
    box.appendChild(inner);
    const targetY = rowY(Math.min(nF, run.floor + 1));
    box.scrollTop = Math.max(0, targetY - box.clientHeight * 0.55);
  };

  function nodeDesc(n) {
    if (n.burning) return '불타는 엘리트. 무작위 강화를 받은 엘리트가 나온다. 이기면 유물과 함께 에메랄드 열쇠.';

      shop: '유물·증강·소모품·용병을 사고, 증강·저주를 없애거나 룬을 새긴다.',
