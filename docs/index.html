    const d = buf.getChannelData(0);
    const lim = Math.min(d.length, Math.floor(buf.sampleRate * 0.3));
    for (let i = 0; i < lim; i++) if (d[i] > THR || d[i] < -THR) return i / buf.sampleRate;
    return 0;
  }
  function decode(bytes) {
    return new Promise((ok, bad) => {
      try {
        const p = ctx.decodeAudioData(bytes, ok, bad);
        if (p && p.catch) p.catch(bad);
      } catch (e) {
        bad(e);
      }
    });
  }
  function fetchBytes(url) {
    if (typeof fetch !== 'function') return Promise.reject(new Error('no fetch'));
    return fetch(url).then((r) => {
      if (!r.ok) throw new Error(r.status);
      return r.arrayBuffer();
    });
  }

  // ── 효과음 ──
  const SFX_GAIN = {
    click: 0.3, error: 0.4, summon: 0.45, rare: 0.5, merge: 0.5, legend: 0.55, upgrade: 0.45, kill: 0.16, big: 0.5,
    leak: 0.5, coin: 0.3, wave: 0.35, boss: 0.5, bomb: 0.55, freeze: 0.35, lose: 0.45, glue: 0.35, shield: 0.35,
    shieldBreak: 0.5, blink: 0.35, charge: 0.4, seal: 0.45, cast: 0.3, doze: 0.3, unseal: 0.45, crit: 0.28,
    atk_knight: 0.2, atk_rogue: 0.18, atk_archer: 0.1, atk_mage: 0.18, atk_frost: 0.12,
  };
  const sfxBuf = {}; // 이름 → [{ buf, off, dur }]
  let sfxLoading = false;
  function preloadSfx() {
    if (sfxLoading || !ctx) return;
    sfxLoading = true;
    for (const name in MAN.sfx) {
      MAN.sfx[name].forEach((it) => {
        fetchBytes(BASE + 'sfx/' + it.f)
          .then(decode)
          .then((buf) => {
            const off = Math.max(0, firstSound(buf) - it.lead);
            (sfxBuf[name] = sfxBuf[name] || []).push({ buf, off, dur: Math.min(it.dur, buf.duration - off) });
          })
          .catch(() => {
            /* 합성음으로 대신 */
          });
      });
    }
  }
  let sfxBus = null;
  function playSample(name, rate) {
    const list = sfxBuf[name];
    if (!list || !list.length) return false;
    const it = list[(Math.random() * list.length) | 0];
    if (!sfxBus) {
      sfxBus = ctx.createGain();
      sfxBus.gain.value = 1.6; // master(0.35) 뒤에서 합성음과 비슷한 크기
      sfxBus.connect(master);
    }
    const src = ctx.createBufferSource();
    src.buffer = it.buf;
    if (rate) src.playbackRate.value = rate;
    // (재생 속도를 흔들면 길이도 바뀌지만 짧은 소리라 괜찮다)
    const g = ctx.createGain();
    g.gain.value = SFX_GAIN[name] || 0.4;
    src.connect(g);
    g.connect(sfxBus);
    src.start(ctx.currentTime, it.off, it.dur + 0.02);
    return true;
  }

  // ── 배경 음악: 장면·막마다 곡을 고르고, 원본 루프 지점대로 끊김 없이 되풀이한다 ──
  const pickOf = (arr) => arr[(Math.random() * arr.length) | 0];
  function trackFor(scene, act) {
    const a = Math.max(1, Math.min(4, act || 1));
    switch (scene) {
      case 'battle': return a >= 4 ? pickOf(['a4', 'a4b']) : pickOf(['a' + a, 'a' + a + 'b']);
      case 'elite': return 'elite';
      case 'boss': return a >= 4 ? 'god' : a >= 3 ? 'boss3' : 'boss1';
      case 'map': return 'select';
      case 'win': return 'title';
      default: return MAN.bgm[scene] ? scene : null;
    }
  }
  // 다음에 나올 법한 곡을 미리 받아 둔다 (압축된 파일만. 풀어 두는 건 틀 때)
  function nextOf(scene, act) {
    const a = Math.max(1, Math.min(4, act || 1));
    if (scene === 'title') return ['select', 'a1', 'a1b'];
    if (scene === 'map' || scene === 'event' || scene === 'shop' || scene === 'rest') return a >= 4 ? ['a4', 'a4b', 'god'] : ['a' + a, 'a' + a + 'b', 'elite', a >= 3 ? 'boss3' : 'boss1'];
    if (scene === 'battle' || scene === 'elite') return ['select', a >= 4 ? 'god' : a >= 3 ? 'boss3' : 'boss1'];
    return ['select'];
  }

  const raw = {}; // 곡 id → 받은 mp3 (Promise<ArrayBuffer>)
  const decoded = new Map(); // 곡 id → { buf, off, dur } (최근 3곡만: 폰 메모리)
  // 못 받은 곡은 5·10·20·40·60초 간격으로만 다시 받는다. 못 푸는 곡은 이번에는 포기
  const fail = {}; // 곡 id → { n, t, hard }
  function blocked(id) {
    const f = fail[id];
    return !!f && (f.hard || Date.now() - f.t < Math.min(60000, 5000 * Math.pow(2, f.n - 1)));
  }
  function clearFails() {
    for (const k in fail) if (!fail[k].hard) delete fail[k];
  }
  if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('online', clearFails);
  function getRaw(id) {
    if (!raw[id]) {
      if (blocked(id)) return Promise.reject(new Error('backoff'));
      raw[id] = fetchBytes(BASE + 'bgm/' + id + '.mp3').then(
        (b) => {
          delete fail[id];
          return b;
        },
        (e) => {
          delete raw[id];
          fail[id] = { n: ((fail[id] && fail[id].n) || 0) + 1, t: Date.now() };
          throw e;
        }
      );
    }
    return raw[id];
  }
  function getTrack(id) {
    if (decoded.has(id)) {
      const v = decoded.get(id);
      decoded.delete(id);
      decoded.set(id, v); // 최근 사용으로
      return Promise.resolve(v);
    }
    const info = MAN.bgm[id];
    return getRaw(id)
      .then((bytes) =>
        decode(bytes.slice(0)).catch((e) => {
          fail[id] = { hard: true };
          delete raw[id];
          throw e;
        })
      )
      .then((buf) => {
        // 한 채널로 합쳐 메모리를 반으로
        let b = buf;
        if (buf.numberOfChannels > 1) {
          b = ctx.createBuffer(1, buf.length, buf.sampleRate);
          const o = b.getChannelData(0);
          const l = buf.getChannelData(0);
          const r = buf.getChannelData(1);
          for (let i = 0; i < o.length; i++) o[i] = (l[i] + r[i]) * 0.5;
        }
        const off = Math.max(0, firstSound(b) - info.lead);
        const v = { buf: b, off, dur: Math.min(info.dur, b.duration - off) };
        decoded.set(id, v);
        while (decoded.size > 3) {
          const oldest = decoded.keys().next().value;
          if (cur && cur.id === oldest) break;
          decoded.delete(oldest);
        }
        return v;
      });
  }

  let want = null; // { scene, act }
  let cur = null; // { scene, act, id, src, gain }
  let musicBus = null;
  let jingle = null; // { src, g }
  let jingleSeq = 0;
  let jingleFor = null; // 승리 팡파르를 튼 want (다시 받기 재시도 때 또 틀지 않는다)
  let reqSeq = 0;
  let pend = null; // 받는 중인 { scene, act }

  function stopCur(fade) {
    if (!cur) return;
    const { src, gain } = cur;
    const now = ctx.currentTime;
    try {
      gain.gain.cancelScheduledValues(now);
      gain.gain.setValueAtTime(gain.gain.value, now);
      gain.gain.linearRampToValueAtTime(0, now + fade);
      src.stop(now + fade + 0.05);
    } catch (e) {
      /* 이미 멈춤 */
    }
    cur = null;
  }
  // 승리 팡파르: 소리를 끄거나 장면이 바뀌면 멈춘다 (아직 받는 중이면 틀지 않게)
  function stopJingle(fade) {
    jingleSeq++;
    if (!jingle) return;
    const { src, g } = jingle;
    jingle = null;
    const now = ctx.currentTime;
    try {
      g.gain.cancelScheduledValues(now);
      g.gain.setValueAtTime(g.gain.value, now);
      g.gain.linearRampToValueAtTime(0, now + fade);
      src.stop(now + fade + 0.05);
    } catch (e) {
      /* 이미 멈춤 */
    }
  }
  function startId(scene, act, id, delay) {
    const seq = ++reqSeq;
    pend = { scene, act };
    getTrack(id)
      .then((t) => {
        if (seq !== reqSeq || !ctx) return; // 그사이 다른 곡으로 바뀜
        pend = null;
        if (!musicBus) {
          musicBus = ctx.createGain();
          musicBus.gain.value = 0.75;
          musicBus.connect(master);
        }
        const src = ctx.createBufferSource();
        src.buffer = t.buf;
        src.loop = true;
        src.loopStart = t.off;
        src.loopEnd = t.off + t.dur;
        const gain = ctx.createGain();
        const t0 = ctx.currentTime + (delay || 0.05);
        gain.gain.setValueAtTime(0, t0);
        gain.gain.linearRampToValueAtTime(1, t0 + 0.6);
        src.connect(gain);
        gain.connect(musicBus);
        src.start(t0, t.off);
        cur = { scene, act, id, src, gain };
      })
      .catch(() => {
        if (seq === reqSeq) pend = null; // 못 받으면 조용히 (효과음은 계속). 나중에 다시 시도
      });
  }
  function playJingle() {
    const info = MAN.bgm.winJingle;
    if (!info || blocked('winJingle')) return 0;
    const seq = ++jingleSeq;
    getTrack('winJingle')
      .then((t) => {
        if (seq !== jingleSeq || !ctx) return; // 그사이 소리를 끄거나 장면이 바뀜
        const src = ctx.createBufferSource();
        src.buffer = t.buf;
        const g = ctx.createGain();
        g.gain.value = 0.9;
        src.connect(g);
        g.connect(musicBus || master);
        src.start(ctx.currentTime + 0.05, t.off, t.dur);
        jingle = { src, g };
        src.onended = () => {
          if (jingle && jingle.src === src) jingle = null;
        };
      })
      .catch(() => {});
    return info.dur;
  }

  function apply() {
    if (!ctx) return;
    const target = muted || bgmOff ? null : want;
    // 끄기는 멈춘 상태에서도 바로 (예약된 멈춤은 깨어날 때 적용된다)
    if (!target) {
      reqSeq++;
      pend = null;
      jingleFor = null;
      stopJingle(0.3);
      stopCur(0.4);
      return;
    }
    // 새 곡은 깨어난 뒤에: onstatechange 와 700ms 확인이 다시 부른다
    if (ctx.state !== 'running') return;
    if (pend && pend.scene === target.scene && pend.act === target.act) return;
    // 같은 장면(같은 막)이면 틀던 곡을 그대로 둔다
    if (cur && cur.scene === target.scene && cur.act === target.act) return;
    const id = trackFor(target.scene, target.act);
    if (!id) return;
    if (target.scene !== 'win') {
      jingleFor = null;
      stopJingle(0.3);
    }
    stopCur(0.8);
    if (blocked(id)) {
      // 못 받은 곡: 기다리는 동안은 조용히 (확인 때마다 다시 받지 않는다)
      reqSeq++;
      pend = null;
      return;
    }
    let delay = 0.05;
    // 팡파르는 승리 화면에 들어올 때 한 번만 (곡을 못 받아 다시 시도할 때는 곡만)
    if (target.scene === 'win' && jingleFor !== want) {
      jingleFor = want;
      delay = playJingle() + 0.2;
    }
    startId(target.scene, target.act, id, delay);
    for (const n of nextOf(target.scene, target.act)) if (MAN.bgm[n] && !blocked(n)) getRaw(n).catch(() => {});
  }

  // scene: title·map·battle·elite·boss·shop·rest·event·win·lose. act 로 막마다 곡이 바뀐다
  RS.bgm = function (scene, act) {
    want = scene ? { scene, act: act || (want && want.act) || 1 } : null;
    apply();
  };
  // 터치로 오디오가 깨어난 뒤에도 원하는 곡이 나오게 가끔 확인한다
  // apply 는 같은 곡이면 바로 돌아오므로, 멈춰 있던 동안 놓친 장면·끄기 변경도 여기서 따라잡는다
  if (typeof setInterval === 'function') setInterval(() => {
    if (ctx && ctx.state === 'running') apply();
  }, 700);

  RS.audioHidden = function (hidden) {
    if (!ctx) return;
    try {
      const p = hidden ? ctx.suspend() : ctx.resume();
      if (p && p.catch) p.catch(() => {});
    } catch (e) {
      /* 무시 */
    }
  };
  RS.isBgmOff = () => bgmOff;
  RS.bgmNow = () => (cur ? cur.id : null);
  // 점검용: 받아 둔 효과음 종류 수, 풀어 둔 곡, 루프 시작점
  RS.audioStats = () => ({ sfx: Object.keys(sfxBuf).length, decoded: [...decoded.keys()], off: cur ? decoded.get(cur.id) && decoded.get(cur.id).off : null, state: ctx ? ctx.state : 'none' });
  RS.setBgmOff = function (off) {
    bgmOff = off;
    try {
      localStorage.setItem('rs_bgm_off', off ? '1' : '0');
    } catch (e) {
      /* 무시 */
    }
    setSession();
    if (!off) {
      clearFails(); // 직접 다시 켜면 한 번은 바로 다시 받아 본다
      RS.unlockAudio();
    }
    apply();
  };

  RS.isMuted = () => muted;
  RS.setMuted = function (m) {
    muted = m;
    try {
      localStorage.setItem('rs_muted', m ? '1' : '0');
    } catch (e) {
      /* 무시 */
    }
    setSession();
    if (!m) {
      clearFails();
      RS.unlockAudio();
    }
    apply();
  };
})((globalThis.RS = globalThis.RS || {}));

// ── src/ui/common.js ──
// 화면 공용 도구: DOM 만들기, 아이콘, 버튼, 토스트, 툴팁, 모달, 상단 바, 확인, 획득 요약
(function (RS) {
  'use strict';

  const UI = (RS.UI = RS.UI || {});

  const $ = (sel) => document.querySelector(sel);
  UI.$ = $;

  function h(tag, props) {
    const el = document.createElement(tag);
    if (props) {
      for (const k in props) {
        const v = props[k];
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = v;
        else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
        else if (k === 'style') el.style.cssText = v;
        else el.setAttribute(k, v === true ? '' : v);

    for (let i = 2; i < arguments.length; i++) append(el, arguments[i]);
    return el;
  }

    else el.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
  }
  UI.h = h;
  UI.append = append;

  const iconName = (icon) => (icon.startsWith('c_') ? icon.slice(2) + '3' : icon);
  UI.icon = (name, cls, scale) => h('img', { class: 'ic ' + (cls || ''), src: RS.iconURL(iconName(name), scale || 4), alt: '' });
  UI.unitImg = (cls, tier, extra) => h('img', { class: 'uimg ' + (extra || ''), src: RS.unitURL(cls, tier, 3), alt: '' });

  UI.fmt = (v) => Math.floor(v).toLocaleString('ko-KR');
  UI.fmtK = (v) => RS.fmtNum(v);
  UI.pct = (v) => Math.round(v * 100) + '%';

  // ── 두 번 탭 방지 ──
  // 화면이 바뀐 직후의 탭은 버린다. 빠른 두 번 탭이 새 화면의 같은 자리를 누르지 않게 한다.
  UI.lockUntil = 0;
  UI.lockInput = function (ms) {
    const now = typeof performance !== 'undefined' ? performance.now() : Date.now();
    UI.lockUntil = Math.max(UI.lockUntil, now + (ms == null ? 300 : ms));
  };
  UI.inputLocked = function () {
    const now = typeof performance !== 'undefined' ? performance.now() : Date.now();
    return now < UI.lockUntil;
  };

  UI.btn = function (label, onclick, cls, disabled) {
    return h('button', {
      class: 'btn ' + (cls || ''),
      disabled: !!disabled,
      onclick(e) {
        RS.sfx('click');
        onclick(e);
      },
    }, label);
  };

  // 되돌릴 수 없는 동작: 첫 탭은 글자만 바뀌고, 2초 안에 한 번 더 누르면 실행
  UI.btn2 = function (label, armedLabel, onConfirm, cls, disabled) {
    let timer = 0;
    const el = h('button', {
      class: 'btn ' + (cls || ''),
      disabled: !!disabled,
      onclick(e) {
        const now = typeof performance !== 'undefined' ? performance.now() : Date.now();
        if (el.classList.contains('arm')) {
          // 빠른 두 번 탭(실수)은 확인으로 치지 않는다
          if (now - (el._armedAt || 0) < 400) return;
          clearTimeout(timer);
          el.classList.remove('arm');
          RS.sfx('click');
          onConfirm(e);
          return;
        }
        RS.sfx('click');
        el._armedAt = now;
        el.classList.add('arm');
        el.dataset.label = el.textContent;
        el.textContent = armedLabel;
        timer = setTimeout(() => {
          if (!el.classList.contains('arm')) return;
          el.classList.remove('arm');
          el.textContent = el.dataset.label || label;
        }, 2000);
      },
    }, label);
    return el;
  };

  // 한 번만 눌려야 하는 버튼 묶음: 하나를 누르면 모두 잠근다
  UI.lockAll = function (root) {

  };

  UI.hideTip = function () {

  };

  UI.show = function (id) {

    const t = h('div', { class: 'toast ' + (kind || '') }, text);
    let dur = 1700;
    if (inBattle && UI.G && UI.G.speed >= 2) {
      dur = 1100;
      t.style.animationDuration = '1.1s';
    } else if (!inBattle) {
      dur = 2400;
      t.style.animationDuration = '2.4s';
    }
    // 긴 설명(보스 기술 첫 안내 등)은 읽을 시간을 더 준다
    if (text.length > 28) {
      dur = Math.min(4200, Math.max(dur, text.length * 60));
      t.style.animationDuration = dur / 1000 + 's';

  // 숫자가 잠깐 떠오르는 표시 (HUD 옆)

    anchor.appendChild(f);
    setTimeout(() => f.remove(), 700);
  };

  UI.tip = function (anchor, title, desc, extra, action) {
    const tip = $('#tip');
    tip.innerHTML = '';
    tip.dataset.owner = ''; // 누가 연 툴팁인지 (맵 칸 두 번 누르기 확인용, 연 쪽이 다시 적는다)
    append(tip, [
      h('b', null, title),
      desc ? h('p', null, desc) : null,
      extra ? h('p', { class: 'cost' }, extra) : null,
      action ? h('div', { class: 'tip-act' }, UI.btn(action.label, (e) => {
        e.stopPropagation();
        tip.hidden = true;
        action.onClick();
      }, 'gold sm')) : null,
    ]);
    tip.hidden = false;
    const r = anchor.getBoundingClientRect();
    const tw = Math.min(260, window.innerWidth - 24);
    tip.style.width = tw + 'px';
    const left = Math.max(12, Math.min(window.innerWidth - tw - 12, r.left + r.width / 2 - tw / 2));
    tip.style.left = left + 'px';
    const below = r.bottom + 8;

  };
  // 화면 좌표에 툴팁 (전장의 적처럼 DOM 요소가 없는 대상)
  UI.tipAt = function (x, y, title, desc, extra, action) {
    const rect = { left: x - 10, right: x + 10, top: y - 14, bottom: y + 14, width: 20, height: 28 };
    UI.tip({ getBoundingClientRect: () => rect }, title, desc, extra, action);
  };

  // ── 저주 설명: 글 속 '저주 [이름]' 과 '무작위 저주' 를 찾아 무엇인지 풀어 준다 ──
  UI.curseRefs = function (text) {
    const list = [];
    let random = false;
    if (!text) return null;
    const re = /저주 \[([^\]]+)\]/g;
    let m;
    while ((m = re.exec(text))) {
      const c = RS.CURSES.find((x) => x.name === m[1]);
      if (c && list.indexOf(c) < 0) list.push(c);
    }
    if (/무작위 저주|저주 하나와|저주도 숨어|· 저주 ·|저주를 받는다/.test(text)) random = true;
    return list.length || random ? { list, random } : null;
  };
  const RANDOM_POOL = () => RS.CURSES.filter((c) => !c.permanent);
  // 카드·선택지 안에 넣는 짧은 설명
  UI.curseNote = function (text) {
    const r = UI.curseRefs(text);
    if (!r) return null;
    return h('div', { class: 'cursenote' },
      r.list.map((c) => h('p', null, h('b', null, `저주 [${c.name}]`), ' ' + c.desc)),
      r.random ? h('p', null, h('b', null, '무작위 저주'), ` 1개: ${RANDOM_POOL().map((c) => c.name).join('·')} 중 하나`) : null,
    );
  };
  // 툴팁용 글: '저주 [불면]' → '저주 [불면: 전투를 시작할 때 생명 -1]'
  UI.curseText = function (text) {
    if (!text) return text;
    return text.replace(/저주 \[([^\]]+)\]/g, (all, name) => {
      const c = RS.CURSES.find((x) => x.name === name);
      return c ? `저주 [${name}: ${c.desc}]` : all;
    });
  };
  // 저주가 걸린 선택: 고르기 전에 저주를 자세히 보여 주고 한 번 더 묻는다
  UI.curseConfirm = function (label, text, onOk) {
    const r = UI.curseRefs(text);
    if (!r) return onOk();
    const cards = r.list.map((c) => h('div', { class: 'card curse' }, UI.icon('curse', 'cic', 4),
      h('div', { class: 'cbody' }, h('div', { class: 'ctop' }, h('span', { class: 'rar' }, c.permanent ? '저주 · 없앨 수 없음' : c.fades ? '저주 · 저절로 사라짐' : '저주'), h('b', null, c.name)), h('p', null, c.desc))));
    const pool = r.random ? h('div', { class: 'cursepool' }, h('p', { class: 'dim' }, '무작위 저주는 아래 중 하나가 나옵니다'),
      RANDOM_POOL().map((c) => h('p', null, h('b', null, c.name), ' · ' + c.desc))) : null;
    UI.modal('저주 확인', h('div', { class: 'confirm' },
      h('p', null, `[${label}] 을(를) 고르면 아래 저주를 받습니다.`),
      h('div', { class: 'cards' }, cards), pool,
      h('p', { class: 'dim small' }, '저주는 상점의 [제거]나 일부 이벤트로 없앨 수 있어요' + (r.list.some((c) => c.permanent) ? ' (없앨 수 없는 것 제외)' : '') + '. 액막이 매듭이 있으면 막아 줘요.'),
      h('div', { class: 'row2' },
        UI.btn('취소', () => UI.closeModal()),
        UI.btn('그래도 고른다', () => {
          UI.onModalClose = null;
          UI.closeModal();
          onOk();
        }, 'gold'),
      ),
    ));
  };

  // ── 연마 미리보기: 연마하면 어떤 수치가 얼마로 바뀌는지 ──
  const MOD_LABEL = {
    dmgPct: '모든 유닛 피해', aspdPct: '공격 속도', rangeAdd: ['사거리', 'n'], critChance: '치명타 확률', critMult: ['치명타 배율', 'x'],
    killGoldPct: '처치 골드', waveGoldPct: '웨이브 골드', interestCap: ['이자 한도', 'n'], interestBonus: ['이자', 'n'],
    rareChance: '희귀 소환 확률', twinChance: '한 기 더 소환 확률', mergeRefund: '재료 반환 확률', mergeDouble: '2단계 상승 확률',
    mergeMirror: '결과 2기 확률', enemySpeedPct: ['적 이동 속도', 'neg'], eliteDmgPct: '엘리트·보스에게 피해', firstStrike: '첫 공격 피해',
    shrapnel: '파편 피해', freezeChance: '빙결 확률', diversity: '클래스당 피해', purity: '조건 충족 시 피해', eliteSquad: '조건 충족 시 피해',
    rich: '골드 100 이상일 때 피해', legendAura: '전설 1기당 피해', demonForm: '웨이브마다 쌓이는 피해', noxious: '초당 독안개 피해',
    poison: '독 피해', eliteKillHeal: ['엘리트 처치 시 회복', 'n'], karmaGold: ['저주당 골드(×막)', 'n'], sellPct: '판매 가격', summonCostPct: '소환 비용', upgradeCostPct: '강화 비용',
    // 지휘관 고유 능력 (abMax·abStart 는 지휘관마다 자원 이름이 달라 아래에서 붙인다)
    chargeHeal: ['강타를 끊으면 생명', 'n'], chargeTaunt: '도발한 적이 받는 피해', resolveDmg: '결의 1개당 피해',
    stanceBurn: '화염 태세 화상', stanceSlow: '냉기 태세 둔화', stanceFreeze: '빙결 확률', stanceCd: ['원소 전환 대기', 's'],
    stanceBoom: '원소 폭발 피해', stanceHaste: '전환 뒤 공격 속도', burnVuln: '화상 입은 적이 받는 피해',
    starKill: ['별 +1 에 필요한 처치', 'per'], starSlow: '별똥별 둔화', starHoard: '별 5개 이상일 때 피해', starTwice: '두 번째 별똥별 피해',
    starStack: '별똥별마다 쌓이는 피해',
  };
  const CLS_LABEL = { dmg: '피해', aspd: '공격 속도', range: ['사거리', 'n'], crit: '치명타 확률', splash: ['폭발 범위', 'n'], slow: '둔화' };
  function fmtMod(v, kind) {
    if (kind === 'n') return (v >= 0 ? '+' : '') + Math.round(v * 10) / 10;
    if (kind === 's') return '-' + Math.round(v * 10) / 10 + '초';
    if (kind === 'per') return Math.round(1 / v) + '마리';
    if (kind === 'x') return '+' + Math.round(v * 100) / 100 + '배';
    if (kind === 'neg') return '-' + Math.round(v * 1000 + 1e-6) / 10 + '%';
    const p = Math.round(v * 1000 + (v >= 0 ? 1e-6 : -1e-6)) / 10;
    return (p >= 0 ? '+' : '') + p + '%';
  }
  // [{ label, from, to }] (바뀌는 수치만)
  UI.upgradeLines = function (id) {
    const def = RS.augDef(id);
    const up = RS.upgradeScale(def.mods || {}, 1.5);
    if (!up) return [];
    const out = [];
    const add = (lab, a, b) => {
      if (a === b) return;
      const [name, kind] = Array.isArray(lab) ? lab : [lab, '%'];
      out.push({ label: name, from: fmtMod(a, kind), to: fmtMod(b, kind) });
    };
    // 결의·별처럼 지휘관마다 이름이 다른 자원
    const cmd = def.cmd && RS.COMMANDER[def.cmd];
    const res = (cmd && RS.ABILITY[cmd.ability] && RS.ABILITY[cmd.ability].res) || '자원';
    const labels = Object.assign({}, MOD_LABEL, { abMax: [res + ' 최대', 'n'], abStart: ['전투 시작 ' + res, 'n'] });
    for (const k in def.mods) {
      if (k === 'cls') {
        for (const c in def.mods.cls) for (const s in def.mods.cls[c]) if (CLS_LABEL[s]) {
          const lab = CLS_LABEL[s];
          add(Array.isArray(lab) ? [`${RS.CLASS[c].name} ${lab[0]}`, lab[1]] : `${RS.CLASS[c].name} ${lab}`, def.mods.cls[c][s], up.cls[c][s]);
        }
      } else if (labels[k] && typeof def.mods[k] === 'number') add(labels[k], def.mods[k], up[k]);
    }
    return out;
  };
  UI.upgradeView = function (id, done) {
    const lines = UI.upgradeLines(id);
    if (!lines.length) return h('p', { class: 'upnote' }, done ? '연마됨: 이로운 효과 ×1.5' : '연마하면 이로운 효과 ×1.5');
    return h('div', { class: 'upnote' }, h('b', null, done ? '연마됨' : '연마하면'),
      lines.map((l) => h('p', null, done ? `${l.label} ${l.to}` : `${l.label} ${l.from} → `, done ? null : h('em', null, l.to))));
  };

  // ── 카드·칩 ──
  UI.relicTitle = (r) => `${r.name} · ${RS.RARITY_NAME.relic[r.rarity]} 유물`;

  UI.relicChip = function (id, run) {
    const r = RS.REL[id];
    let extra = r.cost ? '대가 · ' + UI.curseText(r.cost) : null;
    const st = run && run.relicState[id];
    if (st && st.uses != null) extra = `남은 횟수 ${st.uses}`;
    else if (st && st.charges != null) extra = `남은 충전 ${st.charges}`;
    else if (st && st.count != null) extra = `남은 횟수 ${st.count}`;
    else if (st && st.active === false) extra = '깨짐';
    return h('button', {
      class: 'chip relic r' + r.rarity,
      'aria-label': r.name,
      onclick(e) {
        UI.tip(e.currentTarget, UI.relicTitle(r), r.desc, extra);
      },
    }, UI.icon(r.icon, '', 3));
  };

  // 시너지 태그 줄: #치명타 #도적 … (이미 가진 것과 겹치면 밝게 + 개수)
  UI.synRow = function (def, owned) {
    const tags = RS.synTags(def);
    const run = UI.G && UI.G.run;
    const cnt = run && !owned ? RS.synCounts(run) : null;
    if (!tags.length) return h('div', { class: 'syn' }, h('span', { class: 'tag gen' }, '#범용'));
    return h('div', { class: 'syn' }, tags.map((t) => {
      const n = cnt && cnt[t] ? cnt[t] : 0;
      return h('span', { class: 'tag' + (n ? ' hit' : ''), style: `--tc:${RS.SYN[t].col}`, title: RS.SYN[t].desc }, `#${RS.SYN[t].name}${n ? ` ×${n}` : ''}`);
    }));
  };
  const ownedAug = (a) => { const run = UI.G && UI.G.run; return !!run && run.augments.some((x) => RS.augDef(x).id === a.id); };
  const ownedRel = (id) => { const run = UI.G && UI.G.run; return !!run && run.relics.indexOf(id) >= 0; };

  UI.augCard = function (id, selected, onclick, extra) {
    const a = RS.augDef(id);
    const up = RS.isUpgraded(id);
    return h('button', { class: `card r${a.rarity}${selected ? ' sel' : ''}`, onclick },
      UI.icon(a.icon, 'cic', 4),
      h('div', { class: 'cbody' },
        h('div', { class: 'ctop' }, h('span', { class: 'rar' }, RS.RARITY_NAME.aug[a.rarity]), h('b', null, a.name + (up ? '+' : '')), a.cmd ? h('small', { class: 'cmdtag' }, `${RS.COMMANDER[a.cmd].name} 전용`) : a.unique ? null : h('small', { class: 'stack' }, '중첩 가능')),
        h('p', null, a.desc),
        UI.synRow(a, ownedAug(a)),
        up ? UI.upgradeView(id, true) : null,
        a.cost ? h('p', { class: 'cost' }, '대가 · ' + a.cost) : null,
        a.cost ? UI.curseNote(a.cost) : null,
        extra || null,
      ),
    );
  };

  UI.relicCard = function (id, selected, onclick, price) {
    const r = RS.REL[id];
    return h('button', { class: `card relic rr${r.rarity}${selected ? ' sel' : ''}`, onclick },
      UI.icon(r.icon, 'cic', 4),
      h('div', { class: 'cbody' },
        h('div', { class: 'ctop' }, h('span', { class: 'rar' }, RS.RARITY_NAME.relic[r.rarity] + ' 유물'), h('b', null, r.name)),
        h('p', null, r.desc),
        UI.synRow(r, ownedRel(id)),
        r.cost ? h('p', { class: 'cost' }, '대가 · ' + r.cost) : null,
        r.cost ? UI.curseNote(r.cost) : null,
      ),
      price != null ? h('span', { class: 'price' }, UI.icon('coin', '', 2), price) : null,
    );
  };

  // ── 상단 바 ──
  UI.keysEl = function (run) {
    if (run.act > 3 && !run.keys.ruby) return null;
    const k = run.keys;
    if (!k.ruby && !k.emerald && !k.sapphire && run.act === 1 && run.floor < 2) return null;
    const one = (name, has, label) => h('span', { class: 'keyic' + (has ? ' on' : ''), title: label }, UI.icon(name, '', 2));
    return h('button', {
      class: 'keys',
      'aria-label': '봉인석',
      onclick(e) {
        UI.tip(e.currentTarget, '균열의 봉인석', '붉은(휴식처에서 회수)·초록(성난 엘리트 처치)·푸른(보물 상자에서 유물 대신) 봉인석 세 개를 모으면 3막 보스 뒤에 4막이 열린다.');
      },
    }, one('key_ruby', k.ruby, '붉은 봉인석'), one('key_emerald', k.emerald, '초록 봉인석'), one('key_sapphire', k.sapphire, '푸른 봉인석'));
  };

  UI.topbar = function (run, title) {
    return h('div', { class: 'topbar' },
      h('div', { class: 'tb-title' }, title),
      h('div', { class: 'tb-stats' },
        UI.keysEl(run),
        // 상처는 생명 옆에 작은 배지로만 (좁은 폰에서 제목 폭을 먹지 않게). 탭하면 설명.
        run.injury > 0 ? h('button', {
          class: 'stat life hurt', 'aria-label': `생명, 상처 ${run.injury}`,

        }, UI.icon('heart', '', 3), h('b', null, `${Math.ceil(run.life)}/${run.maxLife}`), h('small', { class: 'inj-badge' }, `상처 ${run.injury}`))
          : h('span', { class: 'stat life' }, UI.icon('heart', '', 3), h('b', null, `${Math.ceil(run.life)}/${run.maxLife}`)),
        h('span', { class: 'stat' }, UI.icon('coin', '', 3), h('b', null, UI.fmt(run.gold))),

  UI.relicStrip = function (run) {
    if (!run.relics.length && !run.curses.length && !run.items.length) return null;
    return h('div', { class: 'strip scroll-x' },
      run.relics.map((id) => UI.relicChip(id, run)),
      run.curses.map((id) => {
        const c = RS.CURSE[id];
        return h('button', { class: 'chip curse', 'aria-label': c.name, onclick: (e) => UI.tip(e.currentTarget, `저주 · ${c.name}`, c.desc) }, UI.icon('curse', '', 3));
      }),
      run.items.map((id) => {
        const it = RS.ITEM[id];
        return h('button', { class: 'chip item', 'aria-label': it.name, onclick: (e) => UI.tip(e.currentTarget, `소모품 · ${it.name}`, it.desc + ' (전투 중 사용)') }, UI.icon(it.icon, '', 3));

  // 보상·상점·이벤트 같은 페이지 화면.
  // 카드를 고르는 것처럼 같은 화면을 다시 그릴 때는 UI.keepScroll = true 로 스크롤을 지킨다.
  UI.page = function (title, sub, body, footer) {
    const scr = $('#scr-page');
    const run = UI.G.run;
    const prev = scr.querySelector('.page');
    const keep = UI.keepScroll && prev && UI.current === 'scr-page' ? prev.scrollTop : 0;
    const selOnly = !!UI.keepScroll && UI.current === 'scr-page';
    UI.keepScroll = false;
    scr.innerHTML = '';
    delete scr.dataset.view;
    append(scr, [
      run ? UI.topbar(run, title) : h('div', { class: 'topbar' }, h('div', { class: 'tb-title' }, title)),
      run ? UI.relicStrip(run) : null,
      h('div', { class: 'page scroll' }, sub ? h('p', { class: 'page-sub' }, sub) : null, body),
      footer ? h('div', { class: 'page-foot' }, footer) : null,
    ]);
    UI.show('scr-page');
    // 같은 화면을 다시 그려도(이벤트 다음 단계 등) 두 번 탭이 새 버튼을 누르지 않게
    UI.lockInput(selOnly ? 120 : 300);
    const pg = scr.querySelector('.page');
    pg.scrollTop = keep;
    if (keep) {
      const s = pg.querySelector('.card.sel, .bcell.sel, .btn.option.sel');
      if (s && s.scrollIntoView) s.scrollIntoView({ block: 'nearest' });
    }
  };

  // ── 모달 ──
  UI.modal = function (title, body, onClose) {
    UI.hideTip();
    const m = $('#modal');
    const box = m.querySelector('.modal-box');
    box.innerHTML = '';
    append(box, [
      h('div', { class: 'modal-head' }, h('b', null, title), h('button', { class: 'btn sm x', onclick: () => UI.closeModal(), 'aria-label': '닫기' }, '닫기')),
      h('div', { class: 'modal-body scroll' }, body),
    ]);
    m.hidden = false;
    UI.lockInput(250);
    UI.onModalClose = onClose || null;
    UI.G.setModal(true);
  };
  UI.closeModal = function () {
    UI.hideTip();
    const m = $('#modal');
    // 모달을 닫는 탭이 아래 화면을 누르지 않게
    if (!m.hidden) UI.lockInput(250);
    m.hidden = true;
    UI.G.setModal(false);
    const cb = UI.onModalClose;
    UI.onModalClose = null;
    if (cb) cb();
  };
  // 모달 안의 다른 모달로 바꿀 때: 닫기 콜백을 부르지 않고 내용만 바꾼다
  UI.swapModal = function (fn) {
    UI.onModalClose = null;
    fn();
  };

  // 확인 창: 취소하면 아무 일도 없다
  UI.confirm = function (title, text, okLabel, onOk, onCancel) {

      h('p', null, text),
      h('div', { class: 'row2' },
        UI.btn('취소', () => UI.closeModal()),
        UI.btn(okLabel, () => {
          UI.onModalClose = null;
          UI.closeModal();
          onOk();
        }, 'gold'),
      ),
    ), onCancel || null);
  };

  // 탭 묶음
  UI.tabs = function (tabs) {
    const head = h('div', { class: 'tabs' });
    const body = h('div', { class: 'tabbody' });
    const sel = (k) => {
      for (const b of head.children) b.classList.toggle('on', b.dataset.k === String(k));
      body.innerHTML = '';
      if (tabs[k].sub) body.appendChild(h('p', { class: 'dim small tabsub' }, tabs[k].sub));
      append(body, tabs[k].render());
    };
    tabs.forEach((t, k) => head.appendChild(h('button', { class: 'tab', 'data-k': String(k), onclick: () => sel(k) }, t.name)));
    sel(0);
    return h('div', null, head, body);
  };

  // 목록 행
  UI.augRow = function (id, count) {
    const a = RS.augDef(id);

    for (const g of out) {
      if (g.k !== 'aug' || !g.gain || !RS.isUpgraded(g.id)) continue;

    for (let k = out.length - 1; k >= 0; k--) if (out[k].paired) out.splice(k, 1);

      const d = (b.units[key] || 0) - (a.units[key] || 0);

      bb.hidden = true;
    }
    UI.setPanel('idle');
    UI.renderItems();
    UI.hudCache = {};
    UI.fitCanvas();
    UI.updateHud(true);
    const run = G.run;
    if (trialLimit(b)) {
      UI.toast(`${trialLimit(b)}초 안에 허수아비를 쓰러뜨리세요`, 'warn');
    } else if (b.kind === 'boss' && bossId) {
      UI.toast(`보스전 · 마지막 웨이브에 ${RS.ENEMY[bossId].name} 등장`, 'warn');
    } else if (b.kind === 'elite') {
      const BUFF = { hp: '체력 +40%', fast: '속도 +30%', regen: '재생', armor: '받는 피해 -25%' };
      UI.toast(run.burning ? `성난 엘리트(${BUFF[st.spec && st.spec.burnBuff] || '강화'}) · 이기면 초록 봉인석` : '엘리트전 · 마지막 웨이브에 강적 등장', 'warn');
    }
    if (run.lament > 0 && !trialLimit(b)) setTimeout(() => UI.toast('졸음의 별: 첫 웨이브 적 체력 1', 'good'), 900);
    if (run.tax > 0) setTimeout(() => UI.toast(`빈 주머니 별: 웨이브 골드 없음 (${run.tax}번 남음)`, 'warn'), 1400);
  };

  // 전장에서 탭한 자리에 가장 가까운 적
  function enemyAt(b, p) {
    let best = null;
    let bd = 12 * 12;
    for (const e of b.enemies) {
      if (e.dead || e.subT > 0) continue;
      const dx = e.x - p.x;
      const dy = e.y - 4 - p.y;
      const d = dx * dx + dy * dy;
      if (d < bd) {
        bd = d;
        best = e;
      }
    }
    return best;
  }
  function enemyTip(b, e, cx, cy) {
    const def = e.def;
    const M = b.M;
    const hp = M.blindfold ? '?' : Math.max(1, Math.ceil((100 * Math.max(0, e.hp)) / e.maxHp));
    const big = e.boss || e.elite;
    // 실제 누수(core leak)와 같은 계산: 심연·쇠말뚝·폭주·생명 보호까지 반영
    const nextLap = Math.round(RS.lapLoss(b, e) * 10) / 10;
    const lapTxt = big ? `이번 바퀴를 돌면 생명 -${nextLap} (돌 때마다 두 배)` : `빠져나가면 생명 -${nextLap}`;
    UI.tipAt(cx, cy, def.name + (e.boss ? ' · 보스' : e.elite ? ' · 엘리트' : ''), `체력 ${hp}${hp === '?' ? '' : '%'} · ${lapTxt}`, def.trait || null);
  }

  function bindField() {
    const cv = $('#cv');
    const toLogical = (e) => {
      const r = cv.getBoundingClientRect();
      return { x: ((e.clientX - r.left) / r.width) * F.W, y: ((e.clientY - r.top) / r.height) * F.H };
    };
    let drag = null;
    const tmpSt = {};
    const reachAt = (s, i) => {
      const G = UI.G;
      const b = G.battle;
      if (!b || i < 0 || !s) return true;
      const st = RS.unitStats(G.run, b.M, b.dyn, s.cls, s.tier, i, tmpSt);
      return st.range >= PATH_D[i];
    };
    cv.addEventListener('pointerdown', (e) => {
      const G = UI.G;
      if (!G.battle) return;
      e.preventDefault();
      // 모달을 닫은 탭이 그대로 전장에 들어가 유닛을 옮기지 않게
      if (G.modalOpen || (UI.inputLocked && UI.inputLocked())) return;
      const p = toLogical(e);
      const i = RS.slotAt(p.x, p.y);
      const board = G.run.board;
      if (i < 0) {
        const foe = enemyAt(G.battle, p);
        if (foe) enemyTip(G.battle, foe, e.clientX, e.clientY);
        else UI.select(-1);
        return;
      }
      if (!board[i]) {
        // 선택된 유닛이 있으면 빈칸으로 이동
        if (UI.sel >= 0 && board[UI.sel]) {
          const s = board[UI.sel];
          G.battle.swap(UI.sel, i);
          RS.sfx('click');
          UI.select(i);
          if (!reachAt(s, i)) warnDrop();
        } else {
          UI.select(-1);
          // 룬이 새겨진 빈칸을 누르면 룬 설명
          const rid = G.run.runes && G.run.runes[i];
          if (rid && RS.RUNE[rid]) {
            const R = RS.RUNE[rid];
            UI.tipAt(e.clientX, e.clientY, R.bad ? R.name : `${R.name} (강화된 칸)`, R.desc, R.bad ? '상점의 [룬]으로 덮어 새기면 없어져요' : '이 칸에 놓인 유닛이 효과를 받아요. 유닛을 옮겨도 룬은 칸에 남아요');
          }
        }
        return;
      }
      drag = { from: i, over: i, moved: false, x0: p.x, y0: p.y, x: p.x, y: p.y, id: e.pointerId, overReach: true, lastOver: i };
      G.renderer.drag = drag;
      try {
        cv.setPointerCapture(e.pointerId);
      } catch (err) {
        /* 일부 브라우저 */
      }
    });
    cv.addEventListener('pointermove', (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      const p = toLogical(e);
      drag.x = p.x;
      drag.y = p.y;
      if (!drag.moved && Math.hypot(p.x - drag.x0, p.y - drag.y0) > 5) drag.moved = true;
      drag.over = RS.slotAt(p.x, p.y);
      if (drag.over !== drag.lastOver) {
        drag.lastOver = drag.over;
        const G = UI.G;
        drag.overReach = drag.over < 0 || drag.over === drag.from ? true : reachAt(G.run.board[drag.from], drag.over);
      }
    });
    const end = (e) => {
      const G = UI.G;
      if (!drag || e.pointerId !== drag.id) return;
      const d = drag;
      drag = null;
      G.renderer.drag = null;
      if (!G.battle) return;
      const board = G.run.board;
      if (d.moved) {
        if (d.over >= 0 && d.over !== d.from) {
          G.battle.swap(d.from, d.over);
          RS.sfx('click');
          UI.select(d.over);
          if (!d.overReach) warnDrop();
        }
      } else if (UI.sel >= 0 && UI.sel !== d.from && board[UI.sel]) {
        // 유닛을 고른 채 다른 유닛을 누르면 두 자리를 바꾼다
        const s = board[UI.sel];
        const from = UI.sel;
        G.battle.swap(from, d.from);
        RS.sfx('click');
        UI.select(d.from);
        if (!reachAt(s, d.from)) warnDrop();
        UI.onceTip('tapSwap', '자리를 바꿨어요! 유닛을 고른 채 다른 칸(빈칸·유닛)을 누르면 옮기거나 바꿔요. 다른 유닛을 보려면 고른 유닛을 한 번 더 눌러 선택을 푸세요');
      } else {
        // 선택된 칸을 다시 누르면 선택을 푼다. 단 합성할 수 있는 칸을 곧바로 두 번 누른 것(연타)은
        // [합성] 버튼이 뜨자마자 패널이 닫히지 않게 선택을 유지한다
        const now = typeof performance !== 'undefined' ? performance.now() : Date.now();
        if (UI.sel === d.from && !(RS.canMerge(board, d.from) && now - (UI.selAt || 0) < 400)) UI.select(-1);
        else {
          UI.select(d.from);
          UI.selAt = now;
        }
        RS.sfx('click');
      }
    };
    cv.addEventListener('pointerup', end);
    cv.addEventListener('pointercancel', (e) => {
      if (drag && e.pointerId === drag.id) {
        drag = null;
        UI.G.renderer.drag = null;
      }
    });
  }

  function warnDrop() {
    if ((UI.dropWarned = (UI.dropWarned || 0) + 1) <= 3) UI.toast('이 칸에선 적에게 닿지 않아요', 'warn');
  }

  UI.sel = -1;
  UI.select = function (i) {
    const G = UI.G;
    UI.sel = i;
    if (G.renderer) G.renderer.sel = i;
    if (i >= 0 && G.run && G.run.board[i]) UI.setPanel('unit');
    else if (UI.panelMode === 'unit') UI.setPanel('idle');
  };

  // 강화·소모품 패널을 닫으면 선택한 유닛이 있을 때 그 정보로 돌아간다
  UI.closePanel = function () {
    const G = UI.G;
    if (UI.sel >= 0 && G.run && G.run.board[UI.sel]) UI.setPanel('unit');
    else {
      UI.sel = -1;
      if (G.renderer) G.renderer.sel = -1;
      UI.setPanel('idle');
    }
  };

  // ── 첫 전투 코치 (메타 기록에 진행 상황 저장) ──
  function tut() {
    const meta = UI.G.meta;
    if (!meta.tut || typeof meta.tut !== 'object') meta.tut = {};
    return meta.tut;
  }
  // 새 규칙 안내: 튜토리얼을 끈 사람에게도 한 번은 보여 준다
  UI.onceTip = function (k, text) {
    const meta = UI.G.meta;
    const seen = meta.tips || (meta.tips = {});
    if (seen[k]) return;
    seen[k] = true;
    UI.toast(text, 'warn');
    UI.G.saveMeta();
  };
  UI.tutDone = function (k) {
    const t = tut();
    if (t.off || t[k]) return;
    t[k] = true;
    if (t.summon && t.merge && t.upgrade && t.leak && t.cap) t.off = true;
    UI.G.saveMeta();
  };
  UI.coach = function (b, mergeable) {
    const G = UI.G;
    const t = tut();
    let text = null;
    let pulse = null;
    if (!t.off && (G.meta.runs || 0) > 2) {
      t.off = true;
      G.saveMeta();
    }
    if (!t.off) {
      const run = G.run;
      if (!t.summon) {
        text = '① 금색 [소환]을 눌러 유닛을 부르세요 (부를수록 1G씩 비싸져요)';
        pulse = 'summon';
      } else if (!t.merge && mergeable > 0) {
        text = '② 반짝이는 칸을 누르고 [합성] → 다음 등급 무작위 유닛';
      } else if (!t.upgrade && b.waveIdx >= 2) {
        let min = Infinity;
        for (const c of RS.CLASSES) min = Math.min(min, b.upgradeCost(c));
        if (run.gold >= min) {
          text = `③ [강화]: 골드로 한 클래스의 피해를 레벨당 +${Math.round(RS.BAL.upgradePct * 1000) / 10}%`;
          pulse = 'upg';
        }
      }
      if (!t.cap && b.enemies.length >= b.cap * 0.5) {
        UI.toast(`적이 ${b.cap}마리 쌓이면 패배! 화력을 늘리세요`, 'warn');
        UI.tutDone('cap');
      }
    }
    const c = UI.hudCache;
    if (c.pulse !== pulse) {
      c.pulse = pulse;
      $('#b-summon').classList.toggle('pulse', pulse === 'summon');
      $('#b-upg').classList.toggle('pulse', pulse === 'upg');
    }
    const refs = UI.panelRefs || {};
    if (UI.panelMode === 'idle' && refs.hint) {
      setText(refs.hint, 'coach', text || '칸을 눌러 정보 보기 · 끌어서 자리 바꾸기');
      if (c.coachOn !== !!text) {
        c.coachOn = !!text;
        refs.hint.classList.toggle('coach', !!text);
        if (refs.hint.parentElement) refs.hint.parentElement.classList.toggle('coaching', !!text);
      }
    }
  };

  UI.doSummon = function () {
    const G = UI.G;
    const b = G.battle;
    if (!b) return;
    RS.unlockAudio();
    const res = b.summon();
    if (res.err === 'gold') {
      RS.sfx('error');
      UI.toast('골드가 부족해요', 'warn');
    } else if (res.err === 'full') {
      RS.sfx('error');
      UI.toast('빈자리가 없어요. 합성하거나 판매하세요', 'warn');
    } else if (res.err === 'cap') {
      RS.sfx('error');
      UI.toast('비단 목띠: 이번 웨이브에는 더 소환할 수 없어요', 'warn');
    } else if (res.err === 'locked') {
      RS.sfx('error');
      UI.toast('홀림 귀고리: 준비 시간에는 소환할 수 없어요', 'warn');
    } else if (res.err) {
      RS.sfx('error');
    } else {
      RS.sfx(res.tier > 0 ? 'rare' : 'summon');
      UI.tutDone('summon');
      if (res.tier > 0) UI.toast(`${RS.TIER[res.tier].name} ${RS.CLASS[res.cls].name} 소환!`, 't' + res.tier);
      if (res.clover) UI.toast('네잎클로버! 비용 반환', 'good');
      if (res.twin != null) UI.toast('한 기가 더 따라왔다!', 'good');
      const s = G.run.board[res.slot];
      if (s && RS.canMerge(G.run.board, res.slot) && (tut().off || tut().merge || UI.panelMode !== 'idle') && (UI.mergeHints = (UI.mergeHints || 0) + 1) <= 2) {
        UI.toast('합성 가능! 반짝이는 칸을 누르세요', 'good');
      }
    }
    UI.updateHud(true);
  };

  UI.doMerge = function (i) {
    const G = UI.G;
    const b = G.battle;
    if (!b) return;
    const tierFrom = G.run.board[i] ? G.run.board[i].tier : 0;
    const res = b.merge(i);
    if (!res) {
      UI.select(G.run.board[i] ? i : -1);
      UI.updateHud(true);
      return;
    }
    UI.tutDone('merge');
    if (res.fail) {
      RS.sfx('error');
      UI.toast('합성 실패…', 'warn');
    } else {
      const r = res.results[0];
      RS.sfx(r && r.tier >= 3 ? 'legend' : 'merge');
      if (r) UI.toast(`${res.double ? '대성공! ' : ''}${RS.TIER[r.tier].name} ${RS.CLASS[r.cls].name}${res.results.length > 1 ? ' ×2' : ''}`, 't' + r.tier);
      if (res.refund) UI.toast('재활용: 재료 1기 반환', 'good');
    }
    const next = res.results.length ? res.results[0].slot : -1;
    UI.select(G.run.board[i] && G.run.board[i].tier === tierFrom ? i : next);
    UI.updateHud(true);
  };

  UI.doMergeAll = function () {
    const G = UI.G;
    const b = G.battle;
    if (!b) return;
    if (RS.firstMergeable(G.run.board) < 0) {
      RS.sfx('error');
      UI.toast('합성할 칸이 없어요 (같은 칸에 같은 유닛 3기)', 'warn');
      return;
    }
    let count = 0;
    let i;
    let guard = 0;
    while ((i = RS.firstMergeable(G.run.board)) >= 0 && guard++ < 30) {
      const res = b.merge(i);
      if (res) count++;
      else break;
    }
    if (count) {
      RS.sfx('merge');
      UI.tutDone('merge');
      UI.toast(`${count}번 합성했어요`);
    }
    UI.select(-1);
    UI.updateHud(true);
  };

  function doSell(i) {
    const G = UI.G;
    const b = G.battle;
    if (!b) return;
    if (G.run.board[i] && G.run.board[i].sealed) {
      RS.sfx('error');
      UI.toast('봉인된 유닛은 팔거나 합성할 수 없어요 (장막을 깨면 풀려요)', 'warn');
      return;
    }
    const v = b.sell(i);
    if (v) {
      RS.sfx('coin');
      UI.toast(`+${v}G`);
    }
    UI.select(G.run.board[i] ? i : -1);
    UI.updateHud(true);
  }

  UI.panelMode = 'idle';
  UI.setPanel = function (mode, data) {
    const G = UI.G;
    // 사용·닫기 버튼 자리에 합성·판매 버튼이 바로 그려지므로 연타가 새 버튼을 누르지 않게 잠깐 막는다
    if (UI.panelMode !== mode && (UI.panelMode === 'item' || UI.panelMode === 'upgrade') && UI.lockInput) UI.lockInput(250);
    UI.panelMode = mode;
    UI.panelData = data || null;
    UI.panelSig = null;
    const p = $('#panel');
    p.innerHTML = '';
    p.className = 'panel-' + mode;

    if (UI.hudCache) {
      UI.hudCache.coach = null;
      UI.hudCache.coachOn = null;

      for (const k of ['pdps', 'punits', 'pint']) delete UI.hudCache[k];
      for (const cl of RS.CLASSES) {
        delete UI.hudCache['lv' + cl];
        delete UI.hudCache['uc' + cl];
        delete UI.hudCache['uo' + cl];
      }
    }
    const b = G.battle;
    const run = G.run;
    if (!b) return;
    if (mode === 'idle') {
      const refs = UI.panelRefs;
      append(p, h('div', { class: 'pidle' },
        h('div', { class: 'pstat' }, h('span', null, '전체 DPS'), (refs.dps = h('b', null, '0'))),
        h('div', { class: 'pstat' }, h('span', null, '유닛'), (refs.units = h('b', null, '0'))),
        h('div', { class: 'pstat' }, h('span', null, b.M.summonCap ? '남은 소환' : '다음 이자'), (refs.int = h('b', null, '0'))),
        (refs.hint = h('p', { class: 'phint' }, '칸을 눌러 정보 보기 · 끌어서 자리 바꾸기')),
      ));
    } else if (mode === 'unit') {
      const i = UI.sel;
      const s = run.board[i];
      if (!s) return UI.setPanel('idle');
      const C = RS.CLASS[s.cls];
      const T = RS.TIER[s.tier];
      const refs = UI.panelRefs;
      const canMerge = RS.canMerge(run.board, i);
      UI.panelSig = unitSig(run, i);
      const sv = UI.sellValueAt(b, i);
      const sellBtn = s.tier >= 2
        ? UI.btn2(`판매 +${sv}`, `한 번 더: 판매 +${sv}`, () => doSell(i))
        : btn(`판매 +${sv}`, () => doSell(i));
      append(p, h('div', { class: 'punit' },
        unitImg(s.cls, s.tier, 'big'),
        h('div', { class: 'pinfo' },
          h('div', { class: 'pname' }, h('b', { class: 'tier' + s.tier }, `${T.name} ${C.name}`), ` ×${s.n}`,
            run.runes[i] && RS.RUNE[run.runes[i]] ? h('span', { class: 'runebadge' + (RS.RUNE[run.runes[i]].bad ? ' bad' : ''), style: `--rune:${RS.RUNE[run.runes[i]].color}` }, RS.RUNE[run.runes[i]].name) : null,
            (refs.dps = h('span', { class: 'pdps' }))),
          (refs.stats = h('div', { class: 'pstats' })),
          (refs.desc = h('p', { class: 'pdesc' })),
        ),
        h('div', { class: 'pbtns' },
          btn(s.tier >= RS.TOP_TIER ? '최고 등급' : canMerge ? '합성' : `합성 ${s.n}/${RS.mergeNeed(s.tier)}`, () => UI.doMerge(i), canMerge ? 'gold' : '', !canMerge),
          (refs.sell = sellBtn),
        ),
      ));
      refs.baseDesc = s.sealed
        ? '봉인됨: 싸우지 못해요. 보스의 장막을 깨면 풀려나요'
        : s.tier >= 4 && RS.MYTHIC[s.cls]
        ? `[${RS.MYTHIC[s.cls].name}] ${RS.MYTHIC[s.cls].short}`
        : run.runes[i] && RS.RUNE[run.runes[i]] ? `${RS.RUNE[run.runes[i]].name}: ${RS.RUNE[run.runes[i]].desc}` : `${C.role} · ${C.desc}`;
      UI.refreshUnitStats();
    } else if (mode === 'upgrade') {
      const refs = (UI.panelRefs = { rows: {} });
      const grid = h('div', { class: 'upg-grid' });
      for (const c of RS.CLASSES) {
        const el = h('button', {
          class: 'upg',
          'aria-label': `${RS.CLASS[c].name} 강화`,
          title: `${RS.CLASS[c].name} 강화`,
          onclick() {
            const r = b.upgrade(c);
            if (r.err) {
              RS.sfx('error');
              UI.toast(r.err === 'locked' ? '홀림 귀고리: 준비 시간에는 강화할 수 없어요' : r.err === 'gold' ? '골드가 부족해요' : '지금은 강화할 수 없어요', 'warn');
            } else {
              RS.sfx('upgrade');
            }
            UI.updateHud(true);
          },
        }, unitImg(c, 0), h('b', { class: 'lv' }), h('span', { class: 'cost' }));
        refs.rows[c] = el;
        grid.appendChild(el);
      }
      append(p, h('div', { class: 'pupg' }, grid));
    } else if (mode === 'item') {
      const idx = data.idx;
      const it = RS.ITEM[run.items[idx]];
      if (!it) return UI.setPanel('idle');
      append(p, h('div', { class: 'pitem' },
        icon(it.icon, 'big', 4),
        h('div', { class: 'pinfo' }, h('b', null, it.name), h('p', { class: 'pdesc' }, it.desc + (b.M.itemPotency ? ' (효과 2배)' : ''))),
        h('div', { class: 'pbtns' },
          btn('사용', () => {
            // 효과가 없는 사용은 막는다 (아이템 사용 자체가 힘이 되는 유물이 있으면 그대로 쓴다)
            const noFoe = !b.enemies.some((e) => !e.dead);
            const why = b.M.itemDmg ? null
              : (it.id === 'bomb' || it.id === 'freeze') && noFoe ? '적이 있을 때 쓸 수 있어요'
              : it.id === 'potion' && !RS.canHeal(run) ? '시든 꽃의 낙인: 회복할 수 없어요'
              : it.id === 'potion' && run.life >= run.maxLife ? '생명이 가득해요'
              : null;
            if (why) {
              RS.sfx('error');
              UI.toast(why, 'warn');
              return;
            }
            const r = b.useItem(idx);
            if (r.err) {
              RS.sfx('error');
              UI.toast(r.err === 'full' ? '빈자리가 없어요' : '쓸 수 없어요', 'warn');
              return;
            }
            RS.sfx(it.id === 'bomb' ? 'bomb' : it.id === 'freeze' ? 'freeze' : 'upgrade');
            UI.toast(`${it.name} 사용!`, 'good');
            UI.renderItems();
            UI.closePanel();
            UI.updateHud(true);
          }, 'gold'),
          btn('닫기', () => UI.closePanel()),
        ),
      ));
    }
  };

  function unitSig(run, i) {
    const s = run.board[i];
    return s ? `${i}/${s.cls}/${s.tier}/${s.n}/${RS.canMerge(run.board, i)}/${run.runes[i] || ''}/${s.sealed ? 1 : 0}` : '';
  }

  UI.refreshUnitStats = function () {
    const G = UI.G;
    const refs = UI.panelRefs;
    const b = G.battle;
    if (!refs || !refs.stats || !b) return;
    const i = UI.sel;
    const s = G.run.board[i];
    if (!s) return;
    if (b.statsDirty) b.computeSlotStats();
    const st = b.slotStats[i];
    if (!st) return;
    const reach = UI.reaches(st, i);
    const parts = [`피해 ${fmtK(st.dmg)}`, `${(1 / st.interval).toFixed(1)}회/초`, `사거리 ${Math.round(st.range)}`];
    if (st.crit > 0) parts.push(`치명 ${pct(Math.min(1, st.crit))}`);
    if (st.splash) parts.push(`범위 ${st.splash}`);
    if (st.slow) parts.push(`둔화 ${pct(st.slow)}`);
    if (st.shots > 1) parts.push(`${st.shots}발`);
    const text = parts.join(' · ');
    if (refs.stats.textContent !== text) refs.stats.textContent = text;
    const dps = reach ? `DPS ${fmtK(st.dps * s.n)}` : 'DPS 0';
    if (refs.dps && refs.dps.textContent !== dps) refs.dps.textContent = dps;
    if (refs.dps && refs.reach !== reach) {
      refs.reach = reach;
      refs.dps.classList.toggle('bad', !reach);
      refs.desc.classList.toggle('bad', !reach);
      refs.desc.textContent = reach ? refs.baseDesc : '사거리가 길에 닿지 않아요 · 끌어서 바깥 칸으로 옮기세요';
    }
    if (refs.sell && !refs.sell.classList.contains('arm')) {
      const t = `판매 +${UI.sellValueAt(b, i)}`;
      if (refs.sell.textContent !== t) refs.sell.textContent = t;
    }
  };

  UI.renderItems = function () {
    const G = UI.G;
    const bar = $('#itembar');
    bar.innerHTML = '';
    const run = G.run;
    const b = G.battle;
    const slots = RS.itemSlots(run);
    // 칸이 많으면(보급 허리띠·연금 솥·별) 칸과 버튼을 조금 줄인다
    UI.itemTight = slots + (b && b.ab ? 2 : 0) >= 6;
    bar.classList.toggle('tight', UI.itemTight);
    for (let k = 0; k < slots; k++) {
      const id = run.items[k];
      if (id) {
        const it = RS.ITEM[id];
        bar.appendChild(h('button', {
          class: 'islot',
          'aria-label': it.name,
          onclick() {
            RS.sfx('click');
            UI.setPanel('item', { idx: k });
          },
        }, icon(it.icon, '', 3)));
      } else {
        bar.appendChild(h('button', {
          class: 'islot empty',
          'aria-label': '빈 소모품 칸',
          onclick(e) {
            UI.tip(e.currentTarget, '소모품 칸', '상점·보상에서 얻은 소모품(폭탄·얼음 등)을 전투 중에 눌러 씁니다.');
          },
        }));
      }
    }
    bar.appendChild(h('div', { class: 'spacer' }));
    UI.abBtn = null;
    if (b && b.ab) {
      // 지휘관 고유 능력 (별똥별 · 방패 돌진 · 원소 전환)
      const def = b.ab.def;
      UI.abBtn = btn(UI.abLabel(b), () => {
        const bb = G.battle;
        if (!bb || !bb.useAbility()) {
          RS.sfx('error');
          UI.toast((bb && bb.abilityBlock()) || '지금은 쓸 수 없어요', 'warn');
          return;
        }
        RS.sfx(bb.ab.id === 'star' ? 'bomb' : bb.ab.id === 'charge' ? 'big' : bb.ab.stance === 'ice' ? 'freeze' : 'bomb');
        UI.updateHud(true);
      }, `sm star ab-${b.ab.id}`);
      UI.abBtn.setAttribute('aria-label', def.name);
      bar.appendChild(UI.abBtn);
    }
    UI.mergeAllBtn = btn(UI.itemTight ? '합성' : '모두 합성', () => UI.doMergeAll(), 'sm mall off');
    UI.mergeAllBtn.setAttribute('aria-label', '모두 합성');
    bar.appendChild(UI.mergeAllBtn);
    // 칸이 많으면 '빌드'는 뺀다 (일시정지 메뉴에 있다)
    if (slots <= 3 && !(b && b.ab)) bar.appendChild(btn('빌드', () => UI.openBuild(), 'sm'));
  };

  const setText = (el, key, v) => {
    if (UI.hudCache[key] !== v) {
      UI.hudCache[key] = v;
      el.textContent = v;
    }
  };
  const setCls = (el, key, cls, on) => {
    if (UI.hudCache[key] !== on) {
      UI.hudCache[key] = on;
      el.classList.toggle(cls, on);
    }
  };

  UI.updateHud = function (force) {
    const G = UI.G;
    const b = G.battle;
    const run = G.run;
    if (!b || !run) return;
    if (force || !UI.hudCache) UI.hudCache = {};
    const c = UI.hudCache;
    const blind = !!b.M.blindfold;
    setText($('#h-life-v'), 'life', String(Math.ceil(run.life)));
    setText($('#h-life-m'), 'lifeM', '/' + run.maxLife);
    // 좁은 화면(360px 이하)에서는 네 자리부터 줄여 쓴다
    setText($('#h-gold-v'), 'gold', run.gold >= (window.innerWidth <= 360 ? 1000 : 10000) ? fmtK(run.gold) : fmt(run.gold));
    const cap = RS.interestCap(b.M);
    const inter = Math.min(cap, Math.floor(run.gold / RS.BAL.interestPer));
    setText($('#h-foe-v'), 'foe', String(b.enemies.length));
    setText($('#h-foe-m'), 'foeM', '/' + b.cap);
    setCls($('#h-foe'), 'danger', 'danger', b.enemies.length >= b.cap * 0.7);
    setCls($('#h-life'), 'low', 'danger', run.life <= run.maxLife * 0.3);
    const inj = run.injury || 0;
    const injEl = $('#h-inj');
    if (injEl) {
      setAttrHidden(injEl, 'injh', !inj);
      // 퍼센트는 이번 전투에 실제로 걸린 값 (이번에 맞은 상처는 다음 전투부터 — 설명 칸에)
      const applied = injApplied(b);
      if (inj) setText(injEl, 'inj', `상처 ${inj}${applied > 0 ? ` (−${applied}%)` : ''}`);
    }
    const nW = b.stage.waves.length;
    const tl = b.prep > 0 ? null : trialLeft(b);
    if (b.prep > 0) {
      setText($('#h-wave-v'), 'wv', '준비');
      setText($('#h-wave-t'), 'wt', blind ? '?' : `${Math.ceil(b.prep)}초`);
    } else if (tl != null) {
      setText($('#h-wave-v'), 'wv', '시험');
      setText($('#h-wave-t'), 'wt', `${Math.max(0, Math.ceil(tl))}초`);
    } else {
      setText($('#h-wave-v'), 'wv', `${b.waveIdx}/${nW}`);
      setText($('#h-wave-t'), 'wt', b.waveIdx < nW ? (blind ? '?' : `${Math.max(0, Math.ceil(b.waveT))}초`) : '마지막');
    }
    setCls($('#h-wave'), 'urgent', 'urgent', tl != null && tl <= 10);
    const cost = b.summonCost();
    setText($('#summon-cost'), 'cost', b.summonLimit() <= 0 ? '제한' : `${cost}G`);
    setCls($('#b-summon'), 'canS', 'off', !(run.gold >= cost && b.summonLimit() > 0));
    setText($('#b-speed'), 'spd', `x${G.speed}`);
    if (UI.abBtn && b.ab) {
      setText(UI.abBtn, 'ab', UI.abLabel(b));
      setCls(UI.abBtn, 'abOn', 'off', !b.canUseAbility());
      // 지금 쓰면 준비 중인 강타를 끊을 수 있다: 금빛으로 반짝
      setCls(UI.abBtn, 'abBrk', 'brk', b.abilityBreaksStrike());
      if (b.ab.id === 'stance') setCls(UI.abBtn, 'abIce', 'ice', b.ab.stance === 'ice');
    }
    // 합성 가능한 칸 수 + 길에 닿지 않는 칸 (0.1초마다 20칸)
    let mergeable = 0;
    if (b.statsDirty) b.computeSlotStats();
    const R = G.renderer;
    const noReach = R && (R.noReach || (R.noReach = new Uint8Array(F.SIZE)));
    for (let i = 0; i < F.SIZE; i++) {
      const s = run.board[i];
      if (s && RS.canMerge(run.board, i)) mergeable++;
      if (noReach) noReach[i] = s && b.slotStats[i] && !UI.reaches(b.slotStats[i], i) ? 1 : 0;
    }
    if (UI.mergeAllBtn) {
      setText(UI.mergeAllBtn, 'mall', `${UI.itemTight ? '합성' : '모두 합성'}${mergeable ? ' ' + mergeable : ''}`);
      if (c.mallOn !== mergeable > 0) {
        c.mallOn = mergeable > 0;
        UI.mergeAllBtn.classList.toggle('gold', mergeable > 0);
        UI.mergeAllBtn.classList.toggle('off', !mergeable);
      }
    }
    // 보스
    updateBossBar(b, c, blind);
    updateStrikeBar(b, c);
    // 패널
    const refs = UI.panelRefs || {};
    if (UI.panelMode === 'idle' && refs.dps) {
      setText(refs.dps, 'pdps', fmtK(UI.effDps(b)));
      setText(refs.units, 'punits', `${RS.boardUnitCount(run.board)}/60`);
      if (b.M.summonCap) setText(refs.int, 'pint', `${b.summonLimit()}회`);
      else setText(refs.int, 'pint', inter > 0 ? `+${inter + (b.M.interestBonus || 0)}G` : '10G당 1');
    } else if (UI.panelMode === 'unit') {
      if (!run.board[UI.sel]) UI.select(-1);
      else if (unitSig(run, UI.sel) !== UI.panelSig) UI.setPanel('unit');
      else UI.refreshUnitStats();
    } else if (UI.panelMode === 'upgrade' && refs.rows) {
      const step = b.M.upgradeDouble ? 2 : 1;
      for (const cl of RS.CLASSES) {
        const el = refs.rows[cl];
        const lv = run.classLv[cl];
        const cst = b.upgradeCost(cl);
        setText(el.querySelector('.lv'), 'lv' + cl, `Lv ${lv}→${lv + step}`);
        setText(el.querySelector('.cost'), 'uc' + cl, cst ? `${cst}G` : '무료');
        setCls(el, 'uo' + cl, 'off', run.gold < cst);
      }
    }
    UI.coach(b, mergeable);
  };

  function updateBossBar(b, c, blind) {
    const bb = $('#bossbar');
    // 약탈 예고: 보스가 준비 중에 쓰러져도 바로 꺼지도록 보스가 있든 없든 매번 계산한다
    let plw = false;
    for (const o of b.bosses || []) if (!o.dead && o.cast && o.cast.s.k === 'plunder') plw = true;
    setCls($('#h-gold'), 'plw', 'plunder', plw);
    if (b.boss) {
      if (bb.hidden || c.bwait !== false) {
        c.bwait = false;
        bb.classList.remove('wait');
        if (bb.hidden) {
          bb.hidden = false;
          UI.bossReserved = true;
          UI.fitCanvas();
        }
      }
      const alive = b.bosses.filter((x) => !x.dead).length;
      setText($('#boss-name'), 'bname', b.boss.def.name + (alive > 1 ? ` 외 ${alive - 1}` : ''));
      const w = blind ? '100%' : Math.max(0, (b.boss.hp / b.boss.maxHp) * 100).toFixed(1) + '%';
      if (c.bhp !== w) {
        c.bhp = w;
        $('#boss-hp').style.width = w;
      }
      // 보호막은 체력바 위에 하늘색으로 (최대 체력 대비)
      const sh = blind || !(b.boss.shield > 0) ? '0%' : Math.min(100, (b.boss.shield / b.boss.maxHp) * 100).toFixed(1) + '%';
      if (c.bsh !== sh) {
        c.bsh = sh;
        $('#boss-sh').style.width = sh;
      }
      setText($('#boss-t'), 'bt', b.enraged ? '폭주!' : blind ? '??' : `${Math.ceil(b.bossTimer)}초`);
      setCls(bb, 'enr', 'enraged', !!b.enraged);
      const fr = b.boss.hp / b.boss.maxHp;
      const ticks = $('#boss-ticks').children;
      for (let j = 0; j < ticks.length; j++) setCls(ticks[j], 'tk' + j, 'done', fr < parseFloat(ticks[j].style.left) / 100);
      updateCastBar(b, c);
    } else if (!bb.hidden && b.bosses && b.bosses.length) {
      // 보스를 쓰러뜨렸다: 바는 그대로 두어 캔버스 크기가 바뀌지 않게 한다
      setText($('#boss-t'), 'bt', '처치!');
      if (c.bhp !== '0%') {
        c.bhp = '0%';
        $('#boss-hp').style.width = '0%';
      }
      setCls(bb, 'enr', 'enraged', false);
      setCls($('#boss-cast'), 'cnow', 'now', false);
    }
  }

  // 강타 집중 띠: 패널 위에 누가·얼마나·경직이 얼마나 찼는지
  function updateStrikeBar(b, c) {
    const el = $('#strikebar');
    const f = b.strikeFocus ? b.strikeFocus() : null;
    setAttrHidden(el, 'sbh', !f);
    if (!f) return;
    const pre = f.cast.pre;
    setText(el.querySelector('.sb-name'), 'sbn', `${f.def.name} · ${f.cast.s.name} ${Math.max(0, f.cast.t).toFixed(1)}`);
    const loss = RS.strikeLoss(b, f);
    setText(el.querySelector('.sb-dmg'), 'sbd', `생명 -${loss}${RS.strikeInjures(b.run, loss) ? ' · 상처 +1' : ''}`);
    const k = Math.min(1, pre.taken / Math.max(1, pre.need));
    const w = (k * 100).toFixed(0) + '%';
    if (c.sbw !== w) {
      c.sbw = w;
      el.querySelector('.sb-bar i').style.width = w;
    }
    setCls(el.querySelector('.sb-bar'), 'sbhot', 'hot', k > 0.7);
  }
  const setAttrHidden = (el, key, on) => {
    if (UI.hudCache[key] !== on) {
      UI.hudCache[key] = on;
      el.hidden = on;
    }
  };

  // 보스 바 아래 기술 예고: 무엇을·언제 쓰는지 (잠든 동안은 남은 시간)
  const CAST_TXT = {
    glue: '표시된 칸이 느려져요',
    pulse: '모든 유닛이 느려져요',
    shield: '보호막을 둘러요 · 먼저 깨야 체력이 깎여요',
    seal: '보호막 + 표시된 유닛 봉인 · 장막을 깨면 풀려요',
    spawn: '부하를 불러요',
    rally: '모든 적이 빨라져요',
    mend: '체력을 회복해요',
    cross: '붉은 선을 따라 돌진! 지나는 칸 기절',
    shuffle: '같은 색 칸끼리 유닛 자리가 바뀌어요',
    plunder: '골드를 빼앗아요 · 지금 써 버리면 안 뺏겨요!',
    doze: '곧 잠들어요: 멈추고 회복하지만 피해를 더 받아요',
    rift: '표시된 칸이 기절해요',
    submerge: '물속에 숨어 공격을 피해요',
    anchor: '표시된 열이 기절해요',
    strike: '생명을 쳐요 · 체력을 깎거나 기절·빙결로 끊기',
  };
  const CAST_NAME = { rift: '균열', spawn: '소환', glue: '점액' };
  function updateCastBar(b, c) {
    const el = $('#boss-cast');
    const e = b.boss;
    let cast = null;
    let k = '';
    let name = '';
    let txt = '';
    let frac = 0;
    let col = '';
    if (e.dozeT > 0) {
      k = 'dozing';
      name = `깊은 잠 ${e.dozeT.toFixed(1)}`;
      txt = `멈춰서 회복 중 · 지금은 피해를 ${e.dozeCap || 1}배 받아요!`;
      frac = e.dozeT / (e.dozeT0 || 1);
      col = '#9ee06a';
    } else if ((cast = RS.castOf && RS.castOf(e)) && cast.T > 0) {
      k = cast.k;
      name = `${cast.name || CAST_NAME[k] || '기술'} ${Math.max(0, cast.t).toFixed(1)}`;
      txt = CAST_TXT[k] || '';
      const sl = k === 'strike' && cast.pre ? RS.strikeLoss(b, e) : 0;
      if (k === 'strike' && cast.pre) txt = `생명 -${sl}${RS.strikeInjures(b.run, sl) ? '·상처 +1' : ''} · 경직 ${Math.min(99, Math.floor((100 * cast.pre.taken) / Math.max(1, cast.pre.need)))}% (채우면 끊겨요)`;
      frac = 1 - cast.t / cast.T;
      col = RS.CAST_COL[k] || '#ffe46b';
    }
    if (!k) {
      // 쉬는 동안: 다음에 쓸 기술과 남은 시간 (이름 있는 기술만)
      const sk = e.def.skills;
      let best = -1;
      if (sk && e.sk) for (let j = 0; j < sk.length; j++) if (sk[j].name && sk[j].k !== 'blink' && (best < 0 || e.sk[j] < e.sk[best])) best = j;
      if (best >= 0) {
        name = '다음';
        txt = `${sk[best].name} · ${Math.max(0, Math.ceil(e.sk[best]))}초`;
      } else if (e.def.trait) {
        name = '특성';
        txt = e.def.trait;
      }
    }
    setCls(el, 'cidle', 'idle', !k);
    setCls(el, 'cnow', 'now', !!k && k !== 'dozing' && frac > 0.65);
    setText(el.querySelector('b'), 'cn', name);
    setText(el.querySelector('span'), 'ct', txt);
    if (c.ccol !== col) {
      c.ccol = col;
      el.style.setProperty('--cc', col);
    }
    if (!k) return;
    const w = (Math.max(0, Math.min(1, frac)) * 100).toFixed(0) + '%';
    if (c.cw !== w) {
      c.cw = w;
      el.querySelector('i').style.width = w;
    }
  }

  // 전투 이벤트 → 소리·토스트
  // 보스 기술 이름 옆에 붙는 짧은 설명 (전투마다 기술별로 처음 한 번만 띄운다)
  const SKILL_HINT = {
    glue: '표시된 칸의 공격이 곧 느려져요',
    cross: '붉은 선을 따라 곧 보드를 가로질러요! 지나가는 칸의 유닛은 기절, 도착한 사도도 잠시 기절',
    shuffle: '같은 색으로 표시된 칸끼리 곧 유닛 자리가 바뀌어요',
    plunder: '곧 골드를 빼앗아요. 그 전에 소환·강화로 써 버리면 덜 뺏겨요!',
    pulse: '곧 모든 유닛이 잠깐 느려져요',
    shield: '보호막을 두르면 먼저 깨야 체력이 깎여요',
    seal: '보랏빛으로 조준된 유닛이 곧 봉인돼요(높은 등급일수록 잘 걸림, 신화는 면역). 장막을 깨면 풀려요',

  };
  const SKILL_SFX = { strike: 'leak', glue: 'glue', pulse: 'heartbeat', shield: 'shield', spawn: 'boss', rally: 'wave', mend: 'coin', cross: 'charge', shuffle: 'blink', plunder: 'error' };
  UI.onFx = function (ev) {
    switch (ev.k) {
      case 'bossSkill':

        if (b && nm && ev.id !== 'spawn') {

        RS.sfx('doze');

      case 'strike': {

        break;
      case 'unseal':
        RS.sfx('unseal');
        UI.toast(ev.reason === 'break' ? '장막이 깨져 봉인이 풀렸다! 유닛이 다시 싸워요' : '봉인이 저절로 풀렸다', 'good');

      case 'plunder':
        UI.hudFloat($('#h-gold'), `-${ev.g}G`, 'bad');

        if (ev.id === 'stance') UI.toast(ev.stance === 'fire' ? '화염 태세 · 공격이 화상을 남긴다' : '냉기 태세 · 공격이 둔화시킨다', 'good');
        else if (ev.id === 'charge') {
          UI.toast(ev.broke ? '방패 돌진! 강타를 끊었다' : '방패 돌진!', 'good');
          if (ev.heal > 0) UI.hudFloat($('#h-life'), `+${ev.heal}`, 'good');
        } else if (ev.id === 'star') UI.toast('별똥별!', 'good');

      case 'boss':
        RS.sfx('boss');
        RS.bgm('boss', UI.G.run ? UI.G.run.act : 1);
        UI.toast(`${ev.name} 등장!`, 'warn');
        break;
      case 'bossDown':
        RS.sfx('big');
        UI.toast('보스 처치!', 'good');
        break;
      case 'msg':
        UI.toast(ev.text, ev.warn ? 'warn' : '');
        break;
      case 'shot':
        if (RS.sfxAttack) RS.sfxAttack(ev.cls, ev.crit);
        break;
      case 'mythic': {
        if (ev.quiet) break;
        RS.sfx(ev.cls === 'mage' ? 'bomb' : ev.cls === 'frost' ? 'freeze' : ev.cls === 'archer' ? 'rare' : 'big');
        // 전투마다 클래스별로 처음 한 번만 이름을 띄운다
        const b = UI.G.battle;
        if (b) {
          b.mythicSeen = b.mythicSeen || {};
          if (!b.mythicSeen[ev.cls]) {
            b.mythicSeen[ev.cls] = true;
            UI.toast(`신화 스킬 · ${RS.MYTHIC[ev.cls].name}!`, 't4');
          }

      }
      case 'kill':
        RS.sfx(ev.big ? 'big' : 'kill');
        break;
      case 'leak':
        RS.sfx('leak');
        if (ev.v > 0) {
          const el = $('#h-life');
          el.classList.remove('hit');
          void el.offsetWidth;
          el.classList.add('hit');
          clearTimeout(UI.hitTimer);
          UI.hitTimer = setTimeout(() => el.classList.remove('hit'), 300);
          UI.hudFloat(el, '-' + Math.round(ev.v * 10) / 10, 'bad');
          UI.onceTip('escape', '한 바퀴를 돈 일반 적은 균열로 빠져나가며 생명을 1 앗아 가요 (엘리트·보스는 다시 나와 계속 돌아요)');

      case 'summon':

          break;

        RS.sfx('win');
        UI.toast('승리!', 'good');
        break;
      case 'lost':
        RS.bgm(null);
        RS.sfx('lose');
        UI.toast(ev.reason === 'cap' ? '적이 너무 많습니다!' : '생명이 다했습니다', 'warn');

// ── src/ui/adventure.js ──
// 모험 화면: 맵, 축복, 차원 방랑자, 선택 대기열, 보상, 상점, 이벤트, 휴식처, 보물, 결과
(function (RS) {
  'use strict';

  const UI = RS.UI;
  const { h, append, $, btn, icon, unitImg, fmt, pct } = UI;

  // 긴 이름은 버튼에 들어가도록 줄인다
  const short = (s, n) => (s.length > n ? s.slice(0, n - 1) + '…' : s);

  function bossTimeOf(run, bossId) {
    const M = RS.collectMods(run);
    const def = RS.ENEMY[bossId];
    return RS.BAL.bossTime + (M.bossTimeAdd || 0) + ((def && def.bossTimeAdd) || 0);
  }

  // ── 맵 ──
  UI.showMap = function () {
    const G = UI.G;
    const run = G.run;
    UI.rewardSel = null;
    UI.shopSel = null;
    UI.restTrain = false;
    UI.mapArmed = null;
    const scr = $('#scr-map');
    scr.innerHTML = '';
    const act = RS.actDef(run);
    const box = h('div', { class: 'mapbox scroll' });
    const wings = RS.wingChoices(run);
    const floors = run.map.floors;
    const nF = floors.length;
    const left = nF - run.floor;
    append(scr, [
      UI.topbar(run, `${run.act}막 · ${act.name}`),
      UI.relicStrip(run),
      box,
      h('p', { class: 'hint' },
        left > 0 ? h('span', { class: 'mapchip' }, left === 1 ? '다음은 보스' : `보스까지 ${left}층`) : null,
        RS.mapTrait(run) ? h('span', { class: 'mapchip trait', onclick: (e) => UI.tip(e.currentTarget, `지형 · ${RS.mapTrait(run).name}`, RS.mapTrait(run).desc) }, RS.mapTrait(run).name) : null,
        '반짝이는 칸을 누르면 설명, 한 번 더 누르면 이동합니다.' + (wings.length ? ` · 점선 칸은 축지 장화로 (${run.relicState.wingBoots.uses}회)` : '')),
    ]);
    UI.show('scr-map');
    const W = RS.MAP_W;
    const avail = RS.nextChoices(run);
    const isAvail = (f, l) => avail.some((c) => c.f === f && c.lane === l);
    const isWing = (f, l) => wings.some((c) => c.f === f && c.lane === l);
    const pad = 46;
    // 층 사이를 넉넉히 벌려 칸 사이 연결선(대각선 포함)이 충분히 보이게
    const H = Math.max(box.clientHeight, nF * 96 + pad * 2);
    const rowH = (H - pad * 2) / nF;
    const inner = h('div', { class: 'mapinner', style: `height:${H}px` });
    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('class', 'maplines');
    svg.setAttribute('width', '100%');
    svg.setAttribute('height', String(H));
    const laneX = (l) => 10 + l * (80 / (W - 1));
    const rowY = (f) => Math.round(pad + (nF - f) * rowH + rowH / 2 - 8);
    // 지금 갈 수 있는 칸에서 이어지는 모든 칸 (앞으로 탈 수 있는 길)
    const reach = new Set();
    const stack = avail.map((c) => [c.f, c.lane]);
    while (stack.length) {
      const [f, l] = stack.pop();
      const k = f + ':' + l;
      if (reach.has(k)) continue;
      reach.add(k);
      const n = f <= nF && floors[f - 1][l];
      if (n) for (const nl of n.next) if (f < nF) stack.push([f + 1, nl]);
    }
    const addLine = (x1, y1, x2, y2, cls) => {
      const line = document.createElementNS(svgNS, 'line');
      line.setAttribute('x1', x1 + '%');
      line.setAttribute('y1', String(y1));
      line.setAttribute('x2', x2 + '%');
      line.setAttribute('y2', String(y2));
      line.setAttribute('class', cls);
      svg.appendChild(line);
    };
    const edges = [];
    for (let f = 1; f < nF; f++) {
      for (let l = 0; l < W; l++) {
        const n = floors[f - 1][l];
        if (!n) continue;
        for (const nl of n.next) {
          const target = floors[f][nl];
          let cls = 'ln far';
          if (n.visited && target && target.visited) cls = 'ln done';
          else if (f === run.floor && l === run.lane) cls = 'ln open';
          else if (reach.has(f + ':' + l) && reach.has(f + 1 + ':' + nl)) cls = 'ln reach';
          edges.push([laneX(l), rowY(f), laneX(nl), rowY(f + 1), cls]);
        }
      }
    }
    // 흐린 길 → 갈 수 있는 길 → 지나온 길·다음 길 순서로 그려 밝은 선이 위에 오게
    const order = { 'ln far': 0, 'ln reach': 1, 'ln done': 2, 'ln open': 3 };
    edges.sort((a, b) => order[a[4]] - order[b[4]]);
    for (const e of edges) addLine(e[0], e[1], e[2], e[3], 'lnb ' + e[4].slice(3));
    for (const e of edges) addLine(...e);
    inner.appendChild(svg);
    const bossDef = RS.ENEMY[act.boss];
    for (let f = 1; f <= nF; f++) {
      for (let l = 0; l < W; l++) {
        const n = floors[f - 1][l];
        if (!n) continue;
        const shown = n.resolved || n.type;
        const info = RS.NODE_INFO[shown] || RS.NODE_INFO.combat;
        const here = f === run.floor && l === run.lane;
        const can = isAvail(f, l);
        const wing = !can && isWing(f, l);
        const far = !n.visited && !here && !wing && !reach.has(f + ':' + l);
        const isBoss = n.type === 'boss';
        let label = n.type === 'unknown' ? (n.resolved ? `?·${RS.NODE_INFO[n.resolved].name}` : null) : info.name;
        if (isBoss && bossDef) label = bossDef.name;
        const title = n.type === 'unknown' ? '? (미지)' : isBoss && bossDef ? `보스 · ${bossDef.name}` : info.name;
        const key = f + ':' + l;
        const enter = () => {
          UI.mapArmed = null;
          UI.hideTip();
          RS.sfx('click');
          G.enterNode(f, l, wing);
        };
        const nodeIcon = isBoss && bossDef
          ? h('img', { class: 'ic', src: RS.iconURL(act.boss, 3), alt: '' })
          : icon(n.type === 'unknown' && !n.resolved ? 'n_event' : info.icon, '', 3);
        inner.appendChild(h('button', {
          class: `node t-${n.type}${n.visited ? ' visited' : ''}${here ? ' here' : ''}${can ? ' avail' : ''}${wing ? ' wing' : ''}${far ? ' far' : ''}`,
          style: `left:${laneX(l)}%;top:${rowY(f)}px`,
          'aria-label': label || '?',
          onclick(e) {
            if (can || wing) {
              // 첫 탭은 설명, 같은 칸을 한 번 더 누르면 이동
              // (지금 떠 있는 툴팁이 이 칸의 설명일 때만, 너무 빠른 연타는 무시)
              const tipEl = $('#tip');
              const now = typeof performance !== 'undefined' ? performance.now() : Date.now();
              if (UI.mapArmed === key && !tipEl.hidden && tipEl.dataset.owner === key) {
                if (now - (UI.mapArmedAt || 0) < 350) return;
                return enter();
              }
              UI.mapArmed = key;
              UI.mapArmedAt = now;
              for (const el of inner.querySelectorAll('.node.armed')) el.classList.remove('armed');
              e.currentTarget.classList.add('armed');
              RS.sfx('click');
              UI.tip(e.currentTarget, title, nodeDesc(n, run), wing ? '축지 장화를 한 번 씁니다' : null, { label: '여기로 이동', onClick: enter });
              tipEl.dataset.owner = key;
            } else {
              UI.mapArmed = null;
              for (const el of inner.querySelectorAll('.node.armed')) el.classList.remove('armed');
              UI.tip(e.currentTarget, title, nodeDesc(n, run));
            }
          },
        }, nodeIcon,
        n.burning ? h('span', { class: 'burn' }, icon('flameE', '', 3)) : null,
        label ? h('span', { class: 'nlabel' }, label) : null));
      }
    }
    box.appendChild(inner);
    const targetY = rowY(Math.min(nF, run.floor + 1));
    box.scrollTop = Math.max(0, targetY - box.clientHeight * 0.55);
  };

  function nodeDesc(n, run) {
    if (n.burning) return '성난 엘리트. 무작위 강화를 받은 엘리트가 나온다. ' + (run.keys && run.keys.emerald ? '이기면 유물과 추가 골드 (초록 봉인석은 이미 있다).' : '이기면 유물과 함께 초록 봉인석.');
    if (n.type === 'boss') {
      const act = RS.actDef(run);
      const def = RS.ENEMY[act.boss];
      if (def) return `${def.name} · ${def.trait || '막의 보스'}. 마지막 웨이브에 등장하고, ${bossTimeOf(run, act.boss)}초 안에 못 쓰러뜨리면 폭주합니다 (속도 ×1.8, 잃는 생명 ×2).`;
    }
    return {
      combat: '적 웨이브 3개. 이기면 골드와 증강 선택.',
      elite: '마지막 웨이브에 엘리트 등장. 위험하지만 좋은 증강과 유물을 준다.',
      unknown: '들어가 봐야 안다. 대개 이벤트지만 전투·상점·보물일 수도 있다. 이벤트가 나올수록 다른 것이 나올 확률이 오른다.',
      shop: '유물·증강·소모품·용병을 사고, 증강·저주를 없애거나 룬을 새긴다.',
      rest: '회복하거나 수련·연마한다. 붉은 봉인석을 회수할 수도 있다.',
      treasure: '유물이 든 상자. 푸른 봉인석을 대신 가져갈 수도 있다.',
      boss: '막의 보스. 제한 시간 안에 쓰러뜨리세요.',
    }[n.type];
  }

  // ── 시작의 축복 (별점술사): 고른 뒤 확정 ──

  // ── 막 시작 (+ 차원 방랑자): 고른 뒤 확정 ──
