  // ── 선택 대기열 (증강 고르기·제거·연마·룬 등) ──
  // 유료 서비스(상점 제거·룬, 유료 이벤트)는 취소하면 환불한다
  function refundOf(item) {
    if (item.undo) {
      const u = item.undo;
      const v = u.price != null ? u.price : u.gold != null ? u.gold : u.item && u.item.price;
      return typeof v === 'number' ? v : 0;
    }
    if (typeof item.refund === 'number') return item.refund;
    if (item.refund && typeof item.refund === 'object') return item.refund.gold || 0;
    return 0;
  }
  UI.cancelQueued = function (run, item) {
    let res = null;
    if (typeof RS.cancelChoice === 'function') {
      try {
        res = RS.cancelChoice(run, item);
      } catch (err) {
        res = null;
      }
    }
    if (res && res.text) UI.toast(res.text, 'good');
    else if (res && res.refund > 0) UI.toast(`환불했어요 (+${res.refund}G)`, 'good');
    return res;
  };

  UI.showChoice = function () {
    const G = UI.G;
    const run = G.run;
    const item = run.queue[0];
    if (!item) return G.finishChoice();
    const sel = UI.choiceSel;
    const done = () => {
      UI.choiceSel = null;
      G.finishChoice();
    };
    const pickSel = (v) => {
      UI.choiceSel = v;
      UI.keepScroll = true;
      UI.showChoice();
    };
    const title = item.title || '선택';
    const cancel = () => {
      UI.cancelQueued(run, item);
      done();
    };
    const paid = !!(item.undo || item.refund || item.refundLife || item.undoCurse || item.undoKarma || item.undoCharm);
    // 취소 버튼: 유료면 '구매 취소 (+NG)', 고를 대상이 없으면 '계속', 그 밖에는 확인을 거친다
    const cancelBtn = (label, hasTargets) => {
      if (paid) {
        const amt = refundOf(item);
        return btn(amt > 0 ? `구매 취소 (+${amt}G)` : '취소하고 되돌리기', cancel, hasTargets ? 'sm' : 'gold grow');
      }
      if (!hasTargets) return btn('계속', cancel, 'gold grow');
      return btn(label, () => UI.confirm('그만둘까요?', `[${title}] 효과를 쓰지 않고 넘어갑니다. 되돌릴 수 없어요.`, label, cancel), 'sm');
    };
    const confirmBtn = (label, onOk, disabled) => btn(label, (e) => {
      e.currentTarget.disabled = true;
      onOk();
    }, 'gold grow', disabled);
    let body;
    let footer;
    switch (item.k) {
      case 'aug':
      case 'augList': {
        if (!item.ids) {
          if (typeof RS.choiceAugIds === 'function') RS.choiceAugIds(run, item);
          else item.ids = RS.rollAugments(run, item.n || RS.augChoiceCount(run), item.w);
          G.save();
        }
        const ok = item.ids.indexOf(sel) >= 0 ? sel : null;
        const left = item.left || 1;
        const has = item.ids.length > 0;
        body = h('div', null, h('h2', null, left > 1 ? `증강을 고르세요 (${left}개 더)` : '증강을 하나 고르세요'), h('div', { class: 'cards' }, item.ids.map((id) => UI.augCard(id, ok === id, () => pickSel(id)))));
        footer = [cancelBtn(left > 1 ? '그만 고르기' : '건너뛰기', has)];
        // 운명의 주사위: 대기열 증강 선택도 새로고침할 수 있다
        if (has && item.rerolls > 0 && typeof RS.choiceReroll === 'function') {
          footer.push(btn(`새로고침 ${item.rerolls}`, () => {
            RS.choiceReroll(run, item);
            UI.choiceSel = null;
            G.save();
            UI.showChoice();
          }, 'sm'));
        }
        if (has) {
          footer.push(confirmBtn(ok ? `${short(RS.augDef(ok).name, 12)} 선택` : '카드를 누르세요', () => {
            RS.pickAugment(run, ok);
            RS.sfx('upgrade');
            // 치즈 방처럼 여러 개를 고르는 목록은 남은 횟수만큼 다시 보여 준다
            if (left > 1) {
              item.left = left - 1;
              item.ids = item.ids.filter((x) => x !== ok);
              UI.choiceSel = null;
              G.save();
              UI.showChoice();
              return;
            }
            done();
          }, !ok));
        }
        break;
      }
      case 'relicList': {
        const ok = item.ids.indexOf(sel) >= 0 ? sel : null;
        body = h('div', { class: 'cards' }, item.ids.map((id) => UI.relicCard(id, ok === id, () => pickSel(id))));
        footer = [item.ids.length
          ? confirmBtn(ok ? `${short(RS.REL[ok].name, 12)} 가져가기` : '유물을 누르세요', () => {
            RS.addRelic(run, ok);
            done();
          }, !ok)
          : btn('계속', cancel, 'gold grow')];
        break;
      }
      case 'remove': {
        const rows = [];
        run.augments.forEach((id, i) => rows.push({ key: 'a' + i, el: UI.augCard(id, sel === 'a' + i, () => pickSel('a' + i)) }));
        run.curses.forEach((id, i) => {
          const c = RS.CURSE[id];
          if (c.permanent) return;
          rows.push({ key: 'c' + i, el: h('button', { class: `card curse${sel === 'c' + i ? ' sel' : ''}`, onclick() { pickSel('c' + i); } }, icon('curse', 'cic', 4), h('div', { class: 'cbody' }, h('div', { class: 'ctop' }, h('span', { class: 'rar' }, '저주'), h('b', null, c.name)), h('p', null, c.desc))) });
        });
        const ok = typeof sel === 'string' && rows.some((r) => r.key === sel) ? sel : null;
        body = h('div', null, h('h2', null, rows.length ? '없앨 것을 고르세요 (저주가 위에 있어요)' : '없앨 수 있는 것이 없습니다.'), h('div', { class: 'cards' }, rows.filter((r) => r.key[0] === 'c').map((r) => r.el), rows.filter((r) => r.key[0] === 'a').map((r) => r.el)));
        footer = [cancelBtn('그만두기', rows.length > 0)];
        if (rows.length) {
          footer.push(confirmBtn(ok ? '없애기' : '고르세요', () => {
            if (ok[0] === 'a') RS.removeAug(run, +ok.slice(1));
            else run.curses.splice(+ok.slice(1), 1);
            RS.sfx('coin');
            done();
          }, !ok));
        }
        break;
      }
      case 'upgrade':
      case 'transform': {
        const up = item.k === 'upgrade';
        const list = h('div', { class: 'cards' });
        const valid = [];
        run.augments.forEach((id, i) => {
          if (up ? !RS.canUpgradeAug(id) : !!RS.augDef(id).onPick) return;
          valid.push(i);
          list.appendChild(UI.augCard(id, sel === i, () => pickSel(i), up ? UI.upgradeView(id) : null));
        });
        const ok = valid.indexOf(sel) >= 0 ? sel : null;
        body = h('div', null, h('h2', null, up ? '연마할 증강을 고르세요 (이로운 효과 ×1.5)' : '다른 증강으로 바꿀 증강을 고르세요 (같은 등급)'), valid.length ? list : h('p', { class: 'dim center' }, '고를 수 있는 증강이 없습니다.'));
        footer = [cancelBtn('그만두기', valid.length > 0)];
        if (valid.length) {
          footer.push(confirmBtn(ok != null ? (up ? '연마하기' : '바꾸기') : '고르세요', () => {
            if (up) RS.upgradeAug(run, ok);
            else {
              const nid = RS.transformAug(run, ok);
              if (nid) UI.toast(`[${RS.AUG[nid].name}]이(가) 되었다!`, 'good');
            }
            RS.sfx('upgrade');
            done();
          }, ok == null));
        }
        break;
      }
      case 'runeChoice':
      case 'rune': {
        const runeId = item.rune;
        if (item.k === 'runeChoice' && !runeId) {
          body = h('div', null, h('h2', null, '새길 룬을 고르세요'), h('div', { class: 'options' }, item.runes.map((rid) => {
            const r = RS.RUNE[rid];
            return h('button', { class: 'btn option', style: `--rune:${r.color}`, onclick() { item.rune = rid; RS.sfx('click'); UI.showChoice(); } }, h('b', { class: 'runename' }, r.name), h('small', null, r.desc));
          })));
          footer = [cancelBtn('그만두기', item.runes.length > 0)];
          break;
        }
        const r = RS.RUNE[runeId];
        const filter = (i, s, rune) => !rune || rune.bad;
        let any = false;
        for (let i = 0; i < RS.FIELD.SIZE; i++) {
          const rr = run.runes[i] ? RS.RUNE[run.runes[i]] : null;
          if (filter(i, run.board[i], rr)) any = true;
        }
        const ok = typeof sel === 'number' ? sel : null;
        body = h('div', null,
          h('h2', null, `${r.name}을(를) 새길 칸을 고르세요`),
          h('p', { class: 'dim center' }, r.desc + ' · 룬은 칸에 남아 그 자리에 선 유닛에게 적용됩니다'),
          UI.boardPicker(run, { selected: ok, filter, onPick: (i) => pickSel(i) }),
        );
        footer = [cancelBtn('그만두기', any)];
        if (any) {
          footer.push(confirmBtn(ok != null ? '여기에 새기기' : '칸을 고르세요', () => {
            RS.setRune(run, ok, runeId);
            RS.sfx('upgrade');
            done();
          }, ok == null));
        }
        break;
      }
      case 'unit': {
        const op = item.op;
        const maxTier = item.maxTier == null ? 3 : item.maxTier;
        const desc = { dup: '복제할 유닛을 고르세요 (같은 칸에 1기 추가, 칸이 차면 다른 칸)', sacrifice: '도깨비 화롯불에 바칠 유닛 1기를 고르세요' }[op] || '유닛을 고르세요';
        const filter = (i, s) => !!s && s.tier <= maxTier;
        const any = run.board.some((s, i) => filter(i, s));
        const ok = typeof sel === 'number' && filter(sel, run.board[sel]) ? sel : null;
        body = h('div', null, h('h2', null, any ? desc : '고를 수 있는 유닛이 없습니다.'), UI.boardPicker(run, { selected: ok, filter, onPick: (i) => pickSel(i) }));
        footer = [cancelBtn('그만두기', any)];
        if (any) {
          footer.push(confirmBtn(ok != null ? '결정' : '칸을 고르세요', () => {
            const s = run.board[ok];
            const snap = UI.snapGains(run);
            let msg = null;
            if (op === 'dup') {

              else UI.toast(`${RS.TIER[s.tier].name} ${RS.CLASS[s.cls].name} 복제!`, 't' + s.tier);
            } else if (op === 'sacrifice') {
              msg = RS.sacrificeUnit(run, ok);
            }

            RS.sfx('upgrade');
            done();
            if (msg) UI.showGains('도깨비 화롯불', gains, null, msg);
          }, ok == null));
        }
        break;
      }
      default:
        return done();
    }
    // 뒤로: 이 고르기를 부른 선택 직전으로 돌아가 다른 것을 고를 수 있다 (유료 구매는 '구매 취소'가 대신한다)
    if (G.canGoBack() && !paid) {
      footer = [btn('← 뒤로', () => {
        RS.sfx('click');
        UI.choiceSel = null;
        G.goBack();
      }, 'sm back')].concat(footer || []);
    }
    UI.page(title, null, body, footer);
  };

  function skipGoldOf(run) {
    if (typeof RS.skipGoldAmount === 'function') return RS.skipGoldAmount(run);
    const M = RS.collectMods(run);
    return RS.BAL.skipGold[Math.min(3, run.act)] * (1 + (M.skipGoldMul || 0));
  }

  // ── 보상 ──
  UI.showReward = function () {
    const G = UI.G;
    const run = G.run;
    const r = run.pending.reward;
    const offered = !r.augDone ? r.aug : r.relics || [];

      RS.eventOptions(run).forEach((o, i) => {

        if (ok) anyOn = true;

        const desc = RS.optionDesc(run, o);
        opts.appendChild(h('button', {
          class: 'btn option' + (UI.curseRefs(desc) ? ' cursed' : ''),
          disabled: !ok,
          onclick() {
            // 저주가 걸린 선택지는 저주를 먼저 보여 주고 한 번 더 묻는다

            }
            choose();
          },
        }, h('b', null, label), h('small', null, desc)));
        function choose() {
          {
            // 한 번 고르면 다시 그릴 때까지 모든 선택지를 잠근다
            UI.lockAll(opts);

            const snap = UI.snapGains(run);
            const pend = run.pending;

            if (run.phase !== 'event') G.route();
            else UI.showEvent();

  // ── 지휘관 선택 + 심연 ──
  UI.showCommanders = function () {
    const G = UI.G;
    RS.bgm('title');
    const meta = G.meta;
    const scr = $('#scr-page');
    const prev = scr.querySelector('.page');
    const keep = UI.keepScroll && prev && UI.current === 'scr-page' && scr.dataset.view === 'cmd' ? prev.scrollTop : 0;
    const selOnly = !!UI.keepScroll && UI.current === 'scr-page' && scr.dataset.view === 'cmd';
    UI.keepScroll = false;
    scr.innerHTML = '';
    scr.dataset.view = 'cmd';
    const unlocked = RS.COMMANDERS.filter((c) => RS.commanderUnlocked(c, meta));
    if (!UI.pickCmd || !unlocked.some((c) => c.id === UI.pickCmd)) UI.pickCmd = unlocked[0].id;
    const maxAsc = meta.maxAsc || 0;
    UI.pickAsc = Math.min(UI.pickAsc || 0, maxAsc);
    const list = h('div', { class: 'cards' }, RS.COMMANDERS.map((c) => {
      const ok = RS.commanderUnlocked(c, meta);
      const rel = RS.REL[c.relic];
      return h('button', {
        class: `card cmd${UI.pickCmd === c.id ? ' sel' : ''}${ok ? '' : ' locked'}`,
        disabled: !ok,
        onclick() {
          RS.sfx('click');
          UI.pickCmd = c.id;
          UI.keepScroll = true;
          UI.showCommanders();
        },
      }, h('div', { class: 'cic uwrap' }, unitImg(c.portrait[0], c.portrait[1])),
      h('div', { class: 'cbody' },
        h('div', { class: 'ctop' }, h('span', { class: 'rar' }, c.title), h('b', null, c.name)),
        h('p', null, ok ? c.desc : c.unlock.text),
        ok ? h('p', { class: 'good small' }, `고유 능력 [${RS.ABILITY[c.ability].name}] ${RS.ABILITY[c.ability].desc}. ${RS.ABILITY[c.ability].gain}`) : null,
        ok ? h('p', { class: 'dim small' }, `시작 유물 · ${rel.name}: ${rel.desc} · 전용 증강 ${RS.AUGMENTS.filter((a) => a.cmd === c.id).length}개`) : null,
      ));
    }));
    const setAsc = (v) => {
      UI.pickAsc = Math.max(0, Math.min(maxAsc, v));
      UI.keepScroll = true;
      UI.showCommanders();
    };
    const ascBox = h('div', { class: 'ascbox' },
      h('p', { class: 'dim small' }, maxAsc ? `심연 ${UI.pickAsc} · 클리어할 때마다 다음 단계가 열립니다. 높은 단계는 아래 효과를 모두 포함` : '한 번 클리어하면 심연(추가 난이도)이 열립니다'),
      UI.pickAsc > 0 ? h('ol', { class: 'asclist' }, RS.ASCENSION.slice(1, UI.pickAsc + 1).map((t) => h('li', null, t))) : null,
    );
    const ascCtl = h('div', { class: 'ascctl' + (maxAsc ? '' : ' off') },
      btn('−', () => setAsc(UI.pickAsc - 1), 'sm', !maxAsc || UI.pickAsc <= 0),
      h('b', null, `심연 ${UI.pickAsc}`),
      btn('+', () => setAsc(UI.pickAsc + 1), 'sm', !maxAsc || UI.pickAsc >= maxAsc),
    );
    append(scr, [
      h('div', { class: 'topbar' }, h('div', { class: 'tb-title' }, '지휘관 선택'), btn('뒤로', () => UI.showTitle(), 'sm')),
      h('div', { class: 'page scroll' }, h('p', { class: 'page-sub' }, '지휘관마다 고유 능력(전투 중 버튼)과 전용 증강이 다릅니다. 클래스는 모두 고르게 나와요'), list, ascBox),
      h('div', { class: 'page-foot' }, ascCtl, btn('출발', (e) => {
        e.currentTarget.disabled = true;
        if (G.abandonSaved) G.abandonSaved(); // 저장본이 없으면 아무 일도 없다
        G.newRun(null, { commander: UI.pickCmd, asc: UI.pickAsc });
      }, 'gold grow')),
    ]);
    UI.show('scr-page');
    UI.lockInput(selOnly ? 120 : 300);
    const pg = scr.querySelector('.page');
    pg.scrollTop = keep;
  };

  // ── 빌드 ──
  // 빌드 목록: 희귀도순(높은 것부터) / 얻은 순서 전환. 고른 방식은 기억해 둔다
  UI.buildSort = UI.buildSort || 'rarity';
  function sortable(ids, rank, row) {
    const box = h('div');
    const draw = () => {
      box.innerHTML = '';
      const list = UI.buildSort === 'rarity' ? ids.map((id, i) => ({ id, i })).sort((x, y) => rank(y.id) - rank(x.id) || x.i - y.i).map((x) => x.id) : ids;
      append(box, [
        h('div', { class: 'sortbar' },
          UI.btn('희귀도순', () => { UI.buildSort = 'rarity'; draw(); }, 'sm' + (UI.buildSort === 'rarity' ? ' gold' : '')),
          UI.btn('얻은 순서', () => { UI.buildSort = 'time'; draw(); }, 'sm' + (UI.buildSort === 'time' ? ' gold' : ''))),
        list.map(row),
      ]);
    };
    draw();
    return box;
  }

    const cmd = RS.COMMANDER[run.commander];
    const quests = [];
    if (run.quests.egg) quests.push('용의 알: 휴식처에서 [부화]');
    if (run.quests.spoilsAct) quests.push(`보물 지도: ${run.quests.spoilsAct}막 첫 보물 상자에서 골드 +400`);
    if (run.quests.wongo) quests.push(`퉁퉁 쿠폰: 전투 ${run.quests.wongo.left}번 뒤 유물 3개`);
    UI.modal('빌드', UI.tabs([
      {
        name: `증강 ${run.augments.length}`,
        render: () => (Object.keys(counts).length
          ? sortable(Object.keys(counts), (id) => RS.augDef(id).rarity + (RS.isUpgraded(id) ? 0.5 : 0), (id) => UI.augRow(id, counts[id]))
          : h('p', { class: 'dim' }, '아직 증강이 없습니다. 전투에서 이기면 고를 수 있어요.')),
      },
      {
        name: `유물 ${run.relics.length}`,

      {
        name: '진행',
        render: () => [
          h('p', { class: 'dim' }, `${cmd.title} ${cmd.name} · 심연 ${run.asc} · ${RS.actDef(run).name}`),
          h('div', { class: 'lvgrid' }, RS.CLASSES.map((c) => h('div', { class: 'lvcell' }, unitImg(c, 0), h('b', null, RS.CLASS[c].name), h('span', null, `Lv ${run.classLv[c]} · +${Math.round(run.classLv[c] * RS.BAL.upgradePct * 100)}%`)))),
          run.permDmg ? h('p', null, `단련: 모든 유닛 피해 ×${Math.round((1 + run.permDmg) * 100) / 100}`) : null,

          h('h3', null, '퀘스트'),

          h('h3', null, '저주'),

      { name: '증강', sub: '전투 보상으로 고르는 영구 효과 · 지휘관 전용 증강은 그 지휘관으로 할 때만 나온다', render: () => [

  // ── 연대기 (슬레이 더 스파이어 2의 타임라인처럼 이정표와 해금) ──
  UI.chronicleMiles = function (meta) {
    // 지휘관 해금 보상은 RS.COMMANDERS 의 unlock 조건에서 뽑는다 (지휘관을 바꿔도 연대기가 따라온다)
    const who = (pred) => RS.COMMANDERS.filter((c) => c.unlock && pred(c.unlock)).map((c) => `지휘관 ${c.name}(${c.title})`);
    const rows = [
      { done: meta.runs >= 1, text: '첫 모험을 떠난다', reward: '—' },
      { done: meta.bestAct >= 2, text: '1막 보스를 쓰러뜨린다', reward: who((u) => u.bestAct === 2).join(' · ') },
      { done: meta.bestAct >= 3, text: '2막 보스를 쓰러뜨린다', reward: who((u) => u.bestAct === 3).join(' · ') },
      { done: meta.wins >= 1, text: '3막 보스를 쓰러뜨린다', reward: who((u) => u.wins === 1).concat('심연 1').join(' · ') },
      { done: meta.wins >= 2, text: '두 번 클리어한다', reward: who((u) => u.wins === 2).join(' · ') },
      { done: !!meta.heart, text: '세 봉인석으로 4막 고대신을 잠재운다', reward: '진 엔딩' },
      { done: (meta.maxAsc || 0) >= 10, text: '심연 10에 도전한다', reward: '최고 난이도' },
    ];
    // 보상이 없는 이정표는 뺀다 (첫 모험은 늘 보인다)
    return rows.filter((r, i) => i === 0 || r.reward);
  };

  // ── 도움말 ──
  UI.openHelp = function (onClose) {

    const E = Object.values(RS.ENEMY);
    const god = RS.ENEMY.riftHeart;
    const lapSeq = (x) => [x, x * 2, x * 4, x * 8].join('→');
    const eliteLk = Math.min(...E.filter((d) => d.elite).map((d) => d.leak));
    const bossLk = Math.max(...E.filter((d) => d.boss && d !== god).map((d) => d.leak));
    const lapText = `엘리트 ${lapSeq(eliteLk)}, 보스 ${lapSeq(bossLk)}` + (god ? `, 고대신 ${lapSeq(god.leak)}` : '');
    UI.modal('게임 방법', h('div', { class: 'help' },
      h('ol', null,
        li('소환', '골드로 무작위 유닛을 부릅니다. 같은 유닛은 한 칸에 3기까지 쌓입니다. 소환할수록 비용이 1씩 오릅니다.'),
        li('합성', '같은 칸의 같은 유닛 3기(전설은 4기) → 다음 등급 무작위 유닛 1기. 일반 → 희귀 → 영웅 → 전설 → 신화. 소환으로는 영웅까지 나와요.'),
        li('신화 스킬', RS.CLASSES.map((c) => `${RS.CLASS[c].name} [${RS.MYTHIC[c].name}] ${RS.MYTHIC[c].desc}`).join(' / ')),
        li('배치', '유닛을 끌어서 옮깁니다. 전사·도적은 바깥 칸, 궁수·마법사·서리술사는 점선 안쪽 칸에. 사거리가 길에 닿지 않는 칸에는 빨간 x가 뜹니다. 새로 소환한 유닛은 알맞은 빈칸에 놓이지만, 보스가 뒤섞은 자리는 직접 옮겨야 해요.'),

// 게임 진행 제어: 루프, 저장, 화면 전환, 메타 기록
(function (RS) {
  'use strict';

  const STEP = 1 / 60;
  const MAX_STEPS = 12;
  const SAVE_KEY = 'rs_save_v2';
  const META_KEY = 'rs_meta_v1';
  const SPEED_KEY = 'rs_speed';

  function store(k, v) {
    try {
      if (v == null) localStorage.removeItem(k);
      else localStorage.setItem(k, v);
    } catch (e) {
      /* 개인 정보 보호 모드 등: 저장 없이 진행 */
    }
  }
  function load(k) {
    try {
      return localStorage.getItem(k);
    } catch (e) {
      return null;
    }
  }

  const G = (RS.G = {
    run: null, battle: null, renderer: null,
    speed: 1, paused: false, modalOpen: false, hidden: false,
    meta: { runs: 0, wins: 0, bestAct: 0, bestFloor: 0, maxAsc: 0, wongo: 0, tut: {} },
    rotated: false,
    last: 0, acc: 0, hudT: 0, wake: null,
  });
  const UI = RS.UI;
  UI.G = G;

  function loadMeta() {
    try {
      const m = JSON.parse(load(META_KEY) || 'null');
      if (m) Object.assign(G.meta, m);
    } catch (e) {
      /* 손상된 기록은 무시 */
    }
    if (!G.meta.tut || typeof G.meta.tut !== 'object') G.meta.tut = {};
  }
  G.saveMeta = function () {
    store(META_KEY, JSON.stringify(G.meta));
  };

  function unlockState(m) {
    return { cmds: RS.COMMANDERS.filter((c) => RS.commanderUnlocked(c, m)).map((c) => c.id), asc: m.maxAsc || 0 };
  }
  function unlockMessages(before, m) {
    const out = [];
    for (const c of RS.COMMANDERS) {
      if (RS.commanderUnlocked(c, m) && before.cmds.indexOf(c.id) < 0) out.push(`지휘관 ${c.title} ${c.name}`);
    }
    if ((m.maxAsc || 0) > before.asc) out.push(`심연 ${m.maxAsc}`);
    return out;
  }
  // 클리어 기록: 3막 보스를 쓰러뜨리면(4막에 들어서면) 그 자리에서 센다
  function recordClear(run, m) {
    if (run.clearRecorded) return;
    run.clearRecorded = true;
    m.wins = (m.wins || 0) + 1;
    if (run.asc >= (m.maxAsc || 0)) m.maxAsc = Math.min(RS.MAX_ASC, run.asc + 1);
  }
  // 진행 기록: 새 막에 들어서는 순간 최고 기록과 해금을 남긴다 (모험이 끝나기 전에도)
  function recordProgress(run) {
    const m = G.meta;
    const before = unlockState(m);
    // 4막까지 갔다면 3막을 끝까지 오른 것으로 기록
    const act = Math.min(3, run.act);
    const floor = run.act > 3 ? RS.FLOORS_PER_ACT : run.floor;
    let changed = false;
    if (act > (m.bestAct || 0) || (act === m.bestAct && floor > (m.bestFloor || 0))) {
      m.bestAct = act;
      m.bestFloor = floor;
      changed = true;
    }
    if (run.act >= 4 && !run.clearRecorded) {
      recordClear(run, m);
      changed = true;
    }
    if (changed) G.saveMeta();
    const out = unlockMessages(before, m);
    if (out.length) {
      run.newUnlocks = (run.newUnlocks || []).concat(out);
      for (const u of out) UI.toast('해금 · ' + u, 'good');
    }
    return out;
  }

  // 모험이 끝날 때(또는 버릴 때) 기록하고, 이번 모험에서 새로 열린 것을 돌려준다
  function recordEnd(run, won) {
    const m = G.meta;
    recordProgress(run);
    const before = unlockState(m);
    if (won) recordClear(run, m);
    // 진 엔딩은 심장을 실제로 부쉈을 때만
    if (won && run.act === 4) m.heart = true;
    m.wongo = (m.wongo || 0) + Math.floor((run.stats.wongo || 0) / 10);
    G.saveMeta();
    const out = unlockMessages(before, m);
    if (out.length) run.newUnlocks = (run.newUnlocks || []).concat(out);
    return (run.newUnlocks || []).slice();
  }

  G.savedRun = function () {
    const s = load(SAVE_KEY);
    if (!s) return null;
    try {
      return RS.loadString(s);
    } catch (e) {
      return null;
    }
  };

  G.save = function () {
    const run = G.run;
    if (!run) return;
    if (run.phase === 'over' || run.phase === 'victory') store(SAVE_KEY, null);
    else {
      recordProgress(run);
      store(SAVE_KEY, RS.saveString(run));
    }
  };

  // 저장된 모험을 버리고 새로 시작할 때: 지금까지의 진행은 기록에 남긴다
  G.abandonSaved = function () {
    const run = G.savedRun();
    if (run && !run.recorded) {
      run.recorded = true;
      recordEnd(run, false);
    }
    store(SAVE_KEY, null);
  };

  function resetSelections() {
    UI.optSel = null;
    UI.choiceSel = null;
    UI.rewardSel = null;
    UI.shopSel = null;
    UI.restTrain = false;
    UI.mapArmed = null;
  }

  G.newRun = function (seed, opts) {
    resetSelections();
    G.run = RS.newRun(seed, opts);
    G.meta.runs++;
    G.saveMeta();
    G.save();
    G.route();
  };

  G.continueRun = function () {
    const run = G.savedRun();
    if (!run) return UI.showCommanders();
    resetSelections();
    G.run = run;
    G.route();
  };

  // ── 뒤로가기: 선택지를 고르기 직전 상태를 기억해 두고, 이어지는 고르기 화면에서 되돌린다 ──
  // 난수 상태까지 함께 되돌리므로 같은 선택지를 다시 골라도 결과는 같다
  G.markBack = function () {
    G.backSnap = { str: RS.saveString(G.run) };
  };
  G.canGoBack = () => !!G.backSnap;
  G.goBack = function () {
    const snap = G.backSnap;
    G.backSnap = null;
    const r = snap && RS.loadString(snap.str);
    if (!r) return;
    resetSelections();
    G.run = r;
    G.save();
    G.route();
  };

  G.route = function () {
    const run = G.run;
    releaseWake();
    // 새 칸으로 넘어가거나 전투가 시작되면 되돌릴 수 없다
    if (run.phase !== 'choice' && run.phase !== 'event' && run.phase !== 'rest' && run.phase !== 'neow' && run.phase !== 'actStart') G.backSnap = null;
    // 상황별 배경 음악 (고르기 화면은 이전 곡을 이어 간다)
    const BGM = { neow: 'event', map: 'map', reward: 'map', treasure: 'map', shop: 'shop', event: 'event', rest: 'rest', actStart: 'event', over: 'lose', victory: 'win' };
    if (BGM[run.phase]) RS.bgm(BGM[run.phase], run.act);
    switch (run.phase) {
      case 'neow': UI.showNeow(); break;
      case 'map': UI.showMap(); break;
      case 'battle': G.startBattle(); break;
      case 'reward': UI.showReward(); break;
      case 'shop': UI.showShop(); break;
      case 'event': UI.showEvent(); break;
      case 'rest': UI.showRest(); break;
      case 'treasure': UI.showTreasure(); break;
      case 'actStart': UI.showActStart(); break;
      case 'choice': UI.showChoice(); break;
      case 'over':
      case 'victory': {
        if (!run.recorded) {
          run.recorded = true;
          recordEnd(run, run.phase === 'victory');
        }
        UI.showEnd(run.phase === 'victory', (run.newUnlocks || []).slice());
        break;
      }
    }
  };

  // 진행 한 걸음: 상태를 바꾸고, 쌓인 선택(증강 고르기 등)을 먼저 처리한 뒤 저장
  const step = (fn) => (...args) => {
    fn(...args);
    RS.flushQueue(G.run);
    G.save();
    G.route();
  };

  G.afterNeow = step(() => {
    G.run.phase = 'map';
    G.run.pending = null;
  });
  G.enterNode = step((f, lane, wing) => RS.enterNode(G.run, f, lane, wing));
  G.leaveNode = step(() => {
    // 이벤트 칸을 떠나면 그 선택은 되돌릴 수 없다 (선택이 남긴 제거·연마 등이 남아 있으면 그때까지는 뒤로 가능)
    if (G.run.phase === 'event' && !G.run.queue.length) G.backSnap = null;
    RS.advance(G.run);
  });
  G.afterReward = step(() => {
    if (RS.rewardComplete(G.run)) RS.advance(G.run);
  });
  G.startAct = step(() => {
    G.run.phase = 'map';
    G.run.pending = null;
  });
  G.startEventFight = step(() => RS.startEventFight(G.run));
  G.finishChoice = function () {
    G.backSnap = null; // 하나라도 고르거나 넘기면 그 앞으로는 돌아갈 수 없다
    RS.popQueue(G.run);
    G.save();
    G.route();
  };

  G.startBattle = function () {
    const run = G.run;
    G.battle = new RS.Battle(run, run.pending.stage);
    const stype = run.pending.stage.type;
    RS.bgm(stype === 'boss' ? 'boss' : stype === 'elite' ? 'elite' : 'battle', run.act);
    G.renderer.reset();
    G.renderer.setTheme(RS.actDef(run).theme);
    G.acc = 0;
    G.slow = 1; // 지난 전투의 강타 집중 감속을 넘기지 않는다
    G.paused = false;
    UI.showBattle();
    requestWake();
  };

  G.endBattle = function () {
    const b = G.battle;
    G.battle = null;
    RS.finishBattle(G.run, b);
    G.save();
    G.route();
  };

  // 전투 중 나가면 전투 전 저장본으로 되돌린다
  // 단, 이미 승패가 난 전투(끝맺는 연출 중)는 결과를 확정한다
  G.quitToTitle = function () {
    const b = G.battle;
    if (b && b.result) {
      G.battle = null;
      RS.finishBattle(G.run, b);
      G.save();
      // 모험이 끝났으면 결과 화면으로 (기록도 남긴다)
      if (G.run.phase === 'over' || G.run.phase === 'victory') return G.route();
    }
    G.battle = null;
    G.run = null;
    releaseWake();
    UI.showTitle();
  };

  G.setSpeed = function (s) {
    G.speed = s;
    store(SPEED_KEY, String(s));
    UI.updateHud(true);
  };
  G.setModal = function (open) {
    G.modalOpen = open;
  };

  // 화면 꺼짐 방지: 백그라운드에 다녀오면 브라우저가 풀어 버리므로 다시 잡는다
  function requestWake() {
    try {
      if (navigator.wakeLock && !G.wake) {
        navigator.wakeLock.request('screen').then((w) => {
          if (!G.battle) {
            w.release().catch(() => {});
            return;
          }
          G.wake = w;
          w.addEventListener('release', () => {
            if (G.wake === w) G.wake = null;
          });
        }).catch(() => {});
      }
    } catch (e) {
      /* 지원하지 않으면 무시 */
    }
  }
  function releaseWake() {
    if (G.wake) {
      G.wake.release().catch(() => {});
      G.wake = null;
    }
  }

  // 끝맺는 연출 중인 전투를 바로 끝낸다 (열린 창은 콜백 없이 닫는다)
  function commitDecided() {
    if (G.modalOpen) {
      UI.onModalClose = null;
      UI.closeModal();
    }
    G.endBattle();
  }

  function frame(ts) {
    requestAnimationFrame(frame);
    const dt = G.last ? Math.min(0.1, (ts - G.last) / 1000) : 0;
    G.last = ts;
    const b = G.battle;
    if (!b) return;
    // 가로 회전 안내가 떠 있는 동안에도 멈춘다
    const running = !G.paused && !G.modalOpen && !G.hidden && !G.rotated;
    // 강타 집중: 엘리트·보스가 강타를 준비하는 동안 시간이 느려진다 (유닛을 옮겨 몰아칠 틈)
    const focus = running && b.strikeFocus && b.strikeFocus();
    const want = focus ? RS.FOCUS_SLOW : 1;
    G.slow = G.slow == null ? 1 : G.slow + (want - G.slow) * Math.min(1, dt * (focus ? 10 : 4));
    if (running) {
      G.acc += dt * G.speed * G.slow;
      let steps = 0;
      while (G.acc >= STEP && steps < MAX_STEPS) {
        b.update(STEP);
        G.acc -= STEP;
        steps++;
      }
      if (steps >= MAX_STEPS) G.acc = 0;
      for (let k = 0; k < b.fx.length; k++) UI.onFx(b.fx[k]);
      G.renderer.consume(b);
      G.hudT -= dt;
      if (G.hudT <= 0) {
        G.hudT = 0.1;
        UI.updateHud();
      }
      if (b.status === 'won' || b.status === 'lost') {
        G.endBattle();
        return;
      }
    }
    G.renderer.draw(b, running ? dt * Math.min(G.speed, 2) * G.slow : 0);
  }

  function boot(hotData) {
    RS.bakeSprites();
    RS.bakeDigits();
    G.renderer = new RS.Renderer(document.getElementById('cv'));
    G.renderer.setTheme('forest');
    loadMeta();
    G.speed = Math.min(3, Math.max(1, parseInt(load(SPEED_KEY) || '1', 10) || 1));
    if (hotData && hotData.save && !load(SAVE_KEY)) store(SAVE_KEY, hotData.save);
    UI.initBattle();
    // 두 번 탭 방지: 화면이 막 바뀐 직후의 클릭은 버린다 (전투 조작 버튼·전장은 제외)
    document.addEventListener('click', (e) => {
      if (!UI.inputLocked()) return;
      const t = e.target;
      if (t && t.closest && t.closest('#controls,#itembar,#cv')) return;
      e.preventDefault();
      e.stopImmediatePropagation();
    }, true);
    // 툴팁 바깥을 누르면 닫기 (툴팁을 여는 요소는 자기 onclick 이 다시 그린다)
    const tipEl = document.getElementById('tip');
    document.addEventListener('pointerdown', (e) => {
      if (!tipEl || tipEl.hidden || tipEl.contains(e.target)) return;
      if (e.target.closest && e.target.closest('.chip,.node,.keys,.hud .stat,#bossbar,.islot.empty')) return;
      tipEl.hidden = true;
    }, true);
    // 툴팁 자체를 눌러도 닫힌다 (안의 버튼은 제 할 일을 한 뒤 닫는다)
    tipEl.addEventListener('click', (e) => {
      if (!e.target.closest('button')) tipEl.hidden = true;
    });
    // 스크롤하면 툴팁을 숨긴다 (가리키던 것이 움직이므로)
    document.addEventListener('scroll', () => UI.hideTip(), true);
    // 모달 바깥(어두운 배경)을 누르면 닫기
    const modalEl = document.getElementById('modal');
    modalEl.addEventListener('click', (e) => {
      if (e.target === modalEl) UI.closeModal();
    });
    // iOS 사파리는 touchend·click 안에서만 소리를 깨울 수 있다
    for (const ev of ['pointerdown', 'touchend', 'click']) document.addEventListener(ev, () => RS.unlockAudio(), { passive: true });
    document.addEventListener('visibilitychange', () => {
      G.hidden = document.hidden;
      // 앱을 내리면 음악도 멈춘다 (돌아오면 다음 터치에서 다시)
      if (RS.audioHidden) RS.audioHidden(document.hidden);
      // 승패가 이미 났으면 앱이 백그라운드에서 꺼지기 전에 결과를 확정한다
      if (document.hidden && G.battle && G.battle.result) commitDecided();
      else if (document.hidden && G.battle && !G.modalOpen) UI.openPause();
      if (!document.hidden && G.battle) requestWake();
    });
    // 가로로 돌리면 전투를 멈추고 메뉴를 띄운다
    if (window.matchMedia) {
      const rot = window.matchMedia('(orientation: landscape) and (max-height: 500px)');
      const onRot = () => {
        G.rotated = rot.matches;
        if (rot.matches && G.battle && G.battle.result) commitDecided();
        else if (rot.matches && G.battle && !G.modalOpen) UI.openPause();
      };
      if (rot.addEventListener) rot.addEventListener('change', onRot);
      else if (rot.addListener) rot.addListener(onRot);
      G.rotated = rot.matches;
    }
    UI.showTitle();
    const hot = window.claude && window.claude.hot;
    if (hot && hot.snapshot) {
      try {
        // 전투 중 상태가 아니라 마지막 저장본(전투 전)을 넘긴다
        hot.snapshot(() => ({ save: load(SAVE_KEY) }));
      } catch (e) {
        /* 미리보기 환경 */
      }
    }
    requestAnimationFrame(frame);
  }

  function start() {
    const hot = window.claude && window.claude.hot;
    if (hot && hot.ready) hot.ready(boot);
    else boot((hot && hot.data) || {});
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})((globalThis.RS = globalThis.RS || {}));

</script>
</body>
