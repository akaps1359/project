:root {
  color-scheme: dark;
  --bg: #15111d;
  --bg2: #1c1627;
  --panel: #251d33;
  --panel2: #30264a;
  --line: #0a070f;
  --hi: #4a3d66;
  --text: #f3e9d2;
  --dim: #a797bd;
  --gold: #f5c44a;
  --gold-d: #9c6f22;
  --red: #ef6166;
  --green: #74d86d;
  --blue: #7cc4ff;
  --pink: #f07fb0;
  --t0: #c2c9d3;
  --t1: #5d9bf0;
  --t2: #b273f0;
  --t3: #f5ae3d;
  --t4: #ff6b86;
  --font: 'Galmuri11', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif;
  --px: 0 -2px 0 var(--line), 0 2px 0 var(--line), -2px 0 0 var(--line), 2px 0 0 var(--line);
}

[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--text);
  overscroll-behavior: none;
}
body {
  font: 12px/1.5 var(--font);
  -webkit-text-size-adjust: 100%;
}
#app {
  position: fixed;
  inset: 0;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  display: flex;
  justify-content: center;
  background:
    radial-gradient(120% 60% at 50% 0%, #2a1f3f 0%, rgba(21, 17, 29, 0) 70%),
    var(--bg);
  /* none 이면 iOS 사파리에서 안쪽 스크롤 영역까지 막힌다. 전장 캔버스는 따로 none */
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}
img { max-width: 100%; }
.ic, .uimg, .foe, .boss-preview img {
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}
.ic { width: 24px; height: 24px; display: block; }
.uimg { width: 36px; height: 36px; display: block; }
.uimg.big { width: 48px; height: 48px; }
.scroll { overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.scroll-x { overflow-x: auto; touch-action: pan-x; -webkit-overflow-scrolling: touch; }

.screen {
  width: 100%;
  max-width: 480px;
  height: 100%;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* ── 버튼 ── */
.btn {
  font: inherit;
  color: var(--text);
  background: var(--panel2);
  border: 0;
  border-radius: 0;
  margin: 2px;

}

/* ── 타이틀 ── */
#scr-title { padding: 24px 20px 18px; }
.title-wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; text-align: center; padding-bottom: 4vh; }
.eyebrow { color: var(--pink); letter-spacing: 0.12em; margin: 0 0 8px; font-size: 11px; }
.logo { margin: 0; font-size: 44px; line-height: 1.1; font-weight: normal; }
.logo span { display: block; color: var(--text); text-shadow: 3px 3px 0 var(--line); }
.logo .l2 { color: var(--gold); text-shadow: 3px 3px 0 #6b3f12, 6px 6px 0 var(--line); }
.parade { display: flex; justify-content: center; gap: 4px; margin-top: 26px; }
.parade .uimg { width: 54px; height: 54px; }
.bob { animation: bob 1.2s steps(2) infinite; }
.parade .uimg:nth-child(2n) { animation-delay: 0.3s; }
@keyframes bob { 50% { transform: translateY(-3px); } }
.title-foes { display: flex; justify-content: center; gap: 10px; margin-top: 10px; opacity: 0.85; }

.title-menu { display: flex; flex-direction: column; gap: 10px; }
.title-menu > .btn { width: 100%; }
.record { text-align: center; color: var(--dim); margin: 6px 0 0; }

/* ── 상단 바 ── */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 14px 8px;

}
.tb-title { flex: 1 1 auto; min-width: 0; font-size: 13px; color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-stats { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; }
.tb-stats .btn { flex: 0 0 auto; white-space: nowrap; margin: 0; }
.tb-stats .stat { white-space: nowrap; }
/* 좁은 폰: 긴 제목(막 이름·이벤트 이름)은 두 줄까지 (버튼 높이 안에 들어간다) */
@media (max-width: 420px) {
  .tb-title { white-space: normal; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-height: 1.15; }
}
@media (max-width: 360px) {
  .topbar { padding: 8px 10px 6px; }

}
.stat { display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.stat .ic { width: 18px; height: 18px; }
.strip { display: flex; gap: 6px; padding: 5px 14px; min-height: 50px; background: var(--bg2); box-shadow: 0 2px 0 var(--line); }
.strip.wrap { flex-wrap: wrap; background: none; box-shadow: none; padding: 0; }
.chip { flex: 0 0 auto; width: 40px; height: 40px; padding: 3px; border: 0; background: var(--panel); box-shadow: var(--px); display: grid; place-items: center; }
.chip .ic { width: 27px; height: 27px; }
.card:active, .chip:active, .islot:active, .bcell:active:not(:disabled), .upg:active { transform: translateY(2px); }
.menu-btn { min-width: 40px; font-size: 16px; }
.chip.curse { background: #3a1f3f; }
.chip.item { background: #1f2b3a; }
.chip.aug.r2 { background: #3b3018; }
.chip.aug.r3 { background: #2c2445; }

/* ── 맵 ── */
.mapbox { flex: 1; min-height: 0; position: relative; }
.mapchip.trait { color: var(--gold); cursor: pointer; }
.mapchip { display: inline-block; margin: 0 6px 2px 0; padding: 1px 7px; font-size: 11px; color: var(--pink); background: var(--panel); box-shadow: var(--px); white-space: nowrap; }
.mapinner { position: relative; width: 100%; }
.maplines { position: absolute; inset: 0; pointer-events: none; }
/* 연결선: 어두운 밑줄 위에 색 선을 겹쳐 배경과 구분되게 */
.maplines line { stroke-linecap: round; }
.maplines .lnb { stroke: #0c0912; stroke-width: 7; }
.maplines .lnb.far { stroke-width: 5; opacity: 0.6; }

.maplines .ln.reach { stroke: #a893dc; }
.maplines .ln.done { stroke: var(--gold); opacity: 0.85; }
.maplines .ln.open { stroke: #fff6e6; stroke-width: 4; stroke-dasharray: 8 6; animation: march 0.6s linear infinite; }
@keyframes march { to { stroke-dashoffset: -14; } }
.node {
  position: absolute;
  transform: translate(-50%, -50%);
  width: 48px;
  height: 48px;
  border: 0;
  padding: 0;

}

.node.t-boss { width: 64px; height: 64px; background: #3a1d2c; }
.node.t-boss .ic { width: 40px; height: 40px; }

.node.t-elite { background: #3a2022; }
.node.visited { filter: brightness(0.55); }
.node.far { filter: brightness(0.5) saturate(0.4); }
.node.here { filter: none; box-shadow: var(--px), 0 0 0 4px var(--gold); }
.node.avail { animation: pulse 1s steps(2) infinite; background: var(--panel2); }
.node.avail .nlabel { color: var(--text); }
@keyframes pulse { 50% { box-shadow: var(--px), 0 0 0 4px var(--text); } }
.node:active { transform: translate(-50%, calc(-50% + 2px)); }
.node.armed { animation: none; box-shadow: var(--px), 0 0 0 4px var(--gold); background: var(--panel2); }
.node.armed .nlabel { color: var(--gold); }
.hint { text-align: center; color: var(--dim); margin: 0; padding: 8px 12px 10px; font-size: 11px; }

/* ── 전투 ── */
#scr-battle { gap: 0; }
.hud {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px 8px;
  background: var(--bg2);
  box-shadow: 0 2px 0 var(--line);
  z-index: 2;
}
.hud .stat { position: relative; flex: 1; min-width: 0; justify-content: center; background: var(--panel); box-shadow: var(--px); height: 30px; margin: 2px; padding: 0 4px; white-space: nowrap; font: inherit; color: var(--text); border: 0; cursor: pointer; touch-action: manipulation; }
.hud .stat .ic { flex: 0 0 auto; }
.hud .stat b { font-weight: normal; font-size: 13px; min-width: 0; overflow: hidden; }
/* 생명·적 수: 현재 값은 크게, 최대치는 작게 (좁은 화면에서도 잘리지 않게) */
.hud .stat small.of { color: var(--dim); font-size: 9px; align-self: flex-end; margin-bottom: 8px; margin-left: -2px; }
.hud #h-life { flex: 1.15; }
.hud #h-wave { flex: 0.85; }
.hud .stat .ic { width: 15px; height: 15px; }
.hud .stat small { color: var(--green); font-size: 10px; }
.hud .stat.danger b { color: var(--red); }
.hud .stat.danger { animation: warn 0.6s steps(2) infinite; }
@keyframes warn { 50% { background: #4a1d27; } }
.hud #h-wave { flex: 1; flex-direction: column; gap: 0; line-height: 1.1; }
.hud #h-wave small { color: var(--dim); }
.hud #h-wave.urgent small, .hud #h-wave.urgent b { color: var(--red); }
.hud .btn.sm { position: relative; flex: 0 0 auto; min-height: 40px; min-width: 40px; padding: 0 6px; margin: 0; }
.hud .btn.sm::after { content: ''; position: absolute; inset: -4px -3px; }
#h-life.hit { animation: hit 0.3s steps(2) 1; }
@keyframes hit { 0% { background: #7a1f2b; transform: translateX(-2px); } 50% { background: #7a1f2b; transform: translateX(2px); } 100% { transform: none; } }
.hudfloat { position: absolute; left: 50%; top: 4px; transform: translateX(-50%); font-size: 12px; pointer-events: none; z-index: 5; color: var(--text); text-shadow: 1px 1px 0 var(--line), -1px -1px 0 var(--line), 1px -1px 0 var(--line), -1px 1px 0 var(--line); animation: hudfloat 0.7s steps(5) forwards; white-space: nowrap; }
.hudfloat.bad { color: var(--red); }
.hudfloat.good { color: var(--gold); }
@keyframes hudfloat { 0% { opacity: 1; transform: translate(-50%, 6px); } 70% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -14px); } }
#field { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
#cv {
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  touch-action: none;
  box-shadow: var(--px);
}
#bossbar {
  position: relative;
  margin: 3px 8px 0;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 2px 8px;
  min-height: 20px;
  background: rgba(21, 17, 29, 0.88);

  font-size: 11px;
  pointer-events: auto;
  cursor: pointer;
}
#bossbar.wait .bar { opacity: 0.35; }
#bossbar.wait #boss-t { color: var(--dim); }
#bossbar .bar { position: relative; flex: 1; height: 8px; background: #3a1d2c; box-shadow: 0 0 0 1px var(--line); }
#bossbar #boss-sh { position: absolute; left: 0; top: 0; height: 100%; width: 0; background: #a8ecff; opacity: 0.9; }
#bossbar .bar i { display: block; height: 100%; background: var(--red); width: 100%; }
#bossbar.enraged { animation: warn 0.4s steps(2) infinite; }
/* 체력바 눈금: 각성·분열·순간이동이 일어나는 체력 */
#boss-ticks { position: absolute; inset: 0; pointer-events: none; }
#boss-ticks b { position: absolute; top: -2px; bottom: -2px; width: 1px; background: #ffe46b; box-shadow: 0 0 0 1px rgba(21,17,29,0.8); }
#boss-ticks b.done { background: #6b5a7a; }
/* 보스 기술 예고: 보스 바의 두 번째 줄 (보스전 내내 자리를 잡아 두어 캔버스 크기가 바뀌지 않는다) */
#bossbar { flex-wrap: wrap; row-gap: 1px; }
#boss-cast { position: relative; flex-basis: 100%; min-height: 15px; padding: 0 0 2px; font-size: 11px; display: flex; gap: 6px; align-items: baseline; pointer-events: none; overflow: hidden; }
#boss-cast b { color: var(--cc, #ffe46b); white-space: nowrap; }

#boss-cast i { position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: var(--cc, #ffe46b); }
#boss-cast.idle b, #boss-cast.idle span { color: var(--dim); }
#boss-cast.idle i { display: none; }
#boss-cast.now { animation: warn 0.3s steps(2) infinite; }
.hud .stat.plunder { animation: warn 0.3s steps(2) infinite; }
.hud .stat.plunder b { color: #f5c44a; }
#boss-name { color: var(--pink); white-space: nowrap; }
#boss-t { font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; white-space: nowrap; }
#dock { position: relative; margin: 6px 8px 0; }
#toasts { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; pointer-events: none; z-index: 4; }
.toast {
  background: rgba(21, 17, 29, 0.92);
  box-shadow: var(--px);
  padding: 5px 10px;
  animation: toast 1.7s steps(6) forwards;

}

.toast.t4 { color: var(--t4); }
@keyframes toast { 0% { transform: translateY(6px); opacity: 0; } 12% { transform: none; opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-6px); } }
.page-toast { position: absolute; left: 50%; bottom: 90px; transform: translateX(-50%); z-index: 5; }

/* 강타 집중: 패널 위를 잠시 덮는 붉은 띠 */
#strikebar { position: absolute; inset: 0; z-index: 3; background: rgba(40, 8, 16, 0.94); box-shadow: var(--px), inset 0 0 0 2px #ff4d5a; padding: 6px 10px; display: flex; flex-direction: column; justify-content: center; gap: 5px; pointer-events: none; animation: sbIn 0.2s steps(3); }

#panel { height: 90px; background: var(--panel); box-shadow: var(--px); display: flex; overflow: hidden; }
#panel > div { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 6px 8px; }

.phint { width: 100%; text-align: center; margin: 0; color: var(--dim); font-size: 11px; }
.phint.coach { color: var(--gold); line-height: 1.35; }
.pdps.bad, .pdesc.bad { color: var(--red); }
.pinfo { flex: 1; min-width: 0; }
.pname { display: flex; align-items: baseline; gap: 4px; white-space: nowrap; overflow: hidden; }
.pdps { margin-left: auto; color: var(--gold); font-size: 11px; font-variant-numeric: tabular-nums; }
.tier0 { color: var(--t0); font-weight: normal; }
.tier1 { color: var(--t1); font-weight: normal; }
.tier2 { color: var(--t2); font-weight: normal; }
.tier3 { color: var(--t3); font-weight: normal; }
.tier4 { color: var(--t4); font-weight: normal; }
.pstats { color: var(--gold); font-size: 11px; line-height: 1.35; font-variant-numeric: tabular-nums; }
.pdesc { margin: 2px 0 0; color: var(--dim); font-size: 11px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pbtns { display: flex; flex-direction: column; gap: 6px; }

.pupg { flex-direction: column; align-items: stretch !important; gap: 4px !important; }
.upg-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.upg-grid.wide { gap: 10px; margin: 8px 0 14px; }
.upg {
  font: inherit;
  color: var(--text);
  border: 0;
  background: var(--panel2);
  box-shadow: var(--px);
  padding: 2px 0;
  display: flex;
  flex-direction: column;
  align-items: center;

}

.pitem .ic.big, .pitem .ic { width: 40px; height: 40px; }

#itembar { display: flex; align-items: center; gap: 6px; padding: 6px 10px 4px; height: 54px; flex: 0 0 auto; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }

/* ── 페이지(보상·상점·이벤트) ── */

/* 시너지 태그 */
.syn { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 5px; }
.syn .tag { font-size: 10px; padding: 0 4px; color: var(--tc, var(--dim)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tc, #888) 45%, transparent); opacity: 0.8; }
.syn .tag.hit { opacity: 1; background: color-mix(in srgb, var(--tc, #888) 22%, transparent); box-shadow: inset 0 0 0 1px var(--tc); }

.synlist .lrow b { color: var(--tc); }

<script>
// ── src/core/rng.js ──
// 시드 기반 난수 (mulberry32). 같은 시드면 같은 전투·맵이 나온다.
(function (RS) {
  'use strict';

  function Rng(seed) {
    this.s = seed | 0;
  }
  Rng.prototype.next = function () {
    const a = (this.s = (this.s + 0x6d2b79f5) | 0);
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  Rng.prototype.int = function (n) {
    return Math.floor(this.next() * n);
  };
  Rng.prototype.chance = function (p) {
    return this.next() < p;
  };
  Rng.prototype.pick = function (arr) {
    return arr[Math.floor(this.next() * arr.length)];
  };
  Rng.prototype.weighted = function (items, weightOf) {
    let total = 0;
    for (let i = 0; i < items.length; i++) total += weightOf(items[i]);
    let r = this.next() * total;
    for (let i = 0; i < items.length; i++) {
      r -= weightOf(items[i]);
      if (r < 0) return items[i];
    }
    return items[items.length - 1];
  };
  Rng.prototype.shuffle = function (arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(this.next() * (i + 1));

    const cleansable = run.curses.some((id) => RS.CURSE[id] && !RS.CURSE[id].permanent);
    // 전설 유닛은 2막에서 너무 결정적이라 3막에서만 나온다
    const fresh = (b) => !owned[b] && boons.indexOf(b) < 0 && !(b === 'legend' && run.act < 3) && !(b === 'cleanse' && !cleansable);
    for (const p of A.pools) {
      let opts = p.filter(fresh);
      // 풀이 다 떨어졌으면 다른 풀에서 아직 안 나온 것을 고른다 (같은 선택지가 두 번 나오지 않게)
      if (!opts.length) opts = [].concat(...A.pools).filter(fresh);
      if (!opts.length) opts = Object.keys(BOONS).filter(fresh);
      if (opts.length) boons.push(rng.pick(opts));
    }
    return { id: A.id, boons, done: false };
  };

  RS.ancientBoon = function (id) {
    if (RS.REL[id]) {
      const r = RS.REL[id];
      return { name: r.name + ' (방랑자 유물)', desc: r.desc, cost: r.cost };
    }
    return BOONS[id];
  };

  RS.applyAncient = function (run, id) {
    if (RS.REL[id]) RS.addRelic(run, id);
    else BOONS[id].apply(run);
  };
})((globalThis.RS = globalThis.RS || {}));

  const GOOD_UP = [

  const GOOD_DOWN = ['summonCostPct', 'upgradeCostPct'];
  RS.upgradeScale = function (mods, f) {

        for (const c in v) {

          for (const s in v[c]) {
            out.cls[c][s] = v[c][s] > 0 ? v[c][s] * f : v[c][s];
            if (v[c][s] > 0) any = true;
          }
        }
      } else if (GOOD_UP.indexOf(k) >= 0 && v > 0) {
        out[k] = INT_KEYS[k] ? Math.round(v * f) : v * f;
        any = true;
      } else if (GOOD_DOWN.indexOf(k) >= 0 && v < 0) {
        // 비용 하한보다 더 깎아 봐야 소용없다 → 하한까지만. 이미 하한이면 강화한 것으로 치지 않는다
        const floor = (k === 'upgradeCostPct' ? RS.UPGRADE_COST_FLOOR : RS.SUMMON_COST_FLOOR) || 0.1;
        out[k] = Math.max(floor - 1, v * f);

// 전장 좌표와 유닛 보드(4×5 칸, 한 칸에 같은 유닛 3기까지)
(function (RS) {
  'use strict';

  // 논리 해상도 160×186. 적은 격자 바깥의 사각 루프를 시계 방향으로 돈다.
  const F = (RS.FIELD = {
    W: 160, H: 186, COLS: 4, ROWS: 5, SLOT: 26, GX: 28, GY: 28,
    L: 15, T: 15, R: 145, B: 171,
  });
  F.SIZE = F.COLS * F.ROWS;
  F.TOPLEN = F.R - F.L;
  F.SIDELEN = F.B - F.T;
  F.PERIM = 2 * (F.TOPLEN + F.SIDELEN);

  RS.pathPos = function (d, out) {
    d %= F.PERIM;
    if (d < 0) d += F.PERIM;
    if (d < F.TOPLEN) {
      out.x = F.L + d; out.y = F.T; out.dir = 0;
    } else if ((d -= F.TOPLEN) < F.SIDELEN) {
      out.x = F.R; out.y = F.T + d; out.dir = 1;
    } else if ((d -= F.SIDELEN) < F.TOPLEN) {
      out.x = F.R - d; out.y = F.B; out.dir = 2;
    } else {
      d -= F.TOPLEN;
      out.x = F.L; out.y = F.B - d; out.dir = 3;
    }
    return out;
  };

  const CENTERS = [];
  for (let i = 0; i < F.SIZE; i++) {
    CENTERS.push({
      x: F.GX + (i % F.COLS) * F.SLOT + F.SLOT / 2,
      y: F.GY + Math.floor(i / F.COLS) * F.SLOT + F.SLOT / 2,
    });
  }
  RS.slotCenter = (i) => CENTERS[i];

  RS.slotAt = function (x, y) {
    const c = Math.floor((x - F.GX) / F.SLOT);
    const r = Math.floor((y - F.GY) / F.SLOT);
    if (c < 0 || r < 0 || c >= F.COLS || r >= F.ROWS) return -1;
    return r * F.COLS + c;
  };

  const CORNERS = [0, 3, 16, 19];
  const INNER = [5, 6, 9, 10, 13, 14];
  RS.isCorner = (i) => CORNERS.indexOf(i) >= 0;
  RS.isInner = (i) => INNER.indexOf(i) >= 0;

  // 근접 유닛은 바깥 칸(모서리 우선), 원거리 유닛은 안쪽 칸부터 채운다.
  const MELEE_ORDER = [0, 3, 16, 19, 1, 2, 17, 18, 4, 7, 8, 11, 12, 15, 5, 6, 9, 10, 13, 14];
  const RANGED_ORDER = [5, 6, 9, 10, 13, 14, 1, 2, 17, 18, 4, 7, 8, 11, 12, 15, 0, 3, 16, 19];
  RS.slotOrder = (cls) => (RS.CLASS[cls].melee ? MELEE_ORDER : RANGED_ORDER);

    return b;
  };

    let n = 0;
    for (const s of board) if (s) n += s.n;
    return n;
  };

  RS.bestUnit = function (board) {
    let best = null;
    for (const s of board) if (s && (!best || s.tier > best.tier)) best = s;
    return best;
  };

  RS.mostCommonClass = function (run) {
    const w = {};
    for (const c of RS.CLASSES) w[c] = 0;
    for (const s of run.board) if (s) w[s.cls] += s.n * RS.tierUnits(s.tier);
    let best = RS.CLASSES[0];
    for (const c of RS.CLASSES) if (w[c] > w[best]) best = c;

  RS.findSlotFor = function (board, cls, tier, prefer) {

      if (s && !s.sealed && s.cls === cls && s.tier === tier && s.n < RS.stackMax(tier)) return i;

  // 소환 → 판매·합성을 어떻게 반복해도 골드가 늘지 않는다.
  RS.freeWorth = (tier) => RS.BAL.freeWorth * RS.tierUnits(tier);

  // v 가 없는 칸(이전 버전 저장): 문맥이 없으면 무료 유닛으로 본다

  RS.migrateBoard = function (run, M) {

  RS.addUnit = function (board, cls, tier, prefer, v) {

    const share = worthOf(s) / s.n;

    if (s.n <= 0) board[i] = null;
    else s.v = Math.max(0, s.v - share);

  RS.moveWorth = function (board, from, to, amount) {

    const m = Math.min(worthOf(a), amount);

  RS.mergeSlot = function (run, i, rng, M) {

    const share = RS.stackWorth(run, s, M) / s.n;
