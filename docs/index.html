:root {
  color-scheme: dark;
  --bg: #15111d;
  --bg2: #1c1627;
  --panel: #251d33;
  --panel2: #30264a;
  --line: #0a070f;
  --hi: #4a3d66;
  --text: #f3e9d2;
  --dim: #a797bd;
  --gold: #f5c44a;
  --gold-d: #9c6f22;
  --red: #ef6166;
  --green: #74d86d;
  --blue: #7cc4ff;
  --pink: #f07fb0;
  --t0: #c2c9d3;
  --t1: #5d9bf0;
  --t2: #b273f0;
  --t3: #f5ae3d;
  --t4: #ff6b86;
  --font: 'Galmuri11', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif;
  --px: 0 -2px 0 var(--line), 0 2px 0 var(--line), -2px 0 0 var(--line), 2px 0 0 var(--line);
}

[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--text);
  overscroll-behavior: none;
}
body {
  font: 12px/1.5 var(--font);
  -webkit-text-size-adjust: 100%;
}
#app {
  position: fixed;
  inset: 0;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  display: flex;
  justify-content: center;
  background:
    radial-gradient(120% 60% at 50% 0%, #2a1f3f 0%, rgba(21, 17, 29, 0) 70%),
    var(--bg);
  /* none 이면 iOS 사파리에서 안쪽 스크롤 영역까지 막힌다. 전장 캔버스는 따로 none */
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}
img { max-width: 100%; }
.ic, .uimg, .foe, .boss-preview img {
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}
.ic { width: 24px; height: 24px; display: block; }
.uimg { width: 36px; height: 36px; display: block; }
.uimg.big { width: 48px; height: 48px; }
.scroll { overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.scroll-x { overflow-x: auto; touch-action: pan-x; -webkit-overflow-scrolling: touch; }

.screen {
  width: 100%;
  max-width: 480px;
  height: 100%;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* ── 버튼 ── */
.btn {
  font: inherit;
  color: var(--text);
  background: var(--panel2);
  border: 0;
  border-radius: 0;
  margin: 2px;
  padding: 8px 12px;
  min-height: 44px;
  cursor: pointer;
  box-shadow: var(--px), inset 0 -3px 0 rgba(0, 0, 0, 0.35), inset 0 2px 0 rgba(255, 255, 255, 0.12);
  touch-action: manipulation;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.btn:active:not(:disabled) {
  transform: translateY(2px);
  box-shadow: var(--px), inset 0 -1px 0 rgba(0, 0, 0, 0.35), inset 0 2px 0 rgba(255, 255, 255, 0.08);
}
.btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.sm { min-height: 40px; padding: 4px 10px; }
/* 두 번 눌러야 실행되는 버튼: 첫 탭 뒤 */
.btn.arm, .btn.gold.arm { background: var(--red); color: #2b0f12; box-shadow: var(--px), inset 0 -3px 0 #8f2f35, inset 0 2px 0 rgba(255, 255, 255, 0.3); }
.btn.option.sel { outline: 3px solid var(--gold); outline-offset: 2px; }
.btn.big { min-height: 52px; font-size: 15px; padding: 10px 20px; }
.btn.gold { background: var(--gold); color: #2b1c07; box-shadow: var(--px), inset 0 -3px 0 var(--gold-d), inset 0 2px 0 rgba(255, 255, 255, 0.45); }
.btn.grow { flex: 1; }
.row2 { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.row2 > .btn { flex: 1; }

/* ── 타이틀 ── */
#scr-title { padding: 24px 20px 18px; }
.title-wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; text-align: center; padding-bottom: 4vh; }
.eyebrow { color: var(--pink); letter-spacing: 0.12em; margin: 0 0 8px; font-size: 11px; }
.logo { margin: 0; font-size: 44px; line-height: 1.1; font-weight: normal; }
.logo span { display: block; color: var(--text); text-shadow: 3px 3px 0 var(--line); }
.logo .l2 { color: var(--gold); text-shadow: 3px 3px 0 #6b3f12, 6px 6px 0 var(--line); }
.parade { display: flex; justify-content: center; gap: 4px; margin-top: 26px; }
.parade .uimg { width: 54px; height: 54px; }
.bob { animation: bob 1.2s steps(2) infinite; }
.parade .uimg:nth-child(2n) { animation-delay: 0.3s; }
@keyframes bob { 50% { transform: translateY(-3px); } }
.title-foes { display: flex; justify-content: center; gap: 10px; margin-top: 10px; opacity: 0.85; }
.title-foes .foe { width: 36px; height: auto; }
.title-menu { display: flex; flex-direction: column; gap: 10px; }
.title-menu > .btn { width: 100%; }

/* ── 맵 ── */
.mapbox { flex: 1; min-height: 0; position: relative; }

.mapinner { position: relative; width: 100%; }
.maplines { position: absolute; inset: 0; pointer-events: none; }
/* 연결선: 어두운 밑줄 위에 색 선을 겹쳐 배경과 구분되게 */
.maplines line { stroke-linecap: round; }

@keyframes march { to { stroke-dashoffset: -14; } }
.node {
  position: absolute;

  height: 48px;

.node.avail { animation: pulse 1s steps(2) infinite; background: var(--panel2); }
.node.avail .nlabel { color: var(--text); }
@keyframes pulse { 50% { box-shadow: var(--px), 0 0 0 4px var(--text); } }

/* ── 전투 ── */

.hudfloat { position: absolute; left: 50%; top: 4px; transform: translateX(-50%); font-size: 12px; pointer-events: none; z-index: 5; color: var(--text); text-shadow: 1px 1px 0 var(--line), -1px -1px 0 var(--line), 1px -1px 0 var(--line), -1px 1px 0 var(--line); animation: hudfloat 0.7s steps(5) forwards; white-space: nowrap; }

#field { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }

.center { text-align: center; }

.card .uwrap { display: grid; place-items: center; }

.bpick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; max-width: 280px; margin: 12px auto; }
.bcell { position: relative; aspect-ratio: 1; border: 0; padding: 0; background: var(--panel2); box-shadow: var(--px), inset 0 0 0 2px var(--rune, transparent); display: grid; place-items: center; touch-action: manipulation; font: inherit; color: var(--text); }

#tip {

}

}

@media (prefers-reduced-motion: reduce) {
  .maplines .ln.open { animation: none; }

}

/* 강화된 칸(룬) 표시 */
.runebadge { margin-left: 4px; padding: 0 4px; font-size: 10px; color: #15111d; background: var(--rune); white-space: nowrap; }

/* 저주 설명 */
.cursenote { margin-top: 4px; padding: 4px 6px; background: rgba(239, 97, 102, 0.1); box-shadow: inset 2px 0 0 var(--red); text-align: left; }

.cursepool p { margin: 2px 0; font-size: 11px; line-height: 1.45; }
.cursepool b { color: var(--red); font-weight: normal; }
.btn.option.cursed b::after { content: ' · 저주'; color: var(--red); font-size: 11px; }

<script>
// ── src/core/rng.js ──
// 시드 기반 난수 (mulberry32). 같은 시드면 같은 전투·맵이 나온다.
(function (RS) {
  'use strict';

  function Rng(seed) {
    this.s = seed | 0;
  }
  Rng.prototype.next = function () {
    const a = (this.s = (this.s + 0x6d2b79f5) | 0);
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  Rng.prototype.int = function (n) {
    return Math.floor(this.next() * n);
  };
  Rng.prototype.chance = function (p) {
    return this.next() < p;
  };
  Rng.prototype.pick = function (arr) {
    return arr[Math.floor(this.next() * arr.length)];
  };
  Rng.prototype.weighted = function (items, weightOf) {
    let total = 0;
    for (let i = 0; i < items.length; i++) total += weightOf(items[i]);
    let r = this.next() * total;
    for (let i = 0; i < items.length; i++) {
      r -= weightOf(items[i]);
      if (r < 0) return items[i];
    }
    return items[items.length - 1];
  };
  Rng.prototype.shuffle = function (arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(this.next() * (i + 1));
      const t = arr[i];
      arr[i] = arr[j];
      arr[j] = t;
    }
    return arr;
  };
  Rng.prototype.seed32 = function () {
    return (this.next() * 4294967296) >>> 0;
  };

  RS.Rng = Rng;
  RS.randomSeed = function () {
    return (Math.random() * 4294967296) >>> 0;
  };
})((globalThis.RS = globalThis.RS || {}));

// ── src/data/units.js ──
// 밸런스 상수, 유닛·등급·적·막(Act) 데이터
(function (RS) {
  'use strict';

  // 밸런스 조정은 여기서. tools/sim.js 가 이 값을 그대로 사용한다.
  RS.BAL = {
    startGold: 60,
    startLife: 20,
    fieldCap: 60, // 필드 위 적이 이 수에 도달하면 즉시 패배
    summonBase: 10, // 소환 비용 = base + step × (지금까지 소환 횟수)
    summonStep: 1,
    rareChance: 0.05, // 소환 시 희귀 등급 기본 확률
    epicChance: 0.005,
    hpBase: 64, // 웨이브 레벨 0의 슬라임 체력 (첫 몇 레벨은 60%부터 완만하게)
    hpGrowth: [0, 1.1102, 1.0775, 1.0654, 1.0523], // [막] 웨이브 레벨당 체력 배율 (한 막 = 30레벨). 후반엔 플레이어 성장도 느려진다
    waveTime: 16, // 다음 웨이브까지 시간(초)
    prepTime: 5,
    spawnGap: 0.55,
    wavesPerStage: 3,
    waveGold: [0, 6, 10, 14], // [막] 웨이브 시작 골드
    killGoldMul: [0, 1, 1.6, 2.2], // [막] 처치 골드 배율
    earlyBonus: [0, 2, 3, 4], // [막] 웨이브를 일찍 정리하면 받는 골드

    // 돈을 내지 않고 얻은 유닛(보상·무료 소환)은 freeWorth × 3^등급 만큼 들인 것으로 친다.
    sellRate: 0.5,

    freeWorth: 6,
  };

  RS.CLASSES = ['knight', 'archer', 'mage', 'rogue', 'frost'];

  // dmgType: heavy(무거운 물리) / light(가벼운 물리) / magic(마법)
  RS.CLASS = {
    knight: {
      name: '전사', role: '근접 · 휘두르기', dmgType: 'heavy', melee: true,
      dmg: 16, interval: 1.1, range: 34,

      desc: '묵직한 한 방. 대상 주변 적에게 40% 휘두르기 피해. 희귀 등급부터 기절.',
    },
    archer: {
      name: '궁수', role: '원거리 · 연사', dmgType: 'light',
      dmg: 8, interval: 0.6, range: 66,
      shots: [1, 1, 2, 3, 3],
      desc: '가장 긴 사거리. 영웅 등급은 2발, 전설·신화 등급은 3발을 동시에 쏜다.',
    },
    mage: {
      name: '마법사', role: '광역 · 폭발', dmgType: 'magic',
      dmg: 13, interval: 1.5, range: 60,
      splash: [14, 16, 19, 23, 27],
      desc: '느리지만 폭발 범위 안의 모든 적에게 같은 피해.',
    },
    rogue: {
      name: '도적', role: '근접 · 치명타', dmgType: 'light', melee: true,
      dmg: 6, interval: 0.4, range: 36,
      crit: [0.2, 0.25, 0.3, 0.35, 0.4], critMult: [2, 2, 2.2, 2.5, 2.8],

      slow: [0.25, 0.3, 0.35, 0.4, 0.45], slowDur: 1.4,
      frostSplash: [0, 0, 10, 14, 18], freeze: [0, 0, 0, 0.1, 0.16],
      desc: '맞은 적을 느리게 만든다. 영웅 등급부터 주변까지, 전설 등급은 빙결.',

  RS.TIER = [
    { name: '일반', color: '#aab3bf', dark: '#6b7383', light: '#dfe4ea', dmg: 1, spd: 1 },
    { name: '희귀', color: '#4f8fe6', dark: '#2b5aa6', light: '#94c1f7', dmg: 3.5, spd: 0.93 },
    { name: '영웅', color: '#a65ee8', dark: '#6a33a3', light: '#d3a0f7', dmg: 12, spd: 0.86 },
    { name: '전설', color: '#f2a531', dark: '#b1680f', light: '#ffd98a', dmg: 40, spd: 0.8 },
    // 신화: 전설 4기를 합성해야 나온다 (전설 4기 합보다 약 20% 강하다)
    { name: '신화', color: '#ef4f6f', dark: '#9e2340', light: '#ffb0c0', dmg: 175, spd: 0.74 },
  ];
  RS.TOP_TIER = RS.TIER.length - 1;
  // 합성에 필요한 수: 전설부터는 4기
  RS.mergeNeed = (tier) => (tier >= 3 ? 4 : 3);
  // 한 칸에 쌓을 수 있는 수 (합성에 필요한 만큼. 신화는 3기)
  RS.stackMax = (tier) => (tier >= RS.TOP_TIER ? 3 : RS.mergeNeed(tier));
  // 일반 유닛 몇 기 분량인가 (골드 가치·힘 비교용): 1, 3, 9, 27, 108
  RS.tierUnits = (tier) => {
    let u = 1;
    for (let t = 0; t < tier; t++) u *= RS.mergeNeed(t);
    return u;
  };

  // hp: 웨이브 레벨 체력 대비 배율, leak: 한 바퀴 돌 때 잃는 생명
  RS.ENEMY = {

    // 엘리트
    ogre: { name: '오우거', hp: 9, speed: 20, gold: 8, leak: 3, elite: true },

// 전장 좌표와 유닛 보드(4×5 칸, 한 칸에 같은 유닛 3기까지)

    } else if ((d -= F.TOPLEN) < F.SIDELEN) {

    }
  };

  P.enemySkill = function (e, def, dt) {
    e.timer += dt;
    // 개구리: 가끔 앞으로 크게 뛴다
    if (def.hop) {
      if (e.hopT === undefined) e.hopT = this.rng.next() * def.hop.every;
      e.hopT += dt;
      if (e.hopT >= def.hop.every && e.stunT <= 0) {
        e.hopT = 0;
        e.d += def.hop.dist;
      }
    }
    // 늪의 여왕: 물속에 잠기면 공격받지 않는다
    if (def.submerge) {
      e.subTimer = (e.subTimer || 0) + dt;
      if (e.subTimer >= def.submerge.every) {
        e.subTimer = 0;
        e.subT = def.submerge.dur;
        this.emit({ k: 'msg', text: `${def.name}이(가) 물속으로 숨었다!` });
      }
    }
    // 해골 선장: 닻을 던져 한 열을 기절
    if (def.anchor) {
      e.anchorT = (e.anchorT || 0) + dt;
      if (e.anchorT >= def.anchor.every) {
        e.anchorT = 0;
        const c = this.rng.int(F.COLS);
        const cells = [];
        for (let r = 0; r < F.ROWS; r++) cells.push(r * F.COLS + c);
        this.riftWarn.push({ cells, t: def.anchor.warn, total: def.anchor.warn, stun: def.anchor.stun });
      }
    }
    if (def.heal && e.timer >= def.heal.every) {
      e.timer = 0;
      const r2 = def.heal.r * def.heal.r;
      for (const o of this.enemies) {
        if (o.dead) continue;
        const dx = o.x - e.x;
        const dy = o.y - e.y;
        if (dx * dx + dy * dy <= r2) o.hp = Math.min(o.maxHp, o.hp + o.maxHp * def.heal.pct);
      }
      this.emit({ k: 'heal', x: e.x, y: e.y, r: def.heal.r });
    } else if (def.haste && e.timer >= def.haste.every) {
      e.timer = 0;
      const r2 = def.haste.r * def.haste.r;
      for (const o of this.enemies) {
        if (o.dead) continue;
        const dx = o.x - e.x;
        const dy = o.y - e.y;
        if (dx * dx + dy * dy <= r2) {
          o.hasteP = def.haste.pct;
          o.hasteT = def.haste.dur;
        }
      }
      this.emit({ k: 'haste', x: e.x, y: e.y, r: def.haste.r });
    } else if (def.summon && e.timer >= def.summon.every) {
      e.timer = 0;
      for (let k = 0; k < def.summon.n; k++) {
        this.queueSpawn(def.summon.type, e.L, e.d - 7 * (k + 1), e.nextLap, def.summon.hp);
      }
      this.emit({ k: 'summonFx', x: e.x, y: e.y });
    } else if (def.rift && e.timer >= def.rift.every) {
      e.timer = 0;
      const c0 = this.rng.int(F.COLS - 1);
      const r0 = this.rng.int(F.ROWS - 1);
      const cells = [r0 * F.COLS + c0, r0 * F.COLS + c0 + 1, (r0 + 1) * F.COLS + c0, (r0 + 1) * F.COLS + c0 + 1];
      this.riftWarn.push({ cells, t: def.rift.warn, total: def.rift.warn, stun: def.rift.stun });
    }
  };

  P.leak = function (e) {
    const M = this.M;
    const run = this.run;
    const nW = this.stage.waves.length;
    let dmg = (e.def.leak + M.leakAdd) * M.leakMult;
    if ((e.elite || e.boss) && run.asc >= 5) dmg += 1;
    if (e.boss && this.enraged) dmg *= 2;
    if (M.lastWaveLeakMult && this.waveIdx >= nW) dmg *= 2;
    if (M.leakReduce) dmg = Math.max(1, dmg - M.leakReduce);
    let blocked = false;
    if (this.ghostT > 0) blocked = true;
    else if (M.firstWaveNoLeak && this.waveIdx <= 1) blocked = true;
    else if (M.helix && !this.helixUsed) {
      this.helixUsed = true;
      blocked = true;
    } else if (this.leakShield > 0) {
      this.leakShield--;
      blocked = true;
    }
    if (!blocked) {
      run.life -= dmg;
      this.stats.leaks += dmg;
    }
    this.emit({ k: 'leak', x: e.x, y: e.y, v: blocked ? 0 : dmg });
    if (M.thorns) this.damage(e, e.maxHp * M.thorns, null, false, true);
    if (M.powderKeg) {
      const kd = RS.levelHp(this.curL) * 0.3;
      for (const o of this.enemies) if (!o.dead) this.damage(o, kd, null, false, true);
      this.emit({ k: 'keg', x: F.L, y: F.T });
    }
    if (run.life <= 0) {
      run.life = 0;
      this.finish('lost', 'life');
    }
  };

  // ── 유닛 ──
  P.updateDyn = function () {
    const M = this.M;
    const run = this.run;
    let dmg = this.demon + (run.permDmg || 0);
    let aspd = 0;
    if (M.diversity || M.purity || M.eliteSquad || M.legendAura) {
      const kinds = {};
      let cnt = 0;
      let legends = 0;
      for (const s of run.board) {
        if (!s) continue;
        kinds[s.cls] = 1;
        cnt += s.n;
        if (s.tier >= 3) legends += s.n * (s.tier >= 4 ? 4 : 1);
      }
      const k = Object.keys(kinds).length;
      if (M.diversity && k === 5) dmg += M.diversity;
      if (M.purity && k > 0 && k <= 3) dmg += M.purity;
      if (M.eliteSquad && cnt > 0 && cnt <= 12) dmg += M.eliteSquad;
      if (M.legendAura) dmg += M.legendAura * legends;
    }
    if (M.rich && run.gold >= 100) dmg += M.rich;
    if (M.berserk && run.life <= run.maxLife / 2) {
      dmg += 0.6;
      aspd += 0.25;
    }
    const rst = run.relicState;
    if (rst.pumpkinCandle && rst.pumpkinCandle.charges > 0) dmg += 0.5;
    if (rst.waxToys) aspd += Math.max(0, 0.4 - 0.1 * Math.floor(rst.waxToys.fights / 4));
    if (this.kind === 'elite') dmg += (M.eliteBattleDmg || 0) + (M.bigBattleDmg || 0);
    if (this.kind === 'boss') dmg += M.bigBattleDmg || 0;
    if (this.buffs.rage > 0) aspd += 0.6;
    if (this.buffs.watch > 0) aspd += 0.6;
    if (dmg !== this.dyn.dmgPct || aspd !== this.dyn.aspdPct) {
      this.dyn.dmgPct = dmg;
      this.dyn.aspdPct = aspd;
      this.statsDirty = true;
    }
  };

  P.computeSlotStats = function () {
    this.statsDirty = false;
    const run = this.run;
    const M = this.M;
    for (let i = 0; i < F.SIZE; i++) {
      const s = run.board[i];
      if (!s) {
        this.slotStats[i] = null;
        continue;
      }
      this.slotStats[i] = RS.unitStats(run, M, this.dyn, s.cls, s.tier, i, this.slotStats[i] || {});
    }
  };

  RS.unitStats = function (run, M, dyn, cls, tier, i, st) {
    st = st || {};
    const C = RS.CLASS[cls];
    const T = RS.TIER[tier];
    const cm = M.cls[cls];
    const corner = i >= 0 && RS.isCorner(i);
    const inner = i >= 0 && RS.isInner(i);
    const rune = i >= 0 && run.runes && run.runes[i] ? RS.RUNE[run.runes[i]].mods : null;
    const pct = M.dmgPct + cm.dmg + (dyn ? dyn.dmgPct : 0) + M.tierDmg[tier] + (corner ? M.cornerDmg : 0) + (inner ? M.innerDmg : 0) + (rune && rune.dmg ? rune.dmg : 0);
    const lv = 1 + run.classLv[cls] * RS.BAL.upgradePct;
    const aspd = Math.max(0.2, 1 + M.aspdPct + cm.aspd + (dyn ? dyn.aspdPct : 0) + (rune && rune.aspd ? rune.aspd : 0));
    st.dmg = C.dmg * T.dmg * lv * Math.max(0.1, 1 + pct);
    st.interval = (C.interval * T.spd) / aspd;
    st.range = C.range + 3 * tier + M.rangeAdd + cm.range + (inner ? M.innerRange : 0) + (rune && rune.range ? rune.range : 0);
    st.crit = (C.crit ? C.crit[tier] : 0) + M.critChance + cm.crit + (rune && rune.crit ? rune.crit : 0);
    st.critMult = (C.critMult ? C.critMult[tier] : 2) + M.critMult;
    st.splash = C.splash ? C.splash[tier] + cm.splash : 0;
    st.slow = C.slow ? Math.min(0.8, C.slow[tier] + cm.slow) : 0;
    st.runeSlow = rune && rune.slow ? rune.slow : 0;
    st.runeGold = rune && rune.killGold ? rune.killGold : 0;
    st.runeEcho = rune && rune.echo ? rune.echo : 0;
    st.frostSplash = C.frostSplash && C.frostSplash[tier] ? C.frostSplash[tier] + cm.splash : 0;
    st.freeze = C.freeze ? C.freeze[tier] : 0;
    st.stun = C.stun ? C.stun[tier] : 0;
    st.shots = C.shots ? C.shots[tier] : 1;
    st.dps = (st.dmg / st.interval) * (1 + Math.min(1, st.crit) * (st.critMult - 1)) * st.shots;
    return st;
  };

  P.updateUnits = function (dt) {
    if (this.statsDirty) this.computeSlotStats();
    const board = this.run.board;
    for (let i = 0; i < F.SIZE; i++) {
      const s = board[i];
      if (!s) continue;
      if (this.slotStun[i] > 0) continue;
      const st = this.slotStats[i];
      // 전투 밖에서 보드가 바뀌어 수치가 없으면 다음 틱에 다시 계산한다
      if (!st) {
        this.statsDirty = true;
        continue;
      }
      const cds = this.cd[i];
      for (let u = 0; u < s.n; u++) {
        cds[u] -= dt;
        if (cds[u] > 0) continue;
        if (this.attack(i, s, st, u)) cds[u] = st.interval + Math.max(cds[u], -dt);
        else cds[u] = 0.1;
      }
    }
  };

  P.findTargets = function (x, y, range, n) {
    const out = this.targets;
    out.length = 0;
    const r2 = range * range;
    const list = this.enemies;
    for (let k = 0, len = list.length; k < len; k++) {
      const e = list[k];
      if (e.dead || e.subT > 0) continue;
      const dx = e.x - x;
      const dy = e.y - y;
      if (dx * dx + dy * dy > r2) continue;
      // 다음 누수에 가장 가까운 적부터. e.d 는 바퀴를 돌수록 쌓이므로 e.d - e.nextLap (클수록 가깝다)으로 비교한다
      const key = e.d - e.nextLap;
      let j = out.length;
      if (j < n) out.push(e);
      else if (key <= out[n - 1].d - out[n - 1].nextLap) continue;
      else j = n - 1;
      while (j > 0 && out[j - 1].d - out[j - 1].nextLap < key) {
        out[j] = out[j - 1];
        j--;
      }
      out[j] = e;
    }
    return out;
  };

  P.attack = function (i, s, st, u) {
    const c = RS.slotCenter(i);
    const targets = this.findTargets(c.x, c.y, st.range, st.shots);
    if (!targets.length) return false;
    let mul = 1;
    if (this.M.penNib && ++this.attackCount % 10 === 0) mul = 2;
    for (let k = 0; k < targets.length; k++) this.hitWith(i, s, st, targets[k], c, u, mul);
    // 메아리 룬: 확률로 한 번 더
    if (st.runeEcho && targets[0] && !targets[0].dead && this.rng.next() < st.runeEcho) this.hitWith(i, s, st, targets[0], c, u, 1);
    return true;
  };

  P.hitWith = function (i, s, st, e, c, u, mul) {
    const M = this.M;
    const rng = this.rng;
    // 눈가리개: 일정 확률로 빗나간다 (공격 모션만 나고 피해·효과 없음)
    if (M.missChance && rng.next() < M.missChance) {
      if (this.fxOn) this.fx.push({ k: 'shot', cls: s.cls, tier: s.tier, slot: i, u, x1: c.x, y1: c.y, x2: e.x + (rng.next() < 0.5 ? -7 : 7), y2: e.y - 4, crit: false, miss: true });
      return;
    }
    const cls = s.cls;
    const C = RS.CLASS[cls];
    let dmg = st.dmg * (mul || 1);
    let crit = mul > 1;
    if (st.crit > 0 && rng.next() < st.crit) {
      dmg *= st.critMult;
      crit = true;
    }
    const ex = e.x;
    const ey = e.y;
    this.lastSlot = i;
    switch (cls) {
      case 'knight':
        this.damage(e, dmg, cls, crit);
        this.splash(ex, ey, C.cleaveR + M.cls.knight.splash, dmg * C.cleave, cls, e, false);
        if (st.stun && !e.boss && rng.next() < st.stun) e.stunT = Math.max(e.stunT, C.stunDur);
        break;
      case 'mage':
        this.splash(ex, ey, st.splash, dmg, cls, null, crit);
        this.emit({ k: 'boom', x: ex, y: ey, r: st.splash, tier: s.tier });
        break;
      case 'frost':
        this.damage(e, dmg, cls, crit);
        this.applySlow(e, st.slow, C.slowDur);
        if (st.frostSplash) {
          const r2 = st.frostSplash * st.frostSplash;
          for (const o of this.enemies) {
            if (o.dead || o === e || o.subT > 0) continue;
            const dx = o.x - ex;
            const dy = o.y - ey;
            if (dx * dx + dy * dy <= r2) {
              this.damage(o, dmg * 0.5, cls, false);
              this.applySlow(o, st.slow, C.slowDur);
            }
          }
        }
        if (st.freeze && !e.boss && rng.next() < st.freeze) e.stunT = Math.max(e.stunT, 0.6);
        break;
      case 'rogue':
        this.damage(e, dmg, cls, crit);
        if (M.poison && !e.dead) {
          // 중첩 하나 = 그 공격 피해의 50%를 3초에 걸쳐. 세기는 중첩들의 평균이라 치명타 한 번이 모든 중첩을 키우지 않는다
          const p = (dmg * M.poison) / 3;
          if (e.poisonN < 5) {
            e.poison = (e.poison * e.poisonN + p) / (e.poisonN + 1);
            e.poisonN++;
          } else e.poison = (e.poison * 4 + p) / 5;
          e.poisonT = 3;
        }
        break;
      default:
        this.damage(e, dmg, cls, crit);
    }
    if (st.runeSlow && !e.dead) this.applySlow(e, st.runeSlow, 1);
    if (M.shrapnel && cls !== 'mage' && cls !== 'frost') this.splash(ex, ey, 8, dmg * M.shrapnel, cls, e, false);
    if (M.freezeChance && !e.boss && rng.next() < M.freezeChance) e.stunT = Math.max(e.stunT, 0.8);
    this.lastSlot = -1;
    if (this.fxOn) this.fx.push({ k: 'shot', cls, tier: s.tier, slot: i, u, x1: c.x, y1: c.y, x2: ex, y2: ey, crit });
  };

  P.applySlow = function (e, pct, dur) {
    if (e.boss) pct *= 0.5;
    if (pct >= e.slow) {
      e.slow = pct;
      e.slowT = dur;
    } else if (pct > 0 && e.slowT < dur * 0.5) {
      e.slowT = dur * 0.5;
    }
  };

  P.splash = function (x, y, r, dmg, cls, exclude, crit) {
    const r2 = r * r;
    const list = this.enemies;
    const burn = cls === 'mage' ? this.M.burn : 0;
    for (let k = 0, len = list.length; k < len; k++) {
      const e = list[k];
      if (e.dead || e === exclude || e.subT > 0) continue;
      const dx = e.x - x;
      const dy = e.y - y;
      if (dx * dx + dy * dy > r2) continue;
      this.damage(e, dmg, cls, crit);
      if (burn && !e.dead) {
        const b = dmg * burn;
        if (b > e.burn || e.burnT <= 0) e.burn = b;
        e.burnT = 3;
      }
    }
  };

  P.damage = function (e, amount, cls, crit, isDot) {
    if (e.dead) return 0;
    let dm = amount;
    const def = e.def;
    const M = this.M;
    if (cls) {
      const t = RS.CLASS[cls].dmgType;
      if (def.armorLight && t === 'light') dm *= def.armorLight;
      if (def.physRes && t !== 'magic') dm *= 1 - def.physRes;
      if (!isDot && !e.struck) {
        e.struck = true;
        if (M.firstStrike) dm *= 1 + M.firstStrike;
      }
    }
    if ((e.elite || e.boss) && M.eliteDmgPct) dm *= 1 + M.eliteDmgPct;
    if (e.burning === 'armor') dm *= 0.75;
    // 균열의 심장: 0.5초마다 받을 수 있는 피해에 한도가 있다
    if (def.dpsCap) {
      dm = Math.min(dm, e.capLeft);
      e.capLeft -= dm;
    }
    const dealt = Math.min(dm, e.hp);
    e.hp -= dm;
    this.stats.dmg += dealt;
    if (cls) this.stats.clsDmg[cls] += dealt;
    if (!isDot) e.flash = 0.08;
    if (this.fxOn && !isDot && this.numCount < MAX_NUMS && dm > 0) {
      this.numCount++;
      this.fx.push({ k: 'num', x: e.x, y: e.y - 5, v: dm, crit });
    }
    if (def.splitAt && e.hp > 0) {
      for (let k = e.splitDone; k < def.splitAt.length; k++) {
        if (e.hp > e.maxHp * def.splitAt[k]) break;
        e.splitDone = k + 1;
        for (let j = 0; j < def.splitN; j++) this.queueSpawn('slime', e.L, e.d - 5 * (j + 1), e.nextLap, def.splitHp);
        this.emit({ k: 'summonFx', x: e.x, y: e.y });
      }
    }
    if (e.hp <= 0) {
      e.dead = true;
      if (this.lastSlot >= 0 && this.slotStats[this.lastSlot] && this.slotStats[this.lastSlot].runeGold) e.runeGold = this.slotStats[this.lastSlot].runeGold;
    }
    return dealt;
  };

  // 죽은 적 정리 + 보상
  P.reap = function () {
    const list = this.enemies;
    let w = 0;
    for (let k = 0; k < list.length; k++) {
      const e = list[k];
      if (e.dead) this.onKill(e);
      else list[w++] = e;
    }
    list.length = w;
    this.flushPending();
  };

  P.onKill = function (e) {
    const def = e.def;
    const run = this.run;
    const M = this.M;
    let g = M.noKillGold ? 0 : def.gold * RS.BAL.killGoldMul[Math.min(3, run.act)] * (1 + M.killGoldPct);
    if (e.runeGold && !M.noKillGold) g += e.runeGold; // 엑토 심장이면 황금 룬 골드도 없다
    RS.addGold(run, g);
    this.stats.goldEarned += g;
    this.stats.kills++;
    if (M.souls) {
      run.souls = Math.min(M.souls, (run.souls || 0) + 1);
      if (run.souls >= M.souls) {
        const tier = M.soulTier || 0;
        // 자리가 없으면 영혼을 모아 둔 채로 다음 처치 때 다시 일으킨다
        if (this.freeSummon(tier, undefined, true) >= 0) {
          run.souls = 0;
          this.emit({ k: 'msg', text: `영혼이 모여 ${RS.TIER[tier].name} 유닛이 일어났다!` });
        }
      }
    }
    if (e.elite || e.boss) {
      if (M.eliteKillHeal) RS.heal(run, M.eliteKillHeal);
      if (M.eliteKillMaxLife) {
        RS.changeMaxLife(run, M.eliteKillMaxLife);
        RS.heal(run, M.eliteKillMaxLife);
      }
    }
    if (def.split) {
      for (let j = 0; j < def.split.n; j++) this.queueSpawn(def.split.type, e.L, e.d - 4 * j, e.nextLap, def.split.hp);
    }
    if (e.boss) {
      const alive = this.bosses.filter((b) => !b.dead);
      this.boss = alive[0] || null;
      if (!this.boss) this.riftWarn.length = 0;
      this.emit({ k: 'bossDown' });
    }
    this.emit({ k: 'kill', x: e.x, y: e.y, type: e.type, gold: g, big: e.boss || e.elite });
  };

  P.updateBoss = function (dt) {
    if (!this.boss || this.enraged) return;
    this.bossTimer -= dt;
    if (this.bossTimer <= 0) {
      this.bossTimer = 0;
      this.enraged = true;
      this.emit({ k: 'msg', text: '보스 폭주! 속도·피해 증가', warn: true });
    }
  };

  P.checkEnd = function () {
    if (this.status !== 'running') return;
    if (this.enemies.length >= this.cap) {
      this.finish('lost', 'cap');
      return;
    }
    if (this.prep <= 0 && this.waveIdx >= this.stage.waves.length && !this.spawnQ.length && !this.enemies.length && !this.pending.length) {
      this.finish('won');
    }
  };

  P.finish = function (result, reason) {
    if (this.status !== 'running') return;
    this.result = result;
    this.reason = reason || null;
    this.status = this.fxOn ? 'ending' : result;
    this.endT = 1.4;
    this.emit({ k: result === 'won' ? 'won' : 'lost', reason });
  };

  // ── 플레이어 조작 ──
  P.rollCost = function () {
    this.costMul = this.M.snakeEye ? 0.5 + this.rng.next() * 1.5 : 1;
  };
  P.summonCost = function () {
    return Math.max(1, Math.round(RS.summonCost(this.run, this.M) * this.costMul));
  };

    };
    RS.attachRng(run);
    run.variants[1] = run.rng.int(RS.ACT_VARIANTS[0].length);
    RS.addRelic(run, cmd.relic);
    for (let k = 0; k < (cmd.startItems || 0); k++) RS.addItem(run, RS.randomItemId(run.rng));
    if (asc >= 6) {
      run.maxLife -= 4;
      run.life = run.maxLife;
    }
    if (asc >= 9) run.curses.push('ascBurden');
    run.map = RS.genMap(run);
    run.pending = { blessings: RS.rollBlessings(run) };
    return run;
  };

  RS.saveString = function (run) {
    run.rngS = run.rng.s;
    return JSON.stringify(run);
  };
  RS.loadString = function (str) {
    const run = JSON.parse(str);
    if (!run || run.v !== 2) return null;
    RS.attachRng(run);
    RS.registerCustomAugs(run);
    if (Array.isArray(run.curses) && run.stats) syncCurseTimers(run);
    // 예전 저장본: 마지막 보스를 이기고 보상 화면에 멈춰 있었다면 그대로 끝낸다
    if (run.phase === 'reward' && run.nodeType === 'boss' && typeof RS.isFinalBoss === 'function' && RS.isFinalBoss(run)) {
      run.phase = 'victory';
      run.pending = null;
    }
    // 이전 버전 저장의 유닛에 판매 가치를 매긴다
    if (Array.isArray(run.board) && typeof RS.migrateBoard === 'function') RS.migrateBoard(run, RS.collectMods(run));
    return run;
  };

  // ── 맵 (슬레이 더 스파이어식: 경로 6개를 겹쳐 그린다) ──
  RS.MAP_W = 5;
  RS.MAP_FLOORS = 9; // + 보스 층

  RS.NODE_INFO = {
    combat: { name: '전투', icon: 'n_combat' },
    elite: { name: '엘리트', icon: 'n_elite' },
    unknown: { name: '?', icon: 'n_event' },
    event: { name: '이벤트', icon: 'n_event' },
    shop: { name: '상점', icon: 'n_shop' },
    rest: { name: '휴식처', icon: 'n_rest' },
    treasure: { name: '보물', icon: 'n_treasure' },
    boss: { name: '보스', icon: 'n_boss' },
  };

  function roomWeights(run, f) {
    const w = [['combat', 45], ['unknown', 22], ['shop', 5]];
    if (f >= 4) w.push(['elite', run.asc >= 1 ? 13 : 8]);
    if (f >= 4 && f !== RS.MAP_FLOORS - 1) w.push(['rest', 12]);
    return w;
  }

  RS.genMap = function (run) {
    if (run.act === 4) return genAct4Map();
    const rng = run.rng;
    const W = RS.MAP_W;
    const H = RS.MAP_FLOORS;
    const floors = [];
    for (let f = 0; f < H; f++) floors.push(new Array(W).fill(null));
    const edge = {};
    const starts = [];
    for (let p = 0; p < 6; p++) {
      let c = rng.int(W);
      if (p === 1) while (c === starts[0]) c = rng.int(W);
      starts.push(c);
      for (let f = 1; f <= H; f++) {
        if (!floors[f - 1][c]) floors[f - 1][c] = { type: null, next: [], visited: false };
        if (f === H) break;
        // 다른 경로와 X자로 엇갈리지 않게
        const opts = [c - 1, c, c + 1].filter((n) => n >= 0 && n < W && !(n === c + 1 && edge[`${f}:${c + 1}>${c}`]) && !(n === c - 1 && edge[`${f}:${c - 1}>${c}`]));
        const n = rng.pick(opts);
        edge[`${f}:${c}>${n}`] = true;
        const node = floors[f - 1][c];
        if (node.next.indexOf(n) < 0) node.next.push(n);
        c = n;
      }
    }
    for (const row of floors) for (const n of row) if (n) n.next.sort((a, b) => a - b);
    const parents = (f, c) => (f <= 1 ? [] : floors[f - 2].filter((p) => p && p.next.indexOf(c) >= 0));
    // 방 종류: 1층 전투, 5층 보물, 마지막 층 휴식처. 나머지는 가중치 + 연속 금지 규칙
    for (let f = 1; f <= H; f++) {
      for (let c = 0; c < W; c++) {
        const n = floors[f - 1][c];
        if (!n) continue;
        if (f === 1) n.type = 'combat';
        else if (f === 5) n.type = 'treasure';
        else if (f === H) n.type = 'rest';
        else {
          const ps = parents(f, c);
          const banned = {};
          for (const p of ps) {
            if (p.type === 'elite' || p.type === 'rest' || p.type === 'shop') banned[p.type] = true;
            // 같은 부모를 둔 형제 칸과 같은 특수 방은 피한다
            for (const sc of p.next) {
              const sib = floors[f - 1][sc];
              if (sib && sib !== n && sib.type && sib.type !== 'combat') banned[sib.type] = true;
            }
          }
          const w = roomWeights(run, f).filter((x) => !banned[x[0]]);
          n.type = rng.weighted(w.length ? w : [['combat', 1]], (x) => x[1])[0];
        }
      }
    }
    const all = [];
    floors.forEach((row, fi) => row.forEach((n) => n && all.push({ n, f: fi + 1 })));
    // 막마다 엘리트 하나는 보장하고, 그중 하나가 '성난 엘리트'(초록 봉인석)
    let elites = all.filter((x) => x.n.type === 'elite');
    if (!elites.length) {
      const cands = all.filter((x) => x.f >= 4 && x.f < H && x.n.type === 'combat');
      if (cands.length) {
        rng.pick(cands).n.type = 'elite';
        elites = all.filter((x) => x.n.type === 'elite');
      }
    }
    if (elites.length) rng.pick(elites).n.burning = true;
    // 상점이 하나도 없으면 하나 만든다
    if (!all.some((x) => x.n.type === 'shop')) {
      const cands = all.filter((x) => x.f >= 3 && x.f < H && (x.n.type === 'combat' || x.n.type === 'unknown'));
      if (cands.length) rng.pick(cands).n.type = 'shop';
    }
    for (const n of floors[H - 1]) if (n) n.next = [2];
    const bossRow = new Array(W).fill(null);
    bossRow[2] = { type: 'boss', next: [], visited: false };
    floors.push(bossRow);
    return { floors };
  };

  // 4막: 휴식처 → 상점 → 엘리트 → 균열의 핵 (일직선)
  function genAct4Map() {
    const row = (type) => {
      const r = new Array(RS.MAP_W).fill(null);
      r[2] = { type, next: [2], visited: false };
      return r;
    };
    const floors = [row('rest'), row('shop'), row('elite'), row('boss')];
    floors[3][2].next = [];
    return { floors };
  }

  RS.bossFloor = (run) => run.map.floors.length;

  RS.nextChoices = function (run) {
    const floors = run.map.floors;
    const out = [];
    if (run.floor >= floors.length) return out;
    if (run.floor === 0) {
      floors[0].forEach((n, l) => n && out.push({ f: 1, lane: l }));
      return out;
    }
    const node = floors[run.floor - 1][run.lane];
    for (const l of node.next) out.push({ f: run.floor + 1, lane: l });
    return out;
  };

  // 축지 장화: 다음 층 아무 칸
  RS.wingChoices = function (run) {
    const st = run.relicState.wingBoots;
    if (!st || st.uses <= 0 || run.floor === 0 || run.floor >= run.map.floors.length) return [];
    const normal = RS.nextChoices(run);
    const out = [];
    run.map.floors[run.floor].forEach((n, l) => {
      if (n && !normal.some((c) => c.lane === l)) out.push({ f: run.floor + 1, lane: l, wing: true });
    });
    return out;
  };

  // ? 칸: 전투·상점·보물 확률이 이벤트가 나올 때마다 오른다
  function resolveUnknown(run) {
    const u = run.unknown;
    const M = RS.collectMods(run);
    u.count++;
    // 꼬마 궤짝: 얻은 뒤부터 센다 (유물마다 따로 센다)
    if (M.tinyChest) {
      const st = run.relicState.tinyChest || (run.relicState.tinyChest = { n: 0 });
      st.n++;
      if (st.n % 4 === 0) return 'treasure';
    }
    const r = run.rng.next();
    const combat = M.juzu ? 0 : u.combat;
    if (r < combat) {
      u.combat = 0.1;
      return 'combat';
    }
    if (r < combat + u.shop) {
      u.shop = 0.03;
      return 'shop';
    }
    if (r < combat + u.shop + u.treasure) {
      u.treasure = 0.02;
      return 'treasure';
    }
    u.combat += 0.1;
    u.shop += 0.03;
    u.treasure += 0.02;
    return 'event';
  }

  RS.enterNode = function (run, f, lane, useWing) {
    const node = run.map.floors[f - 1][lane];
    if (useWing) run.relicState.wingBoots.uses--;
    node.visited = true;
    run.floor = f;
    run.lane = lane;
    const bank = run.relicState.mawBank;
    if (bank && bank.active) RS.addGold(run, 12);
    let type = node.type;
    if (type === 'unknown') {
      type = resolveUnknown(run);
      node.resolved = type;
    }
    run.nodeType = type;
    run.burning = !!node.burning;
    const rng = run.rng;
    switch (type) {
      case 'combat':
      case 'elite':
      case 'boss':
        run.phase = 'battle';
        run.pending = { stage: RS.makeStage(run, type, rng, { burning: run.burning }) };
        break;
      case 'event':
        run.phase = 'event';
        run.pending = { event: RS.pickEvent(run), result: null, step: 0 };
        break;
      case 'shop':
        run.phase = 'shop';
        run.pending = { shop: RS.genShop(run) };
        break;
      case 'rest':
        run.phase = 'rest';
        run.pending = { done: false };
        break;
      case 'treasure':
        run.phase = 'treasure';
        run.pending = { relics: RS.rollRelics(run, 1, [1, 2], [65, 35]), opened: false };
        break;
    }
  };

  // ── 보상 ──
  const AUG_W = [null, [0, 70, 27, 3], [0, 58, 35, 7], [0, 48, 40, 12], [0, 30, 45, 25]];

  // 슬더스의 희귀 카드 보정처럼, 프리즘이 안 나올수록 확률이 오른다
  RS.rollAugments = function (run, n, rarityW, exclude, usePity) {
    const rng = run.rng;
    const owned = {};
    for (const id of run.augments) owned[RS.augDef(id).id] = true;
    const taken = {};
    if (exclude) for (const id of exclude) taken[id] = true;
    const avail = RS.AUGMENTS.filter((a) => !(a.unique && owned[a.id]));
    const out = [];
    for (let k = 0; k < n; k++) {
      const w = rarityW.slice();
      if (usePity) w[3] += run.prismPity * 100;
      const rar = rng.weighted([1, 2, 3], (r) => w[r]);
      if (usePity) {
        if (rar === 3) run.prismPity = 0;
        else if (rar === 1) run.prismPity = Math.min(0.4, run.prismPity + 0.01);
      }
      let pool = avail.filter((a) => a.rarity === rar && !taken[a.id]);
      if (!pool.length) pool = avail.filter((a) => !taken[a.id]);
      if (!pool.length) break;
      const a = rng.pick(pool);
      taken[a.id] = true;
      out.push(a.id);
    }
    return out;
  };

  // exclude: 가진 유물 말고도 빼 둘 것 (상점에 이미 놓인 유물 등)
  RS.rollRelics = function (run, n, rarities, weights, exclude) {
    const rng = run.rng;
    const owned = {};
    for (const id of run.relics) owned[id] = true;
    if (exclude) for (const id of exclude) owned[id] = true;
    const out = [];
    for (let k = 0; k < n; k++) {
      const pools = rarities.map((r) => RS.RELICS.filter((x) => x.rarity === r && !owned[x.id] && out.indexOf(x.id) < 0));
      const idx = rng.weighted(rarities.map((r, i) => i), (i) => (pools[i].length ? weights[i] : 0));
      const pool = pools[idx].length ? pools[idx] : [].concat(...pools);
      if (!pool.length) break;
      out.push(rng.pick(pool).id);
    }
    return out;
  };

  // 아직 얻을 수 있는 유물이 남았는지 (rng 를 쓰지 않는다)
  RS.relicsLeft = function (run, rarities, exclude) {
    return RS.RELICS.some((x) => rarities.indexOf(x.rarity) >= 0 && run.relics.indexOf(x.id) < 0 && !(exclude && exclude.indexOf(x.id) >= 0));
  };

  RS.grantRandomRelic = function (run, rarities, exclude) {
    const ids = RS.rollRelics(run, 1, rarities, rarities.map(() => 1), exclude);
    if (!ids.length) return null;
    RS.addRelic(run, ids[0]);
    return ids[0];
  };

  RS.augChoiceCount = function (run) {
    return Math.max(1, 3 + RS.collectMods(run).augChoices);
  };

  // 모험을 끝내는 보스: 4막 심장, 또는 열쇠 셋이 없을 때의 3막 보스
  RS.isFinalBoss = function (run) {
    if (run.nodeType !== 'boss') return false;
    const k = run.keys || {};
    return run.act === 4 || (run.act === 3 && !(k.ruby && k.emerald && k.sapphire));
  };

  RS.finishBattle = function (run, battle) {
    const st = battle.stats;
    const stage0 = battle.stage;
    const trial = !!(stage0.spec && stage0.spec.trial);
    run.stats.battles++;
    run.stats.kills += st.kills;
    run.stats.dmg += st.dmg;
    for (const c of RS.CLASSES) run.stats.clsDmg[c] += st.clsDmg[c];
    // 졸음의 별은 허수아비 시험에는 걸리지 않으니 횟수도 쓰지 않는다
    if (run.lament > 0 && !trial) run.lament--;
    if (run.tax > 0) run.tax--;
    RS.battleUpkeep(run);
    if (trial) {
      // 허수아비 시험: 실패해도 모험은 계속된다
      RS.trialReward(run, battle);
      return;
    }
    if (battle.result !== 'won') {
      run.phase = 'over';
      run.pending = { reason: battle.reason };
      return;
    }
    // 마지막 보스: 쓸 수 없는 보상을 고르게 하지 않고 곧장 승리
    if (RS.isFinalBoss(run)) {
      run.stats.bosses++;
      run.phase = 'victory';
      run.pending = null;
      return;
    }
    const M = RS.collectMods(run);
    const stage = battle.stage;
    const type = stage.type === 'eventFight' ? stage.spec.as || 'elite' : run.nodeType;
    const act = Math.min(3, run.act);
    const rng = run.rng;
    let gold = BAL.clearGold[type === 'boss' ? 'boss' : type === 'elite' ? 'elite' : 'combat'][act];
    gold = Math.round(gold * (0.85 + rng.next() * 0.3) * (1 + M.combatGoldPct)) + (M.winGold || 0) * act;
    if (run.burning && type === 'elite') gold += 30 * act;
    RS.addGold(run, gold);
    if (M.winHeal) RS.heal(run, M.winHeal);
    if (M.winMaxLife) {
      RS.changeMaxLife(run, M.winMaxLife);
      RS.heal(run, M.winMaxLife);
    }
    if (M.meatBone && run.life <= run.maxLife / 2) RS.heal(run, M.meatBone);
    if (M.eliteUpgrade && type === 'elite') {
      const idxs = run.augments.map((id, i) => i).filter((i) => RS.canUpgradeAug(run.augments[i]));
      rng.shuffle(idxs);
      for (const i of idxs.slice(0, M.eliteUpgrade)) RS.upgradeAug(run, i);
    }
    if (type === 'elite') run.stats.elites++;
    if (type === 'boss' && run.nodeType === 'boss') run.stats.bosses++;
    const reward = { gold, heal: M.winHeal, augDone: false, rerolls: M.augRerolls, relics: null, relicDone: false, item: null, key: null };
    // 소모품: 기본 40%, 나오면 -10%p, 안 나오면 +10%p
    if (!M.noItems && type !== 'boss') {
      if (rng.chance(run.itemChance + (M.itemDropBonus || 0))) {
        const id = RS.randomItemId(rng);
        if (RS.addItem(run, id)) reward.item = id;
        run.itemChance = Math.max(0, run.itemChance - 0.1);
      } else run.itemChance = Math.min(1, run.itemChance + 0.1);
    }
    const w = type === 'boss' ? [0, 0, 0, 1] : type === 'elite' ? [0, 15, 60, 25] : AUG_W[Math.min(4, run.act)];
    reward.augW = w;
    reward.aug = RS.rollAugments(run, RS.augChoiceCount(run), w, null, type === 'combat');
    if (type === 'elite') {
      reward.relics = RS.rollRelics(run, 2, [1, 2], [70, 30]);
      if (M.blackStar && stage.type !== 'eventFight') reward.takeAll = true;
      if (run.burning && !run.keys.emerald) {
        run.keys.emerald = true;
        reward.key = 'emerald';
      }
    }
    if (type === 'boss') reward.relics = RS.rollRelics(run, 3, [3], [1]);
    if (stage.type === 'eventFight' && stage.spec.relic) reward.relics = RS.rollRelics(run, stage.spec.relicChoices || 1, stage.spec.relic, stage.spec.relic.map(() => 1));
    if (type === 'combat' && M.prayerWheel) {
      // 소원 물레: 일반 전투 4번마다 증강 한 번 더
      const st = (run.relicState.prayerWheel = run.relicState.prayerWheel || { n: 0 });
      st.n = (st.n || 0) + 1;
      if (st.n % 4 === 0) RS.enqueue(run, { k: 'aug', w, title: '소원 물레' });
    }
    run.phase = 'reward';
    run.pending = { reward };
  };

  RS.rewardPickAug = function (run, id) {
    const r = run.pending.reward;
    if (r.augDone) return;
    RS.pickAugment(run, id);
    r.augDone = true;
  };
  // 전투 보상에서 증강을 건너뛸 때 받는 골드 (망각의 서가 포함). 보상 화면 버튼도 이 값을 쓴다
  RS.skipGoldAmount = function (run) {
    const M = RS.collectMods(run);
    return Math.round(BAL.skipGold[Math.min(3, run.act)] * (1 + (M.skipGoldMul || 0)));
  };
  // 증강을 건너뛸 때의 공통 효과 (울림 사발). 늘어난 최대 생명을 돌려준다
  RS.skipAugBonus = function (run) {
    const M = RS.collectMods(run);
    if (!M.singingBowl) return 0;
    RS.changeMaxLife(run, 2);
    RS.heal(run, 2);
    return 2;
  };
  RS.rewardSkipAug = function (run) {
    const r = run.pending.reward;
    if (r.augDone) return 0;
    const g = RS.skipGoldAmount(run);
    RS.addGold(run, g);
    RS.skipAugBonus(run);
    r.augDone = true;
    return g;
  };
  RS.rewardReroll = function (run) {
    const r = run.pending.reward;
    if (r.rerolls <= 0 || r.augDone) return false;
    r.rerolls--;
    r.aug = RS.rollAugments(run, r.aug.length, r.augW, r.aug);
    return true;
  };
  RS.rewardPickRelic = function (run, id) {
    const r = run.pending.reward;
    if (r.relicDone) return;
    if (r.takeAll) for (const x of r.relics) RS.addRelic(run, x);
    else if (id) RS.addRelic(run, id);
    r.relicDone = true;
  };
  RS.rewardComplete = function (run) {
    const r = run.pending && run.pending.reward;
    return !!r && r.augDone && (!r.relics || !r.relics.length || r.relicDone);
  };

  // 노드를 마치고 다음으로. 쌓인 선택(증강 고르기 등)이 있으면 먼저 처리한다
  RS.advance = function (run) {
    if (run.nodeType === 'boss') {
      // (예전 저장본이 마지막 보스 보상 화면에 멈춰 있어도 여기서 끝난다)
      if (RS.isFinalBoss(run)) {
        run.phase = 'victory';
        run.pending = null;
        return;
      }
      run.act++;
      run.variants[run.act] = run.rng.int(RS.ACT_VARIANTS[run.act - 1].length);
      run.floor = 0;
      run.lane = -1;
      run.nodeType = null;
      run.map = RS.genMap(run);
      RS.heal(run, Math.ceil(run.maxLife * BAL.actHealPct * (run.asc >= 4 ? 0.5 : 1)));
      run.phase = 'actStart';
      run.pending = run.act <= 3 ? { ancient: RS.rollAncient(run) } : null;
    } else {
      // 상점·이벤트(전투 없이 끝난 것)도 길 위의 발견으로 증강 하나를 고른다: 전투만 고르는 길이 정답이 되지 않게
      if ((run.nodeType === 'shop' || run.nodeType === 'event') && run.phase !== 'over') {
        RS.enqueue(run, { k: 'aug', w: AUG_W[Math.min(4, run.act)], title: '길 위의 발견' });
      }
      run.phase = 'map';
      run.pending = null;
    }
    RS.flushQueue(run);
  };

  RS.flushQueue = function (run) {
    if (run.phase === 'victory' || run.phase === 'over') return;
    if (run.phase !== 'choice') pruneQueue(run);
    if (run.queue.length && run.phase !== 'choice') {
      run.afterQueue = run.phase;
      run.afterPending = run.pending;
      run.phase = 'choice';
      run.pending = null;
    }
  };
  RS.popQueue = function (run) {
    run.queue.shift();
    pruneQueue(run);
    if (!run.queue.length) {
      run.phase = run.afterQueue || 'map';
      run.pending = run.afterPending || null;
      run.afterQueue = null;
      run.afterPending = null;
    }
  };

  // 대기열 항목을 지금 처리할 수 있는지 (고를 대상이 하나라도 있는지)
  RS.choiceActionable = function (run, item) {
    switch (item && item.k) {
      case 'remove':
        return RS.removableCount(run) > 0;
      case 'upgrade':
        return run.augments.some((id) => RS.canUpgradeAug(id));
      case 'transform':
        return RS.transformableCount(run) > 0;
      case 'rune':
      case 'runeChoice':
        return run.runes.some((r) => !r || RS.RUNE[r].bad);
      case 'unit': {
        const maxTier = item.maxTier == null ? 3 : item.maxTier;
        if (item.op === 'dup') return run.board.some((s) => s && s.tier <= maxTier && RS.hasRoomFor(run.board, s.cls, s.tier));
        return run.board.some((s) => s && s.tier <= maxTier);
      }
      case 'relicList':
        return !!(item.ids && item.ids.length);
      default:
        return true;
    }
  };
  // 앞에서부터, 고를 대상이 없어진 항목은 건너뛴다 (값을 치른 항목이면 돌려준다)
  function pruneQueue(run) {
    let guard = 0;
    while (run.queue.length && guard++ < 50 && !RS.choiceActionable(run, run.queue[0])) {
      const it = run.queue[0];
      if (it.undo || it.refund || it.refundLife || it.undoCurse || it.undoCharm) RS.cancelChoice(run, it);
      run.queue.shift();
    }
  }

  // 플레이어가 대기열 선택을 그만두거나 건너뛸 때 (UI 가 popQueue 바로 앞에서 부른다).
  // 값을 치른 서비스는 되돌려 주고, 증강 건너뛰기는 전투 보상과 같은 효과(울림 사발)를 준다.
  RS.cancelChoice = function (run, item) {
    const out = { refund: 0, text: null };
    if (!item) return out;
    const texts = [];
    if (item.undo) {
      // 상점 구매 취소: 판매 전 상태로 되돌린다
      const u = item.undo;
      item.undo = null;
      const p = run.phase === 'choice' ? run.afterPending : run.pending;
      const shop = p && p.shop;
      if (shop && shop.list && u.entry && u.shopIdx >= 0 && u.shopIdx < shop.list.length) {
        const e = JSON.parse(JSON.stringify(u.entry));
        e.sold = false;
        shop.list[u.shopIdx] = e;
        shop.boughtAny = !!u.boughtAny;
      }
      if (u.removeCount != null) run.removeCount = u.removeCount;
      const bank = run.relicState.mawBank;
      if (bank && u.mawBank != null) bank.active = u.mawBank;
      if (u.gold > 0) RS.addGold(run, u.gold);
      out.refund += u.gold || 0;
      if (shop) RS.repriceShop(run, shop);
      texts.push(u.gold > 0 ? `구매를 취소했다. 골드 +${u.gold}` : '구매를 취소했다.');
    }
    if (item.refund || item.refundLife || item.undoCurse || item.undoCharm) {
      // 이벤트에서 값을 치른 서비스
      const g = item.refund || 0;
      if (g > 0) {
        RS.addGold(run, g);
        out.refund += g;
        texts.push(`골드 ${g}을(를) 돌려받았다.`);
      }
      if (item.refundLife > 0) {
        run.life = Math.min(run.maxLife, run.life + item.refundLife);
        texts.push(`생명 ${item.refundLife}을(를) 돌려받았다.`);
      }
      if (item.undoCurse) {
        const i = run.curses.lastIndexOf(item.undoCurse);
        if (i >= 0) {
          run.curses.splice(i, 1);
          texts.push(`저주 [${RS.CURSE[item.undoCurse].name}]도 사라졌다.`);
        }
      }
      if (item.undoCharm && run.relicState.omamori) run.relicState.omamori.charges += item.undoCharm;
      item.refund = 0;
      item.refundLife = 0;
      item.undoCurse = null;
      item.undoCharm = 0;
      // 한 번에 산 묶음(제거 + 연마 등)의 나머지도 함께 취소
      if (item.group) {
        for (let i = run.queue.length - 1; i >= 0; i--) if (run.queue[i] !== item && run.queue[i].group === item.group) run.queue.splice(i, 1);
      }
    } else if ((item.k === 'aug' || item.k === 'augList') && item.ids && item.ids.length) {
      const life = RS.skipAugBonus(run);
      if (life) texts.push(`울림 사발: 최대 생명 +${life}`);
    }
    out.text = texts.length ? texts.join(' ') : null;
    return out;
  };

  // 대기열의 증강 선택지: 처음 보여 줄 때 굴린다. 'aug' 항목은 운명의 주사위 새로고침을 쓸 수 있다
  RS.choiceAugIds = function (run, item) {
    if (!item.ids) item.ids = RS.rollAugments(run, item.n || RS.augChoiceCount(run), item.w);
    if (item.rerolls == null) item.rerolls = item.k === 'aug' && item.w ? RS.collectMods(run).augRerolls || 0 : 0;
    return item.ids;
  };
  RS.choiceReroll = function (run, item) {
    if (!item || !item.w || !item.ids || !(item.rerolls > 0)) return false;
    item.rerolls--;
    item.ids = RS.rollAugments(run, item.ids.length, item.w, item.ids);
    return true;
  };

  // ── 이벤트 ──
  RS.pickEvent = function (run) {
    const actOk = (e) => !e.acts || e.acts.indexOf(Math.min(3, run.act)) >= 0;
    let pool = RS.EVENTS.filter((e) => actOk(e) && run.seenEvents.indexOf(e.id) < 0 && (!e.cond || e.cond(run)));
    if (!pool.length) pool = RS.EVENTS.filter((e) => actOk(e) && (!e.cond || e.cond(run)));
    const e = run.rng.pick(pool);
    run.seenEvents.push(e.id);
    return e.id;
  };

  RS.optionDesc = function (run, opt) {
    return typeof opt.desc === 'function' ? opt.desc(run) : opt.desc;
  };
  RS.optionLabel = function (run, opt) {
    return typeof opt.label === 'function' ? opt.label(run) : opt.label;
  };
  RS.optionEnabled = function (run, opt) {
    return !opt.cond || opt.cond(run);
  };
  // 안전장치: 어떤 이유로든 고를 수 있는 선택지가 하나도 없으면 '떠난다'를 붙인다
  const SAFE_LEAVE = { label: '떠난다', desc: '아무 일도 일어나지 않는다', safeLeave: true, apply: () => '발걸음을 돌렸다.' };
  RS.eventOptions = function (run) {
    const ev = RS.EVENT[run.pending.event];
    const step = run.pending.step || 0;
    const opts = ev.steps ? ev.steps[step].options : ev.options;
    if (opts.some((o) => RS.optionEnabled(run, o))) return opts;
    return opts.concat([SAFE_LEAVE]);
  };
  RS.eventText = function (run) {
    const ev = RS.EVENT[run.pending.event];
    const step = run.pending.step || 0;
    const t = ev.steps ? ev.steps[step].text : ev.text;
    return typeof t === 'function' ? t(run) : t;
  };

  // 결과: 문장 또는 { text, augRarity, fight, next(단계 이동), again(같은 단계 반복) }
  RS.eventChoose = function (run, idx) {
    const opt = RS.eventOptions(run)[idx];
    if (!opt || !RS.optionEnabled(run, opt) || run.pending.result) return null;
    let res = opt.apply(run, run.rng);
    if (typeof res === 'string') res = { text: res };
    res = res || { text: '' };
    if (res.next != null) {
      run.pending.step = res.next;
      run.pending.log = res.text;
      return res;
    }
    if (res.again) {
      run.pending.log = res.text;
      return res;
    }
    run.pending.result = res;
    if (res.augRarity) {
      const w = [0, 0, 0, 0];
      w[res.augRarity] = 1;
      RS.enqueue(run, { k: 'aug', w, title: RS.EVENT[run.pending.event].title });
    }
    if (res.fight) {
      run.pending.fight = res.fight;
    }
    return res;
  };

  // 이벤트 전투: 끝나면 보상 화면으로
  RS.startEventFight = function (run) {
    const spec = run.pending.fight;
    run.nodeType = 'eventFight';
    run.burning = false;
    run.phase = 'battle';
    run.pending = { stage: RS.makeStage(run, 'eventFight', run.rng, spec) };
  };

  // ── 상점 ──
  RS.priceMul = function (run) {
    const M = RS.collectMods(run);
    return [0, 1, 1.2, 1.4, 1.4][run.act] * (run.asc >= 2 ? 1.15 : 1) * Math.max(0.3, 1 - M.shopDiscount);
  };
  RS.removeCost = function (run) {
    const M = RS.collectMods(run);
    if (M.fixedRemoveCost) return M.fixedRemoveCost;
    return Math.round((75 + 25 * run.removeCount) * (run.asc >= 2 ? 1.15 : 1));
  };

  const relicEntry = (id) => ({ kind: 'relic', id, base: RS.REL[id].rarity === 2 ? 170 : 120 });

  RS.genShop = function (run) {
    const rng = run.rng;
    const list = [];
    // 한 번에 굴려야 서로 겹치지 않는다 (유물 3개)
    for (const id of RS.rollRelics(run, 3, [1, 2], [65, 35])) list.push(relicEntry(id));
    for (let k = 0; k < 3; k++) list.push({ kind: 'item', id: RS.randomItemId(rng), base: 45 + rng.int(26) });
    const augs = RS.rollAugments(run, 2, [0, 30, 55, 15]);
    augs.forEach((id, k) => list.push({ kind: 'aug', id, base: [0, 80, 110, 160][RS.AUG[id].rarity], sale: k === 0 }));
    list.push({ kind: 'unit', tier: 1, base: 120 });
    list.push({ kind: 'unit', tier: 2, base: 330 });
    list.push({ kind: 'rune', id: RS.randomRune(rng), base: 100 });
    list.push({ kind: 'remove' });
    for (const it of list) it.sold = false;
    RS.repriceShop(run, { list });
    return { list };
  };

  RS.repriceShop = function (run, shop) {
    const mul = RS.priceMul(run);
    const free = RS.collectMods(run).freeFirstBuy && !shop.boughtAny;
    for (const it of shop.list) {
      if (free) it.price = 0;
      else if (it.kind === 'remove') it.price = RS.removeCost(run);
      else it.price = Math.round(it.base * mul * (it.sale ? 0.5 : 1));
    }
  };

  // 제거/룬처럼 대상을 골라야 하는 것은 구매 후 선택 대기열로 보낸다
  RS.shopBuy = function (run, idx) {
    const shop = run.pending.shop;
    const it = shop.list[idx];
    if (!it || it.sold) return { err: 'sold' };
    if (run.gold < it.price) return { err: 'gold' };
    if (it.kind === 'item' && (run.items.length >= RS.itemSlots(run) || RS.collectMods(run).noItems)) return { err: 'full' };
    if (it.kind === 'unit' && !RS.hasEmptySlot(run.board)) return { err: 'board' };
    if (it.kind === 'remove' && !RS.removableCount(run)) return { err: 'none' };
    if (it.kind === 'rune' && !run.runes.some((r) => !r || RS.RUNE[r].bad)) return { err: 'noslot' };
    const bank = run.relicState.mawBank;
    // 대상을 고르는 서비스(제거·룬)는 선택 화면에서 그만두면 되돌릴 수 있게 기록해 둔다 (RS.cancelChoice)
    const undo = { gold: it.price, shopIdx: idx, entry: JSON.parse(JSON.stringify(it)), removeCount: run.removeCount, boughtAny: !!shop.boughtAny, mawBank: bank ? bank.active : null };
    RS.addGold(run, -it.price);
    shop.boughtAny = true;
    if (bank) bank.active = false;
    it.sold = true;
    if (it.kind === 'relic') RS.addRelic(run, it.id);
    else if (it.kind === 'item') RS.addItem(run, it.id);
    else if (it.kind === 'aug') RS.pickAugment(run, it.id);
    else if (it.kind === 'unit') RS.grantUnits(run, it.tier, 1, it.price > 0 ? it.price : undefined);
    else if (it.kind === 'rune') RS.enqueue(run, { k: 'rune', rune: it.id, title: '룬 새기기', undo });
    else if (it.kind === 'remove') {
      run.removeCount++;
      RS.enqueue(run, { k: 'remove', title: '제거 서비스', undo });
    }
    if (RS.collectMods(run).courier && it.kind !== 'remove') {
      // 보부상: 빈자리에 같은 종류의 새 물건
      let fresh = null;
      if (it.kind === 'relic') {
        const ids = RS.rollRelics(run, 1, [1, 2], [65, 35], shop.list.filter((x) => x.kind === 'relic').map((x) => x.id));
        if (ids.length) fresh = relicEntry(ids[0]);
      } else if (it.kind === 'item') fresh = { kind: 'item', id: RS.randomItemId(run.rng), base: 45 + run.rng.int(26) };
      else if (it.kind === 'aug') {
        const a = RS.rollAugments(run, 1, [0, 30, 55, 15], shop.list.filter((x) => x.kind === 'aug').map((x) => x.id));
        if (a.length) fresh = { kind: 'aug', id: a[0], base: [0, 80, 110, 160][RS.AUG[a[0]].rarity] };
      } else if (it.kind === 'unit') fresh = { kind: 'unit', tier: it.tier, base: it.base };
      else if (it.kind === 'rune') fresh = { kind: 'rune', id: RS.randomRune(run.rng), base: 100 };
      if (fresh) {
        fresh.sold = false;
        shop.list[idx] = fresh;
      }
    }
    RS.repriceShop(run, shop);
    return { ok: true, kind: it.kind };
  };

  RS.removableCount = function (run) {
    return run.augments.length + run.curses.filter((id) => !RS.CURSE[id].permanent).length;
  };

  // ── 휴식처 ──
  RS.restHealAmount = (run) => Math.ceil(run.maxLife * BAL.restHealPct) + (RS.collectMods(run).restHealAdd || 0);
  RS.restTrainAmount = (run) => BAL.trainLevels + RS.collectMods(run).restTrainBonus;

  // 복제의 룬 위 유닛 중 실제로 복제할 수 있는 칸 (같은 유닛 칸이나 빈칸이 있어야 한다)
  RS.cloneTargets = function (run) {
    const out = [];
    run.runes.forEach((r, i) => {
      const s = run.board[i];
      if (r === 'cloneR' && s && RS.hasRoomFor(run.board, s.cls, s.tier)) out.push(i);
    });
    return out;
  };
  // 고른 칸이 없으면 가장 높은 등급 유닛을 복제한다
  RS.cloneTarget = function (run, prefer) {
    const list = RS.cloneTargets(run);
    if (prefer != null && list.indexOf(prefer) >= 0) return prefer;
    let best = -1;
    for (const i of list) if (best < 0 || run.board[i].tier > run.board[best].tier) best = i;
    return best;
  };

  RS.restOptions = function (run) {
    const M = RS.collectMods(run);
    const opts = [];
    const bloom = !RS.canHeal(run);
    const dream = M.dreamCatcher ? ' · 증강 선택' : '';
    opts.push({
      id: 'heal', label: '휴식',
      desc: bloom ? `회복할 수 없다 (시든 꽃의 낙인)${dream}` : `생명 +${RS.restHealAmount(run)}${dream}`,
      off: M.noRestHeal ? '각성제 때문에 잠들 수 없다' : bloom && !M.dreamCatcher ? '시든 꽃의 낙인 때문에 회복할 수 없다' : null,
    });
    opts.push({ id: 'train', label: '수련', desc: `클래스 하나 강화 +${RS.restTrainAmount(run)}`, off: M.noSmith ? '벼락 망치 때문에 할 수 없다' : null });
    const up = run.augments.some((id) => RS.canUpgradeAug(id));
    opts.push({ id: 'smith', label: '연마', desc: '증강 하나를 연마 (효과 ×1.5)', off: M.noSmith ? '벼락 망치 때문에 할 수 없다' : !up ? '연마할 수 있는 증강이 없다' : null });
    if (M.peacePipe) opts.push({ id: 'toke', label: '명상', desc: '증강이나 저주 하나를 없앤다', off: RS.removableCount(run) ? null : '없앨 것이 없다' });
    if (M.shovel) opts.push({ id: 'dig', label: '발굴', desc: '유물 하나를 얻는다' });
    if (M.girya) {
      const lifts = run.relicState.girya.lifts;
      opts.push({ id: 'lift', label: '단련', desc: `모든 유닛 피해 +6% (${lifts}/3)`, off: lifts >= 3 ? '더 단련할 수 없다' : null });
    }
    const candle = run.relicState.pumpkinCandle;
    if (candle && candle.charges < 8) opts.push({ id: 'kindle', label: '불 붙이기', desc: `박 등잔을 다시 켠다 (남은 ${candle.charges}번 → 8번)` });
    if (run.quests && run.quests.egg) opts.push({ id: 'hatch', label: '부화', desc: '용의 알을 부화시킨다: 전설 유닛 1기 + 유물 [아기 용]' });
    const onRune = run.runes.some((r, i) => r === 'cloneR' && run.board[i]);
    if (onRune) {
      const ci = RS.cloneTarget(run);
      const s = ci >= 0 ? run.board[ci] : null;
      opts.push({ id: 'clone', label: '복제', desc: s ? `복제의 룬 위 유닛 1기를 복제 (${RS.TIER[s.tier].name} ${RS.CLASS[s.cls].name})` : '복제의 룬 위 유닛 1기를 복제', off: s ? null : '보드에 자리가 없다' });
    }
    if (run.act <= 3 && !run.keys.ruby) opts.push({ id: 'recall', label: '회수', desc: '붉은 봉인석을 얻는다 (휴식·수련 대신)' });
    return opts;
  };

  // 결과 문장을 돌려준다 (없으면 null)
  RS.restDo = function (run, id, arg) {
    let text = null;
    switch (id) {
      case 'heal':
        RS.heal(run, RS.restHealAmount(run));
        if (RS.collectMods(run).dreamCatcher) RS.enqueue(run, { k: 'aug', w: [0, 50, 42, 8], title: '꿈 그물' });
        break;
      case 'train':
        run.classLv[arg] += RS.restTrainAmount(run);
        break;
      case 'smith':
        RS.enqueue(run, { k: 'upgrade', title: '연마' });
        break;
      case 'toke':
        RS.enqueue(run, { k: 'remove', title: '명상' });
        break;
      case 'dig':
        RS.grantRandomRelic(run, [1, 2]);
        break;
      case 'lift':
        run.relicState.girya.lifts++;
        run.permDmg += 0.06;
        break;
      case 'recall':
        run.keys.ruby = true;
        break;
      case 'kindle':
        run.relicState.pumpkinCandle.charges = 8;
        break;
      case 'hatch':
        run.quests.egg = false;
        RS.grantUnits(run, 3, 1);
        if (!RS.hasRelic(run, 'babyDragon')) RS.addRelic(run, 'babyDragon');
        break;
      case 'clone': {
        const i = RS.cloneTarget(run, arg);
        if (i >= 0) {
          const s = run.board[i];
          if (RS.addUnit(run.board, s.cls, s.tier, i) >= 0) text = `${RS.TIER[s.tier].name} ${RS.CLASS[s.cls].name} 복제!`;
        }
        break;
      }
    }
    if (run.pending) run.pending.done = true;
    return text;
  };

  // ── 보물 ──
  RS.openChest = function (run, takeKey) {
    const p = run.pending;
    p.opened = true;
    const M = RS.collectMods(run);
    if (takeKey) {
      run.keys.sapphire = true;
      p.gotKey = true;
    } else {
      p.got = [];
      for (const id of p.relics) {
        RS.addRelic(run, id);
        p.got.push(id);
      }
      const doll = run.relicState.matryoshka;
      if (doll && doll.count > 0) {
        doll.count--;
        const extra = RS.grantRandomRelic(run, [1, 2]);
        if (extra) p.got.push(extra);
      }
    }
    if (M.cursedKey && !takeKey && run.floor !== 5) {
      const c = RS.randomCurseId(run.rng);
      if (RS.addCurse(run, c)) p.curse = c;
    }
    // 보물 지도: 지도를 산 다음 막의 첫 보물 상자
    if (run.quests && run.quests.spoilsAct === run.act) {
      RS.addGold(run, 400);
      p.spoils = 400;
      run.quests.spoilsAct = null;
    }
  };

  // 전투가 끝날 때마다: 녹는 유물, 사라지는 저주, 퀘스트 카운트
  RS.battleUpkeep = function (run) {
    const st = run.relicState;
    if (st.pumpkinCandle && st.pumpkinCandle.charges > 0) st.pumpkinCandle.charges--;
    if (st.waxToys) st.waxToys.fights++;
    // 사라지는 저주: 생긴 뒤 전투를 정해진 횟수만큼 치르면 사라진다
    const timers = syncCurseTimers(run, true);
    const now = run.stats.battles;
    for (let k = timers.length - 1; k >= 0; k--) {
      const t = timers[k];
      if (now - t.at < RS.CURSE[t.id].fades) continue;
      timers.splice(k, 1);
      const i = run.curses.indexOf(t.id);
      if (i >= 0) run.curses.splice(i, 1);
    }
    const w = run.quests && run.quests.wongo;
    if (w && w.left > 0) {
      w.left--;
      if (w.left === 0) {
        for (let k = 0; k < 3; k++) RS.grantRandomRelic(run, [1, 2]);
        run.quests.wongo = null;
        run.quests.wongoDone = true;
      }
    }
  };

  // 허수아비 시험 보상 (시간 안에 쓰러뜨렸는지에 따라)
  // 보상을 줄 수 없으면(가방이 가득 참 등) 골드로 대신 주고, trial.text 에 실제로 받은 것을 적는다
  RS.trialReward = function (run, battle) {
    const tier = battle.stage.spec.trial;
    const ok = battle.result === 'won' && !battle.trialFailed;
    const reward = { gold: 0, augDone: true, relics: null, relicDone: true, trial: { tier, ok, text: null } };
    if (ok) {
      const a = Math.min(3, run.act);
      const fallback = (g, why) => {
        reward.gold = g;
        RS.addGold(run, g);
        reward.trial.text = `${why} 대신 골드 +${g}`;
      };
      if (tier === 1) {
        const id = RS.randomItemId(run.rng);
        if (RS.addItem(run, id)) {
          reward.item = id;
          reward.trial.text = `소모품 [${RS.ITEM[id].name}]`;
        } else fallback(30 * a, '소모품을 가질 수 없어');
      } else if (tier === 2) {
        const n = Math.min(2, run.augments.filter((id) => RS.canUpgradeAug(id)).length);
        for (let k = 0; k < n; k++) RS.enqueue(run, { k: 'upgrade', title: '허수아비 시험' });
        if (n) reward.trial.text = `증강 ${n}개 연마`;
        else fallback(60 * a, '연마할 증강이 없어');
      } else {
        const ids = RS.rollRelics(run, 1, [2], [1]);
        if (ids.length) {
          reward.relics = ids;
          reward.relicDone = false;
          reward.trial.text = '희귀 유물';
        } else fallback(100 * a, '남은 희귀 유물이 없어');
      }
    }
    run.phase = 'reward';
    run.pending = { reward };
  };

  // 도깨비 화롯불에 바친 유닛 등급에 따라 보상
  RS.sacrificeUnit = function (run, i) {
    const s = run.board[i];
    if (!s) return '';
    const tier = s.tier;
    RS.takeUnit(run.board, i);
    const bloom = !RS.canHeal(run);
    if (tier === 0) return '도깨비들이 시큰둥하다. 아무 일도 없었다.';
    if (tier === 1) {
      const h = RS.heal(run, 5);
      return bloom ? '도깨비들이 기뻐하지만, 시든 꽃의 낙인 때문에 회복하지 못했다.' : `도깨비들이 기뻐한다. 생명 +${h}`;
    }
    if (tier === 2) {
      RS.changeMaxLife(run, 5);
      RS.heal(run, run.maxLife);
      return bloom ? '도깨비들이 춤춘다! 최대 생명 +5 (시든 꽃의 낙인 때문에 회복은 못 했다)' : '도깨비들이 춤춘다! 최대 생명 +5, 생명 모두 회복';
    }
    RS.changeMaxLife(run, 10);
    RS.heal(run, 10);
    const id = RS.grantRandomRelic(run, [2]);
    return `도깨비들이 환호한다! 최대 생명 +10${id ? `, 유물 [${RS.REL[id].name}]` : ''}`;
  };

  // 땜장이 공방: 직접 조립한 증강 (런마다 등록)
  RS.registerCustomAugs = function (run) {
    for (const id in run.customAugs || {}) {
      const c = run.customAugs[id];
      RS.AUG[id] = { id, name: c.name, rarity: 2, icon: 'gear', desc: c.desc, mods: c.mods, unique: true, custom: true };
    }
  };

  RS.buildTinker = function (run, extra) {
    const base = run.pending.tinker ? run.pending.tinker.base : 'dmg';
    const mods = {};
    const parts = [];
    if (base === 'dmg') { mods.dmgPct = 0.15; parts.push('모든 유닛 피해 +15%'); }
    if (base === 'aspd') { mods.aspdPct = 0.12; parts.push('모든 유닛 공격 속도 +12%'); }
    if (base === 'range') { mods.rangeAdd = 7; parts.push('모든 유닛 사거리 +7'); }
    if (extra === 'crit') { mods.critChance = 0.06; parts.push('치명타 확률 +6%'); }
    if (extra === 'gold') { mods.killGoldPct = 0.12; parts.push('처치 골드 +12%'); }
    if (extra === 'slow') { mods.enemySpeedPct = 0.05; parts.push('모든 적 이동 속도 -5%'); }
    run.customAugs = run.customAugs || {};
    const n = Object.keys(run.customAugs).length + 1;
    const id = 'tinker' + n;
    run.customAugs[id] = { name: `괴짜 발명품 ${n}호`, desc: parts.join(', '), mods };
    RS.registerCustomAugs(run);
    RS.pickAugment(run, id);
    return `[괴짜 발명품 ${n}호] 완성! (${parts.join(', ')})`;
  };

  RS.wongoSpend = function (run, g) {
    run.stats.wongo = (run.stats.wongo || 0) + g;
  };

  // 안개 구슬: 9칸 중 정해진 횟수만큼 들여다본다
  RS.initSphere = function (run, n) {
    run.pending.sphere = { left: n, pool: run.rng.shuffle(['gold', 'gold', 'gold', 'item', 'item', 'aug', 'relic', 'curse', 'empty']) };
  };
  RS.revealSphere = function (run) {
    const s = run.pending.sphere;
    const r = s.pool.shift();
    s.left--;
    const a = Math.min(3, run.act);
    let text;
    if (r === 'gold') {
      RS.addGold(run, 40 * a);
      text = `골드 +${40 * a}`;
    } else if (r === 'item') text = RS.addItem(run, RS.randomItemId(run.rng)) ? '소모품을 찾았다' : '소모품이 있었지만 가질 수 없었다';
    else if (r === 'aug') {
      RS.enqueue(run, { k: 'aug', w: [0, 50, 40, 10], title: '안개 구슬' });
      text = '증강의 환영이 보인다 (나중에 고른다)';
    } else if (r === 'relic') {
      const id = RS.grantRandomRelic(run, [1, 2]);
      text = `유물 [${id ? RS.REL[id].name : '먼지'}]!`;
    } else if (r === 'curse') text = RS.addCurse(run, RS.randomCurseId(run.rng)) ? '저주가 튀어나왔다!' : '저주가 튀어나왔지만 액막이 매듭이 막았다';
    else text = '아무것도 없다';
    if (s.left > 0 && s.pool.length) return { text, again: true };
    return text + ' · 구슬 속에 다시 안개가 낀다.';
  };

  // ── 룬 (보드 칸에 새기는 인챈트) ──
  RS.randomRune = function (rng) {
    return rng.pick(RS.RUNES.filter((r) => !r.bad)).id;
  };
  RS.setRune = function (run, slot, id) {
    run.runes[slot] = id;
  };
})((globalThis.RS = globalThis.RS || {}));

    ctx.fillRect(x + 1, y + 1, F.SLOT - 2, 1);
    ctx.fillRect(x + 1, y + F.SLOT - 2, F.SLOT - 2, 1);
    ctx.fillRect(x + 1, y + 1, 1, F.SLOT - 2);
    ctx.fillRect(x + F.SLOT - 2, y + 1, 1, F.SLOT - 2);

    ctx.fillRect(x + a, y + z - 2, 1, 3);

    ctx.fillRect(x + z, y + z - 2, 1, 3);

  };

  P.drawSlots = function (ctx, b, dt) {
    const board = b.run.board;
    const runes = b.run.runes;
    const t = this.t;
    for (let i = 0; i < F.SIZE; i++) {
      const x = F.GX + (i % F.COLS) * F.SLOT;
      const y = F.GY + Math.floor(i / F.COLS) * F.SLOT;
      const s = board[i];
      if (runes && runes[i]) this.drawRune(ctx, RS.RUNE[runes[i]], x, y);
      if (this.lunge[i] > 0) this.lunge[i] -= dt;
      if (this.pop[i] > 0) this.pop[i] -= dt;
      const dr = this.drag;
      if (dr && dr.moved && dr.over === i && dr.from !== i) {
        const bad = dr.overReach === false;
        ctx.fillStyle = bad ? 'rgba(239,97,102,0.35)' : 'rgba(255,228,107,0.25)';
        ctx.fillRect(x + 1, y + 1, F.SLOT - 2, F.SLOT - 2);
        ctx.fillStyle = bad ? '#ef6166' : '#ffe46b';
        ctx.fillRect(x, y, F.SLOT, 1);
        ctx.fillRect(x, y + F.SLOT - 1, F.SLOT, 1);
        ctx.fillRect(x, y, 1, F.SLOT);
        ctx.fillRect(x + F.SLOT - 1, y, 1, F.SLOT);
      }
      if (!s) continue;
      const T = RS.TIER[s.tier];
      // 등급 테두리
      ctx.fillStyle = T.dark;
      ctx.fillRect(x + 2, y + F.SLOT - 4, F.SLOT - 4, 2);
      if (s.tier > 0) {
        ctx.fillStyle = T.color;
        ctx.fillRect(x + 2, y + F.SLOT - 4, F.SLOT - 4, 1);
      }
      const spr = RS.SPR[s.cls + s.tier];
      const bob = Math.sin(t * 3 + i) > 0.6 ? -1 : 0;
      let ox = 0;
      let oy = bob;
      if (this.lunge[i] > 0) {
        ox += this.lungeDir[i].x * this.lungeBig[i];
        oy += this.lungeDir[i].y * this.lungeBig[i];
      }
      if (this.pop[i] > 0) oy -= Math.round(this.pop[i] * 8);
      let draggedAway = false;
      if (dr && dr.moved) {
        if (dr.from === i) {
          ctx.globalAlpha = 0.35;
          draggedAway = true;
        } else if (dr.over === i) ctx.globalAlpha = 0.35; // 자리를 내줄 유닛
      }
      const stunned = b.slotStun[i] > 0;
      ctx.drawImage(spr, x + 4 + ox, y + 2 + oy);
      ctx.globalAlpha = 1;
      // 신화: 유닛 둘레를 도는 반짝이
      if (s.tier >= 4 && !draggedAway) {
        const T4 = RS.TIER[s.tier];
        for (let k = 0; k < 3; k++) {
          const a = t * 2.4 + k * 2.094 + i;
          ctx.fillStyle = k === 0 ? '#ffffff' : T4.light;
          ctx.fillRect(Math.round(x + F.SLOT / 2 + Math.cos(a) * 8), Math.round(y + F.SLOT / 2 - 1 + Math.sin(a) * 8), 1, 1);
        }
      }
      if (draggedAway && dr.over >= 0 && dr.over !== i && board[dr.over]) {
        // 자리 바꿈 미리보기: 목표 칸의 유닛이 이 칸으로 온다
        const o = board[dr.over];
        ctx.globalAlpha = 0.5;
        ctx.drawImage(RS.SPR[o.cls + o.tier], x + 4, y + 2);
        ctx.globalAlpha = 1;
      }
      if (stunned) {

        ctx.fillRect(x + 2, y + 2, F.SLOT - 4, F.SLOT - 4);

      if (s.n > 1) {
        ctx.fillStyle = '#1d1428';
        ctx.fillRect(x + F.SLOT - 9, y + F.SLOT - 10, 7, 7);
        RS.drawNum(ctx, String(s.n), x + F.SLOT - 5.5, y + F.SLOT - 10, RS.canMerge(board, i) ? 'y' : 'w');
      }
      if (RS.canMerge(board, i) && Math.floor(t * 3) % 2 === 0) {

      if (this.noReach && this.noReach[i] && Math.floor(t * 4) % 2 === 0) {
        const qx = x + F.SLOT - 6;
        const qy = y + 2;
        ctx.fillStyle = '#1d1428';
        ctx.fillRect(qx - 1, qy - 1, 5, 5);
        ctx.fillStyle = '#ef6166';
        ctx.fillRect(qx, qy, 1, 1);
        ctx.fillRect(qx + 2, qy, 1, 1);
        ctx.fillRect(qx + 1, qy + 1, 1, 1);
        ctx.fillRect(qx, qy + 2, 1, 1);
        ctx.fillRect(qx + 2, qy + 2, 1, 1);

      const y = F.GY + Math.floor(i / F.COLS) * F.SLOT;
      ctx.fillStyle = '#ffe46b';
      ctx.fillRect(x, y, F.SLOT, 1);
      ctx.fillRect(x, y + F.SLOT - 1, F.SLOT, 1);
      ctx.fillRect(x, y, 1, F.SLOT);
      ctx.fillRect(x + F.SLOT - 1, y, 1, F.SLOT);
      const s = board[i];
      if (s && b.slotStats[i]) {
        const c = RS.slotCenter(i);
        const r = b.slotStats[i].range;
        const n = Math.max(24, Math.round(r * 1.2));
        ctx.fillStyle = 'rgba(255,228,107,0.8)';
        for (let k = 0; k < n; k++) {
          if (k % 2) continue;
          const a = (k / n) * Math.PI * 2 + t * 0.4;

  // 끌고 있는 유닛은 손가락보다 조금 위에 그린다

    if (!dr || !dr.moved) return;

    ctx.drawImage(spr, Math.round(dr.x - spr.width / 2), Math.round(dr.y - 26));
  };

  P.drawStars = function (ctx, x, y) {
    const k = Math.floor(this.t * 8) % 4;

  };

  P.drawEnemies = function (ctx, b) {
    const list = this.sorted || (this.sorted = []);
    list.length = 0;
    for (let k = 0; k < b.enemies.length; k++) list.push(b.enemies[k]);
    list.sort((a, c) => a.y - c.y);

      }

      const h = spr.height;
      const bob = e.boss ? 0 : Math.round(Math.sin(t * 8 + e.phase));
      const x = Math.round(e.x - w / 2);

      if (e.elite) {

      if (e.boss || e.subT > 0 || e.hp >= e.maxHp) continue;
      const spr = RS.SPR[e.type];
      const w = spr.width;
      const top = Math.round(e.y - spr.height + 5 + (e.boss ? 0 : Math.round(Math.sin(t * 8 + e.phase))));

      const bx = Math.round(e.x - bw / 2);

        ctx.fillRect(bx + fill, by, bw - fill, 1);
        ctx.fillStyle = '#e04a52';
        ctx.fillRect(bx, by, fill, 1);
      }
    }
  };

  P.drawShots = function (ctx, dt) {
    let w = 0;
    for (let k = 0; k < this.shots.length; k++) {
      const s = this.shots[k];
      s.t -= dt;
      if (s.t <= 0) continue;
      this.shots[w++] = s;
      const p = 1 - s.t / s.max;
      const x = Math.round(s.x1 + (s.x2 - s.x1) * p);
      const y = Math.round(s.y1 + (s.y2 - s.y1) * p);
      const T = RS.TIER[s.tier];
      switch (s.cls) {
        case 'archer': {
          const dx = s.x2 - s.x1;
          const dy = s.y2 - s.y1;
          const len = Math.max(1, Math.hypot(dx, dy));
          ctx.fillStyle = '#f6f1e8';
          ctx.fillRect(x, y, 1, 1);
          ctx.fillStyle = '#8d5b3d';
          ctx.fillRect(Math.round(x - (dx / len) * 2), Math.round(y - (dy / len) * 2), 1, 1);
          ctx.fillStyle = T.light;
          ctx.fillRect(Math.round(x - (dx / len) * 3), Math.round(y - (dy / len) * 3), 1, 1);
          break;
        }
        case 'mage':
          ctx.fillStyle = T.color;
          ctx.fillRect(x - 1, y - 1, 3, 3);
          ctx.fillStyle = '#fff6e6';
          ctx.fillRect(x, y, 1, 1);
          break;
        case 'frost':
          ctx.fillStyle = '#a8ecff';
          ctx.fillRect(x - 1, y, 3, 1);
          ctx.fillRect(x, y - 1, 1, 3);
          break;
        case 'rogue':

          break;

  };

  // 전사 베기: 표적을 가로지르는 굵은 사선 칼자국 + 맞는 순간 불꽃
  P.drawSlash = function (ctx, s, p, T) {
    const cx = s.x2;
    const cy = s.y2 - 3;
    const face = Math.atan2(s.y2 - s.y1, s.x2 - s.x1);
    const ang = face + (s.flip ? 1 : -1) * 1.05; // 공격 방향에 비스듬히
    const ux = Math.cos(ang);

    const grow = Math.min(1, p / 0.3);

    const edge = s.miss ? '#8a93a3' : s.crit ? '#ffe46b' : '#ffffff';
    const inner = s.miss ? '#5b6272' : s.crit ? '#ff9a3d' : T.light;
    const from = -L / 2;
    const to = from + L * grow;
    for (let d = from; d <= to; d += 0.5) {
      const tn = 1 - Math.abs(d) / (L / 2); // 가운데 1, 끝 0
      const w = Math.max(0, Math.round((tn * 2.2 + 0.4) * thin)); // 반폭
      const bx = cx + ux * d;
      const by = cy + uy * d;
      if (w >= 2) {
        ctx.fillStyle = '#1d1428';
        ctx.fillRect(Math.round(bx + nx * (w + 1)), Math.round(by + ny * (w + 1)), 1, 1);
        ctx.fillRect(Math.round(bx - nx * (w + 1)), Math.round(by - ny * (w + 1)), 1, 1);
      }
      for (let o = -w; o <= w; o++) {
        ctx.fillStyle = Math.abs(o) === w && w > 0 ? inner : edge;
        ctx.fillRect(Math.round(bx + nx * o), Math.round(by + ny * o), 1, 1);
      }
    }
    // 칼이 표적을 지나는 순간(중반) 튀는 불꽃
    if (p > 0.25 && p < 0.7 && !s.miss) {
      const q = (p - 0.25) / 0.45;
      const r = 1 + Math.round(q * (s.crit ? 5 : 3));
      ctx.fillStyle = q < 0.5 ? '#ffffff' : edge;
      ctx.fillRect(cx - r, cy, 1, 1);
      ctx.fillRect(cx + r, cy, 1, 1);
      ctx.fillRect(cx, cy - r, 1, 1);
      ctx.fillRect(cx, cy + r, 1, 1);
      if (s.crit || q < 0.4) {
        const d = Math.max(1, r - 1);
        ctx.fillRect(cx - d, cy - d, 1, 1);
        ctx.fillRect(cx + d, cy - d, 1, 1);
        ctx.fillRect(cx - d, cy + d, 1, 1);
        ctx.fillRect(cx + d, cy + d, 1, 1);
      }
      if (q < 0.3) {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(cx - 1, cy - 1, 3, 3);
      }
    }
  };

  P.drawFx = function (ctx, dt) {
